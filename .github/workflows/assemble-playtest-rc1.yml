name: Assemble Locked Playtest R1 Candidate

on:
  push:
    branches: [integration/char2-current-main-playtest-r1]
    paths: ['.github/workflows/assemble-playtest-rc1.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assemble-locked-playtest-r1
  cancel-in-progress: false

jobs:
  assemble:
    name: Reproduce locked source and publish candidate only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      product_head: ${{ steps.assemble.outputs.product_head }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Reproduce approved exact tree and fast-forward only integration branch
        id: assemble
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,shutil,subprocess,tarfile,tempfile,zlib
          repo=pathlib.Path.cwd()
          branch='integration/char2-current-main-playtest-r1'
          assert os.environ['GITHUB_REPOSITORY']=='rootfabric/distributed-world-simulator'
          assert os.environ['GITHUB_REF']=='refs/heads/'+branch
          event_head=os.environ['GITHUB_SHA']
          def git(*args): return subprocess.check_output(['git',*args],cwd=repo)
          assert git('rev-parse','HEAD').decode().strip()==event_head
          def remote_head():
              return git('ls-remote','origin','refs/heads/'+branch).decode().split()[0]
          assert remote_head()==event_head,'REMOTE_HEAD_MOVED_NO_WRITE'
          bootstrap_changes=set(git('diff','--name-only','15e97f18ad55574f74d47127d77a968c796dead9','HEAD').decode().splitlines())
          permitted={'.github/workflows/assemble-playtest-rc1.yml'}|{'tools/release/assembly/part-'+str(i)+'.b64' for i in range(6)}
          assert bootstrap_changes==permitted,('BOOTSTRAP_SCOPE_DRIFT',bootstrap_changes^permitted)
          payload=b''.join((repo/('tools/release/assembly/part-'+str(i)+'.b64')).read_bytes() for i in range(6))
          assert hashlib.sha256(payload).hexdigest()=='b1e0a4cdbe2f93c16f6fa349902a21c23b03592b7a152dc09f10c701a74ae54c','RECIPE_TRANSFER_CORRUPT'
          raw=zlib.decompress(base64.b64decode(payload))
          assert hashlib.sha256(raw).hexdigest()=='c8dbbbf6d678bb832d13e4737f305e3f049734d1b359b3c0f71c5380f725e80d','RECIPE_CONTENT_MISMATCH'
          recipe=json.loads(raw)
          temp=pathlib.Path(tempfile.mkdtemp(prefix='playtest-locked-',dir=os.environ['RUNNER_TEMP']))
          inputs=temp/'playtest_inputs';inputs.mkdir()
          for name,entry in recipe['inputs'].items():
              ref=entry['head']
              assert git('rev-parse',ref+'^{tree}').decode().strip()==entry['tree'],('INPUT_TREE_MISMATCH',name)
              arc=temp/(name+'.tar.gz')
              subprocess.run(['git','archive','--format=tar.gz','--output='+str(arc),ref],cwd=repo,check=True)
              assert hashlib.sha256(arc.read_bytes()).hexdigest()==entry['archive_sha256'],('INPUT_ARCHIVE_MISMATCH',name)
              with tarfile.open(arc) as t:t.extractall(inputs/name,filter='data')
              (inputs/(name+'-tree.txt')).write_bytes(git('ls-tree','-r',ref))
          (inputs/'manifest.json').write_text(json.dumps(recipe['inputs']))
          (inputs/'net-vs-common-names.txt').write_bytes(git('diff','--name-status',recipe['inputs']['common']['head'],recipe['inputs']['net_windows']['head']))
          for name in ['compose_playtest.py','implement_release.py','implement_launchers.py','build_release_workflow.py']:
              program=temp/name
              program.write_text(recipe['scripts'][name].replace('/mnt/data',str(temp)))
              subprocess.run(['python3',str(program)],check=True)
              if name=='compose_playtest.py':
                  shutil.copy2(inputs/'net_windows/scripts/app/earth_app.gd',temp/'dws_playtest/scripts/app/earth_app.gd')
                  (temp/'dws_playtest/.github/workflows/user1-m6-postrestore-seam-exact.yml').unlink(missing_ok=True)
          candidate=temp/'dws_playtest'
          (candidate/'tools/release/install_playtest_from_verified_donor.ps1').write_text(recipe['installer'])
          program=temp/'finalize_source.py'
          program.write_text(recipe['scripts']['finalize_source.py'].replace('/mnt/data',str(temp)))
          subprocess.run(['python3',str(program)],check=True)
          expected_tree='a990040863885a5c33089f6e801baf7b692bfa7e'
          assert (candidate/'artifacts/release/source-tree.txt').read_text().strip()==expected_tree,'ASSEMBLED_TREE_MISMATCH'
          desired=set(json.loads((temp/'desired-source-paths.json').read_text()))
          tracked=set(git('ls-files','-z').decode().strip('\0').split('\0'))
          removable=permitted|{'.github/workflows/playtest-baseline-inputs.yml'}
          assert tracked-desired<=removable,('UNEXPECTED_REMOVAL',tracked-desired-removable)
          for path in tracked-desired:(repo/path).unlink()
          for path in sorted(desired):
              dst=repo/path;dst.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(candidate/path,dst)
          tree_rows=subprocess.check_output(['git','--git-dir='+str(temp/'dws_source_git'),'ls-tree','-r',expected_tree],text=True)
          for row in tree_rows.splitlines():
              header,path=row.split('\t',1);mode,kind,sha=header.split()
              os.chmod(repo/path,0o755 if mode=='100755' else 0o644)
          subprocess.run(['git','config','core.autocrlf','false'],check=True)
          subprocess.run(['git','add','-A'],check=True)
          assert git('write-tree').decode().strip()==expected_tree,'STAGED_TREE_MISMATCH'
          subprocess.run(['python3','tools/release/verify_playtest_source.py'],check=True) if False else None
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','feat(playtest): freeze Earth Host/Join RC1 with cumulative NET-SMOOTH1, CHAR2 and recovery fixes','-m','Exact tree a990040863885a5c33089f6e801baf7b692bfa7e reproduced from immutable inputs. SAFE60 profile; no F64-v2/120fps default. Lab playground excluded from public launch. Native Linux/three-process tests recorded separately; Windows GUI pending. Main unchanged.'],check=True)
          head=git('rev-parse','HEAD').decode().strip()
          assert git('rev-parse','HEAD^{tree}').decode().strip()==expected_tree
          subprocess.run(['python3','tools/release/verify_playtest_source.py'],check=True)
          assert remote_head()==event_head,'REMOTE_HEAD_MOVED_NO_PUSH'
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
          assert remote_head()==head,'PUBLISHED_HEAD_MISMATCH'
          artifact=repo/'artifacts/playtest-published';artifact.mkdir(parents=True,exist_ok=True)
          (artifact/'HEAD.txt').write_text(head+'\n');(artifact/'TREE.txt').write_text(expected_tree+'\n')
          subprocess.run(['git','archive','--format=tar.gz','--output='+str(artifact/'source.tar.gz'),head],check=True)
          shutil.copy2(repo/'config/release/playtest-r1.json',artifact/'profile.json')
          shutil.copy2(repo/'config/release/playtest-composition.v1.json',artifact/'composition.json')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('product_head='+head+'\n')
          print('PUBLISHED_CANDIDATE',head,expected_tree,'MAIN_UNCHANGED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: playtest-r1-published-source
          path: artifacts/playtest-published/
          if-no-files-found: error
          retention-days: 30

  windows-syntax:
    name: Windows PowerShell shipped launcher and installer syntax
    needs: assemble
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.assemble.outputs.product_head }}
          persist-credentials: false
      - name: Parse actual PowerShell 5.1 launchers and resource installer
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($path in @('tools/release/install_playtest_from_verified_donor.ps1','tools/char1/portable_windows/tools/Playtest-Common.ps1','tools/char1/portable_windows/tools/START_NETWORK_CHAR1.ps1','tools/char1/portable_windows/tools/START_TWO_CLIENTS_CHAR1.ps1')){
            $tok=$null;$errs=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path (Get-Location) $path),[ref]$tok,[ref]$errs)|Out-Null
            if($errs.Count -ne 0){throw ($errs|Out-String)}
          }
          Write-Host 'WINDOWS_PS51_LAUNCH_AND_INSTALL_SYNTAX_PASS'

  windows-bundle:
    name: Native Windows Double full portable Host Join package
    needs: [assemble, windows-syntax]
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    env:
      BREAKPOINT_RUNTIME_DISABLED: '1'
      GODOT_SILENCE_ROOT_WARNING: '1'
      PYTHONUTF8: '1'
      PLAYTEST_EXPECTED_HEAD: ${{ needs.assemble.outputs.product_head }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.assemble.outputs.product_head }}
          fetch-depth: 0
          persist-credentials: false
      - name: Full real asset bundle with exact native negative gates
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $head=(git rev-parse HEAD).Trim()
          if($head -ne $env:PLAYTEST_EXPECTED_HEAD){throw 'HEAD_MISMATCH'}
          New-Item -ItemType Directory -Force artifacts/playtest-r1 | Out-Null
          $candidates=@($env:DWS_QUATERNIUS_ASSET_ROOT,'C:\distributed-world-simulator\char1-realistic-r1\assets\external\quaternius','C:\dwsv-char1-git-hotfix-test\CHAR1_REALISTIC_WINDOWS_TEST\project\assets\external\quaternius')
          if(Test-Path 'C:\dws-char2-playtest-r1-delivery'){$candidates+=@(Get-ChildItem 'C:\dws-char2-playtest-r1-delivery' -Directory -Recurse -Depth 6 -Filter quaternius -ErrorAction SilentlyContinue|Select-Object -ExpandProperty FullName)}
          $asset=$null
          foreach($c in $candidates){if([string]::IsNullOrWhiteSpace($c)){continue};if((Test-Path (Join-Path $c 'base_characters')) -and (Test-Path (Join-Path $c 'animation_library'))){$asset=$c;break}}
          if($null -eq $asset){throw 'REAL_ASSETS_NOT_FOUND'}
          $out=Join-Path (Resolve-Path 'artifacts/playtest-r1').Path ('DWS_PLAYTEST_R1_'+$head.Substring(0,12)+'_Windows.zip')
          python tools/char1/build_bundled_windows_avatar.py --repo . --expected-head $head --assets-root $asset --output $out *> artifacts/playtest-r1/build.log
          $code=$LASTEXITCODE
          Get-Content artifacts/playtest-r1/build.log -Tail 100
          if($code -ne 0){throw "WINDOWS_BUNDLE_FAIL:$code"}
          [ordered]@{head=$head;tree=(git rev-parse 'HEAD^{tree}').Trim();zip_sha256=(Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant();profile='PLAYTEST_R1_SAFE60';gui_acceptance='PENDING_HUMAN'}|ConvertTo-Json|Set-Content artifacts/playtest-r1/receipt.json -Encoding UTF8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DWS-PLAYTEST-R1-Windows
          path: artifacts/playtest-r1/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
