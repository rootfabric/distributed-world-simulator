name: CONTROL MVP8 External Reviewer Git Witness R1
on:
  push:
    branches: [repair/control-mvp8-independent-reviewer-provenance-r1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Frozen #834 ancestry, allowed paths and Python parse
        shell: bash
        run: |
          set -Eeuo pipefail
          parent=a5ef36a1716f4d233351b38314fc70355447078c
          test "$(git merge-base "$parent" HEAD)" = "$parent"
          python3 - <<'PY'
          import subprocess
          expected={
            ".github/workflows/control-mvp8-independent-reviewer-witness.yml":"A",
            "config/control/harness/executions/E2026-09-09-V0-MVP-R1/external-role-event-witness.v1.json":"A",
            "scripts/harness/state_builder.py":"M",
            "tests/harness/test_mvp8_external_reviewer_event_witness_r1.py":"A",
            "docs/control/CONTROL_MVP8_EXTERNAL_REVIEWER_PROVENANCE_R1_RU.md":"A",
          }
          rows=subprocess.check_output(["git","diff","--name-status","a5ef36a1716f4d233351b38314fc70355447078c","HEAD"],text=True).splitlines()
          got={}
          for row in rows:
              status,path=row.split("\t")
              assert expected.get(path)==status,row
              got[path]=status
          assert got==expected,(got,expected)
          canonical="config/control/harness/executions/E2026-09-09-V0-MVP-R1"
          original=[
              (canonical+"/events/V0-MVP-R1-WO-001/0050-mvp8-repair-r2-independent-reviewer-pass.v1.json","b27cc80072fcb66cb217004ddad35aeb381d37a0"),
              (canonical+"/verifications/MVP8-INDEPENDENT-REVIEW-DC6E7FFF-R1.v1.json","3759b7caf84ef1e49a894ae2d6b5934e676c15b5"),
          ]
          for path,blob in original:
              assert subprocess.check_output(["git","rev-parse","HEAD:"+path],text=True).strip()==blob
              assert subprocess.check_output(["git","diff","--name-only","a5ef36a1716f4d233351b38314fc70355447078c","HEAD","--",path],text=True).strip()==""
          print("CONTROL_MVP8_UNMODIFIED_REVIEW_EVIDENCE=PASS")
          PY
          git diff --check "$parent" HEAD
          python3 -m py_compile scripts/harness/state_builder.py tests/harness/test_mvp8_external_reviewer_event_witness_r1.py
  linux:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r scripts/harness/requirements.txt
      - name: Adversarial witness RED/GREEN and spoof tests
        shell: bash
        env:
          PYTHONPATH: scripts
        run: python -m unittest discover -s tests/harness -p 'test_mvp8_external_reviewer_event_witness_r1.py' -v
      - name: Exact control Status — no error suppression
        shell: bash
        env:
          PYTHONPATH: scripts
        run: |
          set -Eeuo pipefail
          set +e
          python -m harness.cli status --root "$PWD" >"$RUNNER_TEMP/status-out.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/status-out.log"
          echo "CONTROL_STATUS_EXIT=$rc"
          test "$rc" -eq 0
          python - "$RUNNER_TEMP/status-out.log" <<'PY'
          import json,sys
          msg=json.loads(open(sys.argv[1],encoding="utf-8").read().splitlines()[-1])
          assert msg["schema"]=="distributed_world_simulator.control_development_output.v1" and msg.get("ok") is True,msg
          print("CONTROL_MVP8_FULL_STATUS=PASS")
          PY
      - name: Full pinned Harness regressions
        shell: bash
        env:
          PYTHONPATH: scripts
        run: python -m unittest discover -s tests/harness -v
  windows:
    needs: scope
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r scripts/harness/requirements.txt
        shell: pwsh
      - name: Windows independent witness unit tests
        shell: pwsh
        env:
          PYTHONPATH: scripts
        run: |
          python -m unittest discover -s tests/harness -p 'test_mvp8_external_reviewer_event_witness_r1.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'EXTERNAL_REVIEW_WITNESS_TEST_FAILED' }
      - name: Public PowerShell Control driver -Status
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $messages=@(& pwsh -NoLogo -NoProfile -File (Join-Path $PWD 'CONTROL_DEVELOPMENT.ps1') -Status)
          $rc=$LASTEXITCODE
          $messages | ForEach-Object { Write-Host $_ }
          if ($rc -ne 0) { throw "CONTROL_DEVELOPMENT_STATUS_EXIT_$rc" }
          $result=($messages | Select-Object -Last 1) | ConvertFrom-Json
          if ($result.schema -ne 'distributed_world_simulator.control_development_output.v1' -or $result.ok -ne $true) { throw 'STATUS_ENVELOPE_INVALID' }
          Write-Host 'CONTROL_MVP8_WINDOWS_FULL_STATUS=PASS'
