name: ECO E3.4 Repair R1 Closure

on:
  pull_request:
    branches:
      - feature/eco-evolutionary-ecology
    paths:
      - "RUN_ECO_EVO3_E3_4_TESTS.py"
      - "config/ecology/**"
      - "scripts/research/ecology/**"
      - "tests/research/ecology/**"
      - ".github/workflows/e3-4-repair-r1-closure.yml"

permissions:
  contents: read

concurrency:
  group: eco-e3-4-repair-r1-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  closure:
    name: exact published E3.4 Repair R1 closure
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install exact validation dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0

      - name: Run exact E3.4 closure
        shell: bash
        run: |
          set -o pipefail
          python RUN_ECO_EVO3_E3_4_TESTS.py | tee e3_4_repair_r1_runner.log

      - name: Upload exact runner log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eco-e3-4-repair-r1-runner-log
          path: e3_4_repair_r1_runner.log
          if-no-files-found: error
          retention-days: 30
