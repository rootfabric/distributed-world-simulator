name: ECO E3.5 Closure

on:
  pull_request:
    branches:
      - feature/eco-evolutionary-ecology
    paths:
      - "RUN_ECO_EVO3_E3_5_TESTS.py"
      - "config/ecology/eco-evo3-e3-5-*"
      - "config/ecology/accepted_inputs/e3_4_*"
      - "scripts/research/ecology/population_workset_compiler_v1.py"
      - "tests/research/ecology/test_eco_evo3_e3_5_*"
      - "validation/ecology/eco-evo3-e3-5-*"
      - "docs/checkpoints/2026-08-20_ECO_EVO3_E3_5_*"
      - ".github/workflows/e3-5-closure.yml"

permissions:
  contents: read

concurrency:
  group: eco-e3-5-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  closure:
    name: exact published E3.5 closure
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Assert exact PR HEAD checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          echo "exact_head=$(git rev-parse HEAD)"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install exact validation dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0

      - name: Run exact E3.5 closure
        shell: bash
        run: |
          set -o pipefail
          python RUN_ECO_EVO3_E3_5_TESTS.py | tee e3_5_runner.log

      - name: Upload exact E3.5 runner evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eco-e3-5-runner-evidence
          path: |
            e3_5_runner.log
            e3_5_candidate_population_workset.json
          if-no-files-found: error
          retention-days: 30
