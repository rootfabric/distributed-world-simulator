name: ECO E3.5 Repair R1 Materialize Generated Artifact

on:
  push:
    branches:
      - feature/eco-evo3-e3-5-population-workset-compiler
    paths:
      - "scripts/research/ecology/population_workset_compiler_v1.py"
      - "tests/research/ecology/test_eco_evo3_e3_5_authority.py"
      - "RUN_ECO_EVO3_E3_5_TESTS.py"
      - ".github/workflows/e3-5-closure.yml"
      - ".github/workflows/e3-5-repair-r1-materialize.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Regenerate committed E3.5 artifact from repaired exact compiler
        shell: bash
        run: |
          set -euo pipefail
          python scripts/research/ecology/population_workset_compiler_v1.py \
            --output validation/ecology/eco-evo3-e3-5-population-workset.generated.json \
            --quiet
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path("validation/ecology/eco-evo3-e3-5-population-workset.generated.json")
          raw = p.read_bytes()
          sha256 = hashlib.sha256(raw).hexdigest()
          blob = hashlib.sha1(f"blob {len(raw)}\0".encode("ascii") + raw).hexdigest()
          assert len(raw) == 27611, len(raw)
          assert sha256 == "0ea5351b7692564161804a3aea5fe5044f3321ded3dcb4d0c7343e93d52c4975", sha256
          assert blob == "d54ce8dad2760312d414c62c88d5f4f71427514f", blob
          print(f"materialized_bytes={len(raw)}")
          print(f"materialized_sha256={sha256}")
          print(f"materialized_git_blob={blob}")
          PY

      - name: Commit generated artifact if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- validation/ecology/eco-evo3-e3-5-population-workset.generated.json; then
            echo "generated_artifact_already_exact=true"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- validation/ecology/eco-evo3-e3-5-population-workset.generated.json
          git commit -m "fix(eco): materialize exact E3.5 repair R1 workset artifact"
          git push origin "HEAD:${{ github.ref_name }}"
