name: ECO E3.FINAL Closure

on:
  pull_request:
    branches:
      - feature/eco-evolutionary-ecology
    paths:
      - "RUN_ECO_EVO3_E3_FINAL_TESTS.py"
      - "config/ecology/eco-evo3-e3-final-*"
      - "config/ecology/accepted_inputs/e3_final/**"
      - "scripts/research/ecology/planetary_ecology_final_compiler_v1.py"
      - "scripts/research/ecology/generate_e3_final_precommit_v1.py"
      - "scripts/research/ecology/seal_e3_final_predictions_v1.py"
      - "scripts/research/ecology/build_e3_final_contract_v1.py"
      - "tests/research/ecology/test_eco_evo3_e3_final_*"
      - "validation/ecology/eco-evo3-e3-final-*"
      - "docs/checkpoints/2026-08-22_ECO_EVO3_E3_FINAL_*"
      - "docs/evidence/2026-08-22_ECO_EVO3_E3_FINAL_*"
      - ".github/workflows/e3-final-closure.yml"

permissions:
  contents: read

concurrency:
  group: eco-e3-final-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  closure:
    name: exact published E3.FINAL closure
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Assert exact PR HEAD checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          echo "exact_head=$(git rev-parse HEAD)"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install exact validation dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0

      - name: Run exact E3.FINAL closure
        shell: bash
        run: |
          set -o pipefail
          python RUN_ECO_EVO3_E3_FINAL_TESTS.py | tee e3_final_runner.log

      - name: Upload exact E3.FINAL runner evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eco-e3-final-runner-evidence
          path: |
            e3_final_runner.log
            e3_final_candidate_unseen_world_program.json
            validation/ecology/eco-evo3-e3-final-unseen-world-program.generated.json
          if-no-files-found: error
          retention-days: 30
