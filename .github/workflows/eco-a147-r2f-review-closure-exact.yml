name: ECO ARCH2 A14.7 R2F Owned CPU Source Exact

on:
  push:
    branches:
      - feature/eco-a147-r2f-review-findings-closure-r1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eco-a147-r2f-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable real Controller E3 1/1 vs 16/4 original exact 4/32/96/256
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Godot 4.7.1 complete original A4 instead of speculative+reference
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot-e2.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          mkdir -p /tmp/godot-e2
          unzip -q /tmp/godot-e2.zip -d /tmp/godot-e2
          godot=/tmp/godot-e2/Godot_v4.7.1-stable_linux.x86_64
          chmod +x "$godot"
          "$godot" --headless --editor --path . --import > r2f-import.log 2>&1 || { cat r2f-import.log; exit 1; }
          mkdir -p r2f-evidence
          for n in 4 32 96 256; do
            "$godot" --headless --path . --script res://validation/ecology/evo_arch2_a14_7/test_a147_r2f_controller_composed.gd -- --population "$n" > "r2f-evidence/n$n.stdout.log" 2> "r2f-evidence/n$n.stderr.log" || { cat "r2f-evidence/n$n.stdout.log"; cat "r2f-evidence/n$n.stderr.log"; exit 1; }
            grep -Fx 'A147_R2F_COMPOSE PASS' "r2f-evidence/n$n.stdout.log"
            grep '^A147_R2F_COMPOSE_JSON ' "r2f-evidence/n$n.stdout.log" | sed 's/^A147_R2F_COMPOSE_JSON //' > "r2f-evidence/n$n.json"
            test "$(wc -l < "r2f-evidence/n$n.json")" -eq 1
            if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Error compiling' "r2f-evidence/n$n.stdout.log" "r2f-evidence/n$n.stderr.log"; then exit 1; fi
          done
          python3 - <<'PY'
          import json,pathlib
          H={4:"7b56b22193534e2a77c33be3e02b1cb33fc37f189e6d68b4b1535a548fc06062",
             32:"62128cea01410626cfda7556c39afb2ae110606cee229a875476143a240ed129",
             96:"23b11ab4c0454d08de1e82b93a1a5913a2bed4116e29dc2f6bcc765cfd2bb448",
             256:"f38c44896ffc8028c00b1c1f74e5b99d41f12620d60f99f7a95690b3f6419906"}
          for n,h in H.items():
              p=json.loads(pathlib.Path(f"r2f-evidence/n{n}.json").read_text())
              assert p["schema"]=="dws.ecology.a147-r2f-composed-controller.v1"
              assert p["population"]==n and p["canonical_hash"]==h
              assert p["checkpoint_exact"] and p["source_unchanged"] 
              assert (p["legacy_worksets_per_resume"],p["new_worksets_per_resume"])==(1,16)
              assert (p["legacy_nested_workers"],p["new_nested_workers"])==(1,4)
              assert p["one_authoritative_a4"] and p["fully_validated_source_and_candidate"]
              assert p["subsecond_not_proven"]
              assert p["new_phase"]["r2e3_original_global_a4_barriers"]==1
              if n>=96: assert p["new_phase"]["r2c_parallel_threaded_worksets"]>0
              print(f'R2F_E3_COMPOSE n={n} baseline_ms={p["legacy_worker_wall_us"]/1000:.3f} composed_ms={p["composed_worker_wall_us"]/1000:.3f} ratio={p["ratio"]:.3f}')
          print("A147_R2F_E3_COMPOSE_ALL_FOUR_EXACT_PASS")
          PY
          git diff --exit-code && git diff --cached --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a147-r2f-portable-owned
          path: |
            r2f-import.log
            r2f-evidence/
          if-no-files-found: ignore

  windows:
    name: Windows Double E3 composed 1/1 vs 16/4 exact 4/32/96/256
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pinned Windows Double original canonical and owner fencing
        shell: pwsh
        env:
          CONFIGURED_GODOT: ${{ vars.DWS_GODOT_DOUBLE_BIN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $godot = $env:CONFIGURED_GODOT
          if ([string]::IsNullOrWhiteSpace($godot)) { $godot = 'C:\Godot\godot\bin\godot.windows.editor.double.x86_64.console.exe' }
          if ((Get-FileHash $godot -Algorithm SHA256).Hash.ToLowerInvariant() -ne '3633c3e609c8ce2f9bae334a9c7e75c7f974de3af0415ab4a8050a625a15a7a5') { throw 'R2F_PINNED_GODOT_SHA' }
          & $godot --headless --editor --path . --import *> r2f-win-import.log
          if ($LASTEXITCODE -ne 0) { throw 'R2F_IMPORT_FAIL' }
          New-Item -ItemType Directory -Force r2f-win-evidence | Out-Null
          foreach ($n in @(4,32,96,256)) {
            $out = Join-Path (Get-Location).Path "r2f-win-evidence\n$n.stdout.log"
            $err = Join-Path (Get-Location).Path "r2f-win-evidence\n$n.stderr.log"
            $argv = @('--headless','--path','.','--script','res://validation/ecology/evo_arch2_a14_7/test_a147_r2f_controller_composed.gd','--','--population',"$n")
            $proc = Start-Process -FilePath $godot -ArgumentList $argv -WorkingDirectory (Get-Location).Path -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
            $proc.WaitForExit()
            $exit = [int64]$proc.ExitCode
            $hex = '0x{0:X8}' -f ([uint32]($exit -band [int64]0xffffffff))
            Write-Host "R2F_NATIVE_EXIT n=$n code=$exit hex=$hex"
            if ($exit -ne 0) { Get-Content $out; Get-Content $err; throw 'R2F_NATIVE_FAIL' }
            if (-not (Select-String -Path $out -Pattern '^A147_R2F_COMPOSE PASS$' -Quiet)) { throw 'R2F_MARKER_MISSING' }
            $rows = @(Get-Content $out | Where-Object { $_ -match '^A147_R2F_COMPOSE_JSON ' })
            if ($rows.Count -ne 1) { throw 'R2F_PROFILE_COUNT' }
            $json = ($rows[0] -replace '^A147_R2F_COMPOSE_JSON ','')
            $p = $json | ConvertFrom-Json
            if ([int]$p.population -ne $n -or -not [bool]$p.checkpoint_exact -or -not [bool]$p.one_authoritative_a4 -or -not [bool]$p.fully_validated_source_and_candidate) { throw 'R2F_RESULT_INVALID' }
            Set-Content -Path "r2f-win-evidence\n$n.json" -Value $json -Encoding utf8
            if (Select-String -Path $out,$err -Pattern 'SCRIPT ERROR|Parse Error|Failed to load script|Error compiling' -Quiet) { throw 'R2F_SCRIPT_FATAL' }
          }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'DIRTY_WORKTREE' }
          git diff --cached --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'DIRTY_INDEX' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a147-r2f-windows-double-owned
          path: |
            r2f-win-import.log
            r2f-win-evidence/
          if-no-files-found: ignore

  linux-double:
    name: Linux pinned Double real Controller E3 batch16 nested4 exact
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pinned Linux Double composed original global A4 exact
        shell: bash
        env:
          CONFIGURED_GODOT: ${{ vars.DWS_GODOT_DOUBLE_LINUX_BIN }}
        run: |
          set -euo pipefail
          godot="${CONFIGURED_GODOT:-${DWS_GODOT_DOUBLE_LINUX_BIN:-$HOME/.local/opt/godot-double-4.7.1-a13da4f/godot.linuxbsd.editor.double.x86_64}}"
          test "$(sha256sum "$godot" | cut -d' ' -f1)" = "bfa7ce632d8d4b1dcc96f64f5405ee52b57c4e25d15c3e0478acc26e08d517d7"
          "$godot" --headless --editor --path . --import > r2f-linux-import.log 2>&1 || { cat r2f-linux-import.log; exit 1; }
          mkdir -p r2f-linux-evidence
          for n in 4 32 96 256; do
            "$godot" --headless --path . --script res://validation/ecology/evo_arch2_a14_7/test_a147_r2f_controller_composed.gd -- --population "$n" > "r2f-linux-evidence/n$n.stdout.log" 2> "r2f-linux-evidence/n$n.stderr.log" || { cat "r2f-linux-evidence/n$n.stdout.log"; cat "r2f-linux-evidence/n$n.stderr.log"; exit 1; }
            grep -Fx 'A147_R2F_COMPOSE PASS' "r2f-linux-evidence/n$n.stdout.log"
            grep '^A147_R2F_COMPOSE_JSON ' "r2f-linux-evidence/n$n.stdout.log" | sed 's/^A147_R2F_COMPOSE_JSON //' > "r2f-linux-evidence/n$n.json"
          done
          git diff --exit-code && git diff --cached --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a147-r2f-linux-double
          path: |
            r2f-linux-import.log
            r2f-linux-evidence/
          if-no-files-found: ignore
