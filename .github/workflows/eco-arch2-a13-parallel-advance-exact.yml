name: ECO ARCH2 A13 Parallel Advance Exact

on:
  pull_request:
    paths:
      - 'scripts/research/ecology/v2/resource_lifecycle_runtime_v1.gd'
      - 'scripts/research/ecology/v2/ecology_runtime_v1.gd'
      - 'scripts/research/ecology/v2/population_spatial_workset_plan_v1.gd'
      - 'scripts/research/ecology/v2/population_activity_cadence_plan_v1.gd'
      - 'validation/ecology/evo_arch2_a13_parallel_advance/**'
      - '.github/workflows/eco-arch2-a13-parallel-advance-exact.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eco-a13-parallel-advance-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  portable-smoke:
    name: A13 Parallel Advance Portable Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify and install official portable smoke engine
        shell: bash
        run: bash tools/engine48/select_portable_smoke_engine.sh

      - name: Fresh import
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT" --headless --editor --path . --import

      - name: Run focused parallel advance smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          log="$(mktemp)"
          set +e
          "$GODOT" --headless --path . --script             res://validation/ecology/evo_arch2_a13_parallel_advance/test_parallel_advance.gd             2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          grep -F "EVO_ARCH2_A13_PARALLEL_ADVANCE PASS" "$log"
          if grep -Eq 'SCRIPT ERROR:|Parse Error|Failed to load script|Error compiling' "$log"; then
            echo "fatal GDScript marker detected" >&2
            exit 4
          fi
          rm -f "$log"

      - name: Verify clean tracked source
        shell: bash
        run: |
          git diff --exit-code
          git diff --cached --exit-code

  exact:
    name: A13 Parallel Advance ${{ matrix.platform }} Double Exact
    strategy:
      fail-fast: false
      matrix:
        platform: [Linux, Windows]
    runs-on: [self-hosted, '${{ matrix.platform }}', X64]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Select strict Linux editor from project marker
        if: matrix.platform == 'Linux'
        shell: bash
        run: bash tools/engine48/select_exact_double_engine.sh
      - name: Select strict Windows editor from project marker
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: '& ./tools/engine48/select_exact_double_engine.ps1'
      - name: A13 Parallel Advance Linux exact
        if: matrix.platform == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          godot="$DWS_GODOT_DOUBLE_LINUX_BIN"
          python3 -m py_compile validation/ecology/evo_arch2_a13_parallel_advance/run_exact.py
          python3 validation/ecology/evo_arch2_a13_parallel_advance/run_exact.py --godot "$godot"
          python3 validation/ecology/evo_arch2_a13_parallel_prepare/run_exact.py --godot "$godot"
          python3 validation/ecology/evo_arch2_a13_activity/run_exact.py --godot "$godot"
          python3 validation/ecology/evo_arch2_a13_spatial/run_exact.py --godot "$godot"
          python3 validation/ecology/evo_arch2_a13/run_exact.py --godot "$godot"
          python3 validation/ecology/evo_arch2_a12/run_exact.py --godot "$godot"
          python3 validation/ecology/evo_arch2_a11/run_exact.py --godot "$godot"

      - name: A13 Parallel Advance Windows exact
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $godot = $env:DWS_GODOT_DOUBLE_BIN
          if (-not $godot -or -not (Test-Path -LiteralPath $godot -PathType Leaf)) { throw 'DWS_PINNED_EDITOR_NOT_FOUND' }
          python -m py_compile validation/ecology/evo_arch2_a13_parallel_advance/run_exact.py
          if ($LASTEXITCODE -ne 0) { throw 'A13_PARALLEL_ADVANCE_PYTHON_COMPILE' }
          python validation/ecology/evo_arch2_a13_parallel_advance/run_exact.py --godot $godot
          if ($LASTEXITCODE -ne 0) { throw 'A13_PARALLEL_ADVANCE_EXACT_FAILED' }
          python validation/ecology/evo_arch2_a13_parallel_prepare/run_exact.py --godot $godot
          if ($LASTEXITCODE -ne 0) { throw 'A13_PARALLEL_PREPARE_REGRESSION_FAILED' }
          python validation/ecology/evo_arch2_a13_activity/run_exact.py --godot $godot
          if ($LASTEXITCODE -ne 0) { throw 'A13_ACTIVITY_REGRESSION_FAILED' }
          python validation/ecology/evo_arch2_a13_spatial/run_exact.py --godot $godot
          if ($LASTEXITCODE -ne 0) { throw 'A13_SPATIAL_REGRESSION_FAILED' }
          python validation/ecology/evo_arch2_a13/run_exact.py --godot $godot
          if ($LASTEXITCODE -ne 0) { throw 'A13_REGRESSION_FAILED' }
          python validation/ecology/evo_arch2_a12/run_exact.py --godot $godot
          if ($LASTEXITCODE -ne 0) { throw 'A12_REGRESSION_FAILED' }
          python validation/ecology/evo_arch2_a11/run_exact.py --godot $godot
          if ($LASTEXITCODE -ne 0) { throw 'A11_REGRESSION_FAILED' }

      - name: Verify clean tracked Linux source
        if: always() && matrix.platform == 'Linux'
        shell: bash
        run: |
          git diff --exit-code
          git diff --cached --exit-code

      - name: Verify clean tracked Windows source
        if: always() && matrix.platform == 'Windows'
        shell: pwsh
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'TRACKED_WORKTREE_CHANGED' }
          git diff --cached --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'TRACKED_INDEX_CHANGED' }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eco-a13-parallel-advance-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/runtime/eco-a13-parallel-advance
            artifacts/runtime/eco-a13-parallel-prepare
            artifacts/runtime/eco-a13-activity
            artifacts/runtime/eco-a13-spatial
            artifacts/runtime/eco-a13
            artifacts/runtime/eco-a12
            artifacts/runtime/eco-a11
          if-no-files-found: warn
