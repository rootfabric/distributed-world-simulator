name: ECO ARCH2 A14.7 R1 Fresh Independent GUI Verifier

on:
  push:
    branches:
      - verify/eco-arch2-a147-r1-e04e0a14-fresh-r1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: independent headless input/scene contract (NOT GPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Frozen independent Godot 4.7.1 input and scene preflight
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot-a147-fresh.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          mkdir -p /tmp/godot-a147-fresh
          unzip -q /tmp/godot-a147-fresh.zip -d /tmp/godot-a147-fresh
          godot=/tmp/godot-a147-fresh/Godot_v4.7.1-stable_linux.x86_64
          chmod +x "$godot"
          "$godot" --headless --editor --path . --import > a147-fresh-import.log 2>&1 || { cat a147-fresh-import.log; exit 1; }
          "$godot" --headless --path . --script res://validation/ecology/evo_arch2_a14_7/test_a147_fresh_independent.gd -- --preflight > a147-fresh-portable.log 2>&1 || { cat a147-fresh-portable.log; exit 1; }
          cat a147-fresh-portable.log
          grep -Fx 'A147_FRESH_PREFLIGHT PASS' a147-fresh-portable.log
          grep -F '"not_gpu_evidence":true' a147-fresh-portable.log
          # Independently falsify the product GUI mode under headless.
          set +e
          "$godot" --headless --path . --script res://validation/ecology/evo_arch2_a14_7/test_a147_fresh_independent.gd -- --gui > a147-fresh-negative.log 2>&1
          code=$?
          set -e
          if test "$code" -eq 0; then echo 'A147_FRESH_FAKE_GPU_ACCEPTED'; exit 1; fi
          grep -F 'INDEPENDENT_NATIVE_GUI_HARDWARE_REQUIRED' a147-fresh-negative.log
          echo 'A147_FRESH_NEGATIVE_GPU_FALSIFIER_PASS'
          git diff --exit-code && git diff --cached --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a147-fresh-portable-contract-only
          path: a147-fresh-*.log
          if-no-files-found: ignore

  windows:
    name: independent Windows Double real GPU 4-pop camera and one tick
    runs-on: [self-hosted, Windows, X64]
    needs: portable
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Independent frozen Windows actual GUI
        shell: pwsh
        env:
          CONFIGURED_GODOT: ${{ vars.DWS_GODOT_DOUBLE_BIN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $godot = $env:CONFIGURED_GODOT
          if ([string]::IsNullOrWhiteSpace($godot)) { $godot = 'C:\Godot\godot\bin\godot.windows.editor.double.x86_64.console.exe' }
          if ((Get-FileHash $godot -Algorithm SHA256).Hash.ToLowerInvariant() -ne '3633c3e609c8ce2f9bae334a9c7e75c7f974de3af0415ab4a8050a625a15a7a5') { throw 'GODOT_SHA256_MISMATCH' }
          & $godot --headless --editor --path . --import *> a147-fresh-win-import.log
          if ($LASTEXITCODE -ne 0) { throw 'A147_FRESH_IMPORT_FAIL' }
          & $godot --path . --script res://validation/ecology/evo_arch2_a14_7/test_a147_fresh_independent.gd -- --gui *> a147-fresh-win.log
          if ($LASTEXITCODE -ne 0) { Get-Content a147-fresh-win.log; throw 'A147_FRESH_NATIVE_GUI_FAIL' }
          if (-not (Select-String -Path a147-fresh-win.log -Pattern '^A147_FRESH_GUI PASS$' -Quiet)) { throw 'A147_FRESH_NATIVE_GUI_MARKER_MISSING' }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'A147_FRESH_DIRTY_WORKTREE' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a147-fresh-windows-native
          path: |
            a147-fresh-win.log
            a147-fresh-win-import.log
          if-no-files-found: ignore
