name: ECO ARCH2 A14.7 R1 Native LAB GUI Soak

on:
  push:
    branches:
      - feature/eco-arch2-a14-7-r1-real-gui-soak-r1
  workflow_dispatch:
    inputs:
      run_linux_gui:
        type: boolean
        description: 'Run Linux GUI on self-hosted graphical hardware (no Xvfb)'
        default: false

permissions:
  contents: read

concurrency:
  group: eco-a147-r1-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  portable_preflight:
    name: Portable contract / negative headless and validator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Godot 4.7.1 contract preflight (not GPU evidence)
        shell: bash
        run: |
          set -euo pipefail
          python3 validation/ecology/evo_arch2_a14_7/validate_gui_evidence.py --self-test
          curl -fL --retry 3 -o /tmp/godot-a147.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          mkdir -p /tmp/godot-a147
          unzip -q /tmp/godot-a147.zip -d /tmp/godot-a147
          godot=/tmp/godot-a147/Godot_v4.7.1-stable_linux.x86_64
          chmod +x "$godot"
          "$godot" --headless --editor --path . --import > a147-import.log 2>&1 || { cat a147-import.log; exit 1; }
          for n in 4 32; do
            "$godot" --headless --path . --script res://validation/ecology/evo_arch2_a14_7/a147_gui_soak.gd -- --a147-preflight --a147-population "$n" > "a147-preflight-$n.log" 2>&1 || { cat "a147-preflight-$n.log"; exit 1; }
            cat "a147-preflight-$n.log"
            grep -Fx 'A147_R1_PREFLIGHT PASS' "a147-preflight-$n.log"
          done
          set +e
          "$godot" --headless --path . --script res://validation/ecology/evo_arch2_a14_7/a147_gui_soak.gd -- --a147-gui --a147-population 4 > a147-negative-headless.log 2>&1
          negative_code=$?
          set -e
          if test "$negative_code" -eq 0; then
            echo "HEADLESS_FALSE_GUI_ACCEPTANCE"; exit 1
          fi
          grep -F 'A147_GUI_DISPLAY_UNAVAILABLE' a147-negative-headless.log
          if grep -F 'A147_R1_NATIVE_GUI PASS' a147-negative-headless.log; then exit 1; fi
          echo 'A147_R1_HEADLESS_GUI_REJECTED_AS_REQUIRED'
          git diff --exit-code && git diff --cached --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eco-a147-r1-portable-contract-only
          path: |
            a147-import.log
            a147-preflight-*.log
            a147-negative-headless.log
          if-no-files-found: ignore

  windows_gui:
    name: Windows native 4/32/96/256 REAL GPU GUI soak
    runs-on: [self-hosted, Windows, X64]
    needs: portable_preflight
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Windows pinned Double real desktop and per-population input soak
        shell: pwsh
        env:
          CONFIGURED_GODOT: ${{ vars.DWS_GODOT_DOUBLE_BIN }}
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File validation/ecology/evo_arch2_a14_7/run_windows_gui.ps1 -Ticks 2
          if ($LASTEXITCODE -ne 0) { throw "A147_WINDOWS_GUI_RUNNER_FAILED" }
      - name: Tracked worktree unchanged
        if: always()
        shell: pwsh
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'A147_DIRTY_WORKTREE' }
          git diff --cached --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'A147_DIRTY_INDEX' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eco-a147-r1-windows-native-gui
          path: a147-evidence/
          if-no-files-found: ignore

  linux_gui:
    name: Linux native GPU soak — requested hardware only
    if: github.event_name == 'workflow_dispatch' && inputs.run_linux_gui == true
    runs-on: [self-hosted, Linux, X64]
    needs: portable_preflight
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Linux pinned Double drawable physical GUI
        shell: bash
        env:
          CONFIGURED_GODOT: ${{ vars.DWS_GODOT_DOUBLE_LINUX_BIN }}
        run: |
          set -euo pipefail
          if test -z "${DISPLAY:-}${WAYLAND_DISPLAY:-}"; then
            echo "A147_LINUX_GUI_BLOCKED_NO_REAL_DESKTOP"; exit 1
          fi
          godot="${CONFIGURED_GODOT:-$HOME/.local/opt/godot-double-4.7.1-a13da4f/godot.linuxbsd.editor.double.x86_64}"
          test "$(sha256sum "$godot" | cut -d' ' -f1)" = "bfa7ce632d8d4b1dcc96f64f5405ee52b57c4e25d15c3e0478acc26e08d517d7"
          mkdir -p a147-evidence
          "$godot" --headless --editor --path . --import > a147-evidence/linux-import.log 2>&1 || { cat a147-evidence/linux-import.log; exit 1; }
          for n in 4 32 96 256; do
            case "$n" in 4) seconds=65;; 32) seconds=110;; 96) seconds=190;; 256) seconds=380;; esac
            echo "A147_R1_LINUX_GUI_PROCESS_BEGIN population=$n"
            "$godot" --path . --script res://validation/ecology/evo_arch2_a14_7/a147_gui_soak.gd -- --a147-gui --a147-population "$n" --a147-ticks 2 --a147-seconds "$seconds" --a147-output "res://a147-evidence/a147-$n.json" > "a147-evidence/linux-$n.stdout.log" 2> "a147-evidence/linux-$n.stderr.log" || { cat "a147-evidence/linux-$n.stdout.log"; cat "a147-evidence/linux-$n.stderr.log"; exit 1; }
            grep -Fx 'A147_R1_NATIVE_GUI PASS' "a147-evidence/linux-$n.stdout.log"
          done
          python3 validation/ecology/evo_arch2_a14_7/validate_gui_evidence.py a147-evidence/a147-{4,32,96,256}.json
          git diff --exit-code && git diff --cached --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eco-a147-r1-linux-native-gui
          path: a147-evidence/
          if-no-files-found: ignore

  virtual_gui_diagnostic:
    name: Xvfb Mesa software GUI path diagnostic — NOT real GPU evidence
    runs-on: ubuntu-latest
    needs: portable_preflight
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Godot window + Input + rendering path in software only
        shell: bash
        run: |
          set -euo pipefail
          # This catches real GUI API and presentation errors on every PR
          # but MUST NEVER be cited as hardware/GPU acceptance.
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -qy xvfb libgl1-mesa-dri
          fi
          curl -fL --retry 3 -o /tmp/godot-a147-gui.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          mkdir -p /tmp/godot-a147-gui
          unzip -q /tmp/godot-a147-gui.zip -d /tmp/godot-a147-gui
          godot=/tmp/godot-a147-gui/Godot_v4.7.1-stable_linux.x86_64
          chmod +x "$godot"
          "$godot" --headless --editor --path . --import >/tmp/a147-gui-import.log 2>&1 || { cat /tmp/a147-gui-import.log; exit 1; }
          mkdir -p a147-evidence
          xvfb-run -a -s '-screen 0 1280x720x24' "$godot" --path . --script res://validation/ecology/evo_arch2_a14_7/a147_gui_soak.gd -- --a147-gui --a147-allow-software --a147-population 4 --a147-ticks 1 --a147-seconds 100 --a147-output res://a147-evidence/a147-4.json > a147-evidence/virtual4.stdout.log 2> a147-evidence/virtual4.stderr.log || { cat a147-evidence/virtual4.stdout.log; cat a147-evidence/virtual4.stderr.log; exit 1; }
          grep -Fx 'A147_R1_NATIVE_GUI PASS' a147-evidence/virtual4.stdout.log
          python3 - <<'PY'
          import json,sys
          sys.path.insert(0, 'validation/ecology/evo_arch2_a14_7')
          from validate_gui_evidence import validate
          p=json.load(open('a147-evidence/a147-4.json',encoding='utf-8'))
          assert p['hardware_required'] is False
          assert not validate(p, expected_population=4, require_hardware=False)
          assert p['p3_p6_actual_lab_scene'] and p['renderer_draw_calls_peak'] > 0
          print('A147_R1_VIRTUAL_GUI_DIAGNOSTIC_ONLY_PASS')
          PY
          git diff --exit-code && git diff --cached --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eco-a147-r1-virtual-software-diagnostic-only
          path: a147-evidence/
          if-no-files-found: ignore
