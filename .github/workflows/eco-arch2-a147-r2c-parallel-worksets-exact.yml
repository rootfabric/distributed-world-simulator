name: ECO ARCH2 A14.7 R2C Deterministic Parallel Worksets Exact

on:
  push:
    branches:
      - feature/eco-arch2-a14-7-r2c-parallel-worksets-r1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eco-a147-r2c-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable paired 16x1 versus 16x4 exact worksets 4/32/96/256
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Cold Godot 4.7.1, exact canonical/hash/A8 and actual parallel counters
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot-r2c.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          mkdir -p /tmp/godot-r2c
          unzip -q /tmp/godot-r2c.zip -d /tmp/godot-r2c
          godot=/tmp/godot-r2c/Godot_v4.7.1-stable_linux.x86_64
          chmod +x "$godot"
          "$godot" --headless --editor --path . --import > r2c-import.log 2>&1 || { cat r2c-import.log; exit 1; }
          mkdir -p r2c-evidence
          for n in 4 32 96 256; do
            echo "R2C_PORTABLE_BEGIN n=$n"
            "$godot" --headless --path . --script res://validation/ecology/evo_arch2_a14_7/test_a147_r2c_parallel_worksets.gd -- --r2-population "$n" > "r2c-evidence/n$n.stdout.log" 2> "r2c-evidence/n$n.stderr.log" || { cat "r2c-evidence/n$n.stdout.log"; cat "r2c-evidence/n$n.stderr.log"; exit 1; }
            grep -Fx 'A147_R2C_PARALLEL PASS' "r2c-evidence/n$n.stdout.log"
            grep '^A147_R2C_PARALLEL_PROFILE_JSON ' "r2c-evidence/n$n.stdout.log" | sed 's/^A147_R2C_PARALLEL_PROFILE_JSON //' > "r2c-evidence/n$n.json"
            test "$(wc -l < "r2c-evidence/n$n.json")" -eq 1
            if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Error compiling' "r2c-evidence/n$n.stdout.log" "r2c-evidence/n$n.stderr.log"; then exit 1; fi
          done
          python3 - <<'PY'
          import json, pathlib
          H={4:"7b56b22193534e2a77c33be3e02b1cb33fc37f189e6d68b4b1535a548fc06062",
          32:"62128cea01410626cfda7556c39afb2ae110606cee229a875476143a240ed129",
          96:"23b11ab4c0454d08de1e82b93a1a5913a2bed4116e29dc2f6bcc765cfd2bb448",
          256:"f38c44896ffc8028c00b1c1f74e5b99d41f12620d60f99f7a95690b3f6419906"}
          for n,hash in H.items():
              p=json.loads(pathlib.Path(f"r2c-evidence/n{n}.json").read_text())
              assert p["schema"]=="dws.ecology.a14-7-r2c-parallel-ordered-reduction.v1"
              assert p["population"]==n and p["canonical_hash"]==hash
              assert p["checkpoint_equal"] and p["source_unchanged"]
              assert p["single_global_allocator"] and p["canonical_biology_unchanged"]
              assert p["untrusted_full_main_validation_preserved"]
              assert p["target_one_second_not_claimed"] and p["windows_native_speedup_unproven"]
              assert p["worksets_per_resume"]==16 and p["parallel_workers"]==4
              assert p["serial_phases"]["allocate_begin_calls"]==p["parallel_phases"]["allocate_begin_calls"]==1
              if n>=32:
                  assert p["parallel_phases"]["r2c_peak_workers"]>=2
                  assert p["parallel_phases"]["r2c_parallel_threaded_worksets"]>0
              print(f'R2C_PAIRED n={n} serial16_ms={p["serial_worker_wall_us"]/1000:.3f} parallel16x4_ms={p["parallel_worker_wall_us"]/1000:.3f} ratio={p["speedup_ratio"]:.3f}x')
          print("A147_R2C_ALL_FOUR_EXACT_PARALLEL_PASS")
          PY
          git diff --exit-code && git diff --cached --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eco-a147-r2c-portable-parallel-exact
          path: |
            r2c-import.log
            r2c-evidence/
          if-no-files-found: ignore

  windows:
    name: Pinned Windows Double paired 16x1 versus 16x4 exact
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fresh pinned native Windows Godot Double scale verification
        shell: pwsh
        env:
          CONFIGURED_GODOT: ${{ vars.DWS_GODOT_DOUBLE_BIN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $godot = $env:CONFIGURED_GODOT
          if ([string]::IsNullOrWhiteSpace($godot)) { $godot = 'C:\Godot\godot\bin\godot.windows.editor.double.x86_64.console.exe' }
          if ((Get-FileHash $godot -Algorithm SHA256).Hash.ToLowerInvariant() -ne '3633c3e609c8ce2f9bae334a9c7e75c7f974de3af0415ab4a8050a625a15a7a5') { throw 'R2C_PINNED_GODOT_MISMATCH' }
          & $godot --headless --editor --path . --import *> r2c-win-import.log
          if ($LASTEXITCODE -ne 0) { throw 'R2C_IMPORT_FAILED' }
          New-Item -ItemType Directory -Force r2c-win-evidence | Out-Null
          foreach ($n in @(4,32,96,256)) {
            $stdout = Join-Path (Get-Location).Path "r2c-win-evidence\n$n.stdout.log"
            $stderr = Join-Path (Get-Location).Path "r2c-win-evidence\n$n.stderr.log"
            $args = @('--headless','--path','.','--script','res://validation/ecology/evo_arch2_a14_7/test_a147_r2c_parallel_worksets.gd','--','--r2-population',"$n")
            $proc = Start-Process -FilePath $godot -ArgumentList $args -WorkingDirectory (Get-Location).Path -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $proc.WaitForExit()
            $code = [int64]$proc.ExitCode
            $hex = '0x{0:X8}' -f ([uint32]($code -band [int64]0xffffffff))
            Write-Host "R2C_NATIVE_EXIT population=$n signed=$code hex=$hex"
            if ($code -ne 0) { Get-Content $stdout; Get-Content $stderr; throw "R2C_NATIVE_FAIL_$n" }
            if (-not (Select-String -Path $stdout -Pattern '^A147_R2C_PARALLEL PASS$' -Quiet)) { throw "R2C_PASS_MARKER_$n" }
            $rows = @(Get-Content $stdout | Where-Object { $_ -match '^A147_R2C_PARALLEL_PROFILE_JSON ' })
            if ($rows.Count -ne 1) { throw "R2C_PROFILE_ROWS_$n" }
            $profile = ($rows[0] -replace '^A147_R2C_PARALLEL_PROFILE_JSON ','') | ConvertFrom-Json
            if ([int]$profile.population -ne $n -or -not [bool]$profile.checkpoint_equal -or -not [bool]$profile.source_unchanged) { throw "R2C_EXACT_PARITY_$n" }
            if ($n -ge 32 -and [int]$profile.parallel_phases.r2c_peak_workers -lt 2) { throw "R2C_NO_PARALLEL_THREADS_$n" }
            Set-Content -Path "r2c-win-evidence\n$n.json" -Value ($rows[0] -replace '^A147_R2C_PARALLEL_PROFILE_JSON ','') -Encoding utf8
            if (Select-String -Path $stdout,$stderr -Pattern 'SCRIPT ERROR|Parse Error|Failed to load script|Error compiling' -Quiet) { throw "R2C_GDSCRIPT_FATAL_$n" }
          }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'DIRTY_WORKTREE' }
          git diff --cached --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'DIRTY_INDEX' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eco-a147-r2c-windows-double-parallel-exact
          path: |
            r2c-win-import.log
            r2c-win-evidence/
          if-no-files-found: ignore
