name: ECO ARCH2 A14.7 R2D A4 COW Exact

on:
  push:
    branches:
      - feature/eco-arch2-a14-7-r2d-a4-copyseal-r1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eco-a147-r2d-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  portable:
    name: Frozen A4 vs COW + original full Runtime 4/32/96/256
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Godot 4.7.1 cold exact old/new and whole A8
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot-r2d.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          mkdir -p /tmp/godot-r2d
          unzip -q /tmp/godot-r2d.zip -d /tmp/godot-r2d
          godot=/tmp/godot-r2d/Godot_v4.7.1-stable_linux.x86_64
          chmod +x "$godot"
          "$godot" --headless --editor --path . --import > r2d-import.log 2>&1 || { cat r2d-import.log; exit 1; }
          mkdir -p r2d-evidence
          for n in 4 32 96 256; do
            for kind in a4 full; do
              if test "$kind" = a4; then
                script=test_a147_r2d_a4_cow_exact.gd; arg=--population; marker='A147_R2D_A4 PASS'; prefix='A147_R2D_A4_COMPARE_JSON '
              else
                script=test_a147_r2c_parallel_worksets.gd; arg=--r2-population; marker='A147_R2C_PARALLEL PASS'; prefix='A147_R2C_PARALLEL_PROFILE_JSON '
              fi
              "$godot" --headless --path . --script "res://validation/ecology/evo_arch2_a14_7/$script" -- "$arg" "$n" > "r2d-evidence/$kind-$n.stdout.log" 2> "r2d-evidence/$kind-$n.stderr.log" || { cat "r2d-evidence/$kind-$n.stdout.log"; cat "r2d-evidence/$kind-$n.stderr.log"; exit 1; }
              grep -Fx "$marker" "r2d-evidence/$kind-$n.stdout.log"
              grep "^$prefix" "r2d-evidence/$kind-$n.stdout.log" | sed "s/^$prefix//" > "r2d-evidence/$kind-$n.json"
              test "$(wc -l < "r2d-evidence/$kind-$n.json")" -eq 1
              if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Error compiling' "r2d-evidence/$kind-$n.stdout.log" "r2d-evidence/$kind-$n.stderr.log"; then exit 1; fi
            done
          done
          python3 - <<'PY'
          import json,pathlib
          H={4:"7b56b22193534e2a77c33be3e02b1cb33fc37f189e6d68b4b1535a548fc06062",32:"62128cea01410626cfda7556c39afb2ae110606cee229a875476143a240ed129",96:"23b11ab4c0454d08de1e82b93a1a5913a2bed4116e29dc2f6bcc765cfd2bb448",256:"f38c44896ffc8028c00b1c1f74e5b99d41f12620d60f99f7a95690b3f6419906"}
          for n,h in H.items():
              a=json.loads(pathlib.Path(f"r2d-evidence/a4-{n}.json").read_text())
              f=json.loads(pathlib.Path(f"r2d-evidence/full-{n}.json").read_text())
              assert a["schema"]=="dws.ecology.a147-r2d-a4-phase-cow-proof.v1" and a["population"]==n
              assert a["source_unchanged"] and a["old_full_cursor_immutability"] and a["new_full_cursor_immutability"]
              assert a["old_steps"]==a["new_steps"]
              assert a["old_phase_sequence"]==a["new_phase_sequence"]==["NORMALIZE","BUILD_CLAIMS","PRIMARY","RESIDUAL","FINALIZE"]
              assert a["single_global_a4_reference_kept"] and a["untrusted_cursor_checksum_validation_kept"]
              assert f["canonical_hash"]==h and f["population"]==n and f["checkpoint_equal"] and f["source_unchanged"] and f["single_global_allocator"]
              print(f'R2D_A4_PAIRED n={n} old_ms={a["frozen_a4_wall_us"]/1000:.3f} r2d_ms={a["r2d_a4_wall_us"]/1000:.3f} speedup={a["speedup_ratio"]:.3f}x')
          print('A147_R2D_ALL_FOUR_A4_AND_FULL_RUNTIME_EXACT_PASS')
          PY
          git diff --exit-code && git diff --cached --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a147-r2d-portable-a4-full-exact
          path: |
            r2d-import.log
            r2d-evidence/
          if-no-files-found: ignore

  windows:
    name: Pinned Windows Double 4/32/96/256 A4 and full Runtime Exact
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pinned Double native and old/new A4 exact
        shell: pwsh
        env:
          CONFIGURED_GODOT: ${{ vars.DWS_GODOT_DOUBLE_BIN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $godot = $env:CONFIGURED_GODOT
          if ([string]::IsNullOrWhiteSpace($godot)) { $godot = 'C:\Godot\godot\bin\godot.windows.editor.double.x86_64.console.exe' }
          if ((Get-FileHash $godot -Algorithm SHA256).Hash.ToLowerInvariant() -ne '3633c3e609c8ce2f9bae334a9c7e75c7f974de3af0415ab4a8050a625a15a7a5') { throw 'PINNED_GODOT_SHA_MISMATCH' }
          & $godot --headless --editor --path . --import *> r2d-win-import.log
          if ($LASTEXITCODE -ne 0) { throw 'R2D_IMPORT_FAILED' }
          New-Item -ItemType Directory -Force r2d-win-evidence | Out-Null
          foreach ($n in @(4,32,96,256)) {
            foreach ($kind in @('a4','full')) {
              $script = if ($kind -eq 'a4') { 'test_a147_r2d_a4_cow_exact.gd' } else { 'test_a147_r2c_parallel_worksets.gd' }
              $arg = if ($kind -eq 'a4') { '--population' } else { '--r2-population' }
              $out = Join-Path (Get-Location).Path "r2d-win-evidence\$kind-$n.stdout.log"
              $err = Join-Path (Get-Location).Path "r2d-win-evidence\$kind-$n.stderr.log"
              $argv = @('--headless','--path','.','--script',"res://validation/ecology/evo_arch2_a14_7/$script",'--',"$arg","$n")
              $p = Start-Process -FilePath $godot -ArgumentList $argv -WorkingDirectory (Get-Location).Path -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
              $p.WaitForExit()
              $exitCode = [int64]$p.ExitCode
              $hex = '0x{0:X8}' -f ([uint32]($exitCode -band [int64]0xffffffff))
              Write-Host "R2D_NATIVE_EXIT n=$n kind=$kind code=$exitCode hex=$hex"
              if ($exitCode -ne 0) { Get-Content $out; Get-Content $err; throw "R2D_NATIVE_FAILURE" }
              $marker = if ($kind -eq 'a4') { 'A147_R2D_A4 PASS' } else { 'A147_R2C_PARALLEL PASS' }
              if (-not (Select-String -Path $out -Pattern "^$marker$" -Quiet)) { throw "R2D_MARKER_MISSING" }
              $prefix = if ($kind -eq 'a4') { 'A147_R2D_A4_COMPARE_JSON ' } else { 'A147_R2C_PARALLEL_PROFILE_JSON ' }
              $rows = @(Get-Content $out | Where-Object { $_.StartsWith($prefix) })
              if ($rows.Count -ne 1) { throw "R2D_PROFILE_COUNT" }
              $json = $rows[0].Substring($prefix.Length)
              $profile = $json | ConvertFrom-Json
              if ([int]$profile.population -ne $n -or -not [bool]$profile.source_unchanged) { throw "R2D_PROFILE_SOURCE" }
              if ($kind -eq 'full' -and -not [bool]$profile.checkpoint_equal) { throw "R2D_A8_MISMATCH" }
              Set-Content -Path "r2d-win-evidence\$kind-$n.json" -Value $json -Encoding utf8
              if (Select-String -Path $out,$err -Pattern 'SCRIPT ERROR|Parse Error|Failed to load script|Error compiling' -Quiet) { throw "R2D_GDSCRIPT_FATAL" }
            }
          }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'DIRTY_WORKTREE' }
          git diff --cached --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'DIRTY_INDEX' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a147-r2d-windows-double-exact
          path: |
            r2d-win-import.log
            r2d-win-evidence/
          if-no-files-found: ignore
