name: ECO ARCH2 A14.7 R2D Fresh Independent Exact

on:
  push:
    branches:
      - verify/eco-arch2-a147-r2d-1de21d1a-fresh-r1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: Independent A4 old-state and nested tamper n32/96
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fresh Godot 4.7.1 hostile source / complete A4 exact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot-r2d-ver.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          mkdir -p /tmp/godot-r2d-ver
          unzip -q /tmp/godot-r2d-ver.zip -d /tmp/godot-r2d-ver
          godot=/tmp/godot-r2d-ver/Godot_v4.7.1-stable_linux.x86_64
          chmod +x "$godot"
          "$godot" --headless --editor --path . --import > r2d-ver-import.log 2>&1 || { cat r2d-ver-import.log; exit 1; }
          mkdir -p r2d-ver-evidence
          for n in 32 96 256; do
            "$godot" --headless --path . --script res://validation/ecology/evo_arch2_a14_7/test_a147_r2d_fresh_independent.gd -- --population "$n" > "r2d-ver-evidence/n$n.stdout.log" 2> "r2d-ver-evidence/n$n.stderr.log" || { cat "r2d-ver-evidence/n$n.stdout.log"; cat "r2d-ver-evidence/n$n.stderr.log"; exit 1; }
            grep -Fx 'A147_R2D_INDEPENDENT PASS' "r2d-ver-evidence/n$n.stdout.log"
            grep '^A147_R2D_INDEPENDENT_JSON ' "r2d-ver-evidence/n$n.stdout.log" | sed 's/^A147_R2D_INDEPENDENT_JSON //' > "r2d-ver-evidence/n$n.json"
          done
          python3 - <<'PY'
          import json,pathlib
          for n in (32,96,256):
              p=json.loads(pathlib.Path(f'r2d-ver-evidence/n{n}.json').read_text())
              assert p['population']==n and p['exact_a4_state'] and p['exact_a4_grants']
              assert p['cursor_input_immutable'] and p['frozen_source_unchanged'] and p['single_original_global_reference']
              assert p['phase_order']==['NORMALIZE','BUILD_CLAIMS','PRIMARY','RESIDUAL','FINALIZE']
          p256=json.loads(pathlib.Path('r2d-ver-evidence/n256.json').read_text())
          assert p256['population']==256
          print('A147_R2D_FRESH_INDEPENDENT_EXACT_PASS')
          PY
          grep '^A147_R2D_ABBA_PROFILE_JSON ' r2d-ver-evidence/n256.stdout.log | sed 's/^A147_R2D_ABBA_PROFILE_JSON //' > r2d-ver-evidence/n256-abba.json
          python3 - <<'PY'
          import json
          p=json.load(open('r2d-ver-evidence/n256-abba.json'))
          assert p['population']==256 and p['order']==['FROZEN','R2D','R2D','FROZEN']
          assert len(p['frozen_wall_us'])==len(p['r2d_wall_us'])==2
          assert p['original_global_authority_exact'] and p['source_unchanged']
          assert not p['full_tick_speedup_claim'] and not p['single_pair_claim']
          print(f'R2D_ABBA_N256 frozen_mean_ms={p["frozen_mean_us"]/1000:.3f} r2d_mean_ms={p["r2d_mean_us"]/1000:.3f} ratio={p["observed_ratio"]:.3f}x')
          PY
          git diff --exit-code && git diff --cached --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r2d-fresh-portable
          path: |
            r2d-ver-import.log
            r2d-ver-evidence/
          if-no-files-found: ignore

  windows:
    name: Independent pinned Windows Double A4 tamper exact
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Windows original global A4 security exact
        shell: pwsh
        env:
          CONFIGURED_GODOT: ${{ vars.DWS_GODOT_DOUBLE_BIN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $godot = $env:CONFIGURED_GODOT
          if ([string]::IsNullOrWhiteSpace($godot)) { $godot = 'C:\Godot\godot\bin\godot.windows.editor.double.x86_64.console.exe' }
          if ((Get-FileHash $godot -Algorithm SHA256).Hash.ToLowerInvariant() -ne '3633c3e609c8ce2f9bae334a9c7e75c7f974de3af0415ab4a8050a625a15a7a5') { throw 'A147_R2D_VERIFIER_PIN_MISMATCH' }
          & $godot --headless --editor --path . --import *> r2d-ver-win-import.log
          if ($LASTEXITCODE -ne 0) { throw 'A147_R2D_VERIFIER_IMPORT' }
          New-Item -ItemType Directory -Force r2d-ver-win-evidence | Out-Null
          foreach ($n in @(32,96,256)) {
            $out = Join-Path (Get-Location).Path "r2d-ver-win-evidence\n$n.stdout.log"
            $err = Join-Path (Get-Location).Path "r2d-ver-win-evidence\n$n.stderr.log"
            $argv = @('--headless','--path','.','--script','res://validation/ecology/evo_arch2_a14_7/test_a147_r2d_fresh_independent.gd','--','--population',"$n")
            $p = Start-Process -FilePath $godot -ArgumentList $argv -WorkingDirectory (Get-Location).Path -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
            $p.WaitForExit()
            if ($p.ExitCode -ne 0) { Get-Content $out; Get-Content $err; throw 'A147_R2D_FRESH_NATIVE_FAILURE' }
            if (-not (Select-String -Path $out -Pattern '^A147_R2D_INDEPENDENT PASS$' -Quiet)) { throw 'A147_R2D_FRESH_MARKER_MISSING' }
          }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'DIRTY_WORKTREE' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r2d-fresh-windows
          path: |
            r2d-ver-win-import.log
            r2d-ver-win-evidence/
          if-no-files-found: ignore
