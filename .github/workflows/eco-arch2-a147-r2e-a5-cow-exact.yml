name: ECO ARCH2 A14.7 R2E Frozen A5 Copy-on-Write Exact

on:
  push:
    branches:
      - feature/eco-arch2-a14-7-r2e-a5-phase-cow-r1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eco-a147-r2e-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  portable:
    name: Frozen A5 vs COW exact and full Runtime 4/32/96/256
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Godot 4.7.1 preflight and exact old/new A5 full worker
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot-a147r2e.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          mkdir -p /tmp/godot-a147r2e
          unzip -q /tmp/godot-a147r2e.zip -d /tmp/godot-a147r2e
          godot=/tmp/godot-a147r2e/Godot_v4.7.1-stable_linux.x86_64
          chmod +x "$godot"
          "$godot" --headless --editor --path . --import > r2e-import.log 2>&1 || { cat r2e-import.log; exit 1; }
          mkdir -p r2e-evidence
          for n in 4 32 96 256; do
            echo "R2E_A5_BEGIN n=$n"
            "$godot" --headless --path . --script res://validation/ecology/evo_arch2_a14_7/test_a147_r2e_a5_cow_exact.gd -- --population "$n" > "r2e-evidence/a5-$n.stdout.log" 2> "r2e-evidence/a5-$n.stderr.log" || { cat "r2e-evidence/a5-$n.stdout.log"; cat "r2e-evidence/a5-$n.stderr.log"; exit 1; }
            grep -Fx 'A147_R2E_A5 PASS' "r2e-evidence/a5-$n.stdout.log"
            grep '^A147_R2E_A5_PROFILE_JSON ' "r2e-evidence/a5-$n.stdout.log" | sed 's/^A147_R2E_A5_PROFILE_JSON //' > "r2e-evidence/a5-$n.json"
            test "$(wc -l < "r2e-evidence/a5-$n.json")" -eq 1
            if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Error compiling' "r2e-evidence/a5-$n.stdout.log" "r2e-evidence/a5-$n.stderr.log"; then exit 1; fi
          done
          python3 - <<'PY'
          import json,pathlib
          H={
          4:"7b56b22193534e2a77c33be3e02b1cb33fc37f189e6d68b4b1535a548fc06062",
          32:"62128cea01410626cfda7556c39afb2ae110606cee229a875476143a240ed129",
          96:"23b11ab4c0454d08de1e82b93a1a5913a2bed4116e29dc2f6bcc765cfd2bb448",
          256:"f38c44896ffc8028c00b1c1f74e5b99d41f12620d60f99f7a95690b3f6419906"}
          for n,expected in H.items():
              p=json.loads(pathlib.Path(f"r2e-evidence/a5-{n}.json").read_text())
              assert p["schema"]=="dws.ecology.a14-7-r2e-a5-cow-exact.v1"
              assert p["population"]==n and p["canonical_hash"]==expected
              assert p["exact_a8"] and p["deep_immutability"] and p["source_unchanged"]
              assert p["same_phase_order"] and p["same_number_of_calls"]
              assert p["single_global_a4"] and p["direct_untrusted_full_validation"]
              assert p["source_checks_disabled"] is False and p["checkpoint_formula_changed"] is False
              assert p["full_tick_one_second_claim"] is False and p["worker_wall_us"]>0
              ph=p["cpu_profile"]
              assert ph["r2e_runtime_source_validate_us"]>0 and ph["r2e_a5_source_digest_us"]>0
              assert ph["r2e_a5_cursor_verify_us"]>0 and ph["r2e_a5_cow_copy_us"]>0
              assert ph["r2e_profiled_calls"]>0
              print(f'R2E_A5 n={n} frozen_ms={p["frozen_a5_wall_us"]/1000:.3f} cow_ms={p["r2e_a5_wall_us"]/1000:.3f} ratio={p["a5_observed_ratio"]:.3f}x worker_ms={p["worker_wall_us"]/1000:.3f} full_Runtime_validate_ms={ph["r2e_runtime_source_validate_us"]/1000:.3f} A5_source_digest_ms={ph["r2e_a5_source_digest_us"]/1000:.3f}')
          print("A147_R2E_A5_ALL_FOUR_FULL_RUNTIME_A8_EXACT_PASS")
          PY
          git diff --exit-code && git diff --cached --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a147-r2e-portable-frozen-a5-and-runtime
          path: |
            r2e-import.log
            r2e-evidence/
          if-no-files-found: ignore

  windows:
    name: Windows pinned Double full A5/Runtime exact 4/32/96/256
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Native Windows Double byte-exact A5/Runtime benchmark
        shell: pwsh
        env:
          CONFIGURED_GODOT: ${{ vars.DWS_GODOT_DOUBLE_BIN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $godot = $env:CONFIGURED_GODOT
          if ([string]::IsNullOrWhiteSpace($godot)) { $godot = 'C:\Godot\godot\bin\godot.windows.editor.double.x86_64.console.exe' }
          if ((Get-FileHash $godot -Algorithm SHA256).Hash.ToLowerInvariant() -ne '3633c3e609c8ce2f9bae334a9c7e75c7f974de3af0415ab4a8050a625a15a7a5') { throw "R2E_PINNED_GODOT_MISMATCH" }
          & $godot --headless --editor --path . --import *> r2e-win-import.log
          if ($LASTEXITCODE -ne 0) { throw 'R2E_IMPORT_FAILED' }
          New-Item -ItemType Directory -Force r2e-win-evidence | Out-Null
          foreach ($n in @(4,32,96,256)) {
            $out = Join-Path (Get-Location).Path "r2e-win-evidence\a5-$n.stdout.log"
            $err = Join-Path (Get-Location).Path "r2e-win-evidence\a5-$n.stderr.log"
            $argv = @('--headless','--path','.','--script','res://validation/ecology/evo_arch2_a14_7/test_a147_r2e_a5_cow_exact.gd','--','--population',"$n")
            $p = Start-Process -FilePath $godot -ArgumentList $argv -WorkingDirectory (Get-Location).Path -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
            $p.WaitForExit()
            $exit = [int64]$p.ExitCode
            $hex = '0x{0:X8}' -f ([uint32]($exit -band [int64]0xffffffff))
            Write-Host "R2E_NATIVE_EXIT n=$n code=$exit hex=$hex"
            if ($exit -ne 0) { Get-Content $out; Get-Content $err; throw "R2E_NATIVE_$n" }
            if (-not (Select-String -Path $out -Pattern '^A147_R2E_A5 PASS$' -Quiet)) { throw "R2E_A5_MARKER_$n" }
            $rows = @(Get-Content $out | Where-Object { $_ -match '^A147_R2E_A5_PROFILE_JSON ' })
            if ($rows.Count -ne 1) { throw "R2E_JSON_ROWS_$n" }
            $json = ($rows[0] -replace '^A147_R2E_A5_PROFILE_JSON ','')
            $p2 = $json | ConvertFrom-Json
            if ([int]$p2.population -ne $n -or -not [bool]$p2.exact_a8 -or -not [bool]$p2.deep_immutability -or -not [bool]$p2.source_unchanged) { throw "R2E_EXACT_A8_$n" }
            Set-Content -Path "r2e-win-evidence\a5-$n.json" -Value $json -Encoding utf8
            if (Select-String -Path $out,$err -Pattern 'SCRIPT ERROR|Parse Error|Failed to load script|Error compiling' -Quiet) { throw "R2E_SCRIPT_$n" }
          }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'DIRTY_WORKTREE' }
          git diff --cached --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'DIRTY_INDEX' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a147-r2e-win-double-a5-runtime
          path: |
            r2e-win-import.log
            r2e-win-evidence/
          if-no-files-found: ignore
