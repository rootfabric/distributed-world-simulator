name: ECO ARCH2 A14.7 R2E Fresh Independent Exact

on:
  push:
    branches:
      - verify/eco-arch2-a147-r2e-8ede5dc5-fresh-r1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: independent EVERY A5 cursor + hostile source exact n32/n96
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Official Godot 4.7.1 exact frozen A5 full cursors and deep tamper
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot-r2e-fresh.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          mkdir -p /tmp/godot-r2e-fresh
          unzip -q /tmp/godot-r2e-fresh.zip -d /tmp/godot-r2e-fresh
          godot=/tmp/godot-r2e-fresh/Godot_v4.7.1-stable_linux.x86_64
          chmod +x "$godot"
          "$godot" --headless --editor --path . --import > r2e-fresh-import.log 2>&1 || { cat r2e-fresh-import.log; exit 1; }
          mkdir -p r2e-fresh-evidence
          for n in 32 96; do
            "$godot" --headless --path . --script res://validation/ecology/evo_arch2_a14_7/test_a147_r2e_fresh_independent.gd -- --population "$n" > "r2e-fresh-evidence/n$n.stdout.log" 2> "r2e-fresh-evidence/n$n.stderr.log" || { cat "r2e-fresh-evidence/n$n.stdout.log"; cat "r2e-fresh-evidence/n$n.stderr.log"; exit 1; }
            grep -Fx 'A147_R2E_FRESH PASS' "r2e-fresh-evidence/n$n.stdout.log"
            grep '^A147_R2E_FRESH_JSON ' "r2e-fresh-evidence/n$n.stdout.log" | sed 's/^A147_R2E_FRESH_JSON //' > "r2e-fresh-evidence/n$n.json"
            if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Error compiling' "r2e-fresh-evidence/n$n.stdout.log" "r2e-fresh-evidence/n$n.stderr.log"; then exit 1; fi
          done
          python3 - <<'PY'
          import json,pathlib
          for n in (32,96):
              p=json.loads(pathlib.Path(f'r2e-fresh-evidence/n{n}.json').read_text())
              assert p['schema']=='dws.ecology.a147-r2e-fresh-verifier.v1'
              assert p['population']==n and p['calls']>0
              assert p['phases']==['PREPARE','ALLOCATE','ADVANCE']
              assert p['every_cursor_exact'] and p['full_source_validation']
              assert p['tamper_falsifier'] and p['source_falsifier']
              assert p['same_full_global_field'] and p['same_full_population'] and p['source_unchanged']
          print('A147_R2E_FRESH_INDEPENDENT_EXACT_PASS')
          PY
          git diff --exit-code && git diff --cached --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a147-r2e-fresh-portable
          path: |
            r2e-fresh-import.log
            r2e-fresh-evidence/
          if-no-files-found: ignore

  windows:
    name: independent Windows Double frozen exact A5 cursor security
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Frozen Windows Double nested hostile source and exact full cursor
        shell: pwsh
        env:
          CONFIGURED_GODOT: ${{ vars.DWS_GODOT_DOUBLE_BIN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $godot = $env:CONFIGURED_GODOT
          if ([string]::IsNullOrWhiteSpace($godot)) { $godot = 'C:\Godot\godot\bin\godot.windows.editor.double.x86_64.console.exe' }
          if ((Get-FileHash $godot -Algorithm SHA256).Hash.ToLowerInvariant() -ne '3633c3e609c8ce2f9bae334a9c7e75c7f974de3af0415ab4a8050a625a15a7a5') { throw 'R2E_FRESH_GODOT_MISMATCH' }
          & $godot --headless --editor --path . --import *> r2e-fresh-win-import.log
          if ($LASTEXITCODE -ne 0) { throw 'R2E_FRESH_IMPORT_FAIL' }
          New-Item -ItemType Directory -Force r2e-fresh-win-evidence | Out-Null
          foreach ($n in @(32,96)) {
            $out = Join-Path (Get-Location).Path "r2e-fresh-win-evidence\n$n.stdout.log"
            $err = Join-Path (Get-Location).Path "r2e-fresh-win-evidence\n$n.stderr.log"
            $argv = @('--headless','--path','.','--script','res://validation/ecology/evo_arch2_a14_7/test_a147_r2e_fresh_independent.gd','--','--population',"$n")
            $p = Start-Process -FilePath $godot -ArgumentList $argv -WorkingDirectory (Get-Location).Path -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
            $p.WaitForExit()
            $exit = [int64]$p.ExitCode
            $hex = '0x{0:X8}' -f ([uint32]($exit -band [int64]0xffffffff))
            Write-Host "R2E_FRESH_NATIVE_EXIT n=$n code=$exit hex=$hex"
            if ($exit -ne 0) { Get-Content $out; Get-Content $err; throw 'R2E_FRESH_NATIVE_FAIL' }
            if (-not (Select-String -Path $out -Pattern '^A147_R2E_FRESH PASS$' -Quiet)) { throw 'R2E_FRESH_MARKER_MISSING' }
          }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'DIRTY_WORKTREE' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a147-r2e-fresh-windows
          path: |
            r2e-fresh-win-import.log
            r2e-fresh-win-evidence/
          if-no-files-found: ignore
