name: ECO ARCH2 A14.7 R2E2 Owned CPU Source Exact

on:
  push:
    branches:
      - feature/eco-arch2-a14-7-r2e2-owned-worker-fast-r1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eco-a147-r2e2-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable real LAB Controller strict-vs-owned 4/32/96/256 original A8
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Godot 4.7.1 exact old/new global Runtime source ownership
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot-e2.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          mkdir -p /tmp/godot-e2
          unzip -q /tmp/godot-e2.zip -d /tmp/godot-e2
          godot=/tmp/godot-e2/Godot_v4.7.1-stable_linux.x86_64
          chmod +x "$godot"
          "$godot" --headless --editor --path . --import > r2e2-import.log 2>&1 || { cat r2e2-import.log; exit 1; }
          mkdir -p r2e2-evidence
          for n in 4 32 96 256; do
            "$godot" --headless --path . --script res://validation/ecology/evo_arch2_a14_7/test_a147_r2e2_owned_worker.gd -- --population "$n" > "r2e2-evidence/n$n.stdout.log" 2> "r2e2-evidence/n$n.stderr.log" || { cat "r2e2-evidence/n$n.stdout.log"; cat "r2e2-evidence/n$n.stderr.log"; exit 1; }
            grep -Fx 'A147_R2E2_OWNED PASS' "r2e2-evidence/n$n.stdout.log"
            grep '^A147_R2E2_OWNED_PROFILE_JSON ' "r2e2-evidence/n$n.stdout.log" | sed 's/^A147_R2E2_OWNED_PROFILE_JSON //' > "r2e2-evidence/n$n.json"
            test "$(wc -l < "r2e2-evidence/n$n.json")" -eq 1
            if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Error compiling' "r2e2-evidence/n$n.stdout.log" "r2e2-evidence/n$n.stderr.log"; then exit 1; fi
          done
          python3 - <<'PY'
          import json,pathlib
          H={4:"7b56b22193534e2a77c33be3e02b1cb33fc37f189e6d68b4b1535a548fc06062",32:"62128cea01410626cfda7556c39afb2ae110606cee229a875476143a240ed129",96:"23b11ab4c0454d08de1e82b93a1a5913a2bed4116e29dc2f6bcc765cfd2bb448",256:"f38c44896ffc8028c00b1c1f74e5b99d41f12620d60f99f7a95690b3f6419906"}
          for n,h in H.items():
              p=json.loads(pathlib.Path(f"r2e2-evidence/n{n}.json").read_text())
              assert p["schema"]=="dws.ecology.a147-r2e2-owned-worker-fast.v1"
              assert p["population"]==n and p["canonical_hash"]==h
              assert p["checkpoint_equal"] and p["original_exact"] and p["source_unchanged"]
              assert p["single_global_a4"] and p["direct_untrusted_fast_rejected"]
              assert p["worker_owned_deep_detached"] and p["default_original_strict"]
              assert p["owned_first_full_validate_us"]>0
              assert p["strict_final_source_validate_us"]>0
              assert p["owned_final_source_validate_us"]>0
              assert p["owned_final_candidate_validate_us"]>0
              assert p["guaranteed_subsecond"] is False
              print(f'R2E2_PAIR n={n} strict_ms={p["strict_worker_wall_us"]/1000:.3f} owned_ms={p["owned_worker_wall_us"]/1000:.3f} ratio={p["observed_ratio"]:.3f}x')
          print('A147_R2E2_FOUR_EXACT_AND_OWNED_FULL_VALIDATION_PASS')
          PY
          git diff --exit-code && git diff --cached --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a147-r2e2-portable-owned
          path: |
            r2e2-import.log
            r2e2-evidence/
          if-no-files-found: ignore

  windows:
    name: Windows pinned Double real LAB owned CPU 4/32/96/256 exact
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pinned Windows Double original canonical and owner fencing
        shell: pwsh
        env:
          CONFIGURED_GODOT: ${{ vars.DWS_GODOT_DOUBLE_BIN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $godot = $env:CONFIGURED_GODOT
          if ([string]::IsNullOrWhiteSpace($godot)) { $godot = 'C:\Godot\godot\bin\godot.windows.editor.double.x86_64.console.exe' }
          if ((Get-FileHash $godot -Algorithm SHA256).Hash.ToLowerInvariant() -ne '3633c3e609c8ce2f9bae334a9c7e75c7f974de3af0415ab4a8050a625a15a7a5') { throw 'R2E2_PINNED_GODOT_SHA' }
          & $godot --headless --editor --path . --import *> r2e2-win-import.log
          if ($LASTEXITCODE -ne 0) { throw 'R2E2_IMPORT_FAIL' }
          New-Item -ItemType Directory -Force r2e2-win-evidence | Out-Null
          foreach ($n in @(4,32,96,256)) {
            $out = Join-Path (Get-Location).Path "r2e2-win-evidence\n$n.stdout.log"
            $err = Join-Path (Get-Location).Path "r2e2-win-evidence\n$n.stderr.log"
            $argv = @('--headless','--path','.','--script','res://validation/ecology/evo_arch2_a14_7/test_a147_r2e2_owned_worker.gd','--','--population',"$n")
            $proc = Start-Process -FilePath $godot -ArgumentList $argv -WorkingDirectory (Get-Location).Path -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
            $proc.WaitForExit()
            $exit = [int64]$proc.ExitCode
            $hex = '0x{0:X8}' -f ([uint32]($exit -band [int64]0xffffffff))
            Write-Host "R2E2_NATIVE_EXIT n=$n code=$exit hex=$hex"
            if ($exit -ne 0) { Get-Content $out; Get-Content $err; throw 'R2E2_NATIVE_FAIL' }
            if (-not (Select-String -Path $out -Pattern '^A147_R2E2_OWNED PASS$' -Quiet)) { throw 'R2E2_MARKER_MISSING' }
            $rows = @(Get-Content $out | Where-Object { $_ -match '^A147_R2E2_OWNED_PROFILE_JSON ' })
            if ($rows.Count -ne 1) { throw 'R2E2_PROFILE_COUNT' }
            $json = ($rows[0] -replace '^A147_R2E2_OWNED_PROFILE_JSON ','')
            $p = $json | ConvertFrom-Json
            if ([int]$p.population -ne $n -or -not [bool]$p.checkpoint_equal -or -not [bool]$p.direct_untrusted_fast_rejected -or -not [bool]$p.worker_owned_deep_detached) { throw 'R2E2_RESULT_INVALID' }
            Set-Content -Path "r2e2-win-evidence\n$n.json" -Value $json -Encoding utf8
            if (Select-String -Path $out,$err -Pattern 'SCRIPT ERROR|Parse Error|Failed to load script|Error compiling' -Quiet) { throw 'R2E2_SCRIPT_FATAL' }
          }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'DIRTY_WORKTREE' }
          git diff --cached --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'DIRTY_INDEX' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a147-r2e2-windows-double-owned
          path: |
            r2e2-win-import.log
            r2e2-win-evidence/
          if-no-files-found: ignore
