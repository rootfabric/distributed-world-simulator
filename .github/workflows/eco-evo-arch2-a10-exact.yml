name: ECO ARCH2 A10 Exact

on:
  push:
    branches:
      - feature/eco-evo-arch2-a10-world-bindings-r1
    paths:
      - config/ecology/evo-arch2-a10-work-order.v1.json
      - docs/research/ecology/EVO_ARCH2_A10_WORLD_BINDINGS_R1_RU.md
      - scripts/research/ecology/v2/world_binding_v1.gd
      - validation/ecology/evo_arch2_a10/**
      - .github/workflows/eco-evo-arch2-a10-exact.yml
  pull_request:
    paths:
      - config/ecology/evo-arch2-a10-work-order.v1.json
      - docs/research/ecology/EVO_ARCH2_A10_WORLD_BINDINGS_R1_RU.md
      - scripts/research/ecology/v2/world_binding_v1.gd
      - validation/ecology/evo_arch2_a10/**
      - .github/workflows/eco-evo-arch2-a10-exact.yml

concurrency:
  group: eco-a10-exact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact:
    name: A10 Linux Double Exact
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Resolve canonical double Godot
        id: godot
        shell: bash
        run: |
          set -euo pipefail
          GODOT="${DWS_GODOT_DOUBLE_LINUX_BIN:-$HOME/.local/opt/godot-double-4.7.1-a13da4f/godot.linuxbsd.editor.double.x86_64}"
          test -x "$GODOT"
          VERSION="$("$GODOT" --version | head -n1)"
          test "$VERSION" = "4.7.1.stable.double.custom_build.a13da4feb"
          SHA="$(sha256sum "$GODOT" | awk '{print $1}')"
          test "$SHA" = "bfa7ce632d8d4b1dcc96f64f5405ee52b57c4e25d15c3e0478acc26e08d517d7"
          echo "path=$GODOT" >> "$GITHUB_OUTPUT"

      - name: Run exact A10 verifier
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          python3 validation/ecology/evo_arch2_a10/verify.py \
            --godot "${{ steps.godot.outputs.path }}" \
            --head "$HEAD_SHA" \
            --tree "$TREE_SHA"

      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eco-a10-exact-${{ github.run_id }}
          path: artifacts/a10/exact
          if-no-files-found: warn
