name: ECO ARCH2 A10 Exact

on:
  push:
    branches:
      - feature/eco-evo-arch2-a10-world-bindings-r1
    paths:
      - config/ecology/evo-arch2-a10-work-order.v1.json
      - docs/research/ecology/EVO_ARCH2_A10_WORLD_BINDINGS_R1_RU.md
      - scripts/research/ecology/v2/world_binding_v1.gd
      - validation/ecology/evo_arch2_a10/**
      - .github/workflows/eco-evo-arch2-a10-exact.yml
  pull_request:
    paths:
      - config/ecology/evo-arch2-a10-work-order.v1.json
      - docs/research/ecology/EVO_ARCH2_A10_WORLD_BINDINGS_R1_RU.md
      - scripts/research/ecology/v2/world_binding_v1.gd
      - validation/ecology/evo_arch2_a10/**
      - .github/workflows/eco-evo-arch2-a10-exact.yml

concurrency:
  group: eco-a10-exact-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  exact:
    name: A10 Linux Double Exact
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Resolve exact double editor by project marker
        id: godot
        shell: bash
        run: |
          set -euo pipefail
          bash tools/engine48/select_exact_double_engine.sh
          GODOT="$(sed -n 's/^DWS_GODOT_DOUBLE_LINUX_BIN=//p' "$GITHUB_ENV" | tail -n1)"
          test -x "$GODOT"
          echo "path=$GODOT" >> "$GITHUB_OUTPUT"

      - name: Run exact A10 verifier
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          if grep -Eq '^config/features=PackedStringArray\("4\.8"' project.godot; then
            python3 tools/engine48/verify_a10_current_runtime.py --godot "$DWS_GODOT_DOUBLE_LINUX_BIN" --stage r1
          else
          python3 validation/ecology/evo_arch2_a10/verify.py \
            --godot "${{ steps.godot.outputs.path }}" \
            --head "$HEAD_SHA" \
            --tree "$TREE_SHA"
          fi

      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eco-a10-exact-${{ github.run_id }}
          path: artifacts/a10/exact
          if-no-files-found: warn
