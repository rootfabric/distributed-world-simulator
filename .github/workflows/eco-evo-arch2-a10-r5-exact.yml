name: ECO ARCH2 A10 R5 Exact

on:
  push:
    branches:
      - feature/eco-evo-arch2-a10-final-composition-r5
    paths:
      - config/ecology/evo-arch2-a10-r5-work-order.v1.json
      - docs/research/ecology/EVO_ARCH2_A10_R5_FINAL_COMPOSITION_RU.md
      - validation/ecology/evo_arch2_a10_r5/**
      - .github/workflows/eco-evo-arch2-a10-r5-exact.yml
  pull_request:
    paths:
      - config/ecology/evo-arch2-a10-r5-work-order.v1.json
      - docs/research/ecology/EVO_ARCH2_A10_R5_FINAL_COMPOSITION_RU.md
      - validation/ecology/evo_arch2_a10_r5/**
      - .github/workflows/eco-evo-arch2-a10-r5-exact.yml

concurrency:
  group: eco-a10-r5-exact-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  exact:
    name: A10 R5 Linux Double Exact
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Resolve exact Godot
        id: godot
        shell: bash
        run: |
          set -euo pipefail
          GODOT="${DWS_GODOT_DOUBLE_LINUX_BIN:-$HOME/.local/opt/godot-double-4.7.1-a13da4f/godot.linuxbsd.editor.double.x86_64}"
          test -x "$GODOT"
          test "$("$GODOT" --version | head -n1)" = "4.7.1.stable.double.custom_build.a13da4feb"
          test "$(sha256sum "$GODOT" | awk '{print $1}')" = "bfa7ce632d8d4b1dcc96f64f5405ee52b57c4e25d15c3e0478acc26e08d517d7"
          echo "path=$GODOT" >> "$GITHUB_OUTPUT"
      - name: Run whole A10 exact verifier
        shell: bash
        run: |
          set -euo pipefail
          python3 validation/ecology/evo_arch2_a10_r5/verify.py             --godot "${{ steps.godot.outputs.path }}"             --head "$(git rev-parse HEAD)"             --tree "$(git rev-parse 'HEAD^{tree}')"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eco-a10-r5-exact-${{ github.run_id }}
          path: artifacts/a10-r5/exact
          if-no-files-found: warn
