name: ECO PERF2.CONV Final Git Bundle R1

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/eco-perf2-conv-final-bundle-r1.yml"

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch frozen subject explicitly
        shell: bash
        run: |
          git fetch origin 350581c9584abe8ef7dcd53d8a68c5f451bc9016
          test "$(git rev-parse 350581c9584abe8ef7dcd53d8a68c5f451bc9016^{tree})" = "dfc59a8cfec74073dd0ad87332f9d510be11d93e"
          git merge-base --is-ancestor 4997f7116d0e4ac40ed88fe8a41a7b5029621d71 350581c9584abe8ef7dcd53d8a68c5f451bc9016
          echo "subject=350581c9584abe8ef7dcd53d8a68c5f451bc9016"
          echo "tree=$(git rev-parse 350581c9584abe8ef7dcd53d8a68c5f451bc9016^{tree})"

      - name: Create provenance-complete bundle
        shell: bash
        run: |
          git bundle create perf2-conv-final.bundle --all
          git bundle verify perf2-conv-final.bundle
          sha256sum perf2-conv-final.bundle | tee perf2-conv-final.bundle.sha256

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: perf2-conv-final-bundle-350581c9584a
          path: |
            perf2-conv-final.bundle
            perf2-conv-final.bundle.sha256
          retention-days: 1
          if-no-files-found: error
