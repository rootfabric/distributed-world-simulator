name: ECO PERF2.CONV Preflight Source Export R1

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/eco-perf2-conv-preflight-source-r1.yml"

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PERF2.CONV preflight subject
        uses: actions/checkout@v4
        with:
          ref: 8adb10fefef14ec00207c8f8e7adcf361cdb0b88
          fetch-depth: 0

      - name: Assert exact subject
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "8adb10fefef14ec00207c8f8e7adcf361cdb0b88"
          test "$(git rev-parse HEAD^{tree})" = "176daa66d12f98310cad4919982486c17137d4a5"
          echo "PERF2_CONV_HEAD=$(git rev-parse HEAD)"
          echo "PERF2_CONV_TREE=$(git rev-parse HEAD^{tree})"

      - name: Build immutable exact source archive
        shell: bash
        run: |
          git archive --format=tar.gz --prefix=distributed-world-simulator/ \
            -o eco-perf2-conv-preflight-source.tar.gz \
            8adb10fefef14ec00207c8f8e7adcf361cdb0b88
          sha256sum eco-perf2-conv-preflight-source.tar.gz | tee eco-perf2-conv-preflight-source.sha256

      - name: Upload exact source
        uses: actions/upload-artifact@v4
        with:
          name: eco-perf2-conv-preflight-8adb10fefef1
          path: |
            eco-perf2-conv-preflight-source.tar.gz
            eco-perf2-conv-preflight-source.sha256
          if-no-files-found: error
          retention-days: 1
