name: ECO VIS4.7 Exact Source Export R1

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/eco-vis4-7-local-source-export-r1.yml"

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact VIS4.7 subject
        uses: actions/checkout@v4
        with:
          ref: 7b3479156a6920083f6cc2c420fcb21834e6dc5e
          fetch-depth: 0

      - name: Assert exact subject
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "7b3479156a6920083f6cc2c420fcb21834e6dc5e"
          test "$(git rev-parse HEAD^{tree})" = "8fedc29f3837f632d5c264080e8d5897beae1861"
          echo "VIS4_7_HEAD=$(git rev-parse HEAD)"
          echo "VIS4_7_TREE=$(git rev-parse HEAD^{tree})"

      - name: Build immutable exact source archive
        shell: bash
        run: |
          git archive --format=tar.gz --prefix=distributed-world-simulator/ \
            -o eco-vis4-7-exact-source.tar.gz \
            7b3479156a6920083f6cc2c420fcb21834e6dc5e
          sha256sum eco-vis4-7-exact-source.tar.gz | tee eco-vis4-7-exact-source.sha256

      - name: Upload exact VIS4.7 source
        uses: actions/upload-artifact@v4
        with:
          name: eco-vis4-7-exact-source-7b3479156a69
          path: |
            eco-vis4-7-exact-source.tar.gz
            eco-vis4-7-exact-source.sha256
          if-no-files-found: error
          retention-days: 1
