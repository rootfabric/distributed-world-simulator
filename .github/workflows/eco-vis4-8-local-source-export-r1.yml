name: ECO VIS4.8 Exact Source Export R1

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/eco-vis4-8-local-source-export-r1.yml"

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact VIS4.8 subject
        uses: actions/checkout@v4
        with:
          ref: 32d9401d2ae7beb2a222b926f07ba44ec50dfe40
          fetch-depth: 0

      - name: Assert exact subject
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "32d9401d2ae7beb2a222b926f07ba44ec50dfe40"
          test "$(git rev-parse HEAD^{tree})" = "09feb0705f2ae32f50d5e0e32db048648600e10f"
          echo "VIS4_8_HEAD=$(git rev-parse HEAD)"
          echo "VIS4_8_TREE=$(git rev-parse HEAD^{tree})"

      - name: Build immutable exact source archive
        shell: bash
        run: |
          git archive --format=tar.gz --prefix=distributed-world-simulator/ \
            -o eco-vis4-8-exact-source.tar.gz \
            32d9401d2ae7beb2a222b926f07ba44ec50dfe40
          sha256sum eco-vis4-8-exact-source.tar.gz | tee eco-vis4-8-exact-source.sha256

      - name: Upload exact VIS4.8 source
        uses: actions/upload-artifact@v4
        with:
          name: eco-vis4-8-exact-source-32d9401d2ae7
          path: |
            eco-vis4-8-exact-source.tar.gz
            eco-vis4-8-exact-source.sha256
          if-no-files-found: error
          retention-days: 1
