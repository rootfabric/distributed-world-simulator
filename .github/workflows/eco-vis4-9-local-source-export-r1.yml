name: ECO VIS4.9 Exact Source Export R1

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/eco-vis4-9-local-source-export-r1.yml"

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact VIS4.9 subject
        uses: actions/checkout@v4
        with:
          ref: ab44617d8961add81a6c9f245c99d0b68eaeab52
          fetch-depth: 0

      - name: Assert exact subject
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "ab44617d8961add81a6c9f245c99d0b68eaeab52"
          test "$(git rev-parse HEAD^{tree})" = "9d543a3db4f54a676e9f25152785c36a72c56a30"
          echo "VIS4_9_HEAD=$(git rev-parse HEAD)"
          echo "VIS4_9_TREE=$(git rev-parse HEAD^{tree})"

      - name: Build immutable exact source archive
        shell: bash
        run: |
          git archive --format=tar.gz --prefix=distributed-world-simulator/ \
            -o eco-vis4-9-exact-source.tar.gz \
            ab44617d8961add81a6c9f245c99d0b68eaeab52
          sha256sum eco-vis4-9-exact-source.tar.gz | tee eco-vis4-9-exact-source.sha256

      - name: Upload exact VIS4.9 source
        uses: actions/upload-artifact@v4
        with:
          name: eco-vis4-9-exact-source-ab44617d8961
          path: |
            eco-vis4-9-exact-source.tar.gz
            eco-vis4-9-exact-source.sha256
          if-no-files-found: error
          retention-days: 1
