name: ECO VIS5.4 Exact Source Export R1

on:
  push:
    branches:
      - validation/eco-vis5-4-source-export-r1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact VIS5.4 target
        uses: actions/checkout@v4
        with:
          ref: 4b75429ac57b5acd17359ab7f47015cb06e01784
          fetch-depth: 0

      - name: Assert exact target and archive
        run: |
          set -euo pipefail
          expected="4b75429ac57b5acd17359ab7f47015cb06e01784"
          actual="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          test "$actual" = "$expected"
          test -z "$(git status --porcelain --untracked-files=no)"
          git archive --format=tar.gz --output=eco-vis5-4-exact-source.tar.gz "$actual"
          sha256sum eco-vis5-4-exact-source.tar.gz | tee eco-vis5-4-exact-source.sha256
          echo "exact_head=$actual"
          echo "exact_tree=$tree"

      - name: Upload exact source
        uses: actions/upload-artifact@v4
        with:
          name: eco-vis5-4-exact-source-r1
          path: |
            eco-vis5-4-exact-source.tar.gz
            eco-vis5-4-exact-source.sha256
          if-no-files-found: error
          retention-days: 7
