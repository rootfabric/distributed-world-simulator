name: ECO VIS5.5 Exact Source Export R2

on:
  push:
    branches:
      - validation/eco-vis5-5-source-export-r2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact VIS5.5 target
        uses: actions/checkout@v4
        with:
          ref: fb1a7ac21037e02033eae6d7e778ed8757514e19
          fetch-depth: 0

      - name: Assert exact target and archive
        run: |
          set -euo pipefail
          expected="fb1a7ac21037e02033eae6d7e778ed8757514e19"
          actual="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          test "$actual" = "$expected"
          test -z "$(git status --porcelain --untracked-files=no)"
          git archive --format=tar.gz --output=eco-vis5-5-exact-source-r2.tar.gz "$actual"
          sha256sum eco-vis5-5-exact-source-r2.tar.gz | tee eco-vis5-5-exact-source-r2.sha256
          echo "exact_head=$actual"
          echo "exact_tree=$tree"

      - name: Upload exact source
        uses: actions/upload-artifact@v4
        with:
          name: eco-vis5-5-exact-source-r2
          path: |
            eco-vis5-5-exact-source-r2.tar.gz
            eco-vis5-5-exact-source-r2.sha256
          if-no-files-found: error
          retention-days: 7
