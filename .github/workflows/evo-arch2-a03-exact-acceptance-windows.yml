name: ECO ARCH2 A0-A3 Exact Acceptance Windows

on:
  push:
    branches:
      - feature/eco-evo-arch2-a0-a3-r1
    paths:
      - "scripts/research/ecology/v2/**"
      - "scripts/labs/ecology/evo_morphology_lab_v2*"
      - "scenes/labs/ecology/evo_morphology_lab_v2.tscn"
      - "tests/research/ecology/v2/arch2_a03_exact_acceptance.gd"
      - ".github/workflows/evo-arch2-a03-exact-acceptance-windows.yml"
  pull_request:
    branches:
      - feature/eco-evo7-vis5-terrain-ecosystem-composition-r1
    paths:
      - "scripts/research/ecology/v2/**"
      - "scripts/labs/ecology/evo_morphology_lab_v2*"
      - "scenes/labs/ecology/evo_morphology_lab_v2.tscn"
      - "tests/research/ecology/v2/arch2_a03_exact_acceptance.gd"
      - ".github/workflows/evo-arch2-a03-exact-acceptance-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eco-arch2-a03-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-exact:
    name: exact A0-A3 Windows verifier
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 150

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Assert exact HEAD and clean tracked tree
        run: |
          $ErrorActionPreference = "Stop"
          $head = (git rev-parse HEAD).Trim()
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          if ($head -ne "${{ github.sha }}") { throw "EXACT_HEAD_MISMATCH actual=$head expected=${{ github.sha }}" }
          $dirty = git status --porcelain --untracked-files=no
          if (-not [string]::IsNullOrWhiteSpace(($dirty -join ""))) { throw "TRACKED_TREE_DIRTY_BEFORE_RUN" }
          Write-Host "exact_head=$head"
          Write-Host "exact_tree=$tree"

      - name: Resolve exact double Godot
        id: godot
        env:
          CONFIGURED_GODOT_BIN: ${{ vars.DWS_GODOT_DOUBLE_BIN }}
        run: |
          $ErrorActionPreference = "Stop"
          $godot = $env:CONFIGURED_GODOT_BIN
          if ([string]::IsNullOrWhiteSpace($godot)) {
            $godot = "C:\Godot\godot\bin\godot.windows.editor.double.x86_64.console.exe"
          }
          if (-not (Test-Path -LiteralPath $godot -PathType Leaf)) { throw "Exact Godot binary not found: $godot" }
          $version = (& $godot --version 2>&1 | Select-Object -First 1).Trim()
          if ($version -ne "4.7.1.stable.double.custom_build.a13da4feb") { throw "GODOT_IDENTITY_MISMATCH: $version" }
          $sha = (Get-FileHash -LiteralPath $godot -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne "3633c3e609c8ce2f9bae334a9c7e75c7f974de3af0415ab4a8050a625a15a7a5") { throw "GODOT_SHA256_MISMATCH: $sha" }
          "path=$godot" >> $env:GITHUB_OUTPUT
          Write-Host "Godot identity: $version"
          Write-Host "Godot SHA256: $sha"

      - name: Cold import from empty cache
        env:
          GODOT_BIN: ${{ steps.godot.outputs.path }}
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path .godot) { Remove-Item .godot -Recurse -Force }
          & $env:GODOT_BIN --headless --audio-driver Dummy --editor --path $PWD --import *> arch2-cold-import.log
          if ($LASTEXITCODE -ne 0) { throw "COLD_IMPORT_EXIT_$LASTEXITCODE" }
          $bad = Select-String -Path arch2-cold-import.log -Pattern 'SCRIPT ERROR|Parse Error|ERROR:'
          if ($bad) { Get-Content arch2-cold-import.log; throw "COLD_IMPORT_ERROR_MARKER" }
          Get-FileHash arch2-cold-import.log -Algorithm SHA256

      - name: Run ARCH2 exact acceptance twice
        env:
          GODOT_BIN: ${{ steps.godot.outputs.path }}
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          $ErrorActionPreference = "Stop"
          1..2 | ForEach-Object {
            $log = "arch2-exact-$_.log"
            & $env:GODOT_BIN --headless --audio-driver Dummy --path $PWD --script res://tests/research/ecology/v2/arch2_a03_exact_acceptance.gd *> $log
            if ($LASTEXITCODE -ne 0) { throw "ARCH2_EXACT_EXIT_$LASTEXITCODE" }
            $text = Get-Content $log -Raw
            if (-not $text.Contains('EVO_ARCH2_A03_EXACT assertions=68 failed=0')) { throw "ARCH2_ASSERTION_MARKER_MISSING" }
            if ($text -match 'SCRIPT ERROR|Parse Error|ERROR:|FAIL:') { throw "ARCH2_ERROR_MARKER" }
          }
          $h1 = (Get-FileHash arch2-exact-1.log -Algorithm SHA256).Hash
          $h2 = (Get-FileHash arch2-exact-2.log -Algorithm SHA256).Hash
          if ($h1 -ne $h2) { throw "ARCH2_REPLAY_LOG_MISMATCH" }
          Write-Host "arch2_replay_sha256=$($h1.ToLowerInvariant())"

      - name: Run preserved VIS5.0-VIS5.5 regression
        env:
          GODOT_BIN: ${{ steps.godot.outputs.path }}
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          $ErrorActionPreference = "Stop"
          .\RUN_ECO_EVO7_VIS5_5_TESTS.ps1 -GodotPath $env:GODOT_BIN
          if ($LASTEXITCODE -ne 0) { throw "VIS5_REGRESSION_EXIT_$LASTEXITCODE" }
          Write-Host "VIS5 regression assertions=521 expected"

      - name: Assert tracked tree unchanged
        run: |
          $ErrorActionPreference = "Stop"
          $dirty = git status --porcelain --untracked-files=no
          if (-not [string]::IsNullOrWhiteSpace(($dirty -join ""))) { throw "TRACKED_TREE_DIRTY_AFTER_RUN" }
          Write-Host "tracked_tree_clean=true"
