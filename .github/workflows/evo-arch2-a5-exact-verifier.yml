name: ECO ARCH2 A5 Canonical Verifier

on:
  push:
    branches:
      - validation/eco-arch2-a5-exact-r1
  workflow_dispatch:

concurrency:
  group: eco-arch2-a5-canonical-verifier
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-canonical:
    name: canonical A5 Linux verifier
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: 3b6d1675ca9668f946265c8ce86e12dbae6b5e1d
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact subject
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3b6d1675ca9668f946265c8ce86e12dbae6b5e1d"
          test "$(git rev-parse HEAD^{tree})" = "6419054b0f7a422f3d8aceccf37adff461646e92"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Resolve canonical double Godot
        id: godot
        env:
          CONFIGURED: ${{ vars.DWS_GODOT_DOUBLE_BIN_LINUX }}
          FALLBACK: ${{ vars.DWS_GODOT_DOUBLE_BIN }}
        run: |
          set -euo pipefail
          godot="$CONFIGURED"
          if [[ -z "$godot" ]]; then
            case "$FALLBACK" in
              *.exe|[A-Za-z]:\\*) godot="" ;;
              *) godot="$FALLBACK" ;;
            esac
          fi
          if [[ -z "$godot" ]]; then godot="$HOME/.local/opt/godot-double-4.7.1-a13da4f/godot.linuxbsd.editor.double.x86_64"; fi
          test -x "$godot"
          version="$("$godot" --version | head -n1 | tr -d '\r')"
          test "$version" = "4.7.1.stable.double.custom_build.a13da4feb"
          sha="$(sha256sum "$godot" | awk '{print $1}')"
          test "$sha" = "bfa7ce632d8d4b1dcc96f64f5405ee52b57c4e25d15c3e0478acc26e08d517d7"
          echo "path=$godot" >> "$GITHUB_OUTPUT"

      - name: Cold empty-cache import
        env:
          GODOT: ${{ steps.godot.outputs.path }}
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          set -euo pipefail
          rm -rf .godot
          "$GODOT" --headless --audio-driver Dummy --editor --path "$PWD" --import > a5-canonical-cold.log 2>&1
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:" a5-canonical-cold.log; then cat a5-canonical-cold.log; exit 1; fi

      - name: Diagnose RM26 first failing runtime step
        env:
          GODOT: ${{ steps.godot.outputs.path }}
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          set -euo pipefail
          src="validation/ecology/evo_arch2_a5/rm_a5_26_development_starvation_window.gd"
          diag="validation/ecology/evo_arch2_a5/_rm26_diag_tmp.gd"
          cp "$src" "$diag"
          sed -i 's/^[[:space:]]*return {"success": false}$/\t\t\tprint("RM26_STEP_ERROR=", result.error); return {"success": false}/' "$diag"
          set +e
          "$GODOT" --headless --audio-driver Dummy --path "$PWD" --script "res://$diag" 2>&1 | tee rm26-diagnostic.log
          rc=${PIPESTATUS[0]}
          set -e
          rm -f "$diag"
          grep -F "RM26_STEP_ERROR=" rm26-diagnostic.log || true
          exit "$rc"
