name: ECO ARCH2 A5 RM29 Diagnostic

on:
  push:
    branches:
      - validation/eco-arch2-a5-exact-r1
  workflow_dispatch:

concurrency:
  group: eco-arch2-a5-canonical-verifier
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-rm29:
    name: exact RM29 diagnostic
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: 04592ab6d8d1013bc788c14e4ff370332eedb872
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact subject
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "04592ab6d8d1013bc788c14e4ff370332eedb872"
          test "$(git rev-parse HEAD^{tree})" = "edb767077fd8fd10cba5de8874c65c935e726b90"

      - name: Resolve canonical double Godot
        id: godot
        env:
          CONFIGURED: ${{ vars.DWS_GODOT_DOUBLE_BIN_LINUX }}
          FALLBACK: ${{ vars.DWS_GODOT_DOUBLE_BIN }}
        run: |
          set -euo pipefail
          godot="$CONFIGURED"
          if [[ -z "$godot" ]]; then
            case "$FALLBACK" in
              *.exe|[A-Za-z]:\\*) godot="" ;;
              *) godot="$FALLBACK" ;;
            esac
          fi
          if [[ -z "$godot" ]]; then godot="$HOME/.local/opt/godot-double-4.7.1-a13da4f/godot.linuxbsd.editor.double.x86_64"; fi
          test -x "$godot"
          test "$("$godot" --version | head -n1 | tr -d '\r')" = "4.7.1.stable.double.custom_build.a13da4feb"
          test "$(sha256sum "$godot" | awk '{print $1}')" = "bfa7ce632d8d4b1dcc96f64f5405ee52b57c4e25d15c3e0478acc26e08d517d7"
          echo "path=$godot" >> "$GITHUB_OUTPUT"

      - name: Run RM29 diagnostic
        env:
          GODOT: ${{ steps.godot.outputs.path }}
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          set -o pipefail
          "$GODOT" --headless --audio-driver Dummy --path "$PWD" --script res://validation/ecology/evo_arch2_a5/rm_a5_29_bounded_parent_proof_depth.gd 2>&1 | tee rm29-diagnostic.log
          code=${PIPESTATUS[0]}
          cat rm29-diagnostic.log
          exit "$code"
