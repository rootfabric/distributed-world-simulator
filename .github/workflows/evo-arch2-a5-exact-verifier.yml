name: ECO ARCH2 A5 Exact Verifier

on:
  push:
    branches:
      - validation/eco-arch2-a5-exact-r1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-exact:
    name: fresh exact A5 Linux verifier
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact immutable source
        uses: actions/checkout@v4
        with:
          ref: 23499c2fb81bc52932ccfcba5811f919ca6ddc94
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact source identity and A5 forbidden fence
        run: |
          set -euo pipefail
          base="4b0f772ff39592262b853f7293bbd5403558b145"
          test "$(git rev-parse HEAD)" = "23499c2fb81bc52932ccfcba5811f919ca6ddc94"
          test "$(git rev-parse HEAD^{tree})" = "c120a22f13ebbdaad8bec401395d69baf8e7ff50"
          test -z "$(git status --porcelain --untracked-files=no)"
          git diff --exit-code "$base"..HEAD -- \
            scripts/research/ecology/v2/canonical_value_v1.gd \
            scripts/research/ecology/v2/body_graph_v1.gd \
            scripts/research/ecology/v2/development_program_v1.gd \
            scripts/research/ecology/v2/organism_genome_v2.gd \
            scripts/research/ecology/v2/organism_state_v1.gd \
            scripts/research/ecology/v2/development_interpreter_v1.gd \
            scripts/research/ecology/v2/phenotype_snapshot_v1.gd \
            scripts/research/ecology/v2/environment_field_contract_v1.gd \
            scripts/research/ecology/v2/local_environment_field_v1.gd \
            scripts/research/ecology/v2/organism_environment_ports_v1.gd
          changed="$(git diff --name-only "$base"..HEAD)"
          if printf '%s\n' "$changed" | grep -Eq '^(scripts/ecology/production/|scripts/simulation/|scripts/network/)'; then
            printf '%s\n' "$changed"
            echo "forbidden production/simulation/network path changed" >&2
            exit 1
          fi
          executable="scripts/research/ecology/v2/resource_lifecycle_runtime_v1.gd"
          ! grep -Ev '^[[:space:]]*#' "$executable" | grep -Ei 'net_resource_proxy|shadow_fitness|top[_ -]?k'
          echo "A0_A4_FORBIDDEN_DIFF=CLEAN"

      - name: Resolve exact double Godot
        id: godot
        env:
          CONFIGURED: ${{ vars.DWS_GODOT_DOUBLE_BIN_LINUX }}
          FALLBACK: ${{ vars.DWS_GODOT_DOUBLE_BIN }}
        run: |
          set -euo pipefail
          godot="$CONFIGURED"
          if [[ -z "$godot" ]]; then
            case "$FALLBACK" in
              *.exe|[A-Za-z]:\\*) godot="" ;;
              *) godot="$FALLBACK" ;;
            esac
          fi
          if [[ -z "$godot" ]]; then godot="$HOME/.local/opt/godot-double-4.7.1-a13da4f/godot.linuxbsd.editor.double.x86_64"; fi
          test -x "$godot"
          version="$("$godot" --version | head -n1 | tr -d '\r')"
          test "$version" = "4.7.1.stable.double.custom_build.a13da4feb"
          sha="$(sha256sum "$godot" | awk '{print $1}')"
          test "$sha" = "bfa7ce632d8d4b1dcc96f64f5405ee52b57c4e25d15c3e0478acc26e08d517d7"
          echo "path=$godot" >> "$GITHUB_OUTPUT"
          echo "godot=$version sha256=$sha"

      - name: Cold empty-cache import
        env:
          GODOT: ${{ steps.godot.outputs.path }}
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          set -euo pipefail
          rm -rf .godot
          "$GODOT" --headless --audio-driver Dummy --editor --path "$PWD" --import > a5-cold.log 2>&1
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR:" a5-cold.log
          sha256sum a5-cold.log

      - name: Run A5 core exact twice
        env:
          GODOT: ${{ steps.godot.outputs.path }}
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          set -euo pipefail
          for n in 1 2; do
            "$GODOT" --headless --audio-driver Dummy --path "$PWD" --script res://tests/research/ecology/v2/arch2_a5_exact_acceptance.gd 2>&1 | tee "a5-exact-$n.log"
            test ${PIPESTATUS[0]} -eq 0
            grep -F "EVO_ARCH2_A5_EXACT assertions=69 failed=0" "a5-exact-$n.log"
            ! grep -E "SCRIPT ERROR|Parse Error|ERROR:|FAIL:" "a5-exact-$n.log"
          done
          cmp a5-exact-1.log a5-exact-2.log
          sha256sum a5-exact-1.log a5-exact-2.log

      - name: Run A5 reviewer repairs twice
        env:
          GODOT: ${{ steps.godot.outputs.path }}
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          set -euo pipefail
          for n in 1 2; do
            "$GODOT" --headless --audio-driver Dummy --path "$PWD" --script res://tests/research/ecology/v2/arch2_a5_reviewer_repairs.gd 2>&1 | tee "a5-repairs-$n.log"
            test ${PIPESTATUS[0]} -eq 0
            grep -F "EVO_ARCH2_A5_REPAIRS assertions=29 failed=0" "a5-repairs-$n.log"
            ! grep -E "SCRIPT ERROR|Parse Error|ERROR:|FAIL:" "a5-repairs-$n.log"
          done
          cmp a5-repairs-1.log a5-repairs-2.log
          sha256sum a5-repairs-1.log a5-repairs-2.log

      - name: Run RM-A5-11 growth headroom twice
        env:
          GODOT: ${{ steps.godot.outputs.path }}
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          set -euo pipefail
          for n in 1 2; do
            "$GODOT" --headless --audio-driver Dummy --path "$PWD" --script res://validation/ecology/evo_arch2_a5/rm_a5_11_growth_headroom.gd 2>&1 | tee "a5-rm11-$n.log"
            test ${PIPESTATUS[0]} -eq 0
            grep -F "EVO_ARCH2_A5_RM11 assertions=9 failed=0" "a5-rm11-$n.log"
            ! grep -E "SCRIPT ERROR|Parse Error|ERROR:|FAIL:" "a5-rm11-$n.log"
          done
          cmp a5-rm11-1.log a5-rm11-2.log
          sha256sum a5-rm11-1.log a5-rm11-2.log

      - name: Run RM-A5-12 reserve headroom twice
        env:
          GODOT: ${{ steps.godot.outputs.path }}
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          set -euo pipefail
          for n in 1 2; do
            "$GODOT" --headless --audio-driver Dummy --path "$PWD" --script res://validation/ecology/evo_arch2_a5/rm_a5_12_reserve_headroom.gd 2>&1 | tee "a5-rm12-$n.log"
            test ${PIPESTATUS[0]} -eq 0
            grep -E "EVO_ARCH2_A5_RM12 assertions=[0-9]+ failed=0" "a5-rm12-$n.log"
            ! grep -E "SCRIPT ERROR|Parse Error|ERROR:|FAIL:" "a5-rm12-$n.log"
          done
          cmp a5-rm12-1.log a5-rm12-2.log
          sha256sum a5-rm12-1.log a5-rm12-2.log

      - name: Run RM-A5-13 starvation policy twice
        env:
          GODOT: ${{ steps.godot.outputs.path }}
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          set -euo pipefail
          for n in 1 2; do
            "$GODOT" --headless --audio-driver Dummy --path "$PWD" --script res://validation/ecology/evo_arch2_a5/rm_a5_13_starvation_policy.gd 2>&1 | tee "a5-rm13-$n.log"
            test ${PIPESTATUS[0]} -eq 0
            grep -F "EVO_ARCH2_A5_RM13 assertions=13 failed=0" "a5-rm13-$n.log"
            ! grep -E "SCRIPT ERROR|Parse Error|ERROR:|FAIL:" "a5-rm13-$n.log"
          done
          cmp a5-rm13-1.log a5-rm13-2.log
          sha256sum a5-rm13-1.log a5-rm13-2.log

      - name: Run RM-A5-14 reproduction policy twice
        env:
          GODOT: ${{ steps.godot.outputs.path }}
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          set -euo pipefail
          for n in 1 2; do
            "$GODOT" --headless --audio-driver Dummy --path "$PWD" --script res://validation/ecology/evo_arch2_a5/rm_a5_14_reproduction_policy.gd 2>&1 | tee "a5-rm14-$n.log"
            test ${PIPESTATUS[0]} -eq 0
            grep -F "EVO_ARCH2_A5_RM14 assertions=21 failed=0" "a5-rm14-$n.log"
            ! grep -E "SCRIPT ERROR|Parse Error|ERROR:|FAIL:" "a5-rm14-$n.log"
          done
          cmp a5-rm14-1.log a5-rm14-2.log
          sha256sum a5-rm14-1.log a5-rm14-2.log

      - name: Run accepted A4 regression
        env:
          GODOT: ${{ steps.godot.outputs.path }}
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          set -euo pipefail
          "$GODOT" --headless --audio-driver Dummy --path "$PWD" --script res://tests/research/ecology/v2/arch2_a4_exact_acceptance.gd > a4.log 2>&1
          grep -F "EVO_ARCH2_A4_EXACT assertions=32 failed=0" a4.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR:|FAIL:" a4.log

      - name: Run accepted A0-A3 regression
        env:
          GODOT: ${{ steps.godot.outputs.path }}
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          set -euo pipefail
          "$GODOT" --headless --audio-driver Dummy --path "$PWD" --script res://tests/research/ecology/v2/arch2_a03_exact_acceptance.gd > a03.log 2>&1
          grep -F "EVO_ARCH2_A03_EXACT assertions=86 failed=0" a03.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR:|FAIL:" a03.log

      - name: Run preserved VIS5 regression
        env:
          GODOT: ${{ steps.godot.outputs.path }}
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          set -euo pipefail
          scripts=(
            res://tests/ecology/eco_evo7_vis5_0_terrain_ecosystem_composition_contract_acceptance.gd
            res://tests/ecology/eco_evo7_vis5_1_terrain_surface_frame_adapter_acceptance.gd
            res://tests/ecology/eco_evo7_vis5_2_noncanonical_ground_cover_bridge_acceptance.gd
            res://tests/ecology/eco_evo7_vis5_3_mixed_strata_composition_lab_acceptance.gd
            res://tests/ecology/eco_evo7_vis5_4_composition_lod_streaming_gate_acceptance.gd
            res://tests/ecology/eco_evo7_vis5_5_visual_evidence_play1_handoff_acceptance.gd
          )
          expected=(87 70 57 101 92 114)
          total=0
          for i in "${!scripts[@]}"; do
            "$GODOT" --headless --audio-driver Dummy --path "$PWD" --script "${scripts[$i]}" > "vis5-$i.log" 2>&1
            grep -E "PASS \(${expected[$i]} assertions\)" "vis5-$i.log"
            ! grep -E "SCRIPT ERROR|Parse Error|ERROR:|FAIL:" "vis5-$i.log"
            total=$((total + expected[$i]))
          done
          test "$total" -eq 521
          echo "VIS5 assertions=$total failed=0"

      - name: Assert tracked subject unchanged
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "23499c2fb81bc52932ccfcba5811f919ca6ddc94"
          test "$(git rev-parse HEAD^{tree})" = "c120a22f13ebbdaad8bec401395d69baf8e7ff50"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "SUBJECT_HEAD=23499c2fb81bc52932ccfcba5811f919ca6ddc94"
          echo "SUBJECT_TREE=c120a22f13ebbdaad8bec401395d69baf8e7ff50"
          echo "VERDICT=PASS"
