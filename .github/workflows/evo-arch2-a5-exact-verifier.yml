name: ECO ARCH2 A5 RM32 RM33 Diagnostic

on:
  push:
    branches:
      - validation/eco-arch2-a5-exact-r1
  workflow_dispatch:

concurrency:
  group: eco-arch2-a5-canonical-verifier
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-repair:
    name: exact RM32 RM33 diagnostic
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: 251238ce231630601a8a641aa06f478dd82ac741
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact subject
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "251238ce231630601a8a641aa06f478dd82ac741"
          test "$(git rev-parse HEAD^{tree})" = "04e60e392c95fa17360144e8e7f38fbc003f22e4"

      - name: Resolve canonical double Godot
        id: godot
        env:
          CONFIGURED: ${{ vars.DWS_GODOT_DOUBLE_BIN_LINUX }}
          FALLBACK: ${{ vars.DWS_GODOT_DOUBLE_BIN }}
        run: |
          set -euo pipefail
          godot="$CONFIGURED"
          if [[ -z "$godot" ]]; then
            case "$FALLBACK" in
              *.exe|[A-Za-z]:\\*) godot="" ;;
              *) godot="$FALLBACK" ;;
            esac
          fi
          if [[ -z "$godot" ]]; then godot="$HOME/.local/opt/godot-double-4.7.1-a13da4f/godot.linuxbsd.editor.double.x86_64"; fi
          test -x "$godot"
          test "$("$godot" --version | head -n1 | tr -d '\r')" = "4.7.1.stable.double.custom_build.a13da4feb"
          test "$(sha256sum "$godot" | awk '{print $1}')" = "bfa7ce632d8d4b1dcc96f64f5405ee52b57c4e25d15c3e0478acc26e08d517d7"
          echo "path=$godot" >> "$GITHUB_OUTPUT"

      - name: Run exact repair diagnostics twice
        env:
          GODOT: ${{ steps.godot.outputs.path }}
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          set -euo pipefail
          run_twice() {
            local script="$1" marker="$2" prefix="$3"
            for n in 1 2; do
              "$GODOT" --headless --audio-driver Dummy --path "$PWD" --script "$script" 2>&1 | tee "$prefix-$n.log"
              test ${PIPESTATUS[0]} -eq 0
              grep -F "$marker" "$prefix-$n.log"
              if grep -E "SCRIPT ERROR|Parse Error|ERROR:|FAIL:" "$prefix-$n.log"; then exit 1; fi
            done
            cmp "$prefix-1.log" "$prefix-2.log"
            sha256sum "$prefix-1.log" "$prefix-2.log"
          }
          run_twice res://validation/ecology/evo_arch2_a5/rm_a5_32_field_intake_lifecycle_causality.gd "EVO_ARCH2_A5_RM32 assertions=12 failed=0" rm32
          run_twice res://validation/ecology/evo_arch2_a5/rm_a5_33_nonreproductive_module_maintenance_history.gd "EVO_ARCH2_A5_RM33 assertions=17 failed=0" rm33
