name: ECO ARCH2 A5 RM17 Diagnostic

on:
  push:
    branches:
      - validation/eco-arch2-a5-exact-r1
  workflow_dispatch:

concurrency:
  group: eco-arch2-a5-rm17-diagnostic
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-rm17:
    name: exact RM17 diagnostic
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: c63c01e2d540b2b1b4e106b745c583201af50e6c
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact subject
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c63c01e2d540b2b1b4e106b745c583201af50e6c"
          test "$(git rev-parse HEAD^{tree})" = "7d428dc6695848931340c9ae9f3cdadc7985cafb"
      - name: Resolve canonical double Godot
        id: godot
        env:
          CONFIGURED: ${{ vars.DWS_GODOT_DOUBLE_BIN_LINUX }}
          FALLBACK: ${{ vars.DWS_GODOT_DOUBLE_BIN }}
        run: |
          set -euo pipefail
          godot="$CONFIGURED"
          if [[ -z "$godot" ]]; then
            case "$FALLBACK" in *.exe|[A-Za-z]:\\*) godot="" ;; *) godot="$FALLBACK" ;; esac
          fi
          if [[ -z "$godot" ]]; then godot="$HOME/.local/opt/godot-double-4.7.1-a13da4f/godot.linuxbsd.editor.double.x86_64"; fi
          test -x "$godot"
          test "$("$godot" --version | head -n1 | tr -d '\r')" = "4.7.1.stable.double.custom_build.a13da4feb"
          test "$(sha256sum "$godot" | awk '{print $1}')" = "bfa7ce632d8d4b1dcc96f64f5405ee52b57c4e25d15c3e0478acc26e08d517d7"
          echo "path=$godot" >> "$GITHUB_OUTPUT"
      - name: Run RM17 twice
        env:
          GODOT: ${{ steps.godot.outputs.path }}
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          set -euo pipefail
          for n in 1 2; do
            "$GODOT" --headless --audio-driver Dummy --path "$PWD" --script res://validation/ecology/evo_arch2_a5/rm_a5_17_starvation_reproduction_window.gd 2>&1 | tee "rm17-$n.log"
            test ${PIPESTATUS[0]} -eq 0
            grep -F "EVO_ARCH2_A5_RM17 assertions=13 failed=0" "rm17-$n.log"
            if grep -E "SCRIPT ERROR|Parse Error|ERROR:|FAIL:" "rm17-$n.log"; then exit 1; fi
          done
          cmp rm17-1.log rm17-2.log
          sha256sum rm17-1.log rm17-2.log
