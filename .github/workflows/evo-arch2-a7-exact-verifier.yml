name: ECO ARCH2 A7 Canonical Verifier
on:
  push:
    branches: [validation/eco-arch2-a7-exact-r1]
    paths: [.github/workflows/evo-arch2-a7-exact-verifier.yml]
permissions:
  contents: read
concurrency:
  group: eco-arch2-a7-canonical-verifier
  cancel-in-progress: true
env:
  SOURCE_HEAD: 8eccf6304078bec3a3ccaa5860c5aab6ee311209
  SOURCE_TREE: 24e876b7377cb3e1e521f08ff9766331fe4e895a
jobs:
  linux-canonical:
    if: github.actor == 'rootfabric' && github.repository == 'rootfabric/distributed-world-simulator'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: Checkout exact A7 candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact source and all file pins
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/a7/exact
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test -z "$(git status --porcelain --untracked-files=no)"
          python3 - <<'PY' | tee artifacts/a7/source-pins.log
          import json, subprocess
          pins=json.load(open('validation/ecology/evo_arch2_a7/source-blobs.v1.json'))
          if len(pins['blobs']) != 18: raise SystemExit('SOURCE_PIN_COUNT_MISMATCH')
          failures=[]
          for path,expected in pins['blobs'].items():
              actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
              print(f'SOURCE_BLOB_{"PASS" if actual == expected else "FAIL"} {path} {actual} expected={expected}')
              if actual != expected: failures.append(path)
          if failures: raise SystemExit('SOURCE_BLOB_MISMATCH: '+', '.join(failures))
          PY
      - name: Full exact A7 with mandatory graphics and preserved regressions
        shell: bash
        env:
          CONFIGURED_GODOT: ${{ vars.GODOT_DOUBLE_PATH }}
        run: |
          set -euo pipefail
          godot="${CONFIGURED_GODOT:-$HOME/.local/opt/godot-double-4.7.1-a13da4f/godot.linuxbsd.editor.double.x86_64}"
          test -x "$godot"
          python3 validation/ecology/evo_arch2_a7/verify.py --godot "$godot" --head "$SOURCE_HEAD" --tree "$SOURCE_TREE"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('artifacts/a7')
          summary=json.loads((root/'exact/summary.json').read_text())
          if summary.get('verdict') != 'PASS' or summary.get('graphical_required') is not True: raise SystemExit('COMPLETE_A7_REQUIRED')
          if summary['subject_head'] != os.environ['SOURCE_HEAD'] or summary['subject_tree'] != os.environ['SOURCE_TREE']: raise SystemExit('SUMMARY_SUBJECT_MISMATCH')
          matches=[c for c in summary['checks'] if c['name']=='a7-graphical']
          if len(matches)!=1 or matches[0]['result']!='PASS' or matches[0]['assertions']!=32 or matches[0]['exit_code']!=0: raise SystemExit('GRAPHICAL_GATE_MISSING')
          for filename,key in [('observatory.png','viewport_sha256'),('capture-sources.json','viewport_source_report_sha256')]:
              if hashlib.sha256((root/filename).read_bytes()).hexdigest()!=summary[key]: raise SystemExit('GRAPHICAL_DIGEST_MISMATCH:'+filename)
          print('COMPLETE_A7_GRAPHICAL_EVIDENCE_PASS')
          PY
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Observe main control without promoting research
        shell: bash
        run: |
          set -euo pipefail
          candidate="$PWD"
          control="$RUNNER_TEMP/a7-control-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          main="$(git rev-parse refs/remotes/origin/main)"
          mkdir -p artifacts/a7/control
          git worktree add --detach "$control" "$main"
          export A7_CONTROL_ROOT="$control" A7_CONTROL_OUT="$candidate/artifacts/a7/control" A7_CONTROL_MAIN="$main"
          python3 - <<'PY'
          import json,os,pathlib,platform,shutil,subprocess
          root=pathlib.Path(os.environ['A7_CONTROL_ROOT']);out=pathlib.Path(os.environ['A7_CONTROL_OUT'])
          report={'main_at_verification':os.environ['A7_CONTROL_MAIN'],'main_at_dispatch':'7dfc68ab5a1e90254a1b7039807f275b5da04eef','platform':platform.platform(),'python':platform.python_version(),'a7_authority':'ISOLATED_RESEARCH_ONLY','global_green_inferred':False,'audits':[],'harness_observations':[]}
          for name,script,args,artifact in [('standard','project_control.py',['--no-fetch','--no-fail-on-red'],'project-control-report.json'),('directional','project_control_directional_watch.py',['--no-fail-on-red'],'directional-watch-report.json')]:
              with (out/(name+'.log')).open('wb') as log: result=subprocess.run(['python3',str(root/'scripts/control'/script),*args],cwd=root,stdout=log,stderr=subprocess.STDOUT,timeout=180)
              item={'name':name,'exit_code':result.returncode,'overall_health':'UNAVAILABLE'};source=root/'artifacts/control'/artifact
              if source.exists():
                  shutil.copyfile(source,out/artifact)
                  item['overall_health']=json.loads(source.read_text()).get('overall_health','UNAVAILABLE')
              report['audits'].append(item)
          env=dict(os.environ,PYTHONPATH=str(root/'scripts'),PYTHONUTF8='1')
          for mode in ['drive','close-role','close-mission']:
              command=['python3','-m','harness.cli',mode,'--root',str(root),'--checkpoint','ECO_ARCH2_A7_OBSERVATORY']
              with (out/(mode+'.log')).open('wb') as log: result=subprocess.run(command,cwd=root,env=env,stdout=log,stderr=subprocess.STDOUT,timeout=180)
              report['harness_observations'].append({'mode':mode,'command':command,'exit_code':result.returncode,'not_an_acceptance_verdict':True})
          (out/'control-observation.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
          git worktree remove "$control"
      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a7-exact-8eccf630
          path: |
            artifacts/a7/exact/
            artifacts/a7/source-pins.log
            artifacts/a7/restart/
            artifacts/a7/observatory.png
            artifacts/a7/capture-sources.json
            artifacts/a7/control/
          if-no-files-found: error
          retention-days: 30
