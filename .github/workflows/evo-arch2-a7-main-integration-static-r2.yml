name: ECO ARCH2 A7 Main Integration Static Preflight R2
on:
  push:
    branches: [validation/eco-arch2-a7-main-integration-r1]
    paths: [.github/workflows/evo-arch2-a7-main-integration-static-r2.yml]
permissions:
  contents: read
env:
  SOURCE_HEAD: 37ee798dbc4096b05fe26069db8f0b5ec2a3f5a3
  SOURCE_TREE: af7f93e7a701b3115f1cc0e69e793a23049e9a62
  BASE_MAIN: 7dfc68ab5a1e90254a1b7039807f275b5da04eef
jobs:
  static-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repaired frozen integration candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact subject, addition-only transfer and accepted pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          git merge-base --is-ancestor "$BASE_MAIN" "$SOURCE_HEAD"
          test -z "$(git status --porcelain --untracked-files=no)"
          python3 - <<'PY'
          import json,subprocess
          base='7dfc68ab5a1e90254a1b7039807f275b5da04eef'; accepted='8eccf6304078bec3a3ccaa5860c5aab6ee311209'
          e=json.load(open('validation/ecology/evo_arch2_a7_main_integration/expected-transfer.v1.json'))
          def out(*a): return subprocess.check_output(['git',*a],text=True).strip()
          def rc(*a): return subprocess.run(['git',*a],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode
          rec=out('diff','--name-status',base,'HEAD').splitlines()
          if not rec or any(not r.startswith('A\t') for r in rec): raise SystemExit('NOT_ADDITION_ONLY')
          forbidden=('scripts/ecology/production/','scripts/network/','scripts/simulation/','config/control/','config/architecture/')
          for r in rec:
              p=r.split('\t',1)[1]
              if p=='project.godot' or p.startswith(forbidden) or p.startswith('.github/'): raise SystemExit('MAIN_OWNERSHIP_PATH:'+p)
          for p,s in {**e['subtrees'],**e['blobs']}.items():
              if out('rev-parse','HEAD:'+p)!=s: raise SystemExit('TRANSFER_IDENTITY:'+p)
              if rc('cat-file','-e',base+':'+p)==0: raise SystemExit('PATH_EXISTED_ON_MAIN:'+p)
          if accepted in out('rev-list','--parents','-n','1','HEAD').split()[1:]: raise SystemExit('RESEARCH_PARENT_IMPORTED')
          print('ADDITION_ONLY_TRANSFER_PASS files=',len(rec),'pinned=',len(e['subtrees'])+len(e['blobs']))
          PY
      - name: Resolve every transferred local res path
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path('.')
          files=list((root/'scripts/research/ecology/v2').glob('*.gd'))
          files+=list((root/'scripts/labs/ecology').glob('arch2_a7_*.gd'))
          files+=list((root/'tests/research/ecology/v2').glob('*.gd'))
          files+=list((root/'validation/ecology/evo_arch2_a5').glob('*.gd'))
          files+=[root/'scripts/research/ecology/plant_development_traits_extension_evo7_v1.gd',root/'scenes/labs/ecology/arch2_a7_observatory.tscn']
          pats=[re.compile(r'(?:preload|load)\(\s*["\']res://([^"\']+)["\']\s*\)'),re.compile(r'path=["\']res://([^"\']+)["\']')]
          refs=[];missing=[]
          for source in files:
              text=source.read_text(encoding='utf-8-sig')
              for pat in pats:
                  for m in pat.finditer(text):
                      target=m.group(1);refs.append((source.as_posix(),target))
                      if not (root/target).exists(): missing.append((source.as_posix(),target))
          for source,target in missing: print('MISSING',source,'->',target)
          if missing: raise SystemExit('TRANSITIVE_RES_PATH_MISSING')
          print('RES_PATH_CLOSURE_PASS refs=',len(refs),'sources=',len(files))
          PY
      - name: Compile integration verifier
        run: python3 -m py_compile validation/ecology/evo_arch2_a7_main_integration/verify.py
      - name: Run complete current-main Harness regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/harness -p 'test_*.py' -v 2>&1 | tee /tmp/a7-main-harness.log
          ! grep -q 'FAILED (' /tmp/a7-main-harness.log
          ! grep -q '^ERROR' /tmp/a7-main-harness.log
          grep -q '^OK$' /tmp/a7-main-harness.log
