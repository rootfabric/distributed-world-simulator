name: ECO EVO6 Rule Selection Continuation

on:
  push:
    branches:
      - "**"
    paths:
      - "RUN_ECO_EVO6_RULE_SELECTION_CONTINUATION.ps1"
      - "OPEN_ECO_EVO6_GENERATED_RULE_LAB.ps1"
      - "scripts/research/ecology/evo6_generated_outcomes_v1.py"
      - "scripts/research/ecology/evo6_rule_selection_bridge_v1.gd"
      - "scripts/labs/ecology/eco_evo6_generated_rule_fly_lab.gd"
      - "scenes/labs/ecology/eco_evo6_generated_rule_fly_lab.tscn"
      - "tests/research/ecology/test_evo6_generated_outcomes.py"
      - "tests/research/ecology/eco_evo6_r31_visual_adapter_acceptance.gd"
      - "tests/research/ecology/eco_evo6_rule_selection_bridge_acceptance.gd"
      - "docs/checkpoints/2026-08-23_ECO_EVO6_RULE_SELECTION_CONTINUATION_R1_RU.md"
      - ".github/workflows/evo6-rule-selection-continuation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eco-evo6-rule-selection-${{ github.ref }}
  cancel-in-progress: false

jobs:
  closure:
    name: exact EVO6 rule-selection closure
    # DWS self-hosted trust policy: trusted actor + trusted source repository +
    # trusted event set only (no self-hosted execution for pull_request events).
    if: >
      github.actor == 'rootfabric' &&
      github.triggering_actor == 'rootfabric' &&
      (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'rootfabric' &&
          github.event.pull_request.head.repo.full_name == github.repository
        )
      )
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact HEAD checkout
        run: |
          $head = (git rev-parse HEAD).Trim()
          $expected = "${{ github.event.pull_request.head.sha || github.sha }}"
          if ($head -ne $expected) {
            throw "EXACT_HEAD_MISMATCH: actual=$head expected=$expected"
          }
          Write-Host "exact_head=$head"

      - name: Resolve exact double Godot
        id: godot
        env:
          CONFIGURED_GODOT_BIN: ${{ vars.DWS_GODOT_DOUBLE_BIN }}
        run: |
          $godot = $env:CONFIGURED_GODOT_BIN
          if ([string]::IsNullOrWhiteSpace($godot)) {
            $godot = "C:\Godot\godot\bin\godot.windows.editor.double.x86_64.console.exe"
          }
          if (-not (Test-Path -LiteralPath $godot -PathType Leaf)) {
            throw "Exact Godot binary not found. Configure DWS_GODOT_DOUBLE_BIN or install: $godot"
          }
          $version = (& $godot --version 2>&1 | Select-Object -First 1).Trim()
          if ($version -ne "4.7.1.stable.double.custom_build.a13da4feb") {
            throw "GODOT_IDENTITY_MISMATCH: $version"
          }
          "path=$godot" >> $env:GITHUB_OUTPUT
          Write-Host "Godot identity: $version"

      - name: Run exact EVO6 continuation closure
        run: |
          .\RUN_ECO_EVO6_RULE_SELECTION_CONTINUATION.ps1 `
            -GodotPath "${{ steps.godot.outputs.path }}"
