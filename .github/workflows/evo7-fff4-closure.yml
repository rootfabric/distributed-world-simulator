name: ECO EVO7 FFF4 Closure

on:
  pull_request:
    branches:
      - feature/eco-evo7-fff31-causality-repair-r1
    paths:
      - "RUN_ECO_EVO7_FFF4_TESTS.ps1"
      - "scripts/research/ecology/plant_environment_effect_v2.gd"
      - "scripts/research/ecology/soil_water_field_v1.gd"
      - "scripts/research/ecology/evo7_water_soil_feedback_bridge_v1.gd"
      - "tests/research/ecology/eco_evo7_fff4_water_soil_acceptance.gd"
      - "docs/checkpoints/2026-08-24_ECO_EVO7_FFF4_WATER_SOIL_R1_RU.md"
      - ".github/workflows/evo7-fff4-closure.yml"

permissions:
  contents: read

concurrency:
  group: eco-evo7-fff4-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  closure:
    name: exact FFF4 water-soil closure
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Assert exact PR HEAD checkout
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne "${{ github.event.pull_request.head.sha }}") {
            throw "EXACT_HEAD_MISMATCH: actual=$head expected=${{ github.event.pull_request.head.sha }}"
          }
          Write-Host "exact_head=$head"

      - name: Resolve exact double Godot
        id: godot
        env:
          CONFIGURED_GODOT_BIN: ${{ vars.DWS_GODOT_DOUBLE_BIN }}
        run: |
          $godot = $env:CONFIGURED_GODOT_BIN
          if ([string]::IsNullOrWhiteSpace($godot)) {
            $godot = "C:\Godot\godot\bin\godot.windows.editor.double.x86_64.console.exe"
          }
          if (-not (Test-Path -LiteralPath $godot -PathType Leaf)) {
            throw "Exact Godot binary not found. Configure DWS_GODOT_DOUBLE_BIN or install: $godot"
          }
          $version = (& $godot --version 2>&1 | Select-Object -First 1).Trim()
          if ($version -ne "4.7.1.stable.double.custom_build.a13da4feb") {
            throw "GODOT_IDENTITY_MISMATCH: $version"
          }
          "path=$godot" >> $env:GITHUB_OUTPUT
          Write-Host "Godot identity: $version"

      - name: Run exact FFF4 closure
        run: |
          .\RUN_ECO_EVO7_FFF4_TESTS.ps1 `
            -GodotPath "${{ steps.godot.outputs.path }}"
