name: ECO EVO7 LS3.2 Source Carrier R1

on:
  pull_request:
    branches:
      - feature/eco-evo7-ls32-spatial-cohort-lattice-r1
    paths:
      - ".github/workflows/evo7-ls32-source-carrier-r1.yml"

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact LS3.2 candidate
        uses: actions/checkout@v4
        with:
          ref: c0cf7a8d37f73e5ffeabd856e70d7ee05e8d5541
          fetch-depth: 0

      - name: Assert exact target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c0cf7a8d37f73e5ffeabd856e70d7ee05e8d5541"
          test "$(git rev-parse HEAD^)" = "930d975e85601bf41e6b5ce8595c99dafdc361a1"
          test "$(git rev-parse 'HEAD^{tree}')" = "303e319060d9af940bcf6ef9997ab1c930814efb"
          test -z "$(git status --porcelain=v1)"

      - name: Materialize exact source archive
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf "$RUNNER_TEMP/ls32-source-c0cf7a8.tar.gz" .
          sha256sum "$RUNNER_TEMP/ls32-source-c0cf7a8.tar.gz"

      - name: Upload exact source archive
        uses: actions/upload-artifact@v4
        with:
          name: ls32-source-c0cf7a8
          path: ${{ runner.temp }}/ls32-source-c0cf7a8.tar.gz
          if-no-files-found: error
          retention-days: 1
