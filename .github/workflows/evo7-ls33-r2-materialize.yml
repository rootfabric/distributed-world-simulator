name: ECO EVO7 LS3.3 R2 Materialize Tested Payload

on:
  pull_request:
    branches:
      - feature/eco-evo7-ls32-spatial-cohort-lattice-r1
    paths:
      - ".github/ls33_r2_payload_*.b64"
      - ".github/workflows/evo7-ls33-r2-materialize.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Reconstruct exact tested R2 payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/ls33_r2_payload_*.b64 | base64 -d > "$RUNNER_TEMP/ls33_payload_r2.tar.gz"
          mkdir -p "$RUNNER_TEMP/ls33_payload_r2"
          tar -xzf "$RUNNER_TEMP/ls33_payload_r2.tar.gz" -C "$RUNNER_TEMP/ls33_payload_r2"
          cp -a "$RUNNER_TEMP/ls33_payload_r2/." .
          chmod 755 RUN_ECO_EVO7_LS33_TESTS.sh

          test "$(git hash-object scripts/ecology/shadow/eco_evo7_ls33_dispersal_recruitment_v1.gd)" = "20a34937f4c0974175a21a6b5566f27aad4cd025"
          test "$(git hash-object tests/ecology/eco_evo7_ls33_dispersal_recruitment_acceptance.gd)" = "6625b85d5691b82d25bca56a1a3f89a38f0645df"
          test "$(git hash-object RUN_ECO_EVO7_LS33_TESTS.sh)" = "2cec8f0e83b4e3c71cac8c7172628deba8de4112"
          test "$(git hash-object docs/checkpoints/2026-08-28_ECO_EVO7_LS3_3_DISPERSAL_RECRUITMENT_R1_RU.md)" = "52eb62d080f2ea45c4d30c0eef7a0a2bf30d17b1"

          rm -f .github/ls33_r2_payload_*.b64
          rm -f .github/workflows/evo7-ls33-r2-materialize.yml

      - name: Commit materialized files to staging branch
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --name-status
          git commit -m "chore(eco): materialize tested LS3.3 R2 payload"
          git push origin "HEAD:$HEAD_BRANCH"
