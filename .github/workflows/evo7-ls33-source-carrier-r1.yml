name: ECO EVO7 LS3.3 Source Carrier R1

on:
  pull_request:
    branches:
      - feature/eco-evo7-ls33-dispersal-recruitment-r1
    paths:
      - ".github/workflows/evo7-ls33-source-carrier-r1.yml"

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact LS3.3 candidate
        uses: actions/checkout@v4
        with:
          ref: ef4fc891cc1213a93e850e59503643a924e68e27
          fetch-depth: 0

      - name: Assert exact target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ef4fc891cc1213a93e850e59503643a924e68e27"
          test "$(git rev-parse HEAD^)" = "c0cf7a8d37f73e5ffeabd856e70d7ee05e8d5541"
          test "$(git rev-parse 'HEAD^{tree}')" = "896088b93306063b02baf38682704f03e314becf"
          test -z "$(git status --porcelain=v1)"

      - name: Materialize exact source archive
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf "$RUNNER_TEMP/ls33-source-ef4fc89.tar.gz" .
          sha256sum "$RUNNER_TEMP/ls33-source-ef4fc89.tar.gz"

      - name: Upload exact source archive
        uses: actions/upload-artifact@v4
        with:
          name: ls33-source-ef4fc89
          path: ${{ runner.temp }}/ls33-source-ef4fc89.tar.gz
          if-no-files-found: error
          retention-days: 1
