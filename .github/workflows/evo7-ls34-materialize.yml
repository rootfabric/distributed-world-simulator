name: ECO EVO7 LS3.4 Materialize Tested Payload

on:
  pull_request:
    branches:
      - feature/eco-evo7-ls34-local-competition-r1
    paths:
      - ".github/ls34_payload_*.b64"
      - ".github/workflows/evo7-ls34-materialize.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Reconstruct exact tested LS3.4 payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/ls34_payload_*.b64 | base64 -d > "$RUNNER_TEMP/ls34_payload.tar.gz"
          mkdir -p "$RUNNER_TEMP/ls34_payload"
          tar -xzf "$RUNNER_TEMP/ls34_payload.tar.gz" -C "$RUNNER_TEMP/ls34_payload"
          cp -a "$RUNNER_TEMP/ls34_payload/." .
          chmod 755 RUN_ECO_EVO7_LS34_TESTS.sh

          test "$(git hash-object scripts/ecology/shadow/eco_evo7_ls34_local_competition_v1.gd)" = "6d65c2425bdc67ee0a0a7658e6c577f5400f0016"
          test "$(git hash-object tests/ecology/eco_evo7_ls34_local_competition_acceptance.gd)" = "00ff7f5a7f266c445309e9eb1697c61414d2b4d0"
          test "$(git hash-object RUN_ECO_EVO7_LS34_TESTS.sh)" = "ea997f7415ecb39b763f0d0fcb8002eb6e1f1496"
          test "$(git hash-object docs/checkpoints/2026-08-28_ECO_EVO7_LS3_4_LOCAL_COMPETITION_R1_RU.md)" = "71f2d957488ceeeda20fe37c747df2443ae80baf"

          rm -f .github/ls34_payload_*.b64
          rm -f .github/workflows/evo7-ls34-materialize.yml

      - name: Commit materialized files to staging branch
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --name-status
          git commit -m "chore(eco): materialize tested LS3.4 payload"
          git push origin "HEAD:$HEAD_BRANCH"
