name: ECO EVO7 LS3.5 Materialize Tested Payload

on:
  pull_request:
    branches:
      - feature/eco-evo7-ls35-emergent-biomes-r1
    paths:
      - ".github/ls35_payload_*.b64"
      - ".github/workflows/evo7-ls35-materialize.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Reconstruct exact tested LS3.5 payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/ls35_payload_*.b64 | base64 -d > "$RUNNER_TEMP/ls35_payload.tar.gz"
          mkdir -p "$RUNNER_TEMP/ls35_payload"
          tar -xzf "$RUNNER_TEMP/ls35_payload.tar.gz" -C "$RUNNER_TEMP/ls35_payload"
          cp -a "$RUNNER_TEMP/ls35_payload/." .
          chmod 755 RUN_ECO_EVO7_LS35_TESTS.sh

          test "$(git hash-object scripts/ecology/shadow/eco_evo7_ls35_emergent_biome_observatory_v1.gd)" = "516d539ae2ae16101e8a5a9e91b4e6749c0544fe"
          test "$(git hash-object tests/ecology/eco_evo7_ls35_emergent_biome_acceptance.gd)" = "08d92032e02a620bde344f3d8badf437d7ac001b"
          test "$(git hash-object RUN_ECO_EVO7_LS35_TESTS.sh)" = "ac8cecc08e4ae5beec66ae6c047ae40de21efa3c"
          test "$(git hash-object docs/checkpoints/2026-08-28_ECO_EVO7_LS3_5_EMERGENT_BIOMES_R1_RU.md)" = "65d3e3d81459991fac7491ccda6b195d7dfa98f5"

          rm -f .github/ls35_payload_*.b64
          rm -f .github/workflows/evo7-ls35-materialize.yml

      - name: Commit materialized files to staging branch
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --name-status
          git commit -m "chore(eco): materialize tested LS3.5 payload"
          git push origin "HEAD:$HEAD_BRANCH"
