name: ECO EVO7 LS3.5 R2 Source Carrier

on:
  pull_request:
    branches:
      - feature/eco-evo7-ls35-emergent-biomes-r1
    paths:
      - ".github/workflows/evo7-ls35-r2-source-carrier.yml"

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact LS3.5 R2 candidate
        uses: actions/checkout@v4
        with:
          ref: 6f8fcd8b959c2832c32747bece454430063ab746
          fetch-depth: 0

      - name: Assert exact target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6f8fcd8b959c2832c32747bece454430063ab746"
          test "$(git rev-parse HEAD^)" = "78ba78a19ed77eb7a1678b01e6e001edb5284104"
          test "$(git rev-parse 'HEAD^{tree}')" = "a9ba512e8997b7b7e964bfa463105da9f894bc5b"
          test -z "$(git status --porcelain=v1)"

      - name: Materialize exact source archive
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf "$RUNNER_TEMP/ls35-r2-source-6f8fcd8.tar.gz" .
          sha256sum "$RUNNER_TEMP/ls35-r2-source-6f8fcd8.tar.gz"

      - name: Upload exact source archive
        uses: actions/upload-artifact@v4
        with:
          name: ls35-r2-source-6f8fcd8
          path: ${{ runner.temp }}/ls35-r2-source-6f8fcd8.tar.gz
          if-no-files-found: error
          retention-days: 1
