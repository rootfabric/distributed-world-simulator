name: ECO EVO7 LS3.6 Source Carrier R1

on:
  pull_request:
    branches:
      - feature/eco-evo7-ls36-rule-workbench-r1
    paths:
      - ".github/workflows/evo7-ls36-source-carrier-r1.yml"

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact LS3.6 candidate
        uses: actions/checkout@v4
        with:
          ref: 26291b02f6be82e02e7ca00a2acb0cc845f35d10
          fetch-depth: 0

      - name: Assert exact target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "26291b02f6be82e02e7ca00a2acb0cc845f35d10"
          test "$(git rev-parse HEAD^)" = "6f8fcd8b959c2832c32747bece454430063ab746"
          test "$(git rev-parse 'HEAD^{tree}')" = "a58649575484a7104ad83647d5510f67c5e12ab6"
          test -z "$(git status --porcelain=v1)"

      - name: Materialize exact source archive
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf "$RUNNER_TEMP/ls36-source-26291b0.tar.gz" .
          sha256sum "$RUNNER_TEMP/ls36-source-26291b0.tar.gz"

      - name: Upload exact source archive
        uses: actions/upload-artifact@v4
        with:
          name: ls36-source-26291b0
          path: ${{ runner.temp }}/ls36-source-26291b0.tar.gz
          if-no-files-found: error
          retention-days: 1
