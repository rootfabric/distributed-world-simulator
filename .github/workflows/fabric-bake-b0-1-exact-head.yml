name: FABRIC-BAKE B0.1 Exact Head

on:
  push:
    branches:
      - research/fabric-bake0-1-exact-boundary-reduction-r1
    paths:
      - "scripts/research/fabric_bake0/**"
      - "tests/research/fabric_bake0/**"
      - "RUN_FABRIC_BAKE_B0_1_TESTS.ps1"
      - "RUN_FABRIC_BAKE_B0_1_TESTS.sh"
      - "docs/research/FABRIC_BAKE_B0_1_EXACT_BOUNDARY_REDUCTION_RU.md"
      - "validation/fabric-bake-b0-1-exact-boundary-reduction-validation.json"
      - "fabric-bake-b0-1-exact-boundary-reduction-files.txt"
      - ".github/workflows/fabric-bake-b0-1-exact-head.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fabric-bake-b0-1-exact-head
  cancel-in-progress: true

jobs:
  exact-head:
    name: exact B0.0 -> B0.1 double-Godot gate
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout exact pushed HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Assert exact checkout and predecessor ancestry
        run: |
          $head = (git rev-parse HEAD).Trim()
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          if ($head -ne "${{ github.sha }}") {
            throw "EXACT_HEAD_MISMATCH: actual=$head expected=${{ github.sha }}"
          }
          git merge-base --is-ancestor d389b8ed72ffbed8949279b42089da3687125a90 HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "B0_0_CLOSURE_NOT_ANCESTOR"
          }
          Write-Host "exact_head=$head"
          Write-Host "exact_tree=$tree"
          Write-Host "b0_0_closure_ancestor=YES"

      - name: Resolve exact double Godot
        id: godot
        env:
          CONFIGURED_GODOT_BIN: ${{ vars.DWS_GODOT_DOUBLE_BIN }}
        run: |
          $godot = $env:CONFIGURED_GODOT_BIN
          if ([string]::IsNullOrWhiteSpace($godot)) {
            $godot = "C:\Godot\godot\bin\godot.windows.editor.double.x86_64.console.exe"
          }
          if (-not (Test-Path -LiteralPath $godot -PathType Leaf)) {
            throw "Exact Godot binary not found: $godot"
          }
          $version = (& $godot --version 2>&1 | Select-Object -First 1).Trim()
          if ($version -ne "4.7.1.stable.double.custom_build.a13da4feb") {
            throw "GODOT_IDENTITY_MISMATCH: $version"
          }
          "path=$godot" >> $env:GITHUB_OUTPUT
          Write-Host "Godot identity: $version"

      - name: Import exact project
        env:
          BREAKPOINT_RUNTIME_DISABLED: "1"
        run: |
          & "${{ steps.godot.outputs.path }}" --headless --editor --quit --path .
          if ($LASTEXITCODE -ne 0) {
            throw "GODOT_IMPORT_FAILED: $LASTEXITCODE"
          }

      - name: Run exact B0.0 -> B0.1 canonical gate
        env:
          GODOT_BIN: ${{ steps.godot.outputs.path }}
          BREAKPOINT_RUNTIME_DISABLED: "1"
        run: |
          .\RUN_FABRIC_BAKE_B0_1_TESTS.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "FABRIC_BAKE_B0_1_GATE_FAILED: $LASTEXITCODE"
          }

      - name: Assert tracked worktree clean
        run: |
          $status = @(git status --porcelain --untracked-files=no)
          if ($status.Count -ne 0) {
            $status | ForEach-Object { Write-Host $_ }
            throw "TRACKED_WORKTREE_DIRTY_AFTER_B0_1"
          }
          Write-Host "TRACKED_WORKTREE_CLEAN=YES"
