name: FABRIC-BAKE B0.2-C Commit Exact Local Payload
on:
  push:
    branches: [research/fabric-bake0-2-c-commit-helper-r1]
    paths: [".github/workflows/fabric-bake-b0-2-c-commit-helper.yml"]
permissions:
  contents: write
jobs:
  commit-payload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/fabric-bake0-2-refinement-guards-r1
          fetch-depth: 0
      - name: Materialize and commit exact tested payload
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "a1b8631a86b9bb896a6ca9a4871a5f0d2cee5b2a"
          printf '%s' '' | base64 -d > /tmp/b02c-impl.tar.gz
          echo "46ad47377889e035e7129ed48f21b58d5d592e47a7958fd0f86cc8a2f694f4e3  /tmp/b02c-impl.tar.gz" | sha256sum -c -
          tar -xzf /tmp/b02c-impl.tar.gz -C .
          test "$(git hash-object scripts/research/fabric_bake0/structural_refinement_guard_field_descriptor_v1.gd)" = "6964efabe01987536f80dca3e895e61e1ba15fb8"
          test "$(git hash-object scripts/research/fabric_bake0/structural_refinement_guard_compiler_v1.gd)" = "cdd469c682dfef808422519114afd692f78e8f26"
          test "$(git hash-object scripts/research/fabric_bake0/structural_refinement_guard_runtime_v1.gd)" = "c93231b77847da4432b5dd77264c922a0dccde9e"
          test "$(git hash-object tests/research/fabric_bake0/fabric_bake_b0_2_c_fixture.gd)" = "6e5083ff0f96e43c971fb398a0b11b8b2346c211"
          test "$(git hash-object tests/research/fabric_bake0/fabric_bake_b0_2_c_acceptance.gd)" = "88528a7d756c27a0378092676cb98f0b22f62e91"
          test "$(git hash-object tests/research/fabric_bake0/fabric_bake_b0_2_c_playground.gd)" = "6e70445369fc17ed0e923cd4cd85a6467419541a"
          test "$(git hash-object RUN_FABRIC_BAKE_B0_2_C_TESTS.sh)" = "8b3042b9ceb4455c43c0cf1c12f7d2541647234c"
          git config user.name "rootfabric-bake-bot"
          git config user.email "rootfabric-bake-bot@users.noreply.github.com"
          git add -- scripts/research/fabric_bake0/structural_refinement_guard_field_descriptor_v1.gd scripts/research/fabric_bake0/structural_refinement_guard_compiler_v1.gd scripts/research/fabric_bake0/structural_refinement_guard_runtime_v1.gd tests/research/fabric_bake0/fabric_bake_b0_2_c_fixture.gd tests/research/fabric_bake0/fabric_bake_b0_2_c_acceptance.gd tests/research/fabric_bake0/fabric_bake_b0_2_c_playground.gd RUN_FABRIC_BAKE_B0_2_C_TESTS.sh
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 7
          git commit -m "feat(fabric-bake): implement B0.2-C refinement guard field"
          git push origin HEAD:research/fabric-bake0-2-refinement-guards-r1
          echo "implementation_head=$(git rev-parse HEAD)"
          echo "implementation_tree=$(git rev-parse HEAD^{tree})"
