name: FABRIC-BAKE B0.2-E Exact Source Export
on:
  push:
    branches: [research/fabric-bake0-2-e-commit-helper-r1]
    paths:
      - ".github/workflows/fabric-bake-b0-2-e-exact-source-export.yml"
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 91a2f79bf6738efefa342589c44e4a0f0a6960d6
          fetch-depth: 0
      - name: Assert exact subject and archive tracked tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "91a2f79bf6738efefa342589c44e4a0f0a6960d6"
          test "$(git rev-parse HEAD^{tree})" = "610288ea119e9f7508f711ce5b0468b272a9b489"
          test -z "$(git status --porcelain --untracked-files=no)"
          git archive --format=tar.gz --output=/tmp/fabric-bake-b0-2-e-exact.tar.gz HEAD
          sha256sum /tmp/fabric-bake-b0-2-e-exact.tar.gz | tee /tmp/SHA256SUMS.txt
          printf 'head=%s\ntree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" > /tmp/IDENTITY.txt
          git ls-tree -r --name-only HEAD | wc -l | tee /tmp/TRACKED_FILE_COUNT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fabric-bake-b0-2-e-exact-source-91a2f79b
          path: |
            /tmp/fabric-bake-b0-2-e-exact.tar.gz
            /tmp/SHA256SUMS.txt
            /tmp/IDENTITY.txt
            /tmp/TRACKED_FILE_COUNT.txt
          if-no-files-found: error
          retention-days: 7
