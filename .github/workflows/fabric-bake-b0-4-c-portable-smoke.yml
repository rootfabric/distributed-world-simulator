name: FABRIC-BAKE B0.4-C Portable Godot Smoke

on:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event subject
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Install official Godot 4.7.1 parser/runtime smoke
        run: |
          curl -fL --retry 3             -o /tmp/godot.zip             https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Run B0.3 and B0.4 A/B/C portable smoke
        env:
          GODOT: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
        run: |
          set -Eeuo pipefail
          for script in             res://tests/research/fabric_bake0/fabric_bake_b0_3_acceptance.gd             res://tests/research/fabric_bake0/fabric_bake_b0_4_a_acceptance.gd             res://tests/research/fabric_bake0/fabric_bake_b0_4_b_acceptance.gd             res://tests/research/fabric_bake0/fabric_bake_b0_4_c_acceptance.gd
          do
            echo "=== $script ==="
            log="$(mktemp)"
            set +e
            "$GODOT" --headless --path . --script "$script" 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -ne 0 ]; then
              exit "$status"
            fi
            if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script' "$log"; then
              echo "fatal GDScript marker detected in $script" >&2
              exit 4
            fi
            rm -f "$log"
          done

      - name: Record exact smoke identity
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          echo "TREE=$(git rev-parse 'HEAD^{tree}')"
