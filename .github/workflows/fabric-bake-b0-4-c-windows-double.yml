name: FABRIC-BAKE B0.4-C Windows Double Runtime

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fabric-bake-b0-4-c-windows-double-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  exact-double:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout exact event subject
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Initialize isolated evidence
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSEdition -cne 'Core' -or $PSVersionTable.PSVersion.Major -lt 7) {
              throw 'POWERSHELL_CORE_REQUIRED'
          }
          $evidence = Join-Path $PWD 'artifacts/fabric-bake-b0-4-c-windows-double'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $profileRoot = Join-Path $env:RUNNER_TEMP ("fabric-b04c-" + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          foreach ($entry in @('APPDATA', 'LOCALAPPDATA')) {
              $folder = Join-Path $profileRoot $entry
              New-Item -ItemType Directory -Force -Path $folder | Out-Null
              "$entry=$folder" >> $env:GITHUB_ENV
          }
          'BREAKPOINT_RUNTIME_DISABLED=1' >> $env:GITHUB_ENV
          $PSVersionTable | Out-String | Set-Content (Join-Path $evidence 'powershell.txt')

      - name: Assert exact Git identity
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:EXPECTED_SHA) {
              throw "EXACT_HEAD_MISMATCH: actual=$head expected=$env:EXPECTED_SHA"
          }
          $tree = (git rev-parse "HEAD^{tree}").Trim()
          $dirty = @(git status --short --untracked-files=no)
          if ($dirty.Count -ne 0) {
              throw "TRACKED_WORKTREE_NOT_CLEAN: $($dirty -join '; ')"
          }
          Write-Host "HEAD=$head"
          Write-Host "TREE=$tree"

      - name: Resolve exact double Godot
        id: godot
        env:
          CONFIGURED_GODOT_BIN: ${{ vars.DWS_GODOT_DOUBLE_BIN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          # BEGIN_HASH_HELPER: no dependency on module autoload or Get-FileHash.
          function Get-ExactSha256([string] $Path) {
              $stream = [IO.File]::OpenRead($Path)
              $algorithm = $null
              try {
                  $algorithm = [Security.Cryptography.SHA256]::Create()
                  return [BitConverter]::ToString($algorithm.ComputeHash($stream)).Replace('-', '').ToLowerInvariant()
              }
              finally {
                  if ($null -ne $algorithm) { $algorithm.Dispose() }
                  $stream.Dispose()
              }
          }
          # END_HASH_HELPER
          $godot = $env:CONFIGURED_GODOT_BIN
          if ([string]::IsNullOrWhiteSpace($godot)) {
              $godot = "C:\Godot\godot\bin\godot.windows.editor.double.x86_64.console.exe"
          }
          if (-not (Test-Path -LiteralPath $godot -PathType Leaf)) {
              throw "EXACT_GODOT_NOT_FOUND: $godot"
          }
          $versionOutput = @(& $godot --version 2>&1)
          $engineExit = $LASTEXITCODE
          if ($engineExit -ne 0 -or $versionOutput.Count -eq 0) {
              throw "GODOT_VERSION_QUERY_FAILED: $engineExit"
          }
          $version = $versionOutput[0].ToString().Trim()
          if ($version -cne "4.7.1.stable.double.custom_build.a13da4feb") {
              throw "GODOT_IDENTITY_MISMATCH: $version"
          }
          $sha = Get-ExactSha256 $godot
          if ($sha -cne '3633c3e609c8ce2f9bae334a9c7e75c7f974de3af0415ab4a8050a625a15a7a5') {
              throw "GODOT_SHA256_MISMATCH: $sha"
          }
          "path=$godot" >> $env:GITHUB_OUTPUT
          Write-Host "GODOT=$version"
          Write-Host "GODOT_SHA256=$sha"

      - name: Fresh Godot import
        env:
          GODOT_BIN: ${{ steps.godot.outputs.path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          foreach ($phase in @('recovery', 'ordinary')) {
              $log = "artifacts/fabric-bake-b0-4-c-windows-double/import-$phase.log"
              $gateArgs = @('--headless', '--editor', '--path', '.', '--import')
              if ($phase -eq 'recovery') { $gateArgs += '--recovery-mode' }
              & $env:GODOT_BIN @gateArgs 2>&1 | Tee-Object -FilePath $log
              $code = $LASTEXITCODE
              if ($code -ne 0) { throw "GODOT_IMPORT_FAILED: phase=$phase exit=$code" }
              $fatal = Select-String -Path $log -Pattern 'SCRIPT ERROR', 'Parse Error', 'Failed to load script' -SimpleMatch
              if ($null -ne $fatal) { throw "GODOT_IMPORT_FATAL_MARKER: phase=$phase" }
          }

      - name: Run exact double B0.3 and B0.4 A B C
        env:
          GODOT_BIN: ${{ steps.godot.outputs.path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $scripts = @(
              "res://tests/research/fabric_bake0/fabric_bake_b0_3_acceptance.gd",
              "res://tests/research/fabric_bake0/fabric_bake_b0_4_a_acceptance.gd",
              "res://tests/research/fabric_bake0/fabric_bake_b0_4_b_acceptance.gd",
              "res://tests/research/fabric_bake0/fabric_bake_b0_4_c_acceptance.gd"
          )
          foreach ($script in $scripts) {
              $name = [IO.Path]::GetFileNameWithoutExtension($script)
              $log = "artifacts\fabric-bake-b0-4-c-windows-double\$name.log"
              Write-Host "=== $script ==="
              & $env:GODOT_BIN --headless --path . --script $script 2>&1 | Tee-Object -FilePath $log
              $code = $LASTEXITCODE
              if ($code -ne 0) {
                  Get-Content $log -Tail 300
                  throw "GODOT_TEST_FAILED: script=$script exit=$code"
              }
              $fatal = Select-String -Path $log -Pattern "SCRIPT ERROR:","ERROR: Failed to load script" -SimpleMatch
              if ($null -ne $fatal) {
                  Get-Content $log -Tail 300
                  throw "GODOT_FATAL_MARKER: script=$script"
              }
          }

      - name: Verify final clean identity
        run: |
          $head = (git rev-parse HEAD).Trim()
          $tree = (git rev-parse "HEAD^{tree}").Trim()
          $dirty = @(git status --short --untracked-files=no)
          if ($dirty.Count -ne 0) {
              throw "TRACKED_WORKTREE_DIRTY_AFTER_TESTS: $($dirty -join '; ')"
          }
          Write-Host "FINAL_HEAD=$head"
          Write-Host "FINAL_TREE=$tree"
          Write-Host "FABRIC-BAKE B0.4-C WINDOWS DOUBLE RUNTIME: PASS"

      - name: Upload runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-bake-b0-4-c-windows-double-logs
          path: artifacts/fabric-bake-b0-4-c-windows-double
          if-no-files-found: warn
          retention-days: 7
