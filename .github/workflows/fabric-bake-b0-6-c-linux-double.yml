name: FABRIC B0.6-C Linux Double

on:
  pull_request:
    paths:
      - 'scripts/research/fabric_bake0/**'
      - 'tests/research/fabric_bake0/**'
      - 'RUN_FABRIC_B0_6_*.sh'
      - '.github/workflows/fabric-bake-b0-6-*.yml'
  workflow_dispatch:
  push:
    branches: [research/fabric-bake0-6-adaptive-physical-fidelity-r1]
    paths:
      - 'scripts/research/fabric_bake0/**'
      - 'tests/research/fabric_bake0/**'
      - 'RUN_FABRIC_B0_6_*.sh'
      - '.github/workflows/fabric-bake-b0-6-*.yml'

permissions:
  contents: read

jobs:
  exact-linux-double:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify source and canonical attached runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          git diff --check
          bash -n RUN_FABRIC_B0_6_C_TESTS.sh
          bin="${DWS_GODOT_DOUBLE_BIN:-$HOME/.local/opt/godot-double-4.7.1-a13da4f/godot.linuxbsd.editor.double.x86_64}"
          test -x "$bin"
          test "$("$bin" --version)" = '4.7.1.stable.double.custom_build.a13da4feb'
          test "$(sha256sum "$bin" | cut -d' ' -f1)" = 'bfa7ce632d8d4b1dcc96f64f5405ee52b57c4e25d15c3e0478acc26e08d517d7'
          echo "GODOT_BIN=$bin" >> "$GITHUB_ENV"
          echo 'BREAKPOINT_RUNTIME_DISABLED=1' >> "$GITHUB_ENV"
          echo '*.gd.uid' >> .git/info/exclude
          mkdir -p artifacts/b0_6
          echo "HEAD=$(git rev-parse HEAD) TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Fresh import
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf .godot
          "$GODOT_BIN" --headless --editor --path . --import 2>&1 | tee artifacts/b0_6/import.log
          python3 scripts/research/fabric_bake0/validate_adaptive_import.py artifacts/b0_6/import.log
      - name: Exact suite
        shell: bash
        run: |
          set -Eeuo pipefail
          B06_LOG_DIR="$PWD/artifacts/b0_6/closure-1" bash ./RUN_FABRIC_B0_6_C_TESTS.sh 2>&1 | tee artifacts/b0_6/c-1.log
      - name: Verify clean source
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain=v1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fabric-b0-6-c-${{ github.sha }}
          path: artifacts/b0_6/
          if-no-files-found: error
