name: FABRIC B0.6-CLOSE Exact e622 Control

on:
  push:
    branches: [control/fabric-r4-b06-close-e622-r1]
    paths:
      - '.github/workflows/fabric-bake-b0-6-close-linux-double.yml'

permissions:
  contents: read

jobs:
  exact-linux-double:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: e6228a39b6b3006a3d14ad0884c09266570fcd00
      - name: Verify exact product subject and canonical attached runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 'e6228a39b6b3006a3d14ad0884c09266570fcd00'
          test "$(git rev-parse 'HEAD^{tree}')" = '1b84960369868aa6d5ec23c1eae3019250ff9a8f'
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          git diff --check
          bash -n RUN_FABRIC_B0_6_CLOSE_TESTS.sh
          bin="${DWS_GODOT_DOUBLE_BIN:-$HOME/.local/opt/godot-double-4.7.1-a13da4f/godot.linuxbsd.editor.double.x86_64}"
          test -x "$bin"
          test "$("$bin" --version)" = '4.7.1.stable.double.custom_build.a13da4feb'
          test "$(sha256sum "$bin" | cut -d' ' -f1)" = 'bfa7ce632d8d4b1dcc96f64f5405ee52b57c4e25d15c3e0478acc26e08d517d7'
          echo "GODOT_BIN=$bin" >> "$GITHUB_ENV"
          echo 'BREAKPOINT_RUNTIME_DISABLED=1' >> "$GITHUB_ENV"
          echo '*.gd.uid' >> .git/info/exclude
          mkdir -p artifacts/b0_6
          echo "PRODUCT_HEAD=$(git rev-parse HEAD) PRODUCT_TREE=$(git rev-parse 'HEAD^{tree}')"
          echo "CONTROL_TRIGGER_SHA=$GITHUB_SHA"
      - name: Fresh import
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf .godot
          "$GODOT_BIN" --headless --editor --path . --import 2>&1 | tee artifacts/b0_6/import.log
          python3 scripts/research/fabric_bake0/validate_adaptive_import.py artifacts/b0_6/import.log
      - name: Exact suite twice
        shell: bash
        run: |
          set -Eeuo pipefail
          B06_LOG_DIR="$PWD/artifacts/b0_6/closure-1" bash ./RUN_FABRIC_B0_6_CLOSE_TESTS.sh 2>&1 | tee artifacts/b0_6/close-1.log
          B06_LOG_DIR="$PWD/artifacts/b0_6/closure-2" bash ./RUN_FABRIC_B0_6_CLOSE_TESTS.sh 2>&1 | tee artifacts/b0_6/close-2.log
          diff <(grep '^B06_CLOSURE_HASH=' artifacts/b0_6/close-1.log) <(grep '^B06_CLOSURE_HASH=' artifacts/b0_6/close-2.log)
          expected='B06_CLOSURE_HASH=892a66dbcb9e29c99ba7088a03dd41c167fd728a6f97923d4e944e4aef682584'
          test "$(grep '^B06_CLOSURE_HASH=' artifacts/b0_6/close-1.log | tail -n1)" = "$expected"
          test "$(grep '^B06_CLOSURE_HASH=' artifacts/b0_6/close-2.log | tail -n1)" = "$expected"
      - name: Verify clean exact product source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 'e6228a39b6b3006a3d14ad0884c09266570fcd00'
          test "$(git rev-parse 'HEAD^{tree}')" = '1b84960369868aa6d5ec23c1eae3019250ff9a8f'
          git diff --check
          test -z "$(git status --porcelain=v1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fabric-b0-6-close-e622-control-${{ github.run_attempt }}
          path: artifacts/b0_6/
          if-no-files-found: error
          retention-days: 30
