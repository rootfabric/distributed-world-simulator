name: FABRIC B0.6 Checksum-Bound Git Transport
on:
  workflow_dispatch:
  push:
    branches: [research/fabric-bake0-6-adaptive-physical-fidelity-r1]
    paths: [.github/workflows/fabric-bake-b0-6-git-transfer.yml]
permissions:
  contents: write
jobs:
  verified-source-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OUTPUT_DIR: /tmp/b06-verified-transfer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Reconstruct checksum-bound source bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import subprocess, textwrap
          text = subprocess.check_output(['git', 'show', '3999f724835da11685580ff81e3c20982f94d338:.github/workflows/fabric-bake-b0-6-git-transfer.yml'], text=True)
          program = text.split("          python3 - <<'PY'\n", 1)[1].split('\n          PY', 1)[0]
          exec(compile(textwrap.dedent(program), 'checksum_verified_transport', 'exec'))
          PY
      - name: Stage verified commits without moving research or main
        run: |
          set -Eeuo pipefail
          base=1e8e74d6afafad294ddf10d68cb37efacc3ef3a1
          payload=f50d19e4bdf54a4b89a4e7018314c6ee63e4578c
          branch="staging/fabric-b0-6-offline-${GITHUB_RUN_ID}"
          git bundle verify "$OUTPUT_DIR/implementation.bundle"
          git fetch "$OUTPUT_DIR/implementation.bundle" HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$payload"
          # Read from the independently hash-verified commit, not the old mistyped manifest.
          test "$(git rev-parse "$payload^{tree}")" = 5d33ff8f630f60d788330471144fcb14f1c93500
          test "$(git rev-list --count "$base..$payload")" = 6
          git config user.name 'DWS Research Agent'
          git config user.email 'dws-research@users.noreply.github.com'
          git checkout --detach "$GITHUB_SHA"
          git cherry-pick $(git rev-list --reverse "$base..$payload")
          # Preserve all newer transport/diagnostic files; compare only restored paths.
          python3 - <<'PY'
          import subprocess
          git = lambda *a: subprocess.check_output(['git', *a])
          base = '1e8e74d6afafad294ddf10d68cb37efacc3ef3a1'
          payload = 'f50d19e4bdf54a4b89a4e7018314c6ee63e4578c'
          paths = git('diff', '--name-only', '-z', base, payload).decode().split('\0')[:-1]
          assert len(paths) == 30
          for path in paths:
              assert path.startswith(('RUN_FABRIC_', 'scripts/research/fabric_bake0/', 'tests/research/fabric_bake0/', 'docs/research/FABRIC_', 'validation/FABRIC_', '.github/workflows/fabric-bake-b0-6-')), path
              assert git('ls-tree', payload, '--', path) == git('ls-tree', 'HEAD', '--', path), path
          PY
          git diff --check
          test -z "$(git status --porcelain=v1)"
          git update-ref "refs/heads/$branch" HEAD
          git update-ref refs/heads/recovery/fabric-b0-6-original-payload "$payload"
          git bundle create "$OUTPUT_DIR/result.bundle" "refs/heads/$branch" refs/heads/recovery/fabric-b0-6-original-payload ^949b089ed35750abf9e237f063af21490291d187
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          out = Path(os.environ['OUTPUT_DIR'])
          git = lambda *args: subprocess.check_output(['git', *args], text=True).strip()
          manifest = {'purpose': 'VERIFIED_SOURCE_TRANSPORT_NOT_RUNTIME_EVIDENCE', 'carrier_head': os.environ['GITHUB_SHA'], 'payload_head': 'f50d19e4bdf54a4b89a4e7018314c6ee63e4578c', 'payload_tree': '5d33ff8f630f60d788330471144fcb14f1c93500', 'head': git('rev-parse', 'HEAD'), 'tree': git('rev-parse', 'HEAD^{tree}'), 'branch': 'staging/fabric-b0-6-offline-' + os.environ['GITHUB_RUN_ID'], 'bundle_sha256': hashlib.sha256((out / 'result.bundle').read_bytes()).hexdigest(), 'main_changed': False, 'research_ref_changed': False}
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest, indent=2))
          PY
          git push origin "HEAD:refs/heads/$branch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fabric-b0-6-verified-source-${{ github.sha }}
          path: /tmp/b06-verified-transfer/
          if-no-files-found: error
          retention-days: 7
