name: FABRIC-BAKE BRIDGE-2-A Portable Smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge2-a:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact event subject
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Install official Godot 4.7.1
        run: |
          set -Eeuo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Parse BRIDGE-2-A sources
        env:
          GODOT: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
        run: |
          set -Eeuo pipefail
          for script in \
            res://tests/research/fabric_bake0/fabric_bake_bridge2_a_acceptance.gd \
            res://tests/research/fabric_bake0/fabric_bake_bridge2_a_playground.gd
          do
            log="$(mktemp)"
            set +e
            "$GODOT" --headless --path . --script "$script" --check-only 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -ne 0 ] || grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script' "$log"; then
              exit 4
            fi
            rm -f "$log"
          done

      - name: Run BRIDGE-2-A portable ownership smoke
        env:
          GODOT: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
        run: |
          set -Eeuo pipefail
          "$GODOT" --headless --path . \
            --script res://tests/research/fabric_bake0/fabric_bake_bridge2_a_acceptance.gd \
            2>&1 | tee /tmp/bridge2-a.log
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script' /tmp/bridge2-a.log; then
            exit 4
          fi
          grep -Fq 'FABRIC-BAKE BRIDGE-2-A Mixed Representation Ownership Acceptance: PASS' /tmp/bridge2-a.log

      - name: Record exact smoke identity
        run: |
          set -Eeuo pipefail
          git diff --check
          echo "HEAD=$(git rev-parse HEAD)"
          echo "TREE=$(git rev-parse 'HEAD^{tree}')"
