name: FABRIC-BAKE BRIDGE-2-D Portable Smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge2-d-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact event subject
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Install official Godot 4.7.1
        run: |
          set -Eeuo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Parse BRIDGE-2-D sources
        env:
          GODOT: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
        run: |
          set -Eeuo pipefail
          bash -n RUN_FABRIC_BAKE_BRIDGE2_D_TESTS.sh
          for script in \
            res://tests/research/fabric_bake0/fabric_bake_bridge2_d_acceptance.gd \
            res://tests/research/fabric_bake0/fabric_bake_bridge2_d_recovery_acceptance.gd \
            res://tests/research/fabric_bake0/fabric_bake_bridge2_d_playground.gd
          do
            log="$(mktemp)"
            set +e
            "$GODOT" --headless --path . --script "$script" --check-only 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -ne 0 ] || grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script' "$log"; then
              exit 4
            fi
            rm -f "$log"
          done

      - name: Keep BRIDGE-2-D runtime authoritative-double only
        run: |
          echo "B2-D composes B0.2-E/B0.3/B0.4/B0.5 runtime artifacts; portable Godot is parser coverage only."

      - name: Record exact parser identity
        run: |
          set -Eeuo pipefail
          git diff --check
          echo "HEAD=$(git rev-parse HEAD)"
          echo "TREE=$(git rev-parse 'HEAD^{tree}')"
