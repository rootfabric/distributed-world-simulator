name: FABRIC COMPOSITION-R3 Linux Double
on:
  push:
    branches: [research/fabric-composition-r3-coupled-mechanism-r1]
permissions:
  contents: read
concurrency:
  group: fabric-composition-r3-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact-linux-double:
    if: github.repository == 'rootfabric/distributed-world-simulator' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind exact subject and immutable R2 predecessor
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/research/fabric-physics-r2-material-geometry-laws-r1)" = '2c1802bf0b90c7ca11992cb1c166855f2d92c682'
          bin="${DWS_GODOT_DOUBLE_BIN:-$HOME/.local/opt/godot-double-4.7.1-a13da4f/godot.linuxbsd.editor.double.x86_64}"
          test -x "$bin"
          printf 'GODOT_BIN=%s\n' "$bin" >> "$GITHUB_ENV"
          bash -n RUN_FABRIC_COMPOSITION_R3_TESTS.sh scripts/research/fabric_bake0/run_composition_r3_exact.sh
      - name: Exact fresh import, R3, R2 and R1 regression
        shell: bash
        run: bash scripts/research/fabric_bake0/run_composition_r3_exact.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fabric-composition-r3-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/fabric-composition-r3/
          if-no-files-found: error
          retention-days: 14
