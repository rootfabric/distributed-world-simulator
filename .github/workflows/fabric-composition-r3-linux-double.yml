name: COMPOSITION-R3 Immutable Closure Package
on:
  push:
    branches: [verify/fabric-composition-r3-exact-replay-r1]
    paths: [.github/workflows/fabric-composition-r3-linux-double.yml]
permissions:
  contents: read
jobs:
  package:
    if: github.repository == 'rootfabric/distributed-world-simulator' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c9176fe0073b4093afe23d14f21a4c7e47bba106
          fetch-depth: 0
          persist-credentials: false
      - name: Package only changed files from exact Git objects
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, json, subprocess, zipfile
          from pathlib import Path
          before = 'ddf2b2c51d76d0afe3331cfaf17a6d4e7fb86054'
          head = 'c9176fe0073b4093afe23d14f21a4c7e47bba106'
          runtime = 'fd6e83b35301d7a15e92c55939654f1f95729730'
          def git(*args):
              return subprocess.check_output(['git', *args])
          assert git('rev-parse','HEAD').decode().strip() == head
          assert git('rev-parse',head+'^{tree}').decode().strip() == '91571530f648738686aaef4c79f475bc0cc31bf7'
          assert git('rev-parse','origin/research/fabric-composition-r3-coupled-mechanism-r1').decode().strip() == runtime
          assert not git('diff','--name-only',runtime,head,'--','scripts','tests','scenes','RUN_FABRIC_COMPOSITION_R3_TESTS.sh','.github')
          paths = git('diff','--name-only','--diff-filter=AM',before,head).decode().splitlines()
          assert len(paths) == 14, paths
          output = Path('artifacts/r3-closure-package'); output.mkdir(parents=True,exist_ok=True)
          target = output/'COMPOSITION_R3_CLOSED_CHANGED_FILES.zip'
          manifest = {'base_head':before,'runtime_head':runtime,'closure_head':head,'closure_tree':'91571530f648738686aaef4c79f475bc0cc31bf7','files':{}}
          with zipfile.ZipFile(target,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for path in paths:
                  assert not path.startswith('/') and '..' not in Path(path).parts
                  assert Path(path).suffix in ['.gd','.sh','.md','.json'], path
                  data = git('show',head+':'+path)
                  z.writestr(path,data)
                  manifest['files'][path] = hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(target) as z:
              assert z.testzip() is None
              assert sorted(z.namelist()) == sorted(paths)
          manifest['archive_sha256'] = hashlib.sha256(target.read_bytes()).hexdigest()
          (output/'package-receipt.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          (output/'archive.sha256').write_text(manifest['archive_sha256']+'  '+target.name+'\n')
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fabric-composition-r3-closure-package-${{ github.run_id }}
          path: artifacts/r3-closure-package/
          if-no-files-found: error
          retention-days: 30
