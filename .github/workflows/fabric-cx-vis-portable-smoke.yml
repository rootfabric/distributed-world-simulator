name: FABRIC CX-VIS0 Portable Parser Smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact CX-VIS subject
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Install official Godot 4.7.1
        run: |
          set -Eeuo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Parse exact CX-VIS branch sources
        env:
          GODOT: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
        run: |
          set -Eeuo pipefail
          for script in             res://scripts/research/fabric_bake0/cx_vis_observation_model_v1.gd             res://scripts/labs/fabric/cx_vis_observatory.gd             res://tests/research/fabric_bake0/fabric_bake_cx_vis_observatory_acceptance.gd
          do
            log="$(mktemp)"
            set +e
            "$GODOT" --headless --path . --script "$script" --check-only 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -ne 0 ] || grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script' "$log"; then
              exit 4
            fi
            rm -f "$log"
          done

      - name: Fresh import scenes
        env:
          GODOT: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
        run: |
          set -Eeuo pipefail
          "$GODOT" --headless --editor --path . --import 2>&1 | tee /tmp/cx-vis-import.log
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script' /tmp/cx-vis-import.log; then
            exit 4
          fi

      - name: Keep 2000 runtime authoritative-double only
        run: |
          echo "CX-VIS parser/resource smoke is portable; COMPLEX0@2000 runtime remains canonical-double-only."

      - name: Record smoke identity
        run: |
          set -Eeuo pipefail
          git diff --check
          echo "HEAD=$(git rev-parse HEAD)"
          echo "TREE=$(git rev-parse 'HEAD^{tree}')"
