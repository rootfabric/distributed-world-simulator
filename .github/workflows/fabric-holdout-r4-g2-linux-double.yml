name: FABRIC HOLDOUT-R4 G2 Linux Double
on:
  push:
    branches: [repair/fabric-holdout-r4-g2-generalized-capabilities-r1]
    paths:
      - scripts/network/contracts/network_contract_utils.gd
      - scripts/research/fabric_bake0/fabric_composition_r3_*general*.gd
      - scripts/research/fabric_bake0/fabric_composition_r3_compiler_v1.gd
      - scripts/research/fabric_bake0/fabric_composition_r3_runtime_v1.gd
      - tests/research/fabric1/fabric_holdout_r4_g2_*.gd
      - RUN_FABRIC_HOLDOUT_R4_G2_TESTS.sh
      - .github/workflows/fabric-holdout-r4-g2-*.yml
      - docs/research/FABRIC_HOLDOUT_R4_G2_*.md
permissions:
  contents: read
concurrency:
  group: fabric-holdout-r4-g2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  g2:
    if: github.repository == 'rootfabric/distributed-world-simulator' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Execute bounded G2 repair and unchanged R1-R3 regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          export GODOT_BIN="${DWS_GODOT_DOUBLE_BIN:-$HOME/.local/opt/godot-double-4.7.1-a13da4f/godot.linuxbsd.editor.double.x86_64}"
          bash RUN_FABRIC_HOLDOUT_R4_G2_TESTS.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fabric-holdout-r4-g2-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/fabric-holdout-r4-g2-exact-*/
          if-no-files-found: error
          retention-days: 30
