name: HOLDOUT-R4 Independent Challenge Capture
on:
  push:
    branches: [verify/fabric-holdout-r4-author-capture-r1]
permissions:
  contents: read
  pull-requests: read
jobs:
  capture-only:
    if: github.repository == 'rootfabric/distributed-world-simulator' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c73262adf568e2309fe5dd49a034812492566691
          fetch-depth: 0
          persist-credentials: false
      - name: Capture immutable author response and challenge without execution
        env:
          GH_READ_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, re, subprocess, urllib.request
          freeze = 'c73262adf568e2309fe5dd49a034812492566691'
          url = 'https://api.github.com/repos/rootfabric/distributed-world-simulator/pulls/comments/3950896660'
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer '+os.environ['GH_READ_TOKEN'], 'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=30) as response:
              raw = response.read()
          comment = json.loads(raw)
          assert comment['id'] == 3950896660
          assert comment['user']['id'] == 199175422 and comment['user']['login'] == 'chatgpt-codex-connector[bot]'
          assert comment['original_commit_id'] == freeze
          created = datetime.datetime.fromisoformat(comment['created_at'].replace('Z','+00:00'))
          frozen = datetime.datetime.fromisoformat(subprocess.check_output(['git','show','-s','--format=%cI',freeze], text=True).strip())
          assert created > frozen
          body = comment['body'].encode('utf-8')
          blocks = re.findall(rb'```json\s*\n(.*?)\n```', body, re.S)
          assert len(blocks) == 1
          cases = blocks[0]
          parsed = json.loads(cases)
          assert parsed['schema'] == 'fabric.holdout_r4.cases.v1' and len(parsed['cases']) >= 6
          out = pathlib.Path('capture'); out.mkdir()
          (out/'author-response.json').write_bytes(raw)
          (out/'author-body.md').write_bytes(body)
          (out/'cases.json').write_bytes(cases)
          provenance = {
              'freeze_commit':freeze, 'subject_head':'fd6e83b35301d7a15e92c55939654f1f95729730',
              'cases_sha256':hashlib.sha256(cases).hexdigest(), 'author':comment['user']['login'],
              'author_id':comment['user']['id'], 'source_comment_id':comment['id'],
              'review_id':comment['pull_request_review_id'], 'created_at':comment['created_at'],
              'updated_at':comment['updated_at'], 'original_commit_id':comment['original_commit_id'],
              'raw_response_path':'docs/research/FABRIC_HOLDOUT_R4_AUTHOR_RAW_RU.md',
              'raw_response_sha256':hashlib.sha256(body).hexdigest(),
              'github_response_sha256':hashlib.sha256(raw).hexdigest(),
              'source_url':comment['html_url'], 'capture_run':int(os.environ['GITHUB_RUN_ID']),
              'capture_purpose':'DATA_ONLY_NO_RUNTIME_EXECUTION_NO_ACCEPTANCE'}
          (out/'provenance.json').write_text(json.dumps(provenance,ensure_ascii=False,indent=2)+'\n')
          (out/'work-order.md').write_bytes(pathlib.Path('docs/research/FABRIC_HOLDOUT_R4_WORK_ORDER_RU.md').read_bytes())
          (out/'freeze-commit.txt').write_bytes(subprocess.check_output(['git','cat-file','commit',freeze]))
          (out/'sha256.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(out.iterdir()) if p.is_file()))
          print('AUTHOR_CASES_CAPTURED='+str(len(parsed['cases'])))
          print('CASE_DIGEST='+provenance['cases_sha256'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fabric-holdout-r4-author-${{ github.run_id }}
          path: capture/
          if-no-files-found: error
          retention-days: 30
