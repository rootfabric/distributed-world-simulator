name: HOLDOUT-R4 Frozen G1 Exact Replay
on:
  push:
    branches: [verify/fabric-holdout-r4-exact-replay-r1]
permissions:
  contents: read
  actions: read
jobs:
  exact-measurement:
    if: github.repository == 'rootfabric/distributed-world-simulator' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9c5ee890d9f770756e37c1d3df84b4f3c1dbd477
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact harness and approved engine
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/executor-provenance
          printf 'HARNESS_HEAD=%s\nHARNESS_TREE=%s\nWORKFLOW_HEAD=%s\nRUN=%s\nENGINE_ARTIFACT_ID=10015796111\n' "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')" "$GITHUB_SHA" "$GITHUB_RUN_ID" > artifacts/executor-provenance/identity.txt
          test "$(git rev-parse HEAD)" = 9c5ee890d9f770756e37c1d3df84b4f3c1dbd477
          test "$(git rev-parse 'HEAD^{tree}')" = 4bd6f2834f775cf4286c6de3ac9e28fb73e57c61
          test "$(git rev-parse origin/research/fabric-composition-r3-coupled-mechanism-r1)" = fd6e83b35301d7a15e92c55939654f1f95729730
          gh run download 34114746722 --repo "$GITHUB_REPOSITORY" --name fabric-composition-r3-approved-engine-34114746722 --dir "$RUNNER_TEMP/r4-engine"
          bin="$RUNNER_TEMP/r4-engine/godot.linuxbsd.editor.double.x86_64"
          test "$(sha256sum "$bin" | cut -d' ' -f1)" = bfa7ce632d8d4b1dcc96f64f5405ee52b57c4e25d15c3e0478acc26e08d517d7
          chmod u+x "$bin"
          test "$("$bin" --version)" = 4.7.1.stable.double.custom_build.a13da4feb
          sha256sum "$bin" > artifacts/executor-provenance/engine.sha256
          printf 'GODOT_BIN=%s\n' "$bin" >> "$GITHUB_ENV"
      - name: Run exact R4 experiment and unchanged predecessor regressions
        shell: bash
        run: bash RUN_FABRIC_HOLDOUT_R4_TESTS.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fabric-holdout-r4-g1-exact-${{ github.run_id }}
          path: |
            artifacts/fabric-holdout-r4-exact-*/
            artifacts/executor-provenance/
          if-no-files-found: error
          retention-days: 30
