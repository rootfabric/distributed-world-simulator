name: FABRIC R4.1 Fresh Independent Verifier R1

on:
  push:
    branches: [verify/fabric-r4-1-numeric-envelope-diagnostics-r1]

permissions:
  contents: read

concurrency:
  group: fabric-r4-1-fresh-independent-verifier-r1
  cancel-in-progress: true

env:
  SUBJECT_BRANCH: repair/fabric-r4-1-numeric-envelope-diagnostics-r1
  SUBJECT_HEAD: 3afd12e9296b6533b25e7466cec6b4e2151daceb
  SUBJECT_TREE: dc8d9c8c9bf0e6905ad3c581f75893ccd195078e

jobs:
  fresh-independent-verifier:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact R4.1 subject and verifier scope
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin "$SUBJECT_BRANCH" --no-tags
          test "$(git rev-parse "origin/$SUBJECT_BRANCH")" = "$SUBJECT_HEAD"
          test "$(git rev-parse "$SUBJECT_HEAD^{tree}")" = "$SUBJECT_TREE"
          test "$(git merge-base HEAD "$SUBJECT_HEAD")" = "$SUBJECT_HEAD"
          expected="$(printf '%s\n' \
            '.github/workflows/fabric-r4-1-fresh-independent-verifier-r1.yml' \
            'docs/research/FABRIC_R4_1_FRESH_INDEPENDENT_VERIFIER_R1_RU.md' \
            'tests/research/fabric1/fabric_r4_1_independent_verifier.gd' | sort)"
          actual="$(git diff --name-only "$SUBJECT_HEAD"...HEAD | sort)"
          test "$actual" = "$expected"
          git diff --check "$SUBJECT_HEAD"...HEAD
          echo '*.gd.uid' >> .git/info/exclude
          printf 'VERIFIER_HEAD=%s\nVERIFIER_TREE=%s\nSUBJECT_HEAD=%s\nSUBJECT_TREE=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')" "$SUBJECT_HEAD" "$SUBJECT_TREE" | tee r41-verifier-identity.txt
      - name: Verify canonical Linux double
        shell: bash
        run: |
          set -Eeuo pipefail
          bin="${DWS_GODOT_DOUBLE_BIN:-$HOME/.local/opt/godot-double-4.7.1-a13da4f/godot.linuxbsd.editor.double.x86_64}"
          test -x "$bin"
          test "$("$bin" --version | head -n1 | tr -d '\r')" = '4.7.1.stable.double.custom_build.a13da4feb'
          sha="$(sha256sum "$bin" | awk '{print $1}')"
          test "$sha" = 'bfa7ce632d8d4b1dcc96f64f5405ee52b57c4e25d15c3e0478acc26e08d517d7'
          echo "GODOT_BIN=$bin" >> "$GITHUB_ENV"
          printf 'GODOT_SHA256=%s\n' "$sha" | tee r41-verifier-godot.txt
      - name: Fresh import verifier checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf .godot
          "$GODOT_BIN" --headless --editor --path . --log-file r41-verifier-import.log --import
          ! grep -Eiq 'SCRIPT ERROR|Parse Error|Invalid call|Invalid access|ERROR:' r41-verifier-import.log
      - name: Run primary independent oracle
        shell: bash
        run: |
          set -Eeuo pipefail
          "$GODOT_BIN" --headless --path . --script res://tests/research/fabric1/fabric_r4_1_independent_verifier.gd 2>&1 | tee r41-independent.log
          grep -F 'FABRIC_R4_1_INDEPENDENT_VERIFIER_ASSERTIONS=17 FAILURES=0' r41-independent.log
          grep -F 'FABRIC-R4.1-INDEPENDENT-VERIFIER: PASS' r41-independent.log
          ! grep -Eiq 'SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Assertion failed|Segmentation fault' r41-independent.log
      - name: Replay bounded exact R4.1 regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$GITHUB_WORKSPACE/r41-subject-replay.log"
          subject_dir="$RUNNER_TEMP/dws-r41-verifier-subject-${GITHUB_RUN_ID}"
          rm -rf "$subject_dir"
          git worktree prune
          git worktree add --detach "$subject_dir" "$SUBJECT_HEAD"
          cleanup() { git worktree remove --force "$subject_dir" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          (
            set -Eeuo pipefail
            cd "$subject_dir"
            test "$(git rev-parse HEAD)" = "$SUBJECT_HEAD"
            test "$(git rev-parse 'HEAD^{tree}')" = "$SUBJECT_TREE"
            export GODOT_BIN="$GODOT_BIN" BREAKPOINT_RUNTIME_DISABLED=1
            "$GODOT_BIN" --headless --path . --script res://tests/research/fabric1/fabric_r4_1_numeric_diagnostics_acceptance.gd
            bash RUN_FABRIC_HOLDOUT_R4_G2_TESTS.sh
            bash RUN_FABRIC_COMPLEX2_PERF_TESTS.sh
            bash RUN_FABRIC_COMPLEX2_CLOSE_TESTS.sh
            git diff --check
            test -z "$(git status --porcelain=v1 --untracked-files=no)"
          ) 2>&1 | tee "$out"
          grep -F 'FABRIC-R4.1-NUMERIC-DIAGNOSTICS: PASS' "$out"
          grep -F 'FABRIC-HOLDOUT-R4-G2: PASS' "$out"
          grep -F 'COMPLEX2PERF_MATRIX_HASH=698486abd097e6ee12731b0afb1c6e28ed24bf72b52d8d940c9f5b7336498607' "$out"
          grep -F 'COMPLEX2_CLOSE_HASH=f429d2743dab5f31fed87901186b03868039b13c2e087a86f3473f84e5b60855' "$out"
      - name: Capture verifier evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse "origin/$SUBJECT_BRANCH")" = "$SUBJECT_HEAD"
          sha256sum r41-verifier-identity.txt r41-verifier-godot.txt r41-verifier-import.log r41-independent.log r41-subject-replay.log > r41-verifier-evidence.sha256
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          echo 'FABRIC_R4_1_FRESH_INDEPENDENT_VERIFIER=PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: fabric-r4-1-verifier-${{ github.sha }}
          path: |
            r41-verifier-identity.txt
            r41-verifier-godot.txt
            r41-verifier-import.log
            r41-independent.log
            r41-subject-replay.log
            r41-verifier-evidence.sha256
          if-no-files-found: error
          retention-days: 90
