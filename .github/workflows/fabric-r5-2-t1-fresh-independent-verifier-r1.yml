name: FABRIC R5.2 T1 Fresh Independent Verifier R1

on:
  push:
    branches: [verify/fabric-r5-2-t1-fresh-independent-verifier-r1]

permissions:
  contents: read
  actions: read

concurrency:
  group: fabric-r5-2-t1-fresh-independent-verifier-r1
  cancel-in-progress: false

env:
  SUBJECT_HEAD: 9b2bf8db9e7f8e8d2629e76e724ad1b9270ca9cb
  SUBJECT_TREE: 4f7e7e6fcd57de1ebe0d323cf86bf3e355d14b1d
  EXPECTED_DETERMINISTIC_HASH: 3236785de6f45e34c7f380edb5cad6286bf650c7d963c907708afe936b97de0f

jobs:
  sample:
    name: verifier-sample-${{ matrix.sample }}
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact T1 subject and verifier-only scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse "$SUBJECT_HEAD^{tree}")" = "$SUBJECT_TREE"
          test "$(git merge-base HEAD "$SUBJECT_HEAD")" = "$SUBJECT_HEAD"
          expected="$(printf '%s\n'             '.github/workflows/fabric-r5-2-t1-fresh-independent-verifier-r1.yml'             'docs/research/FABRIC_R5_2_T1_FRESH_INDEPENDENT_VERIFIER_R1_RU.md' | sort)"
          actual="$(git diff --name-only "$SUBJECT_HEAD"...HEAD | sort)"
          test "$actual" = "$expected"
          git diff --check "$SUBJECT_HEAD"...HEAD
          git diff --exit-code "$SUBJECT_HEAD"...HEAD --             scripts/research/fabric_bake0/behavior_capsule_contract_v1.gd             scripts/research/fabric_bake0/linear_conductance_component_graph_v1.gd             scripts/research/fabric_bake0/linear_conductance_graph_compiler_v1.gd             scripts/research/fabric_bake0/r5_t1_boundary_network_capsule_compiler_v1.gd             scripts/research/fabric_bake0/r5_t1_boundary_network_capsule_runtime_v1.gd             scripts/research/fabric_bake0/r5_exact_linear_capsule_session_v1.gd             tests/research/fabric_bake0/fabric_r5_2_t1_boundary_network_fixture.gd             tests/research/fabric_bake0/fabric_r5_2_t1_boundary_network_acceptance.gd             scripts/research/fabric_bake0/collect_r5_2_t1_evidence.py
          echo '*.gd.uid' >> .git/info/exclude

      - name: Verify durable exact evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          x=json.load(open('validation/fabric-r5-2-t1-boundary-network-exact-evidence.v1.json'))
          assert x['status']=='EXACT_T1_CANONICAL_BOUND_PASS'
          assert x['subject_head']=='dc8f1efb038c6e55781f848b4737e401f1f6bcb1'
          assert x['canonical_owner']=='Construction/Matter'
          assert x['production_checkpoint'] is False
          assert x['hashes']['deterministic_hash']=='3236785de6f45e34c7f380edb5cad6286bf650c7d963c907708afe936b97de0f'
          q=x['qualitative_compression']
          assert q['source_components']==543
          assert q['internal_nodes']==128
          assert q['boundary_ports']==4
          assert q['full_equations']==132
          assert q['executable_equations']==4
          assert q['steady_state_source_component_traversals_per_execute']==0
          assert x['canonical_graph_binding']['second_truth_allowed'] is False
          assert x['fail_closed']['canonical_graph_frontier_mismatch']=='REJECTED'
          assert x['invariants']['device_specific_kernel'] is False
          assert x['invariants']['threshold_relaxation'] is False
          print('FABRIC_R5_2_T1_DURABLE_EVIDENCE_BINDING=PASS')
          PY

      - name: Download canonical Linux double
        uses: actions/download-artifact@v4
        with:
          name: p7-repair-engine-34117353691
          run-id: 34117353691
          repository: rootfabric/distributed-world-simulator
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/r5-2-t1-verifier-engine

      - name: Verify canonical Linux double
        shell: bash
        run: |
          set -Eeuo pipefail
          bin="$RUNNER_TEMP/r5-2-t1-verifier-engine/godot"
          chmod u+x "$bin"
          version="$("$bin" --version | head -n1 | tr -d '\r')"
          sha="$(sha256sum "$bin" | awk '{print $1}')"
          test "$version" = '4.7.1.stable.double.custom_build.a13da4feb'
          test "$sha" = 'bfa7ce632d8d4b1dcc96f64f5405ee52b57c4e25d15c3e0478acc26e08d517d7'
          echo "GODOT_BIN=$bin" >> "$GITHUB_ENV"
          mkdir -p artifacts/fabric-r5-2-t1-verifier

      - name: Fresh import
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf .godot
          "$GODOT_BIN" --headless --editor --path .             --log-file "artifacts/fabric-r5-2-t1-verifier/sample-${{ matrix.sample }}.import.log" --import
          ! grep -Eiq 'SCRIPT ERROR|Parse Error|Invalid call|Invalid access|ERROR:'             "artifacts/fabric-r5-2-t1-verifier/sample-${{ matrix.sample }}.import.log"

      - name: Run fresh verifier T1 sample
        shell: bash
        run: |
          set -Eeuo pipefail
          i='${{ matrix.sample }}'
          /usr/bin/time -v -o "artifacts/fabric-r5-2-t1-verifier/sample-$i.time.txt"             bash RUN_FABRIC_R5_2_T1_TESTS.sh 2>&1 | tee "artifacts/fabric-r5-2-t1-verifier/sample-$i.log"
          grep -F 'FABRIC R5.2 T1 BOUNDARY NETWORK CAPSULE: PASS' "artifacts/fabric-r5-2-t1-verifier/sample-$i.log"
          grep -F "FABRIC_R5_2_T1_DETERMINISTIC_HASH=$EXPECTED_DETERMINISTIC_HASH"             "artifacts/fabric-r5-2-t1-verifier/sample-$i.log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fabric-r5-2-t1-verifier-sample-${{ matrix.sample }}-${{ github.sha }}
          path: artifacts/fabric-r5-2-t1-verifier/sample-${{ matrix.sample }}.*
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: aggregate-verifier-evidence
    needs: sample
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: fabric-r5-2-t1-verifier-sample-*-${{ github.sha }}
          path: artifacts/fabric-r5-2-t1-verifier
          merge-multiple: true

      - name: Aggregate verifier evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/research/fabric_bake0/collect_r5_2_t1_evidence.py             --root artifacts/fabric-r5-2-t1-verifier             --out artifacts/fabric-r5-2-t1-verifier/evidence.json             | tee artifacts/fabric-r5-2-t1-verifier/collector.log
          grep -F "FABRIC_R5_2_T1_DETERMINISTIC_HASH=$EXPECTED_DETERMINISTIC_HASH"             artifacts/fabric-r5-2-t1-verifier/collector.log
          grep -F 'FABRIC_R5_2_T1_EVIDENCE=PASS' artifacts/fabric-r5-2-t1-verifier/collector.log

      - name: Seal verifier evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          printf 'SUBJECT_HEAD=%s\nSUBJECT_TREE=%s\nVERIFIER_HEAD=%s\nVERIFIER_TREE=%s\n'             "$SUBJECT_HEAD" "$SUBJECT_TREE" "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')"             > artifacts/fabric-r5-2-t1-verifier/identity.txt
          sha256sum artifacts/fabric-r5-2-t1-verifier/sample-*             artifacts/fabric-r5-2-t1-verifier/evidence.json             artifacts/fabric-r5-2-t1-verifier/collector.log             > artifacts/fabric-r5-2-t1-verifier/evidence.sha256
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          echo 'FABRIC_R5_2_T1_FRESH_INDEPENDENT_VERIFIER_R1=PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: fabric-r5-2-t1-verifier-r1-${{ github.sha }}
          path: artifacts/fabric-r5-2-t1-verifier/**
          if-no-files-found: error
          retention-days: 90
