name: FABRIC R5.2 T10 Fresh Independent Verifier R1

on:
  push:
    branches: [verify/fabric-r5-2-t10-fresh-independent-verifier-r1]

permissions:
  contents: read

env:
  SUBJECT_HEAD: 5ac4fe26f9825c920481c5ac86c1dbd430027fb2
  PRODUCT_SUBJECT: 8e0916384e302d1ec1e8dbcb60a32db2c7977731
  EXPECTED_DETERMINISTIC_HASH: 5905b9102685455853595e246be60fe89c835f8c53814f47a04f3aad220332fd

jobs:
  verifier-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prove frozen product identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git merge-base HEAD "$SUBJECT_HEAD")" = "$SUBJECT_HEAD"
          changed="$(git diff --name-only "$SUBJECT_HEAD"...HEAD)"
          test "$changed" = '.github/workflows/fabric-r5-2-t10-independent-verifier-r1.yml'
          git diff --exit-code "$SUBJECT_HEAD"...HEAD -- \
            scripts/research/fabric_bake0 \
            tests/research/fabric_bake0 \
            RUN_FABRIC_R5_2_T10_TESTS.sh \
            docs/research/FABRIC_R5_2_T10_LASER_CANNON_RU.md \
            validation/fabric-r5-2-t10-laser-cannon-exact-evidence.v1.json

      - name: Independently inspect durable evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          d=json.load(open('validation/fabric-r5-2-t10-laser-cannon-exact-evidence.v1.json',encoding='utf-8'))
          assert d['status']=='REPAIR_R2_LOCAL_EXACT_3X_PASS'
          assert d['subject_head']=='8e0916384e302d1ec1e8dbcb60a32db2c7977731'
          assert d['hashes']['deterministic_hash']=='5905b9102685455853595e246be60fe89c835f8c53814f47a04f3aad220332fd'
          assert d['hierarchical_compression']['leaf_source_components']==642
          assert d['hierarchical_compression']['runtime_source_component_traversals_per_execute']==0
          assert d['repair_r2']['descriptor_expansion_tamper']=='LASER_CANNON_DESCRIPTOR_EXPANSION_RELATION_MISMATCH'
          assert d['repair_r2']['child_capsule_descriptor_mismatch']=='LASER_CANNON_EMITTER_DESCRIPTOR_BINDING_MISMATCH'
          assert d['exact_composition']['snapshot_replay_error']==0.0
          print('T10_DURABLE_EVIDENCE=PASS')
          PY

      - name: Build exact verifier source bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p verifier-source
          git branch -f t10-verifier-exact HEAD
          git bundle create verifier-source/t10-verifier-exact.bundle refs/heads/t10-verifier-exact
          sha256sum verifier-source/t10-verifier-exact.bundle > verifier-source/t10-verifier-exact.bundle.sha256
          printf 'SUBJECT_HEAD=%s\nPRODUCT_SUBJECT=%s\nVERIFIER_HEAD=%s\nVERIFIER_TREE=%s\nEXPECTED_DETERMINISTIC_HASH=%s\n' \
            "$SUBJECT_HEAD" "$PRODUCT_SUBJECT" "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')" "$EXPECTED_DETERMINISTIC_HASH" \
            > verifier-source/identity.txt
          git bundle verify verifier-source/t10-verifier-exact.bundle

      - uses: actions/upload-artifact@v4
        with:
          name: fabric-r5-2-t10-independent-verifier-source-${{ github.sha }}
          path: verifier-source/**
          if-no-files-found: error
          retention-days: 90
