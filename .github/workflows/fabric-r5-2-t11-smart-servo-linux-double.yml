name: FABRIC R5.2 T11 Smart Servo

on:
  push:
    branches: [research/fabric-r5-2-t11-smart-servo-r1]
  pull_request:
    paths:
      - 'scripts/research/fabric_bake0/smart_servo_*'
      - 'scripts/research/fabric_bake0/r5_t11_smart_servo_*'
      - 'tests/research/fabric_bake0/fabric_r5_2_t11_smart_servo_*'
      - 'scripts/research/fabric_bake0/collect_r5_2_t11_evidence.py'
      - 'validation/fabric-r5-2-t11-*'
      - 'RUN_FABRIC_R5_2_T11_TESTS.sh'
      - 'docs/research/FABRIC_R5_2_T11_SMART_SERVO_RU.md'
      - '.github/workflows/fabric-r5-2-t11-smart-servo-linux-double.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: fabric-r5-2-t11-${{ github.sha }}
  cancel-in-progress: false

env:
  T10_MERGE_HEAD: 613cd890b0871959544810c5396b66d94a4288ec

jobs:
  sample:
    name: sample-${{ matrix.sample }}
    strategy:
      fail-fast: false
      matrix:
        sample: [1,2,3]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind T10 merged base and T11-only scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git merge-base HEAD "$T10_MERGE_HEAD")" = "$T10_MERGE_HEAD"
          allowed='^(.github/workflows/fabric-r5-2-t11-smart-servo-linux-double.yml|RUN_FABRIC_R5_2_T11_TESTS.sh|docs/research/FABRIC_R5_2_T11_SMART_SERVO_RU.md|scripts/research/fabric_bake0/(smart_servo_[^/]+|r5_t11_smart_servo_[^/]+|collect_r5_2_t11_evidence.py)|tests/research/fabric_bake0/fabric_r5_2_t11_smart_servo_[^/]+|validation/fabric-r5-2-t11-[^/]+)$'
          bad="$(git diff --name-only "$T10_MERGE_HEAD"...HEAD | grep -Ev "$allowed" || true)"
          test -z "$bad"
          git diff --check "$T10_MERGE_HEAD"...HEAD
          echo '*.gd.uid' >> .git/info/exclude
      - name: Verify canonical Linux double
        shell: bash
        run: |
          set -Eeuo pipefail
          bin="${DWS_GODOT_DOUBLE_BIN:-$HOME/.local/opt/godot-double-4.7.1-a13da4f/godot.linuxbsd.editor.double.x86_64}"
          test -x "$bin"
          test "$("$bin" --version | head -n1 | tr -d '\r')" = '4.7.1.stable.double.custom_build.a13da4feb'
          test "$(sha256sum "$bin" | awk '{print $1}')" = 'bfa7ce632d8d4b1dcc96f64f5405ee52b57c4e25d15c3e0478acc26e08d517d7'
          echo "GODOT_BIN=$bin" >> "$GITHUB_ENV"
          mkdir -p artifacts/fabric-r5-2-t11
      - name: Fresh import
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf .godot
          "$GODOT_BIN" --headless --editor --path . --log-file "artifacts/fabric-r5-2-t11/sample-${{ matrix.sample }}.import.log" --import
          ! grep -Eiq 'SCRIPT ERROR|Parse Error|Invalid call|Invalid access|ERROR:' "artifacts/fabric-r5-2-t11/sample-${{ matrix.sample }}.import.log"
      - name: Run T11 sample
        shell: bash
        run: |
          set -Eeuo pipefail
          i='${{ matrix.sample }}'
          /usr/bin/time -v -o "artifacts/fabric-r5-2-t11/sample-$i.time.txt" bash RUN_FABRIC_R5_2_T11_TESTS.sh 2>&1 | tee "artifacts/fabric-r5-2-t11/sample-$i.log"
          grep -F 'FABRIC R5.2 T11 SMART SERVO: PASS' "artifacts/fabric-r5-2-t11/sample-$i.log"
          grep -F 'FABRIC_R5_2_T11_RESULT=' "artifacts/fabric-r5-2-t11/sample-$i.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fabric-r5-2-t11-sample-${{ matrix.sample }}-${{ github.sha }}
          path: artifacts/fabric-r5-2-t11/sample-${{ matrix.sample }}.*
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: aggregate-t11-evidence
    needs: sample
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: fabric-r5-2-t11-sample-*-${{ github.sha }}
          path: artifacts/fabric-r5-2-t11
          merge-multiple: true
      - name: Aggregate T11 evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/research/fabric_bake0/collect_r5_2_t11_evidence.py --root artifacts/fabric-r5-2-t11 --out artifacts/fabric-r5-2-t11/evidence.json | tee artifacts/fabric-r5-2-t11/collector.log
          grep -F 'FABRIC_R5_2_T11_EVIDENCE=PASS' artifacts/fabric-r5-2-t11/collector.log
      - uses: actions/upload-artifact@v4
        with:
          name: fabric-r5-2-t11-aggregate-${{ github.sha }}
          path: artifacts/fabric-r5-2-t11/**
          if-no-files-found: error
          retention-days: 90
