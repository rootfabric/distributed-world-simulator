name: FABRIC R5.2 T13 Fresh Independent Verifier Carrier
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: fabric-t13-verifier-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SUBJECT_HEAD: 4cae54d17838f12dd619289eed114332813ea094
  SUBJECT_TREE: 9b8aaa64f2114f1af99f0870004bf555aefecb16
  VERIFIER_HEAD: 9c00f4d147429d36357b0f4aed22a26c15f367f3
  EXPECTED_HASH: c43d4a4c568d38d3ff16a8f118927ba6c76aeefcb17a200cf7f1325a52ac62bf
  EXPECTED_MODEL_CHECKSUM: 98e2148b1ca1ab08c035976d65f51d0187016c6269cf330f2099f985bf404a39
  EXPECTED_MODEL_HASH: 484f0c0901b712119716983c41ecd33080d6bebe005f602abd8009a56e48fd16
  EXPECTED_ISOLATION_HASH: 53c996b85419a9cc4999f804375dbde3912d91a5c06c6e7974f46030d99131dc

jobs:
  verifier-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9c00f4d147429d36357b0f4aed22a26c15f367f3
          fetch-depth: 0
          persist-credentials: false

      - name: Prove verifier-only diff and frozen product
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$VERIFIER_HEAD"
          test "$(git rev-parse "$SUBJECT_HEAD^{tree}")" = "$SUBJECT_TREE"
          test "$(git merge-base HEAD "$SUBJECT_HEAD")" = "$SUBJECT_HEAD"
          changed="$(git diff --name-only "$SUBJECT_HEAD"...HEAD)"
          test "$changed" = '.github/workflows/fabric-r5-2-t13-independent-verifier-r1.yml'
          git diff --exit-code "$SUBJECT_HEAD"...HEAD --             scripts/research/fabric_bake0             tests/research/fabric_bake0             RUN_FABRIC_R5_2_T13_TESTS.sh             docs/research/FABRIC_R5_2_T13_SHARED_INSTANCES_RU.md
          git diff --check "$SUBJECT_HEAD" HEAD

      - name: Independent source inspection
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          runtime = Path('scripts/research/fabric_bake0/r5_t13_shared_instances_runtime_v1.gd').read_text()
          acceptance = Path('tests/research/fabric_bake0/fabric_r5_2_t13_shared_instances_acceptance.gd').read_text()
          assert 'res://tests/' not in runtime
          assert '_compiler_v1.gd' not in runtime
          assert runtime.count('runtime.prepare(') == 1
          assert 'compiled_bundle = bundle.duplicate(true)' in runtime
          assert 'context.update(var_to_bytes(bundle))' in runtime
          assert 'U.canonical_hash(compiled_bundle)' not in runtime
          assert acceptance.count('F.make_ship()') == 1
          assert 'U.canonical_hash(bundle)' not in acceptance
          assert acceptance.count('exact_binary_hash(bundle)') >= 4
          assert 'const DAMAGE_INDEX := 41' in acceptance
          assert 'healthy_equivalent == 99' in acceptance
          print('T13_VERIFIER_SOURCE_INSPECTION=PASS')
          PY
          python3 -m unittest discover -s tests/research/fabric_bake0 -p test_t13_evidence.py -v

  exact-windows:
    needs: verifier-source
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    env:
      CONFIGURED_GODOT_BIN: C:\Godot\godot\bin\godot.windows.editor.double.x86_64.console.exe
      BREAKPOINT_RUNTIME_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9c00f4d147429d36357b0f4aed22a26c15f367f3
          fetch-depth: 0
          persist-credentials: false

      - name: Verify verifier/product identity and canonical Godot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:VERIFIER_HEAD) { throw "VERIFIER_HEAD_MISMATCH:$actual" }
          $changed = @(git diff --name-only "$env:SUBJECT_HEAD...HEAD")
          if ($changed.Count -ne 1 -or $changed[0] -ne '.github/workflows/fabric-r5-2-t13-independent-verifier-r1.yml') {
            throw "PRODUCT_DIFF_NOT_ZERO:$($changed -join ',')"
          }
          $subjectTree = (git rev-parse "$env:SUBJECT_HEAD^{tree}").Trim()
          if ($subjectTree -ne $env:SUBJECT_TREE) { throw "SUBJECT_TREE_MISMATCH:$subjectTree" }
          $godot = $env:CONFIGURED_GODOT_BIN
          if (-not (Test-Path -LiteralPath $godot)) { throw "EXACT_GODOT_NOT_FOUND:$godot" }
          $version = (& $godot --version | Select-Object -First 1).Trim()
          if ($version -ne '4.7.1.stable.double.custom_build.a13da4feb') { throw "GODOT_IDENTITY_MISMATCH:$version" }
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $godot).Hash.ToLowerInvariant()
          $expected = '3633c3e609c8ce2f9bae334a9c7e75c7f974de3af0415ab4a8050a625a15a7a5'
          if ($sha -ne $expected) { throw "GODOT_SHA_MISMATCH:$sha" }
          Write-Host "SUBJECT_HEAD=$env:SUBJECT_HEAD"
          Write-Host "SUBJECT_TREE=$subjectTree"
          Write-Host "VERIFIER_HEAD=$actual"
          Write-Host "VERIFIER_TREE=$((git rev-parse 'HEAD^{tree}').Trim())"
          Write-Host "GODOT=$version"
          Write-Host "GODOT_SHA256=$sha"
          "GODOT_BIN=$godot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Fresh import
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path .godot) { Remove-Item -Recurse -Force .godot }
          $out = 'artifacts\fabric-r5-2-t13-verifier-r1'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $log = Join-Path $out 'import.log'
          & $env:GODOT_BIN --headless --editor --path . --import 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "IMPORT_FAILED:$LASTEXITCODE" }
          if (Select-String -Path $log -Pattern 'SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Invalid access|ERROR:' -Quiet) {
            throw 'IMPORT_FATAL_MARKER'
          }

      - name: Run three fresh T13 processes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'artifacts\fabric-r5-2-t13-verifier-r1'
          $script = 'res://tests/research/fabric_bake0/fabric_r5_2_t13_shared_instances_acceptance.gd'
          foreach ($i in 1..3) {
            $log = Join-Path $out "sample-$i.log"
            & $env:GODOT_BIN --headless --path . --script $script 2>&1 | Tee-Object -FilePath $log
            if ($LASTEXITCODE -ne 0) { throw "T13_SAMPLE_FAILED:$i:$LASTEXITCODE" }
          }

      - name: Independent verifier oracle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import hashlib, json, pathlib, re, sys
          root = pathlib.Path(r"artifacts/fabric-r5-2-t13-verifier-r1")
          prefix = "FABRIC_R5_2_T13_RESULT="
          pass_marker = "FABRIC R5.2 T13 SHARED INSTANCES: PASS (1377 assertions)"
          fatal = re.compile(r"SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Invalid access|ERROR:")
          rows, parsed = [], []
          for i in (1,2,3):
              text = (root / f"sample-{i}.log").read_text(encoding="utf-8", errors="strict")
              assert pass_marker in text, f"sample {i}: PASS marker missing"
              assert not fatal.search(text), f"sample {i}: fatal engine marker"
              found = [ln[len(prefix):] for ln in text.splitlines() if ln.startswith(prefix)]
              assert len(found) == 1, f"sample {i}: result marker count"
              rows.append(found[0])
              parsed.append(json.loads(found[0]))
          assert rows[0] == rows[1] == rows[2], "raw result payloads differ"
          d = parsed[0]
          expected = {
              "schema":"fabric.t13.result.v1",
              "failures":[],
              "checks":1377,
              "instance_gates":[1,10,100],
              "gate_counts":{"1":1,"10":10,"100":100},
              "bindings":100,
              "unique_binding_checksums":100,
              "source_components_per_model":4275,
              "state_scalars_per_instance":31,
              "prepare_count":1,
              "recompile_events":0,
              "runtime_steps":311,
              "leaf_traversals":0,
              "evaluations":2605,
              "boundary_calls":49495,
              "compiled_group_visits":31260,
              "damaged_instance":"instance-042",
              "damage_revision":1,
              "healthy_equivalent_after_damage":99,
              "damaged_diverged":True,
              "model_hash_unchanged":True,
              "caller_states_unchanged":True,
              "shared_compiled_model_checksum":"98e2148b1ca1ab08c035976d65f51d0187016c6269cf330f2099f985bf404a39",
              "shared_compiled_model_hash":"484f0c0901b712119716983c41ecd33080d6bebe005f602abd8009a56e48fd16",
              "isolation_hash":"53c996b85419a9cc4999f804375dbde3912d91a5c06c6e7974f46030d99131dc",
          }
          for k,v in expected.items():
              assert d.get(k) == v, f"{k}: {d.get(k)!r} != {v!r}"
          assert d["compiled_group_visits"] == 12 * d["evaluations"]
          assert d["boundary_calls"] == 19 * d["evaluations"]
          digest = hashlib.sha256(json.dumps(d, sort_keys=True, separators=(",",":"), allow_nan=False).encode()).hexdigest()
          assert digest == "c43d4a4c568d38d3ff16a8f118927ba6c76aeefcb17a200cf7f1325a52ac62bf", digest
          (root / "independent-verifier.json").write_text(json.dumps({
              "schema":"fabric.r5_2.t13.independent_verifier.r1",
              "verdict":"PASS",
              "deterministic_hash":digest,
              "result":d,
          }, indent=2, sort_keys=True)+"\n", encoding="utf-8")
          print("T13_FRESH_INDEPENDENT_VERIFIER=PASS")
          print("T13_VERIFIER_DETERMINISTIC_HASH="+digest)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "INDEPENDENT_VERIFIER_ORACLE_FAILED:$LASTEXITCODE" }

      - name: Run unchanged T12 regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'artifacts\fabric-r5-2-t13-verifier-r1'
          $log = Join-Path $out 't12-regression.log'
          & $env:GODOT_BIN --headless --path . --script res://tests/research/fabric_bake0/fabric_r5_2_t12_ship_acceptance.gd 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "T12_REGRESSION_FAILED:$LASTEXITCODE" }
          if (-not (Select-String -Path $log -Pattern 'FABRIC R5.2 T12 SHIP MATRYOSHKA: PASS (8386 assertions)' -SimpleMatch -Quiet)) {
            throw 'T12_REGRESSION_MARKER_MISSING'
          }
          if (Select-String -Path $log -Pattern 'SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Invalid access|ERROR:' -Quiet) {
            throw 'T12_REGRESSION_FATAL_MARKER'
          }
          $dirty = git status --porcelain=v1 --untracked-files=no
          if ($dirty) { throw "TRACKED_TREE_DIRTY:$dirty" }

      - name: Record verifier identity
        shell: pwsh
        run: |
          $out = 'artifacts\fabric-r5-2-t13-verifier-r1'
          @(
            "SUBJECT_HEAD=$env:SUBJECT_HEAD"
            "SUBJECT_TREE=$env:SUBJECT_TREE"
            "VERIFIER_HEAD=$env:VERIFIER_HEAD"
            "VERIFIER_TREE=$((git rev-parse 'HEAD^{tree}').Trim())"
            "PRODUCT_DIFF=0"
            "EXPECTED_DETERMINISTIC_HASH=$env:EXPECTED_HASH"
          ) | Set-Content -Path (Join-Path $out 'identity.txt')

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t13-fresh-independent-verifier-r1-${{ github.sha }}
          path: artifacts/fabric-r5-2-t13-verifier-r1/**
          if-no-files-found: error
          retention-days: 90
