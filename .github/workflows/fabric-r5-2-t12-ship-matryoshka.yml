name: FABRIC R5.2 T13 Exact Control Carrier
on:
  push:
    branches: [control/fabric-r5-2-t13-exact-r1]
permissions:
  contents: read
concurrency:
  group: fabric-t13-exact-control-${{ github.ref }}
  cancel-in-progress: true
jobs:
  control-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify product-equivalent control carrier
        shell: bash
        run: |
          set -Eeuo pipefail
          product=e54622fe7286fed0a77c1f1fdb9c59a82cf94a14
          test "$(git merge-base HEAD "$product")" = "$product"
          changed="$(git diff --name-only "$product" HEAD)"
          test "$changed" = '.github/workflows/fabric-r5-2-t12-ship-matryoshka.yml'
          git diff --check "$product" HEAD
          bash -n RUN_FABRIC_R5_2_T13_TESTS.sh
          python3 -m unittest discover -s tests/research/fabric_bake0 -p test_t13_evidence.py -v
          printf 'PRODUCT_HEAD=%s\nCONTROL_HEAD=%s\nCONTROL_DIFF=%s\n' "$product" "$(git rev-parse HEAD)" "$changed"
  exact-runtime:
    needs: control-scope
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact product equivalence
        shell: bash
        run: |
          set -Eeuo pipefail
          product=e54622fe7286fed0a77c1f1fdb9c59a82cf94a14
          test "$(git diff --name-only "$product" HEAD)" = '.github/workflows/fabric-r5-2-t12-ship-matryoshka.yml'
          printf 'PRODUCT_HEAD=%s\nCONTROL_HEAD=%s\nCONTROL_TREE=%s\n' "$product" "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')"
      - name: Canonical double T13 exact gate
        shell: bash
        run: |
          set -Eeuo pipefail
          export GODOT_BIN="${DWS_GODOT_DOUBLE_BIN:-$HOME/.local/opt/godot-double-4.7.1-a13da4f/godot.linuxbsd.editor.double.x86_64}"
          bash RUN_FABRIC_R5_2_T13_TESTS.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t13-exact-control-${{ github.sha }}
          path: artifacts/fabric-r5-2-t13/**
          retention-days: 90
