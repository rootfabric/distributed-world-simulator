name: FABRIC R5.2 T14 Observation Refinement
on:
  push:
    branches: [research/fabric-r5-2-t14-observation-refinement-r1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fabric-t14-${{{ github.ref }}-${{{ github.event_name }}
  cancel-in-progress: true

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: T14 additive source and evidence contract
        shell: bash
        run: |
          set -Eeuo pipefail
          base=bb191ec4f610f1f879e48fa104ca3155464bbdc2
          test "$(git merge-base HEAD "$base")" = "$base"
          allowed='^(.github/workflows/fabric-r5-2-t14-observation-refinement.yml|RUN_FABRIC_R5_2_T14_TESTS.sh|docs/research/FABRIC_R5_2_T14_OBSERVATION_REFINEMENT_RU.md|scripts/research/fabric_bake0/(r5_t14_observation_refinement_runtime_v1.gd|collect_r5_2_t14_evidence.py)|tests/research/fabric_bake0/(fabric_r5_2_t14_observation_refinement_acceptance.gd|test_t14_evidence.py))$'
          test -z "$(git diff --name-only "$base" HEAD | grep -Ev "$allowed" || true)"
          git diff --check "$base" HEAD
          bash -n RUN_FABRIC_R5_2_T14_TESTS.sh
          python3 -m unittest discover -s tests/research/fabric_bake0 -p test_t14_evidence.py -v
          mkdir -p source
          git archive --format=tar HEAD | gzip -n > source/t14-source.tar.gz
          printf 'HEAD=%s\nTREE=%s\nBASE_T13_5=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')" "$base" > source/identity.txt
          sha256sum source/t14-source.tar.gz > source/source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: t14-source-${{{ github.sha }}
          path: source/**
          retention-days: 30
