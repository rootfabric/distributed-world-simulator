name: FABRIC R5.2 T16 Windows Exact Carrier
on:
  push:
    branches: [control/fabric-r5-2-t16-windows-exact-r2]
permissions:
  contents: read
concurrency:
  group: fabric-t16-windows-exact-r2
  cancel-in-progress: true
env:
  SUBJECT_HEAD: 37c7a606c70071e896797c73e4082745d78cfb82
  SUBJECT_TREE: 919c69a68c4b169356a068272a7ffbab9a073cd2
  EXPECTED_HASH: cf5f66dac6a89790c7fef20df582480d1044401f37dfb5d61befb9028a678fff
jobs:
  control-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prove control-only carrier and exact subject
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git merge-base HEAD "$SUBJECT_HEAD")" = "$SUBJECT_HEAD"
          test "$(git rev-parse "$SUBJECT_HEAD^{tree}")" = "$SUBJECT_TREE"
          test "$(git diff --name-only "$SUBJECT_HEAD" HEAD)" = '.github/workflows/fabric-r5-2-t16-windows-exact-carrier.yml'
          git diff --check "$SUBJECT_HEAD" HEAD
          bash -n RUN_FABRIC_R5_2_T16_TESTS.sh
          python3 -m unittest discover -s tests/research/fabric_bake0 -p test_t16_evidence.py -v
  exact-windows:
    needs: control-scope
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 40
    steps:
      - name: Do not interfere with live Godot sessions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -lt 7) { throw 'HOST_REQUIRES_PWSH7' }
          $foreign = @(Get-CimInstance Win32_Process | Where-Object { $_.Name -like 'godot*.exe' })
          if ($foreign.Count -gt 0) { throw ('HOST_BUSY_GODOT:' + (($foreign | Select-Object -ExpandProperty ProcessId) -join ',')) }
          $free = [double](Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory / 1MB
          Write-Host "HOST=$env:COMPUTERNAME FREE_RAM_GB=$free"
          if ($free -lt 8) { throw 'HOST_LOW_MEMORY' }
      - uses: actions/checkout@v4
        with:
          ref: 37c7a606c70071e896797c73e4082745d78cfb82
          fetch-depth: 0
          persist-credentials: false
          path: t16-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Run frozen product fresh import, 3 T16 processes and unchanged regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $checkout = Join-Path $env:GITHUB_WORKSPACE 't16-${{ github.run_id }}-${{ github.run_attempt }}'
          $out = Join-Path $env:GITHUB_WORKSPACE 'artifacts/t16-${{ github.run_id }}-${{ github.run_attempt }}'
          $runner = Join-Path $checkout 'RUN_FABRIC_R5_2_T16_TESTS.ps1'
          & $runner -GodotBin 'C:\Godot\godot\bin\godot.windows.editor.double.x86_64.console.exe' -ExpectedHead $env:SUBJECT_HEAD -ExpectedTree $env:SUBJECT_TREE -ExpectedHash $env:EXPECTED_HASH -EvidenceDir $out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t16-windows-exact-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/t16-${{ github.run_id }}-${{ github.run_attempt }}/**
          if-no-files-found: error
          retention-days: 90
