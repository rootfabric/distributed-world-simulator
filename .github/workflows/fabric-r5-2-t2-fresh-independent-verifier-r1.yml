name: FABRIC R5.2 T2 Fresh Independent Verifier R1

on:
  push:
    branches: [verify/fabric-r5-2-t2-fresh-independent-verifier-r1]

permissions:
  contents: read
  actions: read

concurrency:
  group: fabric-r5-2-t2-fresh-independent-verifier-r1
  cancel-in-progress: false

env:
  SUBJECT_HEAD: e12ace397517110b2aaeb7deeb9f865183db600f
  SUBJECT_TREE: 3590f5fc67a12011e1a25f4f002469e1c155e926
  EXPECTED_DETERMINISTIC_HASH: a7bb61c19ddda61527155d3ed405b22b6260cce807a3e958558a13b1a50b8d05

jobs:
  sample:
    name: verifier-sample-${{ matrix.sample }}
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact T2 subject and verifier-only scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse "$SUBJECT_HEAD^{tree}")" = "$SUBJECT_TREE"
          test "$(git merge-base HEAD "$SUBJECT_HEAD")" = "$SUBJECT_HEAD"
          expected="$(printf '%s\n'             '.github/workflows/fabric-r5-2-t2-fresh-independent-verifier-r1.yml'             'docs/research/FABRIC_R5_2_T2_FRESH_INDEPENDENT_VERIFIER_R1_RU.md' | sort)"
          actual="$(git diff --name-only "$SUBJECT_HEAD"...HEAD | sort)"
          test "$actual" = "$expected"
          git diff --check "$SUBJECT_HEAD"...HEAD
          git diff --exit-code "$SUBJECT_HEAD"...HEAD --             scripts/research/fabric_bake0/behavior_capsule_contract_v2.gd             scripts/research/fabric_bake0/logic_interface_contract_v1.gd             scripts/research/fabric_bake0/logic_component_graph_v1.gd             scripts/research/fabric_bake0/logic_graph_interpreter_v1.gd             scripts/research/fabric_bake0/logic_lookup_descriptor_v1.gd             scripts/research/fabric_bake0/logic_execution_artifact_v1.gd             scripts/research/fabric_bake0/r5_t2_logic_lookup_compiler_v1.gd             scripts/research/fabric_bake0/r5_t2_logic_lookup_runtime_v1.gd             tests/research/fabric_bake0/fabric_r5_2_t2_logic_fixture.gd             tests/research/fabric_bake0/fabric_r5_2_t2_logic_acceptance.gd             scripts/research/fabric_bake0/collect_r5_2_t2_evidence.py
          echo '*.gd.uid' >> .git/info/exclude

      - name: Verify durable T2 evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          x=json.load(open('validation/fabric-r5-2-t2-logic-exact-evidence.v1.json'))
          assert x['status']=='EXACT_T2_PASS'
          assert x['subject_head']=='ac6fd2102a460baf617764d19bfa7af639a1bfbb'
          assert x['hashes']['deterministic_hash']=='a7bb61c19ddda61527155d3ed405b22b6260cce807a3e958558a13b1a50b8d05'
          assert x['adder']['exhaustive_cases']==131072
          assert x['adder']['runtime_source_traversals_per_execute']==0
          assert x['counter']['exhaustive_cases']==1024
          assert x['counter']['sequence_ticks']==2048
          assert x['counter']['runtime_owns_persistent_state'] is False
          assert x['fail_closed']['combinational_cycle']=='LOGIC_COMBINATIONAL_CYCLE'
          assert x['fail_closed']['address_state_space_over_17_bits']=='LOGIC_STATE_SPACE_TOO_LARGE'
          assert x['invariants']['device_specific_kernel'] is False
          assert x['invariants']['behavior_capsule_v1_t1_modified'] is False
          assert x['invariants']['threshold_relaxation'] is False
          print('FABRIC_R5_2_T2_DURABLE_EVIDENCE_BINDING=PASS')
          PY

      - name: Download canonical Linux double
        uses: actions/download-artifact@v4
        with:
          name: p7-repair-engine-34117353691
          run-id: 34117353691
          repository: rootfabric/distributed-world-simulator
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/r5-2-t2-verifier-engine

      - name: Verify canonical Linux double
        shell: bash
        run: |
          set -Eeuo pipefail
          bin="$RUNNER_TEMP/r5-2-t2-verifier-engine/godot"
          chmod u+x "$bin"
          version="$("$bin" --version | head -n1 | tr -d '\r')"
          sha="$(sha256sum "$bin" | awk '{print $1}')"
          test "$version" = '4.7.1.stable.double.custom_build.a13da4feb'
          test "$sha" = 'bfa7ce632d8d4b1dcc96f64f5405ee52b57c4e25d15c3e0478acc26e08d517d7'
          echo "GODOT_BIN=$bin" >> "$GITHUB_ENV"
          mkdir -p artifacts/fabric-r5-2-t2-verifier

      - name: Fresh import
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf .godot
          "$GODOT_BIN" --headless --editor --path .             --log-file "artifacts/fabric-r5-2-t2-verifier/sample-${{ matrix.sample }}.import.log" --import
          ! grep -Eiq 'SCRIPT ERROR|Parse Error|Invalid call|Invalid access|ERROR:'             "artifacts/fabric-r5-2-t2-verifier/sample-${{ matrix.sample }}.import.log"

      - name: Run fresh verifier T2 sample
        shell: bash
        run: |
          set -Eeuo pipefail
          i='${{ matrix.sample }}'
          /usr/bin/time -v -o "artifacts/fabric-r5-2-t2-verifier/sample-$i.time.txt"             bash RUN_FABRIC_R5_2_T2_TESTS.sh 2>&1 | tee "artifacts/fabric-r5-2-t2-verifier/sample-$i.log"
          grep -F 'FABRIC R5.2 T2 LOGIC ADDER COUNTER: PASS' "artifacts/fabric-r5-2-t2-verifier/sample-$i.log"
          grep -F "FABRIC_R5_2_T2_DETERMINISTIC_HASH=$EXPECTED_DETERMINISTIC_HASH"             "artifacts/fabric-r5-2-t2-verifier/sample-$i.log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fabric-r5-2-t2-verifier-sample-${{ matrix.sample }}-${{ github.sha }}
          path: artifacts/fabric-r5-2-t2-verifier/sample-${{ matrix.sample }}.*
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: aggregate-verifier-evidence
    needs: sample
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: fabric-r5-2-t2-verifier-sample-*-${{ github.sha }}
          path: artifacts/fabric-r5-2-t2-verifier
          merge-multiple: true

      - name: Aggregate verifier evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/research/fabric_bake0/collect_r5_2_t2_evidence.py             --root artifacts/fabric-r5-2-t2-verifier             --out artifacts/fabric-r5-2-t2-verifier/evidence.json             | tee artifacts/fabric-r5-2-t2-verifier/collector.log
          grep -F "FABRIC_R5_2_T2_DETERMINISTIC_HASH=$EXPECTED_DETERMINISTIC_HASH"             artifacts/fabric-r5-2-t2-verifier/collector.log
          grep -F 'FABRIC_R5_2_T2_EVIDENCE=PASS' artifacts/fabric-r5-2-t2-verifier/collector.log

      - name: Seal verifier evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          printf 'SUBJECT_HEAD=%s\nSUBJECT_TREE=%s\nVERIFIER_HEAD=%s\nVERIFIER_TREE=%s\n'             "$SUBJECT_HEAD" "$SUBJECT_TREE" "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')"             > artifacts/fabric-r5-2-t2-verifier/identity.txt
          sha256sum artifacts/fabric-r5-2-t2-verifier/sample-*             artifacts/fabric-r5-2-t2-verifier/evidence.json             artifacts/fabric-r5-2-t2-verifier/collector.log             > artifacts/fabric-r5-2-t2-verifier/evidence.sha256
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          echo 'FABRIC_R5_2_T2_FRESH_INDEPENDENT_VERIFIER_R1=PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: fabric-r5-2-t2-verifier-r1-${{ github.sha }}
          path: artifacts/fabric-r5-2-t2-verifier/**
          if-no-files-found: error
          retention-days: 90
