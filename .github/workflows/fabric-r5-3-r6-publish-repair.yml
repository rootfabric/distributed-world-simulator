name: FABRIC R5.3 R6 Guarded Repair Publication
on:
  push:
    branches: [control/fabric-r5-3-r6-publish-repair-r1]
permissions:
  contents: write
concurrency:
  group: fabric-r5-3-r6-publish-repair-r1
  cancel-in-progress: false
env:
  TARGET_BRANCH: research/fabric-r5-3-recursive-hierarchical-execution-r1
  EXPECTED_PARENT: 305b54bf127a910a515d02544a18d9a01a7afaa8
  EXPECTED_TREE: c1253db8c0c07cd46ab95b032e34d3e8ef4eb658
  EXPECTED_HEAD: 08fa81ebd860e98e655f4f403ed136a89e2ec074
  PATCH_SHA256: 8a5e9dd3aef5994da79b502923c45ff0200ba9c2229cb730ef6942b70d00623c
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  GIT_AUTHOR_DATE: '2026-10-05T02:14:32Z'
  GIT_COMMITTER_DATE: '2026-10-05T02:14:32Z'
jobs:
  scope-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '305b54bf127a910a515d02544a18d9a01a7afaa8'
          fetch-depth: 0
      - name: Decode exact repair from immutable transport record
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PARENT"
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          import os, re, subprocess, base64, zlib, hashlib
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'],'r6-source');out.mkdir(exist_ok=True)
          text=subprocess.check_output(['git','show','9aa05882a36da4dfd4792806d4c0e486fbcbd907:.github/workflows/fabric-r5-3-r6-publish-repair.yml'],text=True)
          (out/'transport-original.yml').write_text(text)
          encoded=re.search(r'PATCH_ZLIB_B64: >-\n\s+(\S+)',text).group(1)
          # Repair two transcription errors in the carrier only. The product
          # patch, resulting tree and complete commit are independently pinned.
          encoded=encoded.replace('dJ6Jb6ebsy','dJ6ebsy').replace('MRv7Hh9','MRv7Nh9')
          (out/'transport-normalized.b64').write_text(encoded)
          data=zlib.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(data).hexdigest()==os.environ['PATCH_SHA256']
          Path(os.environ['RUNNER_TEMP'],'r6.patch').write_bytes(data)
          print('EXACT_PATCH_SHA256=PASS')
          PY
          git apply --check --index "$RUNNER_TEMP/r6.patch"
          git apply --index "$RUNNER_TEMP/r6.patch"
          test "$(git write-tree)" = "$EXPECTED_TREE"
      - name: Enforce bounded repair and source contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import subprocess
          expected={
            'docs/research/FABRIC_R5_3_RECURSIVE_HIERARCHICAL_EXECUTION_RU.md',
            'docs/research/FABRIC_R5_3_WORK_ORDER_RU.md',
            'scripts/research/fabric_bake0/collect_r5_3_evidence.py',
            'scripts/research/fabric_bake0/r5_3_recursive_rom_compiler_v1.gd',
            'scripts/research/fabric_bake0/r5_3_recursive_rom_runtime_v1.gd',
            'tests/research/fabric_bake0/fabric_r5_3_recursive_rom_acceptance.gd',
            'tests/research/fabric_bake0/test_r5_3_evidence.py',
          }
          rows=subprocess.check_output(['git','diff','--cached','--name-status'],text=True).splitlines()
          assert set(row.split('\t')[1] for row in rows)==expected
          assert all(row.startswith('M\t') for row in rows)
          rows=subprocess.check_output(['git','diff','--cached','--name-status','604192f07070d0f0e38a94445611d09d92cb7f7f'],text=True).splitlines()
          assert len(rows)==11 and all(row.startswith('A\t') for row in rows)
          PY
          git diff --cached --check
          bash -n RUN_FABRIC_R5_3_TESTS.sh
          python3 -m unittest discover -s tests/research/fabric_bake0 -p test_r5_3_evidence.py -v
      - name: Commit exact product and non-force push with drift guard
        shell: bash
        run: |
          set -Eeuo pipefail
          git -c commit.gpgsign=false commit -m 'fix(fabric): revalidate R5.3 mutable leaf runtime provenance (R6)'
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          remote=$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)
          test "$remote" = "$EXPECTED_PARENT"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
      - name: Preserve exact product source and Git recovery bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$RUNNER_TEMP/r6-source"
          git archive --format=tar "$EXPECTED_HEAD" | gzip -n > "$out/r5-3-source.tar.gz"
          git branch r53-r6-product-exact "$EXPECTED_HEAD"
          git bundle create "$out/r5-3-r6-product-exact.bundle" r53-r6-product-exact
          printf 'HEAD=%s\nTREE=%s\nBASE_T16=%s\nPARENT=%s\n' "$EXPECTED_HEAD" "$EXPECTED_TREE" 604192f07070d0f0e38a94445611d09d92cb7f7f "$EXPECTED_PARENT" > "$out/identity.txt"
          cd "$out"
          sha256sum r5-3-source.tar.gz r5-3-r6-product-exact.bundle > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r53-r6-source-08fa81eb-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r6-source/**
          if-no-files-found: error
          retention-days: 90
