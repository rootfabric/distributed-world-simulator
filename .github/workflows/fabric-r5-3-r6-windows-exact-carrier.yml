name: FABRIC R5.3 R6 Windows Exact Carrier
on:
  push:
    branches: [control/fabric-r5-3-r6-windows-exact-r1]
permissions:
  contents: read
concurrency:
  group: fabric-r5-3-r6-windows-exact-r1
  cancel-in-progress: false
env:
  SUBJECT_HEAD: 08fa81ebd860e98e655f4f403ed136a89e2ec074
  SUBJECT_TREE: c1253db8c0c07cd46ab95b032e34d3e8ef4eb658
  EXPECTED_HASH: 3035a57a288929598255d1814c0121b9c5d11eca0dc86b96a421063e7501eb8c
jobs:
  control-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prove control-only carrier and exact subject
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git merge-base HEAD "$SUBJECT_HEAD")" = "$SUBJECT_HEAD"
          test "$(git rev-parse "$SUBJECT_HEAD^{tree}")" = "$SUBJECT_TREE"
          test "$(git diff --name-only "$SUBJECT_HEAD" HEAD)" = '.github/workflows/fabric-r5-3-r6-windows-exact-carrier.yml'
          test "$(git rev-parse "$SUBJECT_HEAD^")" = 305b54bf127a910a515d02544a18d9a01a7afaa8
          git diff --check "$SUBJECT_HEAD" HEAD
          bash -n RUN_FABRIC_R5_3_TESTS.sh
          python3 -m unittest discover -s tests/research/fabric_bake0 -p test_r5_3_evidence.py -v
  exact-windows:
    needs: control-scope
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 50
    steps:
      - name: Do not interfere with live Godot sessions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -lt 7) { throw 'HOST_REQUIRES_PWSH7' }
          $foreign = @(Get-CimInstance Win32_Process | Where-Object { $_.Name -like 'godot*.exe' })
          if ($foreign.Count -gt 0) { throw ('HOST_BUSY_GODOT:' + (($foreign | Select-Object -ExpandProperty ProcessId) -join ',')) }
          $free = [double](Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory / 1MB
          Write-Host "HOST=$env:COMPUTERNAME FREE_RAM_GB=$free"
          if ($free -lt 8) { throw 'HOST_LOW_MEMORY' }
      - uses: actions/checkout@v4
        with:
          ref: 08fa81ebd860e98e655f4f403ed136a89e2ec074
          fetch-depth: 0
          persist-credentials: false
          path: r53-r6-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Run frozen R6 exact acceptance and unchanged regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $checkout = Join-Path $env:GITHUB_WORKSPACE 'r53-r6-${{ github.run_id }}-${{ github.run_attempt }}'
          $out = Join-Path $env:GITHUB_WORKSPACE 'artifacts/r53-r6-${{ github.run_id }}-${{ github.run_attempt }}'
          $runner = Join-Path $checkout 'RUN_FABRIC_R5_3_TESTS.ps1'
          & $runner -GodotBin 'C:\Godot\godot\bin\godot.windows.editor.double.x86_64.console.exe' -ExpectedHead $env:SUBJECT_HEAD -ExpectedTree $env:SUBJECT_TREE -ExpectedHash $env:EXPECTED_HASH -EvidenceDir $out
          if ($LASTEXITCODE -ne 0) { throw "R6_EXACT_FAILED:$LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r53-r6-windows-exact-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/r53-r6-${{ github.run_id }}-${{ github.run_attempt }}/**
          if-no-files-found: error
          retention-days: 90
