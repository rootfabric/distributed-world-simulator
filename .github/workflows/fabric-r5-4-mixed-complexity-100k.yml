name: FABRIC R5.4 Mixed Complexity 100k Source
on:
  push:
    branches: [research/fabric-r5-4-mixed-complexity-100k-machine-r1]
permissions:
  contents: read
jobs:
  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prove R5.4 additive scope and source contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE=044eab40803acf51ffc8bc8ff59ae7e8727947de
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          mapfile -t files < <(git diff --name-only "$BASE" HEAD)
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq 9
          expected=(
            .github/workflows/fabric-r5-4-mixed-complexity-100k.yml
            RUN_FABRIC_R5_4_TESTS.ps1
            RUN_FABRIC_R5_4_TESTS.sh
            docs/research/FABRIC_R5_4_MIXED_COMPLEXITY_100K_MACHINE_RU.md
            docs/research/FABRIC_R5_4_WORK_ORDER_RU.md
            scripts/research/fabric_bake0/collect_r5_4_evidence.py
            scripts/research/fabric_bake0/r5_4_mixed_complexity_machine_v1.gd
            tests/research/fabric_bake0/fabric_r5_4_mixed_complexity_100k_acceptance.gd
            tests/research/fabric_bake0/test_r5_4_evidence.py
          )
          test "$(printf '%s\n' "${files[@]}")" = "$(printf '%s\n' "${expected[@]}")"
          git diff --check "$BASE" HEAD
          bash -n RUN_FABRIC_R5_4_TESTS.sh
          python3 -m py_compile scripts/research/fabric_bake0/collect_r5_4_evidence.py tests/research/fabric_bake0/test_r5_4_evidence.py
          python3 -m unittest discover -s tests/research/fabric_bake0 -p test_r5_4_evidence.py -v
          test -z "$(git diff --name-only "$BASE" HEAD -- 'scripts/research/fabric_bake0/r5_3_*' 'tests/research/fabric_bake0/fabric_r5_3_*' 'scripts/research/fabric_bake0/r5_indexed_sparse_damage_lifecycle_v1.gd' 'scripts/research/fabric_bake0/r5_range_aggregate_index_v1.gd')"
      - name: Publish exact source bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifact
          git archive --format=tar.gz --output=artifact/r5-4-source.tar.gz HEAD
          git bundle create artifact/r5-4-product-exact.bundle HEAD
          printf 'HEAD=%s\nTREE=%s\nBASE=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')" 044eab40803acf51ffc8bc8ff59ae7e8727947de > artifact/identity.txt
          sha256sum artifact/r5-4-source.tar.gz artifact/r5-4-product-exact.bundle > artifact/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: fabric-r5-4-source-${{ github.sha }}
          path: artifact/**
          retention-days: 90
