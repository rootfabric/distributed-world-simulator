name: FABRIC R5.6.2 R1 Unified Lifecycle
on:
  push:
    branches: [research/fabric-r5-6-2-r1-unified-lifecycle-r1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact R2 ancestry and additive scope
        shell: bash
        run: |
          set -Eeuo pipefail
          base=60f193d6602d2d6ebb62393d3db6633b14623627
          test "$(git merge-base HEAD "$base")" = "$base"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          python3 - <<'PY'
          import subprocess
          base='60f193d6602d2d6ebb62393d3db6633b14623627'
          allowed={
            '.github/workflows/fabric-r5-6-2-r1-unified-lifecycle.yml',
            'RUN_FABRIC_R5_6_2_R1_TESTS.ps1',
            'RUN_FABRIC_R5_6_2_R1_TESTS.sh',
            'docs/research/FABRIC_R5_6_2_R1_UNIFIED_LIFECYCLE_WORK_ORDER_RU.md',
            'scripts/research/fabric_bake0/collect_r5_6_2_r1_evidence.py',
            'scripts/research/fabric_bake0/r5_6_2_r1_event_lifecycle_v1.gd',
            'tests/research/fabric_bake0/fabric_r5_6_2_r1_lifecycle_acceptance.gd',
          }
          rows=subprocess.check_output(['git','diff','--name-status',base,'HEAD'],text=True).splitlines()
          for row in rows:
              status,path=row.split('\t')
              assert status=='A' and path in allowed, row
          assert {row.split('\t')[1] for row in rows}==allowed, 'incomplete delivery'
          PY
          git diff --check "$base" HEAD
          bash -n RUN_FABRIC_R5_6_2_R1_TESTS.sh
          python3 -m py_compile scripts/research/fabric_bake0/collect_r5_6_2_r1_evidence.py
      - name: Freeze exact source for offline local reproduction
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p source-package
          git archive --format=tar.gz -o source-package/fabric-r562-source.tar.gz HEAD
          printf 'HEAD=%s\nTREE=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')" > source-package/IDENTITY
          (cd source-package && sha256sum fabric-r562-source.tar.gz > SHA256SUMS)
      - name: Upload offline source
        uses: actions/upload-artifact@v4
        with:
          name: fabric-r562-offline-source-${{ github.sha }}
          path: source-package/**
          if-no-files-found: error
          retention-days: 21
  linux-exact:
    needs: source-contracts
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve canonical Linux double Godot
        id: godot
        shell: bash
        run: |
          set -Eeuo pipefail
          bin="${DWS_GODOT_DOUBLE_BIN:-$HOME/.local/opt/godot-double-4.7.1-a13da4f/godot.linuxbsd.editor.double.x86_64}"
          test -x "$bin"
          test "$(sha256sum "$bin" | cut -d' ' -f1)" = 'bfa7ce632d8d4b1dcc96f64f5405ee52b57c4e25d15c3e0478acc26e08d517d7'
          echo "path=$bin" >>"$GITHUB_OUTPUT"
      - name: Execute exact lifecycle and inherited regressions
        shell: bash
        env:
          GODOT_BIN: ${{ steps.godot.outputs.path }}
        run: |
          set -Eeuo pipefail
          export R562_R1_EXPECTED_HEAD="$(git rev-parse HEAD)"
          export R562_R1_EXPECTED_TREE="$(git rev-parse 'HEAD^{tree}')"
          export R562_R1_EVIDENCE_DIR="$PWD/artifacts/ci-r562-${GITHUB_RUN_ID}"
          bash RUN_FABRIC_R5_6_2_R1_TESTS.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fabric-r562-r1-linux-evidence-${{ github.sha }}
          path: artifacts/ci-r562-${{ github.run_id }}/**
          if-no-files-found: warn
          retention-days: 30
