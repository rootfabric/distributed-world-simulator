name: FABRIC R5.5 R2 Frozen Source Carrier
on:
  push:
    branches:
      - verify/fabric-r55-r2-source-f6ef2070-r1
permissions:
  contents: read
jobs:
  frozen-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f6ef2070638c39832d11b262e33480c520cf7924
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact immutable product identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "f6ef2070638c39832d11b262e33480c520cf7924"
          test "$(git rev-parse 'HEAD^{tree}')" = "c8fcf6879ffe71fa287dc1a7f681d065714c048f"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
      - name: Export frozen source with hash manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p export
          git archive --format=tar.gz --output=export/fabric-r55-r2-frozen-source.tar.gz HEAD
          printf 'HEAD=%s\nTREE=%s\nBASE=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')" "56ab06936b902e8c752be06eafa2e4d16465cc82" > export/IDENTITY.txt
          (cd export && sha256sum fabric-r55-r2-frozen-source.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: fabric-r55-r2-frozen-source-f6ef2070
          path: export/**
          retention-days: 14
