name: FABRIC R5.6.1 R2 COM Frozen Source & Windows Exact
on:
  push:
    branches:
      - verify/fabric-r56-r2-com-91223acb-exact-r1
permissions:
  contents: read
concurrency:
  group: fabric-r56-r2-com-frozen-91223acb
  cancel-in-progress: false
jobs:
  source-carrier:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 91223acb7bf79c37e12fc11d44054ad3e2732455
          fetch-depth: 0
          persist-credentials: false
      - name: Frozen identity and eight-path COM repair scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "91223acb7bf79c37e12fc11d44054ad3e2732455"
          test "$(git rev-parse 'HEAD^{tree}')" = "3bb5f214a563ce2bb66b548555cf5f049e6fe932"
          test "$(git rev-parse HEAD^)" = "1b2e707c3605c502280efe157ed112816f85c6df"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          git diff --check HEAD^ HEAD
          test "$(git diff --name-only HEAD^ HEAD | wc -l)" -eq 8
          test -z "$(git diff --name-only HEAD^ HEAD -- 'scripts/construction/**' 'scripts/simulation/matter/**' 'scripts/research/fabric_bake0/r5_1_*' 'scripts/research/fabric_bake0/r5_3_*' 'scripts/research/fabric_bake0/r5_4_*' 'scripts/research/fabric_bake0/r5_5_*' 'scripts/research/fabric_bake0/r5_6_1_canonical_delta*' 'scripts/research/fabric_bake0/r5_6_1_r1_*')"
          bash -n RUN_FABRIC_R5_6_1_R2_TESTS.sh
          python3 -m py_compile scripts/research/fabric_bake0/collect_r5_6_1_r2_evidence.py scripts/research/fabric_bake0/test_r5_6_1_r2_evidence_collector.py
      - name: Export frozen exact source and full ancestry
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p frozen
          git archive --format=tar.gz --output=frozen/r56-r2-com-source.tar.gz HEAD
          git bundle create frozen/r56-r2-com-full.bundle HEAD
          printf 'HEAD=%s\nTREE=%s\nPARENT=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" "$(git rev-parse HEAD^)" > frozen/IDENTITY.txt
          (cd frozen && sha256sum r56-r2-com-source.tar.gz r56-r2-com-full.bundle > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: fabric-r56-r2-com-frozen-91223acb
          path: frozen/**
          retention-days: 30
  windows-exact:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 91223acb7bf79c37e12fc11d44054ad3e2732455
          fetch-depth: 0
          persist-credentials: false
      - name: Canonical Windows exact Godot and product identity
        id: godot
        env:
          CONFIGURED_GODOT_BIN: ${{ vars.DWS_GODOT_DOUBLE_BIN }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $head = (git rev-parse HEAD).Trim()
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          if ($head -ne '91223acb7bf79c37e12fc11d44054ad3e2732455') { throw "HEAD_DRIFT: $head" }
          if ($tree -ne '3bb5f214a563ce2bb66b548555cf5f049e6fe932') { throw "TREE_DRIFT: $tree" }
          if (@(git status --porcelain=v1 --untracked-files=no).Count -ne 0) { throw 'TRACKED_DIRTY' }
          $godot = $env:CONFIGURED_GODOT_BIN
          if ([string]::IsNullOrWhiteSpace($godot)) {
              $godot = 'C:\Godot\godot\bin\godot.windows.editor.double.x86_64.console.exe'
          }
          if (!(Test-Path -LiteralPath $godot -PathType Leaf)) { throw "CANONICAL_GODOT_MISSING: $godot" }
          $version = ((& $godot --version) -join "`n").Trim()
          $sha = (Get-FileHash $godot -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($version -cne '4.7.1.stable.double.custom_build.a13da4feb') { throw "GODOT_VERSION_MISMATCH: $version" }
          if ($sha -cne '3633c3e609c8ce2f9bae334a9c7e75c7f974de3af0415ab4a8050a625a15a7a5') { throw "GODOT_SHA_MISMATCH: $sha" }
          "path=$godot" >> $env:GITHUB_OUTPUT
          Write-Host "FROZEN_WINDOWS_ENVIRONMENT=PASS $head $tree $sha"
      - name: Run untouched R5.6.1 R2 Windows COM exact
        env:
          GODOT_BIN: ${{ steps.godot.outputs.path }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $Out = Join-Path (Get-Location) 'artifacts/fabric-r56-r2-com-windows-exact'
          if (Test-Path $Out) {
            if (@(Get-ChildItem $Out -Force).Count -gt 0) { throw 'EVIDENCE_DIR_NOT_EMPTY' }
          }
          $env:BREAKPOINT_RUNTIME_DISABLED = '1'
          $env:GODOT_SILENCE_ROOT_WARNING = '1'
          & .\RUN_FABRIC_R5_6_1_R2_TESTS.ps1 `
            -GodotBin $env:GODOT_BIN `
            -ExpectedHead '91223acb7bf79c37e12fc11d44054ad3e2732455' `
            -ExpectedTree '3bb5f214a563ce2bb66b548555cf5f049e6fe932' `
            -EvidenceDir $Out -PythonBin 'python'
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_COM_EXACT_RUNNER_EXIT_NONZERO' }
          if (!(Test-Path (Join-Path $Out 'r2-com.log'))) { throw 'COM_EVIDENCE_MISSING' }
          $lines = @(Get-Content (Join-Path $Out 'SHA256SUMS'))
          foreach ($line in $lines) {
              if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw 'SHA_MANIFEST_INVALID' }
              $file = Join-Path $Out $Matches[2]
              if (!(Test-Path $file)) { throw "SHA_FILE_MISSING: $file" }
              if ((Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant() -ne $Matches[1]) { throw "SHA_DRIFT: $file" }
          }
          Write-Host "FABRIC_R56_R2_COM_WINDOWS_EXACT=PASS manifest_rows=$($lines.Count)"
      - name: Upload full raw Windows COM exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-r56-r2-com-windows-exact-91223acb
          path: artifacts/fabric-r56-r2-com-windows-exact/**
          if-no-files-found: warn
          retention-days: 30
