name: FABRIC R5.6.1 R2 COM Repair Frozen Source
on:
  push:
    branches:
      - verify/fabric-r56-r2-com-91223acb-source-r1
permissions:
  contents: read
jobs:
  frozen-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 91223acb7bf79c37e12fc11d44054ad3e2732455
          fetch-depth: 0
          persist-credentials: false
      - name: Frozen identity and narrow COM repair scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "91223acb7bf79c37e12fc11d44054ad3e2732455"
          test "$(git rev-parse 'HEAD^{tree}')" = "3bb5f214a563ce2bb66b548555cf5f049e6fe932"
          test "$(git rev-parse 'HEAD^')" = "1b2e707c3605c502280efe157ed112816f85c6df"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          git diff --check HEAD^ HEAD
          test "$(git diff --name-only HEAD^ HEAD | wc -l)" -eq 8
          test -z "$(git diff --name-only HEAD^ HEAD -- 'scripts/construction/**' 'scripts/simulation/matter/**' 'scripts/research/fabric_bake0/r5_1_*' 'scripts/research/fabric_bake0/r5_3_*' 'scripts/research/fabric_bake0/r5_4_*' 'scripts/research/fabric_bake0/r5_5_*' 'scripts/research/fabric_bake0/r5_6_1_canonical_delta*' 'scripts/research/fabric_bake0/r5_6_1_r1_*')"
          bash -n RUN_FABRIC_R5_6_1_R2_TESTS.sh
          python3 -m py_compile scripts/research/fabric_bake0/collect_r5_6_1_r2_evidence.py scripts/research/fabric_bake0/test_r5_6_1_r2_evidence_collector.py
      - name: Export exact product source and complete Git history
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifact
          git archive --format=tar.gz --output=artifact/r56-r2-com-source.tar.gz HEAD
          git bundle create artifact/r56-r2-com-full.bundle HEAD
          printf 'HEAD=%s\nTREE=%s\nPARENT=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')" "$(git rev-parse 'HEAD^')" > artifact/IDENTITY.txt
          (cd artifact && sha256sum r56-r2-com-source.tar.gz r56-r2-com-full.bundle > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: fabric-r56-r2-com-91223acb
          path: artifact/**
          retention-days: 30
  windows-syntax:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 91223acb7bf79c37e12fc11d44054ad3e2732455
      - name: Confirm exact PowerShell syntax and COM gate invocation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $code = Get-Content RUN_FABRIC_R5_6_1_R2_TESTS.ps1 -Raw
          $tokens = $null; $parseErrors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseInput($code, [ref]$tokens, [ref]$parseErrors)
          if (@($parseErrors).Count -ne 0) { throw 'POWERSHELL_PARSE_FAILED' }
          if ($code -notmatch '\[string\[\]\]\$GateArgs') { throw 'GATEARGS_MISSING' }
          if ($code -notmatch 'r2-com') { throw 'CENTER_PRECISION_GATE_MISSING' }
          if ($code -notmatch 'FABRIC_R56_R2_EXACT=PASS') { throw 'EXACT_SENTINEL_MISSING' }
          Write-Host 'FABRIC_R56_R2_COM_WINDOWS_SYNTAX=PASS'
