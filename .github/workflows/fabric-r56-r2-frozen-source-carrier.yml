name: FABRIC R5.6.1 R2 Frozen Source Carrier
on:
  push:
    branches: [verify/fabric-r56-1-r2-dynamic-2ea4debd-source-r1]
permissions:
  contents: read
jobs:
  frozen-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2ea4debdcef7a38dc1de2a0acc9a906ccfcea442
          fetch-depth: 0
          persist-credentials: false
      - name: Exact source and narrow 11-path audit
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "2ea4debdcef7a38dc1de2a0acc9a906ccfcea442"
          test "$(git rev-parse 'HEAD^{tree}')" = "8e2c9b4a74c53eebe102c7ec923465787af9318f"
          test "$(git rev-parse 'HEAD^')" = "4f301fae461567362d408a51802cc3dde6730999"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          git diff --check HEAD^ HEAD
          test "$(git diff --name-only HEAD^ HEAD | wc -l)" -eq 11
          test -z "$(git diff --name-only HEAD^ HEAD -- 'scripts/construction/**' 'scripts/simulation/matter/**' 'scripts/research/fabric_bake0/r5_1_*' 'scripts/research/fabric_bake0/r5_3_*' 'scripts/research/fabric_bake0/r5_4_*' 'scripts/research/fabric_bake0/r5_5_*' 'scripts/research/fabric_bake0/r5_6_1_canonical_delta*' 'scripts/research/fabric_bake0/r5_6_1_r1_*')"
          bash -n RUN_FABRIC_R5_6_1_R2_TESTS.sh
          python3 -m py_compile scripts/research/fabric_bake0/collect_r5_6_1_r2_evidence.py scripts/research/fabric_bake0/test_r5_6_1_r2_evidence_collector.py
      - name: Export frozen exact source and self-contained git ancestry
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p export
          git archive --format=tar.gz --output=export/fabric-r56-r2-source.tar.gz HEAD
          git bundle create export/fabric-r56-r2-full.bundle HEAD
          printf 'HEAD=%s\nTREE=%s\nPARENT=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')" "$(git rev-parse 'HEAD^')" > export/IDENTITY.txt
          (cd export && sha256sum fabric-r56-r2-source.tar.gz fabric-r56-r2-full.bundle > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: fabric-r56-r2-frozen-2ea4debd
          path: export/**
          retention-days: 30
