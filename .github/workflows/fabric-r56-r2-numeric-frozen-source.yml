name: FABRIC R5.6.1 R2 Numeric Repair Frozen Source
on:
  push:
    branches:
      - verify/fabric-r56-r2-numeric-716cddee-source-r1
permissions:
  contents: read
jobs:
  frozen-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 716cddeee0cb479bcf4d96496510c0be033f5e64
          fetch-depth: 0
          persist-credentials: false
      - name: Assert frozen HEAD/TREE and 8-file narrow repair
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "716cddeee0cb479bcf4d96496510c0be033f5e64"
          test "$(git rev-parse 'HEAD^{tree}')" = "8457feca07484eb9d4d7f0824af8dea962e66052"
          test "$(git rev-parse 'HEAD^')" = "2ea4debdcef7a38dc1de2a0acc9a906ccfcea442"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          git diff --check HEAD^ HEAD
          test "$(git diff --name-only HEAD^ HEAD | wc -l)" -eq 8
          test -z "$(git diff --name-only HEAD^ HEAD -- 'scripts/construction/**' 'scripts/simulation/matter/**' 'scripts/research/fabric_bake0/r5_1_*' 'scripts/research/fabric_bake0/r5_3_*' 'scripts/research/fabric_bake0/r5_4_*' 'scripts/research/fabric_bake0/r5_5_*' 'scripts/research/fabric_bake0/r5_6_1_canonical_delta*' 'scripts/research/fabric_bake0/r5_6_1_r1_*')"
          bash -n RUN_FABRIC_R5_6_1_R2_TESTS.sh
          python3 -m py_compile scripts/research/fabric_bake0/collect_r5_6_1_r2_evidence.py scripts/research/fabric_bake0/test_r5_6_1_r2_evidence_collector.py
      - name: Export exact source and git history
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifact
          git archive --format=tar.gz --output=artifact/r56-r2-numeric-source.tar.gz HEAD
          git bundle create artifact/r56-r2-numeric-full.bundle HEAD
          printf 'HEAD=%s\nTREE=%s\nPARENT=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')" "$(git rev-parse 'HEAD^')" > artifact/IDENTITY.txt
          (cd artifact && sha256sum r56-r2-numeric-source.tar.gz r56-r2-numeric-full.bundle > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: fabric-r56-r2-numeric-716cddee
          path: artifact/**
          retention-days: 30
