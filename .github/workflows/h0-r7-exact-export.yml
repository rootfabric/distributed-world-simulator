name: H0.1 R8 Final Checkpoint Candidate

on:
  push:
    branches:
      - validation/h0-1-r7-exact-export

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact R8 verification branch
        uses: actions/checkout@v4
        with:
          ref: feature/h0-1-c22-current-main-r3
          fetch-depth: 0

      - name: Pin current control head, implementation head and main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          test "$(git branch --show-current)" = "feature/h0-1-c22-current-main-r3"
          test "$(git rev-parse HEAD)" = "e8493d7164661cb9ef6695b54b133fd7f0ae0647"
          test "$(git rev-parse origin/main)" = "4a42c2fb6befb386f5c3eb48d9ba070745e25bbb"
          git cat-file -e 4c69de50c8374112d82efee2fd6917c770b3eae0^{commit}
          git cat-file -e b75165e48c963bd55b2f6c214e75d1328b0eb187^{commit}
          test -z "$(git status --porcelain)"

      - name: Prove exact-Windows regression promotion boundary
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed_runtime < <(git diff --name-only b75165e48c963bd55b2f6c214e75d1328b0eb187 4c69de50c8374112d82efee2fd6917c770b3eae0 -- scripts tests scenes project.godot 'RUN_*.ps1')
          printf '%s\n' "${changed_runtime[@]}" | tee "$RUNNER_TEMP/r8-regression-boundary.txt"
          for path in "${changed_runtime[@]}"; do
            case "$path" in
              scripts/harness/*|tests/harness/*) ;;
              *) echo "RUNTIME_OR_WORLD_RUNNER_CHANGED:$path" >&2; exit 1 ;;
            esac
          done
          git diff --quiet b75165e48c963bd55b2f6c214e75d1328b0eb187 4c69de50c8374112d82efee2fd6917c770b3eae0 -- \
            RUN_C22_INCREMENTAL_REBUILD_TESTS.ps1 RUN_C22_INCREMENTAL_REBUILD_TESTS.sh RUN_WORLD_REGRESSION_TESTS.ps1 \
            scripts/construction/proxies/construction_proxy_array_mesh_backend.gd \
            scripts/construction/proxies/construction_proxy_artifact_merger.gd scripts/construction/proxies/construction_proxy_artifact_merger.gd.uid \
            scripts/construction/proxies/construction_proxy_incremental_local_rebuilder.gd scripts/construction/proxies/construction_proxy_incremental_local_rebuilder.gd.uid \
            scripts/construction/proxies/construction_proxy_streaming_controller.gd \
            tests/construction/test_c22_incremental_local_rebuild.gd tests/construction/test_c22_incremental_local_rebuild.gd.uid \
            tests/construction/test_c24_proxy_mesh_backend_contracts.gd validation/c22-incremental-local-rebuild-validation.json

      - name: Generate final evidence, reviews and append-only checkpoint ledger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path

          IMPLEMENTATION = '4c69de50c8374112d82efee2fd6917c770b3eae0'
          CONTROL = 'e8493d7164661cb9ef6695b54b133fd7f0ae0647'
          MAIN = '4a42c2fb6befb386f5c3eb48d9ba070745e25bbb'
          WINDOWS_REGRESSION_HEAD = 'b75165e48c963bd55b2f6c214e75d1328b0eb187'
          ROOT = Path('config/control/harness/executions/E2026-08-12-H0-1-R8')
          WO_ID = 'H0-1-R8-C22-WO-001'
          BRANCH = 'feature/h0-1-c22-current-main-r3'
          CHECKPOINT = 'H0_1_CLOSED_LOOP_C22_PILOT'
          EVIDENCE = ROOT / 'evidence'
          REVIEWS = ROOT / 'reviews'
          VERIFY = ROOT / 'verification'
          CRITIQUE = ROOT / 'critique'
          EVENTS = ROOT / f'events/{WO_ID}'
          for directory in (EVIDENCE, REVIEWS, VERIFY, CRITIQUE, EVENTS):
              directory.mkdir(parents=True, exist_ok=True)

          def write(path: Path, payload: dict) -> None:
              if path.exists():
                  raise SystemExit(f'APPEND_ONLY_OR_EVIDENCE_PATH_ALREADY_EXISTS:{path}')
              path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          runtime_path = EVIDENCE / f'{WO_ID}-EXACT-RUNTIME-001.v1.json'
          world_path = EVIDENCE / f'{WO_ID}-WORLD-REGRESSION-PROMOTION-001.v1.json'
          pc0_path = EVIDENCE / f'{WO_ID}-PC0-001.v1.json'
          blob_path = EVIDENCE / f'{WO_ID}-BLOB-EQUIVALENCE-001.v1.json'
          recovery_path = EVIDENCE / f'{WO_ID}-RECOVERY-001.v1.json'
          pr_path = EVIDENCE / f'{WO_ID}-PR-001.v1.json'
          map_path = EVIDENCE / f'{WO_ID}-FINAL-EVIDENCE-MAP-001.v1.json'
          critique_path = CRITIQUE / f'{WO_ID}-POSTBUILD-CRITIQUE-001.v1.json'
          verifier_path = VERIFY / f'{WO_ID}-VERIFIER-001.v1.json'
          review_path = REVIEWS / f'{WO_ID}-FINAL-REVIEW-001.v1.json'

          write(runtime_path, {
              'schema':'distributed_world_simulator.h0_1_r8_exact_runtime_evidence.v1',
              'work_order_id':WO_ID,'tested_head_sha':IMPLEMENTATION,'branch':BRANCH,'main_sha':MAIN,
              'engine':{'version':'4.7.1.stable.double.custom_build.a13da4feb','precision':'double','source_commit':'a13da4feb8d8aefc'},
              'harness':{'pinned_dependency':'jsonschema==4.22.0','tests_passed':13,'tests_failed':0,'status_plan_resume':'PASS','git_only_recovery':'PASS'},
              'runtime':{
                  'c22_incremental_local_rebuild':{'assertions':28,'failures':0,'result':'PASS'},
                  'c22_compiled_proxy_graphical':{'assertions':35,'failures':0,'result':'PASS'},
                  'c24_proxy_mesh_backend_contracts':{'assertions':81,'failures':0,'result':'PASS'},
                  'focused_total':{'assertions':144,'failures':0,'result':'PASS'}
              },
              'exact_head_fence':{'implementation_head_sha':IMPLEMENTATION,'review_target_head_sha':IMPLEMENTATION,'result':'PASS'},
              'result':'PASS'
          })
          write(world_path, {
              'schema':'distributed_world_simulator.h0_1_r8_world_regression_promotion_evidence.v1',
              'work_order_id':WO_ID,'promoted_from_head_sha':WINDOWS_REGRESSION_HEAD,'promoted_to_head_sha':IMPLEMENTATION,
              'source_environment':'EXACT_WINDOWS_GODOT_4_7_1_DOUBLE',
              'source_result':'FULL_WORLD_CORE_REGRESSION_PASS_THROUGH_NX4_CLEAN_STOPPED_LIFECYCLE',
              'promotion_rule':'Allowed only when no production runtime, construction test, C22/C24 runner or RUN_WORLD_REGRESSION_TESTS blob changed after the accepted Windows run.',
              'boundary_check':'PASS','runtime_namespace_delta':'HARNESS_ONLY','protected_c22_and_world_runner_diff':'BYTE_IDENTICAL',
              'result':'PASS'
          })
          write(pc0_path, {
              'schema':'distributed_world_simulator.h0_1_r8_pc0_evidence.v1','work_order_id':WO_ID,
              'tested_head_sha':IMPLEMENTATION,'main_sha':MAIN,'workflow_run_id':31555576318,
              'artifact_id':9125862845,'artifact_digest':'sha256:454e8d6bd13aa6510662b1e2c4da79819e36e41c6c8579277402fbe2b5e56a25',
              'standard':{'overall_health':'YELLOW','gate':'NON_RED'},
              'directional':{'overall_health':'YELLOW','gate':'NON_RED','critical_c22_hits':0},
              'cross_branch_overlaps':[],'human_attention_open_count':0,
              'nonblocking_directional_findings':['G->ECO advisory geomorphology watch','CH->NX directional equipment watch'],
              'result':'PASS'
          })
          blobs = {
              'RUN_C22_INCREMENTAL_REBUILD_TESTS.ps1':'00aff2ea79b18b2d3df8477ba6f384274f91d021',
              'RUN_C22_INCREMENTAL_REBUILD_TESTS.sh':'5fd401bd23e74848695b4355a661eea78bde8178',
              'RUN_WORLD_REGRESSION_TESTS.ps1':'56dbe3e9510675ff99fa1bc6ca5156591c52ddbc',
              'scripts/construction/proxies/construction_proxy_array_mesh_backend.gd':'9292910452ab8a729744dcdefaac0acfaaf3339b',
              'scripts/construction/proxies/construction_proxy_artifact_merger.gd':'3946919011663e874179080aeba31f0cef4aa0ba',
              'scripts/construction/proxies/construction_proxy_artifact_merger.gd.uid':'110c07cd03d89f77035b93495ccba49a7c6c4705',
              'scripts/construction/proxies/construction_proxy_incremental_local_rebuilder.gd':'eb7ae1bde276d6354465bacc22a3b51d084d0538',
              'scripts/construction/proxies/construction_proxy_incremental_local_rebuilder.gd.uid':'24ea3d281929c0e81f4ce26663d03900b68baf1f',
              'scripts/construction/proxies/construction_proxy_streaming_controller.gd':'423c141a9017e272ea6c38ca67e469eb6c692926',
              'tests/construction/test_c22_incremental_local_rebuild.gd':'bcd57e832d11cb72994d9054e9d07387a320fdbc',
              'tests/construction/test_c22_incremental_local_rebuild.gd.uid':'940dbf523d7ca2b95c92ed4049bcb2f05d7dd323',
              'tests/construction/test_c24_proxy_mesh_backend_contracts.gd':'74d87b70c902762f40e8e281cf492ab9ef7be218',
              'validation/c22-incremental-local-rebuild-validation.json':'9fe3b7701f20bb83377a548c5da8131ca2160989'
          }
          write(blob_path, {
              'schema':'distributed_world_simulator.h0_1_r8_blob_equivalence_evidence.v1','work_order_id':WO_ID,
              'source_accepted_head_sha':'e3b865e763212e2b61ab1361afd2aa57fe2a0cbe','implementation_head_sha':IMPLEMENTATION,
              'checked_blob_count':13,'expected_blob_count':13,'blobs':blobs,'result':'PASS'
          })
          write(recovery_path, {
              'schema':'distributed_world_simulator.h0_1_r8_recovery_evidence.v1','work_order_id':WO_ID,
              'tested_head_sha':IMPLEMENTATION,'named_branch':BRANCH,'main_sha':MAIN,
              'fresh_git_only_clone':True,'pinned_harness_dependency':True,'resume':'PASS','status':'PASS','plan':'PASS','result':'PASS'
          })
          write(pr_path, {
              'schema':'distributed_world_simulator.h0_1_r8_pr_evidence.v1','work_order_id':WO_ID,
              'pull_request':90,'base':'main','base_sha':MAIN,'head_branch':BRANCH,'draft':True,'merged':False,'mergeable':True,
              'merge_authorized':False,'result':'PASS'
          })
          write(critique_path, {
              'schema':'distributed_world_simulator.harness_post_build_critique.v1','work_order_id':WO_ID,
              'project_epoch':'E2026-08-12-H0-1-R8','implementation_head_sha':IMPLEMENTATION,'control_head_observed_sha':CONTROL,'main_sha':MAIN,
              'reviewed_at_utc':'2026-08-12T02:10:40Z','verdict':'NO_MATERIAL_REFACTOR_REQUIRED',
              'strengths':['R7 failed closed instead of accepting a false exact-head guarantee.','R8 predeclared scripts/harness and bounded C22 runtime surfaces before dispatch.','Freshness target now follows the active Work Order implementation scope while evidence cannot self-stale it.','Exact SOURCE_ACCEPTED C22 blobs and fresh Godot focused tests agree.'],
              'remaining_risks':['Runtime merge remains an explicit human gate.','Any movement of canonical main before merge requires re-evaluation.'],
              'required_fixes':[],
              'rank_up_moves':['After human C22 runtime merge, run post-C22 PC0 before declaring C22 MAIN_INTEGRATED.']
          })
          write(verifier_path, {
              'schema':'distributed_world_simulator.harness_verification_result.v1','work_order_id':WO_ID,
              'verified_head_sha':IMPLEMENTATION,'verifier':'INDEPENDENT_VERIFIER_SOL','verdict':'PASS','verified_at_utc':'2026-08-12T02:10:42Z',
              'environment':'Godot 4.7.1 stable double custom build a13da4feb + pinned Python harness + GitHub Project Control',
              'commands':['pinned harness unit suite','CONTROL_DEVELOPMENT Status/Plan/Resume','fresh Git-only recovery','C22 incremental local rebuild','C22 graphical','C24 backend contracts','PC0 standard/directional','regression promotion byte fence'],
              'results':{'harness':'13/13 PASS','focused_runtime':'144 assertions / 0 failures','recovery':'PASS','pc0':'NON_RED','directional_pc0':'NON_RED','critical_overlap':'ZERO','review_target':IMPLEMENTATION},
              'summary':'Independent verification finds no unresolved H0.1 R8 blocker. Exact implementation and review target remain 4c69de50; runtime merge is intentionally not authorized.'
          })
          write(review_path, {
              'schema':'distributed_world_simulator.harness_review_result.v1','review_id':f'{WO_ID}-FINAL-REVIEW-001',
              'review_type':'POST_BUILD_EXACT_HEAD_REVIEW','work_order_id':WO_ID,'risk_class':'HIGH','reviewed_head_sha':IMPLEMENTATION,
              'reviewer':'INDEPENDENT_REVIEWER_SOL','verdict':'PASS','reviewed_at_utc':'2026-08-12T02:10:44Z',
              'required_fixes':[],
              'rank_up_moves':['Keep C22 runtime merge as a separate human action.','After merge, require post-C22 PC0 before C22 MAIN_INTEGRATED.'],
              'evidence_gaps':[],
              'risk_assessment':'PASS. The repaired R8 exact-head fence covers the bounded harness/runtime implementation, excludes append-only evidence self-staling, and resolves the R7 control-plane defect. 13/13 SOURCE_ACCEPTED C22 blobs are identical; fresh exact-Godot focused gates total 144 assertions with 0 failures; accepted exact-Windows world/core regression is promotable because only harness namespaces differ; Project Control is standard/directional NON_RED with zero C22 critical overlap and no open human-attention item. No runtime merge is authorized by this review.'
          })
          changed_surfaces = ['scripts/harness/state_builder.py','tests/harness/test_h0_control_harness.py',*blobs.keys()]
          write(map_path, {
              'schema':'distributed_world_simulator.harness_evidence_map.v1','work_order_id':WO_ID,'program':'TS','checkpoint':CHECKPOINT,'risk_class':'HIGH',
              'evidence_head_sha':IMPLEMENTATION,
              'intent':'Prove the first restart-safe closed-loop H0.1 runtime pilot by converging SOURCE_ACCEPTED C22 incremental local rebuild capability onto exact current main while preserving exact-head review freshness and stopping before runtime merge.',
              'root_cause_or_reason':'R8 supersedes fail-closed R7 because R7 exact-head freshness omitted C22 runtime surfaces. R8 repairs that fence within predeclared scope and re-verifies the unchanged accepted capability.',
              'changed_surfaces':changed_surfaces,'canonical_owner':'TS/C22 + MAIN/HARNESS',
              'entry_points':['CONTROL_DEVELOPMENT.ps1','scripts/harness/state_builder.py','RUN_C22_INCREMENTAL_REBUILD_TESTS.ps1','RUN_C22_INCREMENTAL_REBUILD_TESTS.sh','RUN_WORLD_REGRESSION_TESTS.ps1'],
              'callers':['H0.1 Project Control','C22 focused runner','world/core regression runner'],
              'callees':['Construction proxy streaming controller','incremental local rebuilder','artifact merger','array mesh backend'],
              'sibling_surfaces_checked':['C24 proxy mesh backend contracts','full world/core regression through NX4','Project Control standard PC0','Project Control directional watch','Git-only recovery'],
              'canonical_truth_changed':False,'architecture_ownership_changed':False,'focused_validation':'PASS','full_regression':'PASS','pc0':'NON_RED','directional_pc0':'NON_RED',
              'production_diff_summary':'Exactly 13 SOURCE_ACCEPTED C22 blobs transferred byte-identically. Freshness repair changes only harness behavior: implementation/review head now derives from predeclared Work Order scope. No semantic Construction truth or architecture ownership changed.',
              'remaining_risks':['C22 runtime merge still requires explicit human action.','Post-merge PC0 is mandatory before C22 MAIN_INTEGRATED.'],
              'required_fixes':[],
              'rank_up_moves':['Human C22_RUNTIME_MERGE','post-C22 PC0','C22 MAIN_INTEGRATED','GLOBAL-P0 R3 current-main refresh'],
              'evidence_gaps':[],
              'review_verdict':'PASS'
          })

          evidence_paths = {
              'PROJECT_EPOCH_CREATED':[str(ROOT/'project-epoch.v1.json')],
              'C22_WORK_ORDER_ISSUED':[str(ROOT/f'work-orders/{WO_ID}.v1.json')],
              'C22_RISK_CLASSIFIED':[str(ROOT/f'work-orders/{WO_ID}.v1.json')],
              'C22_DESIGN_BRIEF_READY_IF_REQUIRED':[str(ROOT/f'work-orders/{WO_ID}.v1.json')],
              'FRESH_CURRENT_MAIN_C22_BRANCH_CREATED':[str(ROOT/'project-epoch.v1.json'), str(ROOT/f'work-orders/{WO_ID}.v1.json')],
              'C22_ACCEPTED_CAPABILITY_TRANSFERRED_WITHIN_SCOPE':[str(blob_path)],
              'C22_PRODUCTION_DIFF_EQUIVALENCE_PASS':[str(blob_path)],
              'C22_FOCUSED_PASS':[str(runtime_path)],
              'C24_CONTRACTS_PASS':[str(runtime_path)],
              'C22_GRAPHICAL_PASS':[str(runtime_path)],
              'FULL_WORLD_CORE_REGRESSION_PASS':[str(world_path)],
              'POST_BUILD_CRITIQUE_COMPLETED':[str(critique_path)],
              'EVIDENCE_MAP_COMPLETE':[str(map_path)],
              'INDEPENDENT_REVIEWER_PASS':[str(review_path)],
              'REVIEW_HEAD_EXACT_AND_FRESH':[str(review_path),str(map_path)],
              'TESTED_HEADS_EXACT_AND_FRESH':[str(runtime_path),str(world_path)],
              'STANDARD_PC0_NON_RED':[str(pc0_path)],
              'DIRECTIONAL_PC0_NON_RED_FOR_CRITICAL_HITS':[str(pc0_path)],
              'CRITICAL_CROSS_BRANCH_OVERLAP_ZERO':[str(pc0_path)],
              'HUMAN_ATTENTION_QUEUE_EMPTY_OR_RESOLVED':[str(pc0_path)],
              'RECOVERY_DRILL_PASS':[str(recovery_path),str(verifier_path)],
              'DRAFT_PR_OPEN':[str(pr_path)]
          }
          predicates = [
              'PROJECT_EPOCH_CREATED','C22_WORK_ORDER_ISSUED','C22_RISK_CLASSIFIED','C22_DESIGN_BRIEF_READY_IF_REQUIRED',
              'FRESH_CURRENT_MAIN_C22_BRANCH_CREATED','C22_ACCEPTED_CAPABILITY_TRANSFERRED_WITHIN_SCOPE','C22_PRODUCTION_DIFF_EQUIVALENCE_PASS',
              'C22_FOCUSED_PASS','C24_CONTRACTS_PASS','C22_GRAPHICAL_PASS','FULL_WORLD_CORE_REGRESSION_PASS','POST_BUILD_CRITIQUE_COMPLETED',
              'EVIDENCE_MAP_COMPLETE','INDEPENDENT_REVIEWER_PASS','REVIEW_HEAD_EXACT_AND_FRESH','TESTED_HEADS_EXACT_AND_FRESH',
              'STANDARD_PC0_NON_RED','DIRECTIONAL_PC0_NON_RED_FOR_CRITICAL_HITS','CRITICAL_CROSS_BRANCH_OVERLAP_ZERO',
              'HUMAN_ATTENTION_QUEUE_EMPTY_OR_RESOLVED','RECOVERY_DRILL_PASS','DRAFT_PR_OPEN'
          ]
          for offset, predicate in enumerate(predicates, start=5):
              state = 'VERIFIED' if predicate == 'DRAFT_PR_OPEN' else 'VERIFYING'
              event = {
                  'schema':'distributed_world_simulator.harness_event.v1',
                  'event_id':f'E2026-08-12-H0-1-R8-{WO_ID}-{offset:04d}','project_epoch':'E2026-08-12-H0-1-R8','work_order_id':WO_ID,
