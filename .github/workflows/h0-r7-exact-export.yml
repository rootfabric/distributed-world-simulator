name: H0.1 R8 Read-Only Verification

on:
  push:
    branches:
      - validation/h0-1-r7-exact-export

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout named R8 branch
        uses: actions/checkout@v4
        with:
          ref: feature/h0-1-c22-current-main-r3
          fetch-depth: 0

      - name: Pin control head and canonical main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          test "$(git rev-parse HEAD)" = "e8493d7164661cb9ef6695b54b133fd7f0ae0647"
          test "$(git rev-parse origin/main)" = "4a42c2fb6befb386f5c3eb48d9ba070745e25bbb"
          test -z "$(git status --porcelain)"

      - name: Install pinned harness dependency
        shell: bash
        run: python -m pip install -r scripts/harness/requirements.txt

      - name: Verify exact implementation target survives evidence commits
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/harness -v
          PYTHONPATH=scripts python - <<'PY'
          from pathlib import Path
          from harness.state_builder import build_state
          root = Path('.').resolve()
          execution = root / 'config/control/harness/executions/E2026-08-12-H0-1-R8'
          state = build_state(root, execution)
          assert state['active_work_order']['state'] == 'VERIFYING', state['active_work_order']['state']
          assert state['reduced_work_order']['state'] == 'VERIFYING', state['reduced_work_order']['state']
          assert state['repository']['implementation_head_sha'] == '4c69de50c8374112d82efee2fd6917c770b3eae0', state['repository']['implementation_head_sha']
          assert state['review']['review_target_head_sha'] == '4c69de50c8374112d82efee2fd6917c770b3eae0', state['review']['review_target_head_sha']
          assert state['human_attention']['open_count'] == 0, state['human_attention']
          print('R8 VERIFYING exact implementation fence: PASS')
          PY
