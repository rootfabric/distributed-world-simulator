          audit_seq = 27
          write(EVENTS/f'{audit_seq:04d}-final-audit.v1.json', {
              'schema':'distributed_world_simulator.harness_event.v1','event_id':f'E2026-08-12-H0-1-R8-{WO_ID}-{audit_seq:04d}',
