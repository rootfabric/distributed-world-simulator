name: H0.1 R8 Exact Verification

on:
  push:
    branches:
      - validation/h0-1-r7-exact-export

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact named R8 branch
        uses: actions/checkout@v4
        with:
          ref: feature/h0-1-c22-current-main-r3
          fetch-depth: 0

      - name: Pin exact implementation and main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          test "$(git branch --show-current)" = "feature/h0-1-c22-current-main-r3"
          test "$(git rev-parse HEAD)" = "4c69de50c8374112d82efee2fd6917c770b3eae0"
          test "$(git rev-parse origin/main)" = "4a42c2fb6befb386f5c3eb48d9ba070745e25bbb"
          test -z "$(git status --porcelain)"

      - name: Install pinned harness dependency
        shell: bash
        run: python -m pip install -r scripts/harness/requirements.txt

      - name: Run harness regression suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/h0-r8-evidence"
          python -m unittest discover -s tests/harness -v 2>&1 | tee "$RUNNER_TEMP/h0-r8-evidence/harness-unit.log"

      - name: Prove public exact-head state
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./CONTROL_DEVELOPMENT.ps1 -Status 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/h0-r8-evidence/control-status.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./CONTROL_DEVELOPMENT.ps1 -Plan 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/h0-r8-evidence/control-plan.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./CONTROL_DEVELOPMENT.ps1 -Resume 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/h0-r8-evidence/control-resume.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prove Git-only recovery
        shell: bash
        run: |
          set -euo pipefail
          recovery="$RUNNER_TEMP/h0-r8-recovery"
          git clone --no-tags https://github.com/rootfabric/distributed-world-simulator.git "$recovery"
          cd "$recovery"
          git checkout -B feature/h0-1-c22-current-main-r3 4c69de50c8374112d82efee2fd6917c770b3eae0
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          test "$(git branch --show-current)" = "feature/h0-1-c22-current-main-r3"
          test "$(git rev-parse HEAD)" = "4c69de50c8374112d82efee2fd6917c770b3eae0"
          test "$(git rev-parse origin/main)" = "4a42c2fb6befb386f5c3eb48d9ba070745e25bbb"
          python -m pip install -r scripts/harness/requirements.txt
          pwsh -File ./CONTROL_DEVELOPMENT.ps1 -Resume 2>&1 | tee "$RUNNER_TEMP/h0-r8-evidence/git-only-recovery-resume.log"

      - name: Pack exact R8 checkout
        if: always()
        shell: bash
        run: tar -czf "$RUNNER_TEMP/h0-r8-exact-4c69de50.tar.gz" .

      - name: Upload exact verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h0-r8-exact-validation-4c69de50
          path: |
            ${{ runner.temp }}/h0-r8-evidence
            ${{ runner.temp }}/h0-r8-exact-4c69de50.tar.gz
          if-no-files-found: error
          retention-days: 1
