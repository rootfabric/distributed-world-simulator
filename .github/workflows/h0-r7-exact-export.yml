name: H0.1 R8 Bounded Implementation

on:
  push:
    branches:
      - validation/h0-1-r7-exact-export

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dispatched R8 branch
        uses: actions/checkout@v4
        with:
          ref: feature/h0-1-c22-current-main-r3
          fetch-depth: 0

      - name: Pin dispatch and canonical main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          test "$(git branch --show-current)" = "feature/h0-1-c22-current-main-r3"
          test "$(git rev-parse HEAD)" = "f5f8e9adff508678c2e2f8d0cb1ddadae6db4b95"
          test "$(git rev-parse origin/main)" = "4a42c2fb6befb386f5c3eb48d9ba070745e25bbb"
          git cat-file -e 83954a5ca2b4f47ea140de208f572ee495378fca^{commit}
          test -z "$(git status --porcelain)"

      - name: Repair freshness fence and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          state_path = Path("scripts/harness/state_builder.py")
          state = state_path.read_text(encoding="utf-8")
          start = state.index("def _git_implementation_head(root: Path, execution_dir: Path) -> str:\n")
          end = state.index("\n\ndef _git_path_head", start)
          replacement = '''def _implementation_pathspecs(
              root: Path,
              execution_dir: Path,
              work_order: dict[str, Any],
          ) -> tuple[str, ...]:
              """Return review-freshness pathspecs for the active bounded implementation.

              The Work Order is the authority for implementation scope. Append-only execution
              records, branch passports and checkpoint-only documents are intentionally
              excluded so writing evidence cannot stale its own review target. The active
              transition table remains part of the implementation fence because it controls
              reducer semantics for this execution.
              """
              execution_prefix = f"{_repo_relative(root, execution_dir).rstrip('/')}/"
              excluded_prefixes = (execution_prefix, "config/control/branches/", "docs/checkpoints/")
              pathspecs: list[str] = []
              for raw_path in work_order["allowed_paths"]:
                  normalized = raw_path.replace("\\\\", "/")
                  if any(normalized.startswith(prefix) for prefix in excluded_prefixes):
                      continue
                  if normalized not in pathspecs:
                      pathspecs.append(normalized)

              transition_path = _repo_relative(root, execution_dir / "transition-table.v1.json")
              if transition_path not in pathspecs:
                  pathspecs.append(transition_path)
              if not pathspecs:
                  raise ContractValidationError("IMPLEMENTATION_PATHS_UNAVAILABLE")
              return tuple(pathspecs)


          def _git_implementation_head(
              root: Path,
              execution_dir: Path,
              work_order: dict[str, Any],
          ) -> str:
              """Return the latest commit touching the active bounded implementation."""
              implementation_paths = _implementation_pathspecs(root, execution_dir, work_order)
              output = subprocess.run(
                  ["git", "log", "-1", "--format=%H", "--", *implementation_paths],
                  cwd=root,
                  text=True,
                  capture_output=True,
                  check=False,
              )
              value = output.stdout.strip()
              if output.returncode != 0 or not re.fullmatch(r"[0-9a-f]{40}", value):
                  raise ContractValidationError("GIT_IMPLEMENTATION_HEAD_UNAVAILABLE")
              return value
          '''
          state = state[:start] + textwrap.dedent(replacement) + state[end:]
          old_call = "implementation_head = _git_implementation_head(root, execution_dir)"
          if state.count(old_call) != 1:
              raise SystemExit("IMPLEMENTATION_HEAD_CALL_NOT_UNIQUE")
          state = state.replace(old_call, 'implementation_head = _git_implementation_head(root, execution_dir, active["definition"])', 1)
          state_path.write_text(state, encoding="utf-8")

          test_path = Path("tests/harness/test_h0_control_harness.py")
          tests = test_path.read_text(encoding="utf-8")
          old_import = "from harness.state_builder import _validate_semantics, build_state"
          new_import = "from harness.state_builder import _implementation_pathspecs, _validate_semantics, build_state"
          if tests.count(old_import) != 1:
              raise SystemExit("STATE_BUILDER_IMPORT_NOT_UNIQUE")
          tests = tests.replace(old_import, new_import, 1)
          test_start = tests.index("    def test_implementation_freshness_scope_declares_runtime_and_excludes_ledger(self):\n")
          test_end = tests.index("    def test_current_diff_stays_inside_declared_scope(self):\n", test_start)
          block = (
              "    def test_implementation_freshness_scope_covers_runtime_without_self_staling_evidence(self):\n"
              "        pathspecs = _implementation_pathspecs(ROOT, ACTIVE_EXECUTION, self.work_order)\n"
              "        self.assertIn(\"scripts/harness/**\", pathspecs)\n"
              "        self.assertIn(\"scripts/construction/proxies/construction_proxy_incremental_local_rebuilder.gd\", pathspecs)\n"
              "        self.assertIn(\"RUN_WORLD_REGRESSION_TESTS.ps1\", pathspecs)\n"
              "        execution_prefix = f\"config/control/harness/executions/{self.epoch['epoch_id']}/\"\n"
              "        self.assertNotIn(f\"{execution_prefix}**\", pathspecs)\n"
              "        self.assertIn(f\"{execution_prefix}transition-table.v1.json\", pathspecs)\n"
              "        self.assertFalse(any(path.startswith(\"config/control/branches/\") for path in pathspecs))\n"
              "        self.assertFalse(any(path.startswith(\"docs/checkpoints/\") for path in pathspecs))\n"
              "\n"
              "        state = build_state(ROOT, ACTIVE_EXECUTION)\n"
              "        expected = subprocess.run(\n"
              "            [\"git\", \"log\", \"-1\", \"--format=%H\", \"--\", *pathspecs],\n"
              "            cwd=ROOT, text=True, capture_output=True, check=True,\n"
              "        ).stdout.strip()\n"
              "        self.assertEqual(expected, state[\"repository\"][\"implementation_head_sha\"])\n"
              "        self.assertEqual(expected, state[\"review\"][\"review_target_head_sha\"])\n"
              "\n"
          )
          tests = tests[:test_start] + block + tests[test_end:]
          test_path.write_text(tests, encoding="utf-8")
          PY
          python -m py_compile scripts/harness/state_builder.py tests/harness/test_h0_control_harness.py

      - name: Transfer exact SOURCE_ACCEPTED C22 blobs
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            RUN_C22_INCREMENTAL_REBUILD_TESTS.ps1
            RUN_C22_INCREMENTAL_REBUILD_TESTS.sh
            RUN_WORLD_REGRESSION_TESTS.ps1
            scripts/construction/proxies/construction_proxy_array_mesh_backend.gd
            scripts/construction/proxies/construction_proxy_artifact_merger.gd
            scripts/construction/proxies/construction_proxy_artifact_merger.gd.uid
            scripts/construction/proxies/construction_proxy_incremental_local_rebuilder.gd
            scripts/construction/proxies/construction_proxy_incremental_local_rebuilder.gd.uid
            scripts/construction/proxies/construction_proxy_streaming_controller.gd
            tests/construction/test_c22_incremental_local_rebuild.gd
            tests/construction/test_c22_incremental_local_rebuild.gd.uid
            tests/construction/test_c24_proxy_mesh_backend_contracts.gd
            validation/c22-incremental-local-rebuild-validation.json
          )
          git checkout 83954a5ca2b4f47ea140de208f572ee495378fca -- "${paths[@]}"
          declare -A expected=(
            [RUN_C22_INCREMENTAL_REBUILD_TESTS.ps1]=00aff2ea79b18b2d3df8477ba6f384274f91d021
            [RUN_C22_INCREMENTAL_REBUILD_TESTS.sh]=5fd401bd23e74848695b4355a661eea78bde8178
            [RUN_WORLD_REGRESSION_TESTS.ps1]=56dbe3e9510675ff99fa1bc6ca5156591c52ddbc
            [scripts/construction/proxies/construction_proxy_array_mesh_backend.gd]=9292910452ab8a729744dcdefaac0acfaaf3339b
            [scripts/construction/proxies/construction_proxy_artifact_merger.gd]=3946919011663e874179080aeba31f0cef4aa0ba
            [scripts/construction/proxies/construction_proxy_artifact_merger.gd.uid]=110c07cd03d89f77035b93495ccba49a7c6c4705
            [scripts/construction/proxies/construction_proxy_incremental_local_rebuilder.gd]=eb7ae1bde276d6354465bacc22a3b51d084d0538
            [scripts/construction/proxies/construction_proxy_incremental_local_rebuilder.gd.uid]=24ea3d281929c0e81f4ce26663d03900b68baf1f
            [scripts/construction/proxies/construction_proxy_streaming_controller.gd]=423c141a9017e272ea6c38ca67e469eb6c692926
            [tests/construction/test_c22_incremental_local_rebuild.gd]=bcd57e832d11cb72994d9054e9d07387a320fdbc
            [tests/construction/test_c22_incremental_local_rebuild.gd.uid]=940dbf523d7ca2b95c92ed4049bcb2f05d7dd323
            [tests/construction/test_c24_proxy_mesh_backend_contracts.gd]=74d87b70c902762f40e8e281cf492ab9ef7be218
            [validation/c22-incremental-local-rebuild-validation.json]=9fe3b7701f20bb83377a548c5da8131ca2160989
          )
          for path in "${paths[@]}"; do
            test "$(git hash-object "$path")" = "${expected[$path]}"
          done

      - name: Enforce bounded diff, commit and push
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 15
          git config user.name 'H0 R8 bounded worker'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/harness/state_builder.py tests/harness/test_h0_control_harness.py \
            RUN_C22_INCREMENTAL_REBUILD_TESTS.ps1 RUN_C22_INCREMENTAL_REBUILD_TESTS.sh RUN_WORLD_REGRESSION_TESTS.ps1 \
            scripts/construction/proxies/construction_proxy_array_mesh_backend.gd \
            scripts/construction/proxies/construction_proxy_artifact_merger.gd scripts/construction/proxies/construction_proxy_artifact_merger.gd.uid \
            scripts/construction/proxies/construction_proxy_incremental_local_rebuilder.gd scripts/construction/proxies/construction_proxy_incremental_local_rebuilder.gd.uid \
            scripts/construction/proxies/construction_proxy_streaming_controller.gd \
            tests/construction/test_c22_incremental_local_rebuild.gd tests/construction/test_c22_incremental_local_rebuild.gd.uid \
            tests/construction/test_c24_proxy_mesh_backend_contracts.gd validation/c22-incremental-local-rebuild-validation.json
          git diff --cached --name-only | tee "$RUNNER_TEMP/r8-changed-files.txt"
          test "$(git diff --cached --name-only | wc -l)" -eq 15
          git commit -m 'fix(h0.1): repair freshness fence and transfer C22'
          new_head="$(git rev-parse HEAD)"
          git push origin HEAD:feature/h0-1-c22-current-main-r3
          printf 'R8_IMPLEMENTATION_HEAD=%s\n' "$new_head" | tee "$RUNNER_TEMP/r8-implementation-head.txt"

      - name: Upload implementation evidence
        uses: actions/upload-artifact@v4
        with:
          name: h0-r8-implementation-head
          path: |
            ${{ runner.temp }}/r8-implementation-head.txt
            ${{ runner.temp }}/r8-changed-files.txt
          if-no-files-found: error
          retention-days: 1
