name: Sync Central Control Docs After H0.1 R8

on:
  push:
    branches:
      - validation/h0-1-r7-exact-export

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper
        uses: actions/checkout@v4
        with:
          ref: validation/h0-1-r7-exact-export
          path: helper

      - name: Checkout control docs
        uses: actions/checkout@v4
        with:
          ref: docs/h-primary-roadmap-refresh-r1
          fetch-depth: 0
          path: repo

      - name: Patch and validate control docs
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          test "$(git rev-parse origin/main)" = "4a42c2fb6befb386f5c3eb48d9ba070745e25bbb"
          grep -Fq '**Observed active runtime pilot:** `H0.1 R7 / PR #88`' docs/control/CURRENT_PROJECT_FRONTIERS_RU.md
          grep -Fq '**Observed active pilot:** `H0.1 R7 / PR #88`' docs/plans/H_PRIMARY_EXECUTION_ROADMAP_RU.md
          python ../helper/.ci/h0_r8_sync_control_docs.py
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'docs/control/CURRENT_PROJECT_FRONTIERS_RU.md'
          test "${changed[1]}" = 'docs/plans/H_PRIMARY_EXECUTION_ROADMAP_RU.md'
          ! grep -Fq '**Observed active runtime pilot:** `H0.1 R7 / PR #88`' docs/control/CURRENT_PROJECT_FRONTIERS_RU.md
          ! grep -Fq '# 3. CURRENT — H0.1 R7' docs/control/CURRENT_PROJECT_FRONTIERS_RU.md
          ! grep -Fq '**Observed active pilot:** `H0.1 R7 / PR #88`' docs/plans/H_PRIMARY_EXECUTION_ROADMAP_RU.md
          ! grep -Fq '## 2. CURRENT — H0.1 R7 / C22' docs/plans/H_PRIMARY_EXECUTION_ROADMAP_RU.md
          grep -Fq 'CURRENT = HUMAN C22_RUNTIME_MERGE' docs/control/CURRENT_PROJECT_FRONTIERS_RU.md
          grep -Fq 'CH -> NX    WATCH_HIT   global_blocking=true' docs/control/CURRENT_PROJECT_FRONTIERS_RU.md
          grep -Fq 'H0.1 R8 accepted / HUMAN C22 merge gate' docs/plans/H_PRIMARY_EXECUTION_ROADMAP_RU.md
          grep -Fq 'PR #87 остаётся Draft/merge-deferred' docs/plans/H_PRIMARY_EXECUTION_ROADMAP_RU.md

      - name: Commit and push control docs
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Project Control docs synchronizer'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/control/CURRENT_PROJECT_FRONTIERS_RU.md docs/plans/H_PRIMARY_EXECUTION_ROADMAP_RU.md
          git commit -m 'docs(control): advance current primary to C22 human merge gate'
          git push origin HEAD:docs/h-primary-roadmap-refresh-r1
          echo "CONTROL_DOCS_HEAD=$(git rev-parse HEAD)"
