name: MVP1 R11 Exact Provenance and Runtime Evidence
on:
  push:
    branches: [feature/v0-mvp-playable-seamless-planet-r1]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mvp1-r11-exact-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact-evidence:
    if: >-
      github.repository == 'rootfabric/distributed-world-simulator' &&
      github.actor == 'rootfabric' && github.triggering_actor == 'rootfabric' &&
      github.ref == 'refs/heads/feature/v0-mvp-playable-seamless-planet-r1' &&
      (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[mvp1-evidence]'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      BREAKPOINT_RUNTIME_DISABLED: '1'
      PLANET_SIMULATOR_INVENTORY_PROFILE: planet_default
      EXPECTED_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch actual refs and confirm exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          # Drive requires the declared local execution branch, not detached HEAD.
          # This creates only a local ref at the already pinned commit; no commit/push.
          git switch -c feature/v0-mvp-playable-seamless-planet-r1 "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Install pinned Harness dependency in disposable environment
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/mvp1-r11-venv"
          "$RUNNER_TEMP/mvp1-r11-venv/bin/python" -m pip install -r scripts/harness/requirements.txt
      - name: Obtain previously approved binary only
        uses: actions/download-artifact@v4
        with:
          name: p7-repair-engine-34117353691
          run-id: 34117353691
          repository: rootfabric/distributed-world-simulator
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/mvp1-r11-engine
      - name: Execute exact evidence producer
        shell: bash
        run: |
          set -euo pipefail
          export GODOT_BIN="$RUNNER_TEMP/mvp1-r11-engine/godot"
          test "$(sha256sum "$GODOT_BIN" | cut -d' ' -f1)" = bfa7ce632d8d4b1dcc96f64f5405ee52b57c4e25d15c3e0478acc26e08d517d7
          chmod u+x "$GODOT_BIN"
          "$RUNNER_TEMP/mvp1-r11-venv/bin/python" docs/control/mvp-act0-r1/validate_mvp1_r11.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mvp1-r11-exact-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mvp1-r11-exact/
          if-no-files-found: error
          retention-days: 90
