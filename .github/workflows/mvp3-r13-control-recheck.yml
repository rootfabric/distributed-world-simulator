name: MVP3 R13 Exact Control Recheck
on:
  push:
    branches: [control/v0-mvp3-closure-6a750d85-r1]
    paths: [.github/workflows/mvp3-r13-control-recheck.yml]
permissions:
  contents: read
jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: f1d453fb2af49231c30bdc5cbe415ad199394446
      EXPECTED_TREE: f1697cc52c1abc7f1bb21922c5fab3b49a3c167d
      FREEZE_REF: freeze/v0-mvp3-r13b-f1d453fb-r1
      PRODUCT_BRANCH: feature/v0-mvp-playable-seamless-planet-r1
      AUDITED_MAIN: 7dfc68ab5a1e90254a1b7039807f275b5da04eef
      PYTHONUTF8: '1'
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f1d453fb2af49231c30bdc5cbe415ad199394446
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact subject and restore product branch identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/mvp3-r13-control
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          test "$(git rev-parse origin/main)" = "$AUDITED_MAIN"
          test "$(git rev-parse origin/$FREEZE_REF)" = "$EXPECTED_HEAD"
          git switch -c "$PRODUCT_BRANCH" "$EXPECTED_HEAD"
          test "$(git branch --show-current)" = "$PRODUCT_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=no)"
          git rev-parse HEAD HEAD^{tree} origin/main > artifacts/mvp3-r13-control/subjects.txt
          python3 -m pip install --disable-pip-version-check -r scripts/harness/requirements.txt
      - name: Run exact control gates
        shell: bash
        run: |
          set -euo pipefail
          O=artifacts/mvp3-r13-control
          python3 -m unittest discover -s tests/harness -p 'test_*.py' -v 2>&1 | tee "$O/harness.log"
          pwsh -NoProfile -File CONTROL_DEVELOPMENT.ps1 -Plan 2>&1 | tee "$O/plan.log"
          pwsh -NoProfile -File CONTROL_DEVELOPMENT.ps1 -Drive 2>&1 | tee "$O/drive.log"
          set +e
          pwsh -NoProfile -File CONTROL_DEVELOPMENT.ps1 -CloseRole > "$O/close-role.log" 2>&1; CR=$?
          pwsh -NoProfile -File CONTROL_DEVELOPMENT.ps1 -CloseMission > "$O/close-mission.log" 2>&1; CM=$?
          set -e
          echo "$CR" > "$O/close-role.exit"; echo "$CM" > "$O/close-mission.exit"
          test "$CR" = 0 -o "$CR" = 7
          test "$CM" = 8
          python3 scripts/control/project_control.py --no-fetch --no-fail-on-red 2>&1 | tee "$O/pc0.log"
          python3 scripts/control/project_control_directional_watch.py --no-fail-on-red 2>&1 | tee "$O/directional-pc0.log"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Bind evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          o=pathlib.Path('artifacts/mvp3-r13-control'); o.mkdir(parents=True,exist_ok=True)
          def g(*a):
            p=subprocess.run(['git',*a],capture_output=True,text=True); return {'exit_code':p.returncode,'stdout':p.stdout.strip(),'stderr':p.stderr.strip()}
          fs=[]
          for p in sorted(o.rglob('*')):
            if p.is_file() and p.name!='manifest.json': fs.append({'path':str(p),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          m={'schema':'distributed_world_simulator.mvp3_r13_exact_control.v1','subject_head':g('rev-parse','HEAD'),'subject_tree':g('rev-parse','HEAD^{tree}'),'branch':g('branch','--show-current'),'canonical_main':g('rev-parse','origin/main'),'expected_head':os.environ['EXPECTED_HEAD'],'expected_tree':os.environ['EXPECTED_TREE'],'freeze_ref':os.environ['FREEZE_REF'],'carrier_sha':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'manual_input_executed':False,'independent_verdict':False,'mvp3_predicate_verified':False,'files':fs}
          (o/'manifest.json').write_text(json.dumps(m,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mvp3-r13-f1d453fb-control-recheck-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mvp3-r13-control/
          if-no-files-found: error
          retention-days: 90
