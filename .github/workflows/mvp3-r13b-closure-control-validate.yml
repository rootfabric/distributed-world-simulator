name: MVP3 R13b Closure Control Validation
on:
  push:
    branches: [control/v0-mvp3-predicate-verified-f1d453fb-r1]
    paths:
      - .github/workflows/mvp3-r13b-closure-control-validate.yml
      - config/control/harness/executions/E2026-09-09-V0-MVP-R1/**
permissions:
  contents: read
jobs:
  closure-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: scripts
      PYTHONUTF8: '1'
      EXECUTION: config/control/harness/executions/E2026-09-09-V0-MVP-R1
      PREDICATE: MVP_SEAM_NO_RECONNECT_OR_RESPAWN
    steps:
      - uses: actions/checkout@v4
        with:
          ref: control/v0-mvp3-predicate-verified-f1d453fb-r1
          fetch-depth: 0
          persist-credentials: false
      - name: Verify named closure branch and bounded diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "control/v0-mvp3-predicate-verified-f1d453fb-r1"
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          base=f1d453fb2af49231c30bdc5cbe415ad199394446
          test "$(git merge-base HEAD "$base")" = "$base"
          git diff --name-only "$base"..HEAD | tee closure-diff.txt
          python3 - <<'PY'
          import pathlib
          expected={
            'config/control/harness/executions/E2026-09-09-V0-MVP-R1/supporting-evidence/MVP3-R13B-CLOSURE-EVIDENCE-F1D453FB-R1.v1.json',
            'config/control/harness/executions/E2026-09-09-V0-MVP-R1/verifications/MVP3-INDEPENDENT-VERIFICATION-F1D453FB-R3.v1.json',
            'config/control/harness/executions/E2026-09-09-V0-MVP-R1/events/V0-MVP-R1-WO-001/0011-mvp3-seam-no-reconnect-or-respawn-verified.v1.json',
            '.github/workflows/mvp3-r13b-closure-control-validate.yml',
          }
          actual=set(pathlib.Path('closure-diff.txt').read_text().splitlines())
          assert actual==expected, (sorted(actual),sorted(expected))
          print('MVP3_CLOSURE_BOUNDED_DIFF_PASS')
          PY
      - name: Install pinned Harness dependencies
        run: python3 -m pip install --disable-pip-version-check -r scripts/harness/requirements.txt
      - name: Build exact execution state through production reducer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/mvp3-r13b-closure-control
          python3 - <<'PY' | tee artifacts/mvp3-r13b-closure-control/state-builder.json
          import json
          from pathlib import Path
          from harness.state_builder import build_state
          root=Path.cwd()
          execution=root/'config/control/harness/executions/E2026-09-09-V0-MVP-R1'
          state=build_state(root,execution)
          print(json.dumps(state,ensure_ascii=False,sort_keys=True,separators=(',',':')))
          raw=json.dumps(state,ensure_ascii=False)
          assert 'MVP_SEAM_NO_RECONNECT_OR_RESPAWN' in raw
          assert 'IN_PROGRESS' in raw
          print('MVP3_PRODUCTION_REDUCER_ACCEPTED_SEQUENCE_11')
          PY
      - name: Run full Harness regression on closure candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/harness -p 'test_*.py' -v 2>&1 | tee artifacts/mvp3-r13b-closure-control/full-harness.log
      - name: Run Control Status Plan Drive on named branch
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -File ./CONTROL_DEVELOPMENT.ps1 -Status -Execution "$EXECUTION" | tee artifacts/mvp3-r13b-closure-control/status.log
          pwsh -NoProfile -File ./CONTROL_DEVELOPMENT.ps1 -Plan -Execution "$EXECUTION" | tee artifacts/mvp3-r13b-closure-control/plan.log
          pwsh -NoProfile -File ./CONTROL_DEVELOPMENT.ps1 -Drive -Execution "$EXECUTION" | tee artifacts/mvp3-r13b-closure-control/drive.log
      - name: Prove whole mission remains non-terminal
        shell: bash
        run: |
          set -uo pipefail
          pwsh -NoProfile -File ./CONTROL_DEVELOPMENT.ps1 -CloseMission -Execution "$EXECUTION" > artifacts/mvp3-r13b-closure-control/close-mission.log 2>&1
          code=$?
          cat artifacts/mvp3-r13b-closure-control/close-mission.log
          test "$code" -eq 8
          grep -q 'MISSION_EXIT_FORBIDDEN' artifacts/mvp3-r13b-closure-control/close-mission.log
          echo MVP3_PARENT_REMAINS_OPEN_PASS
      - name: Upload closure control evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp3-r13b-closure-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/mvp3-r13b-closure-control/
            closure-diff.txt
          if-no-files-found: error
          retention-days: 90
