name: MVP4 Shared Canonical Dig Exact Validation
on:
  push:
    branches: [feature/v0-mvp-playable-seamless-planet-r1]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mvp4-shared-dig-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact:
    if: github.repository == 'rootfabric/distributed-world-simulator' && github.ref == 'refs/heads/feature/v0-mvp-playable-seamless-planet-r1' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[mvp4-evidence]'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_HEAD: ${{ github.sha }}
      PYTHONUTF8: '1'
      PYTHONPATH: scripts
      BREAKPOINT_RUNTIME_DISABLED: '1'
      GODOT_SILENCE_ROOT_WARNING: '1'
      PLANET_SIMULATOR_INVENTORY_PROFILE: planet_default
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=no)"
          git merge-base --is-ancestor e80ff5a37f30729509f0a7d307cbb44f44dc23ac HEAD
          git diff --check e80ff5a37f30729509f0a7d307cbb44f44dc23ac HEAD
          echo "EXPECTED_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          mkdir -p artifacts/mvp4-exact
          if ! command -v Xvfb >/dev/null || ! command -v xauth >/dev/null; then
            sudo -n apt-get update
            sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri
          fi
      - uses: actions/download-artifact@v4
        with:
          name: p7-repair-engine-34117353691
          run-id: 34117353691
          repository: rootfabric/distributed-world-simulator
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/mvp4-engine
      - name: Focused and actual graphical execution with MVP3 regressions
        shell: bash
        run: |
          set -euo pipefail
          export GODOT_BIN="$RUNNER_TEMP/mvp4-engine/godot"
          test "$(sha256sum "$GODOT_BIN" | cut -d' ' -f1)" = bfa7ce632d8d4b1dcc96f64f5405ee52b57c4e25d15c3e0478acc26e08d517d7
          chmod u+x "$GODOT_BIN"
          xvfb-run -a -s '-screen 0 1600x900x24' python3 docs/control/mvp-act0-r1/validate_mvp4_exact.py
      - name: Bind raw evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          out=pathlib.Path('artifacts/mvp4-exact');out.mkdir(parents=True,exist_ok=True)
          git=lambda *a:subprocess.check_output(['git',*a],text=True).strip()
          m={'schema':'distributed_world_simulator.mvp4_exact_manifest.v1','subject_head':git('rev-parse','HEAD'),'subject_tree':git('rev-parse','HEAD^{tree}'),'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'tracked_after':git('status','--porcelain','--untracked-files=no'),'mvp4_predicate_verified':False,'files':[]}
          engine=pathlib.Path(os.environ['RUNNER_TEMP'])/'mvp4-engine/godot'
          m['engine_sha256']=hashlib.sha256(engine.read_bytes()).hexdigest() if engine.is_file() else None
          for p in sorted(out.rglob('*')):
              if p.is_file() and p!=out/'manifest.json':m['files'].append({'path':p.relative_to(out).as_posix(),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          (out/'manifest.json').write_text(json.dumps(m,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mvp4-exact-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mvp4-exact/
          if-no-files-found: error
          retention-days: 90
