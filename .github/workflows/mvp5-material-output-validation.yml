name: MVP5 Exact Named-Branch Control Driver b78de498
on:
  push:
    branches: [control/v0-mvp5-exact-driver-b78de498-r1]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mvp5-control-driver-b78-${{ github.ref }}
  cancel-in-progress: false
jobs:
  control-drive:
    if: github.repository == 'rootfabric/distributed-world-simulator' && github.ref == 'refs/heads/control/v0-mvp5-exact-driver-b78de498-r1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: b78de4980328bb7b4d19e030bb7f0fa5d9976cd8
      EXPECTED_TREE: 0bfdd7595e10f007815bb666e62e7c5575172173
      SUBJECT_BRANCH: feature/v0-mvp-playable-seamless-planet-r1
      PYTHONUTF8: '1'
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b78de4980328bb7b4d19e030bb7f0fa5d9976cd8
          fetch-depth: 0
          persist-credentials: false
      - name: Bind unchanged product subject to its actual execution branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain --untracked-files=no)"
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          test "$(git rev-parse "origin/$SUBJECT_BRANCH")" = "$EXPECTED_HEAD"
          git checkout -B "$SUBJECT_BRANCH" "$EXPECTED_HEAD"
          git branch --set-upstream-to="origin/$SUBJECT_BRANCH" "$SUBJECT_BRANCH"
          test "$(git symbolic-ref --short HEAD)" = "$SUBJECT_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          mkdir -p artifacts/mvp5-control-drive
          git rev-parse HEAD HEAD^{tree} origin/main > artifacts/mvp5-control-drive/subjects.txt
          python3 - <<'PY'
          import json,os
          w=json.load(open('config/control/harness/executions/E2026-09-09-V0-MVP-R1/work-orders/V0-MVP-R1-WO-001.v1.json'))
          assert w['branch']==os.environ['SUBJECT_BRANCH']
          assert w['state']=='IN_PROGRESS'
          print('EXACT_NAMED_PRODUCT_CHECKOUT_PASS')
          PY
      - name: Install and verify pinned Harness dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r scripts/harness/requirements.txt
          python3 - <<'PY'
          import importlib.metadata
          from pathlib import Path
          required=Path('scripts/harness/requirements.txt').read_text(encoding='utf-8').strip()
          expected=required.split('==',1)[1]
          actual=importlib.metadata.version('jsonschema')
          if actual != expected: raise SystemExit(f'PINNED_DEPENDENCY_VERSION_MISMATCH:{actual}:{expected}')
          print(f'PINNED DEPENDENCY OK: jsonschema=={actual}')
          PY
      - name: Exact branch-aware Status Resume Drive
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -File ./CONTROL_DEVELOPMENT.ps1 -Status 2>&1 | tee artifacts/mvp5-control-drive/status.log
          pwsh -NoProfile -File ./CONTROL_DEVELOPMENT.ps1 -Resume 2>&1 | tee artifacts/mvp5-control-drive/resume.log
          pwsh -NoProfile -File ./CONTROL_DEVELOPMENT.ps1 -Drive 2>&1 | tee artifacts/mvp5-control-drive/drive.log
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Bind driver provenance and exact product evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          out=pathlib.Path('artifacts/mvp5-control-drive');out.mkdir(parents=True,exist_ok=True)
          def git(*a):
              p=subprocess.run(['git',*a],text=True,capture_output=True)
              return {'exit_code':p.returncode,'stdout':p.stdout.strip(),'stderr':p.stderr.strip()}
          files=[{'path':p.relative_to(out).as_posix(),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(out.rglob('*')) if p.is_file() and p!=out/'manifest.json']
          m={'schema':'distributed_world_simulator.mvp5_control_driver_exact.v1','subject_head':git('rev-parse','HEAD'),'subject_tree':git('rev-parse','HEAD^{tree}'),'subject_branch':git('symbolic-ref','--short','HEAD'),'expected_head':os.environ['EXPECTED_HEAD'],'expected_tree':os.environ['EXPECTED_TREE'],'canonical_main':git('rev-parse','origin/main'),'driver_head':os.environ['GITHUB_SHA'],'driver_branch':os.environ['GITHUB_REF_NAME'],'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'tracked_after':git('status','--porcelain','--untracked-files=no'),'read_only_driver':True,'mvp5_predicate_verified':False,'independent_verdict':False,'files':files}
          (out/'manifest.json').write_text(json.dumps(m,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mvp5-control-drive-b78de498-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mvp5-control-drive/
          if-no-files-found: error
          retention-days: 90
