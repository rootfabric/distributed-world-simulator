name: MVP5 P2 Frozen Reproduction Diagnostic
on:
  push:
    branches:
      - control/v0-mvp5-p2-repro-b78de498-r1
    paths:
      - .github/workflows/mvp5-material-output-validation.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mvp5-p2-frozen-repro-${{ github.ref }}
  cancel-in-progress: false
jobs:
  frozen-p2-repeat:
    if: github.repository == 'rootfabric/distributed-world-simulator' && github.ref == 'refs/heads/control/v0-mvp5-p2-repro-b78de498-r1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRODUCT_HEAD: b78de4980328bb7b4d19e030bb7f0fa5d9976cd8
      PRODUCT_TREE: 0bfdd7595e10f007815bb666e62e7c5575172173
      CARRIER_HEAD: ${{ github.sha }}
      ENGINE_SHA: bfa7ce632d8d4b1dcc96f64f5405ee52b57c4e25d15c3e0478acc26e08d517d7
      PYTHONUTF8: '1'
      PYTHONPATH: scripts
      BREAKPOINT_RUNTIME_DISABLED: '1'
      GODOT_SILENCE_ROOT_WARNING: '1'
      PLANET_SIMULATOR_INVENTORY_PROFILE: planet_default
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b78de4980328bb7b4d19e030bb7f0fa5d9976cd8
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: p7-repair-engine-34117353691
          run-id: 34117353691
          repository: rootfabric/distributed-world-simulator
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/mvp5-p2-engine
      - name: Exact frozen P2 repeated three times without source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,shutil,signal,subprocess,time
          out=pathlib.Path('artifacts/mvp5-p2-repro');out.mkdir(parents=True,exist_ok=True)
          def git(*args):
              return subprocess.check_output(['git',*args],text=True).strip()
          actual_head=git('rev-parse','HEAD');actual_tree=git('rev-parse','HEAD^{tree}')
          assert actual_head==os.environ['PRODUCT_HEAD'], 'PRODUCT_HEAD_MISMATCH'
          assert actual_tree==os.environ['PRODUCT_TREE'], 'PRODUCT_TREE_MISMATCH'
          assert not git('status','--porcelain','--untracked-files=no'), 'TRACKED_DIRTY_BEFORE'
          engine=pathlib.Path(os.environ['RUNNER_TEMP'])/'mvp5-p2-engine/godot'
          assert hashlib.sha256(engine.read_bytes()).hexdigest()==os.environ['ENGINE_SHA'], 'ENGINE_SHA_MISMATCH'
          engine.chmod(engine.stat().st_mode|0o100)
          os.environ['GODOT_BIN']=str(engine)
          def run(label,args,timeout):
              command=[str(engine),*args];started=time.monotonic();timed_out=False
              log=out/(label+'.log')
              with log.open('w') as stream:
                  process=subprocess.Popen(command,stdout=stream,stderr=subprocess.STDOUT,start_new_session=True)
                  try:
                      code=process.wait(timeout=timeout)
                  except subprocess.TimeoutExpired:
                      timed_out=True
                      try: os.killpg(process.pid,signal.SIGKILL)
                      except ProcessLookupError: pass
                      process.wait();code=124
              text=log.read_text(errors='replace')
              errors=[line[:400] for line in text.splitlines() if re.match(r'^(?:SCRIPT ERROR:|ERROR:)',line)]
              return {'label':label,'command':command,'exit_code':code,'duration_seconds':round(time.monotonic()-started,3),'timed_out':timed_out,'error_markers':errors[:8],'passed':code==0 and not errors}
          imported=run('fresh-import',['--headless','--path','.','--editor','--import','--quit'],240)
          repeats=[]
          if imported['passed']:
              for index in range(1,4):
                  previous=set(pathlib.Path('artifacts/test-results').glob('v0-p2-live-shared-state-*'))
                  result=run('p2-repeat-'+str(index),['--headless','--path','.','--script','tests/runtime/test_v0_p2_live_shared_state_convergence.gd'],300)
                  current=set(pathlib.Path('artifacts/test-results').glob('v0-p2-live-shared-state-*'))-previous
                  result['native_results']=[]
                  for root in sorted(current):
                      target=out/('repeat-'+str(index))/root.name;target.mkdir(parents=True,exist_ok=True)
                      for source in sorted(root.iterdir()):
                          if source.is_file() and source.suffix in ('.json','.log'):
                              shutil.copy2(source,target/source.name)
                      actor_path=root/'actor.json'
                      actor=json.loads(actor_path.read_text()) if actor_path.is_file() else {}
                      result['native_results'].append({'root':str(root),'actor_state':actor.get('state'),'actor_passed':actor.get('passed'),'actor_failures':actor.get('failures'),'actor_error_code':actor.get('details',{}).get('error_code')})
                  if len(current)!=1 or any(r['actor_passed'] is not True for r in result['native_results']):
                      result['passed']=False
                  repeats.append(result)
                  (out/'repetitions.json').write_text(json.dumps(repeats,indent=2)+'\n')
                  print(json.dumps(result,sort_keys=True))
          tracked_after=git('status','--porcelain','--untracked-files=no')
          identity_unchanged=git('rev-parse','HEAD')==actual_head and git('rev-parse','HEAD^{tree}')==actual_tree
          passed=imported['passed'] and len(repeats)==3 and all(r['passed'] for r in repeats) and not tracked_after and identity_unchanged
          summary={'schema':'distributed_world_simulator.mvp5_p2_frozen_reproduction.v1','product_head':actual_head,'product_tree':actual_tree,'carrier_head':os.environ['CARRIER_HEAD'],'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'engine_sha256':os.environ['ENGINE_SHA'],'fresh_import':imported,'repetitions':repeats,'tracked_after':tracked_after,'identity_unchanged':identity_unchanged,'passed':passed,'full_world_core_executed':False,'independent_verdict':False,'mvp5_predicate_verified':False}
          (out/'summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          raise SystemExit(0 if passed else 1)
          PY
      - name: Preserve digest-bound diagnostic evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          out=pathlib.Path('artifacts/mvp5-p2-repro');out.mkdir(parents=True,exist_ok=True)
          def git(*args):
              p=subprocess.run(['git',*args],capture_output=True,text=True)
              return {'exit_code':p.returncode,'stdout':p.stdout.strip(),'stderr':p.stderr.strip()}
          engine=pathlib.Path(os.environ['RUNNER_TEMP'])/'mvp5-p2-engine/godot'
          files=[{'path':p.relative_to(out).as_posix(),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(out.rglob('*')) if p.is_file() and p!=out/'manifest.json']
          m={'schema':'distributed_world_simulator.mvp5_p2_frozen_reproduction_manifest.v1','product_head':os.environ['PRODUCT_HEAD'],'product_tree':os.environ['PRODUCT_TREE'],'carrier_head':os.environ['CARRIER_HEAD'],'actual_head':git('rev-parse','HEAD'),'actual_tree':git('rev-parse','HEAD^{tree}'),'tracked_after':git('status','--porcelain','--untracked-files=no'),'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'actual_engine_sha256':hashlib.sha256(engine.read_bytes()).hexdigest() if engine.is_file() else None,'full_world_core_executed':False,'independent_verdict':False,'mvp5_predicate_verified':False,'files':files}
          (out/'manifest.json').write_text(json.dumps(m,indent=2)+'\n')
          print(json.dumps({'product_head':m['product_head'],'files':len(files)}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mvp5-p2-repro-b78de498-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mvp5-p2-repro/
          if-no-files-found: error
          retention-days: 90
