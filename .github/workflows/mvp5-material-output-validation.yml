name: MVP5 Exactly Once Material Output
on:
  push:
    branches:
      - feature/v0-mvp-playable-seamless-planet-r1
      - control/v0-mvp5-worldcore-b78de498-r1
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mvp5-exact-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact:
    if: github.repository == 'rootfabric/distributed-world-simulator' && github.ref == 'refs/heads/feature/v0-mvp-playable-seamless-planet-r1' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[mvp5-evidence]'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPECTED_HEAD: ${{ github.sha }}
      PYTHONUTF8: '1'
      PYTHONPATH: scripts
      BREAKPOINT_RUNTIME_DISABLED: '1'
      GODOT_SILENCE_ROOT_WARNING: '1'
      PLANET_SIMULATOR_INVENTORY_PROFILE: planet_default
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact subject and parent scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=no)"
          git merge-base --is-ancestor d78760738e8032b97de2a433382fc7ddafa17fbf HEAD
          git diff --check d78760738e8032b97de2a433382fc7ddafa17fbf HEAD
          echo "EXPECTED_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          mkdir -p artifacts/mvp5-exact
          python3 - <<'PY'
          import fnmatch,json,subprocess
          w=json.load(open('config/control/harness/executions/E2026-09-09-V0-MVP-R1/work-orders/V0-MVP-R1-WO-001.v1.json'))
          base='d78760738e8032b97de2a433382fc7ddafa17fbf'
          sync_main=subprocess.check_output(['git','merge-base','HEAD','origin/main'],text=True).strip()
          paths=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          feature_paths=[]
          inherited_main_paths=[]
          for p in paths:
              inherited=subprocess.run(['git','diff','--quiet',sync_main,'HEAD','--',p],check=False).returncode == 0
              if inherited:
                  inherited_main_paths.append(p)
                  continue
              feature_paths.append(p)
              if not any(fnmatch.fnmatchcase(p,g) for g in w['allowed_paths']) or any(fnmatch.fnmatchcase(p,g) for g in w['forbidden_paths']):
                  raise SystemExit('MVP5_WRITE_FENCE:'+p)
          print('MVP5_WRITE_FENCE_PASS',len(feature_paths),'feature_paths',len(inherited_main_paths),'inherited_main_paths','sync_main',sync_main)
          PY
          if ! command -v Xvfb >/dev/null || ! command -v xauth >/dev/null; then
            sudo -n apt-get update
            sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri
          fi
      - uses: actions/download-artifact@v4
        with:
          name: p7-repair-engine-34117353691
          run-id: 34117353691
          repository: rootfabric/distributed-world-simulator
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/mvp5-engine
      - name: Exact focused, five-process material and unchanged MVP4-MVP3 regressions
        shell: bash
        run: |
          set -euo pipefail
          export GODOT_BIN="$RUNNER_TEMP/mvp5-engine/godot"
          test "$(sha256sum "$GODOT_BIN" | cut -d' ' -f1)" = bfa7ce632d8d4b1dcc96f64f5405ee52b57c4e25d15c3e0478acc26e08d517d7
          chmod u+x "$GODOT_BIN"
          xvfb-run -a -s '-screen 0 1600x900x24' python3 docs/control/mvp-act0-r1/validate_mvp5_exact.py
      - name: Bind exact raw evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          out=pathlib.Path('artifacts/mvp5-exact');out.mkdir(parents=True,exist_ok=True)
          git=lambda *a:subprocess.check_output(['git',*a],text=True).strip()
          engine=pathlib.Path(os.environ['RUNNER_TEMP'])/'mvp5-engine/godot'
          summary=json.loads((out/'summary.json').read_text()) if (out/'summary.json').is_file() else {}
          graphical=json.loads((out/'graphical/manifest.json').read_text()) if (out/'graphical/manifest.json').is_file() else {}
          files=[{'path':p.relative_to(out).as_posix(),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(out.rglob('*')) if p.is_file() and p!=out/'manifest.json']
          m={'schema':'distributed_world_simulator.mvp5_exact_manifest.v1','subject_head':git('rev-parse','HEAD'),'subject_tree':git('rev-parse','HEAD^{tree}'),'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'tracked_after':git('status','--porcelain','--untracked-files=no'),'engine_sha256':hashlib.sha256(engine.read_bytes()).hexdigest() if engine.is_file() else None,'ci_passed':summary.get('passed') is True,'mvp5_predicate_verified':False,'independent_verdict':False,'full_world_core_executed':False,'graphical_mvp5_executed':bool(graphical),'graphical_mvp5_passed':graphical.get('passed') is True,'files':files}
          (out/'manifest.json').write_text(json.dumps(m,indent=2)+'\n')
          print(json.dumps({'head':m['subject_head'],'tree':m['subject_tree'],'ci_passed':m['ci_passed'],'graphical_mvp5_passed':m['graphical_mvp5_passed'],'files':len(files)}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mvp5-exact-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mvp5-exact/
          if-no-files-found: error
          retention-days: 90

  exact-product-world-core:
    if: github.repository == 'rootfabric/distributed-world-simulator' && github.ref == 'refs/heads/control/v0-mvp5-worldcore-b78de498-r1'
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      PRODUCT_HEAD: b78de4980328bb7b4d19e030bb7f0fa5d9976cd8
      PRODUCT_TREE: 0bfdd7595e10f007815bb666e62e7c5575172173
      CARRIER_HEAD: ${{ github.sha }}
      ENGINE_SHA: bfa7ce632d8d4b1dcc96f64f5405ee52b57c4e25d15c3e0478acc26e08d517d7
      PYTHONUTF8: '1'
      PYTHONPATH: scripts
      BREAKPOINT_RUNTIME_DISABLED: '1'
      GODOT_SILENCE_ROOT_WARNING: '1'
      PLANET_SIMULATOR_INVENTORY_PROFILE: planet_default
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b78de4980328bb7b4d19e030bb7f0fa5d9976cd8
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact frozen product and live feature ref
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          test "$(git rev-parse HEAD)" = "$PRODUCT_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$PRODUCT_TREE"
          test "$(git rev-parse origin/feature/v0-mvp-playable-seamless-planet-r1)" = "$PRODUCT_HEAD"
          test -z "$(git status --porcelain --untracked-files=no)"
          mkdir -p artifacts/mvp5-world-core
          {
            echo "carrier_head=$CARRIER_HEAD"
            echo "product_head=$(git rev-parse HEAD)"
            echo "product_tree=$(git rev-parse HEAD^{tree})"
            echo "feature_remote=$(git rev-parse origin/feature/v0-mvp-playable-seamless-planet-r1)"
            echo "canonical_main=$(git rev-parse origin/main)"
          } > artifacts/mvp5-world-core/subjects.txt
          if [ ! -x /usr/bin/Xvfb ] || ! command -v xauth >/dev/null; then
            sudo -n apt-get update
            sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri
          fi
      - uses: actions/download-artifact@v4
        with:
          name: p7-repair-engine-34117353691
          run-id: 34117353691
          repository: rootfabric/distributed-world-simulator
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/mvp5-world-core-engine
      - name: Run canonical unchanged full world-core suite
        shell: bash
        run: |
          set -euo pipefail
          export GODOT_BIN="$RUNNER_TEMP/mvp5-world-core-engine/godot"
          test "$(sha256sum "$GODOT_BIN" | cut -d' ' -f1)" = "$ENGINE_SHA"
          chmod u+x "$GODOT_BIN"
          "$GODOT_BIN" --version | tee artifacts/mvp5-world-core/godot-version.log
          pwsh -NoProfile -File RUN_WORLD_REGRESSION_TESTS.ps1 2>&1 | tee artifacts/mvp5-world-core/world-core.log
          test "$(git rev-parse HEAD)" = "$PRODUCT_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$PRODUCT_TREE"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Prove literal soak and main-scene terminal gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('artifacts/test-results/world-regression-summary.json')
          if not p.is_file(): raise SystemExit('WORLD_CORE_SUMMARY_MISSING')
          d=json.loads(p.read_text())
          if d.get('passed') is not True: raise SystemExit('WORLD_CORE_SUMMARY_NOT_PASS')
          steps=d.get('steps') or []
          failed=[s for s in steps if not bool(s.get('passed')) or int(s.get('exit_code',0)) != 0]
          if failed: raise SystemExit('WORLD_CORE_FAILED_STEPS:'+json.dumps(failed[:5],sort_keys=True))
          by_name={str(s.get('name','')):s for s in steps}
          soak=by_name.get('test_v0_p6_thirty_minute_soak')
          main=by_name.get('main_scene_cli_all')
          if not soak or soak.get('passed') is not True or int(soak.get('exit_code',-1)) != 0: raise SystemExit('THIRTY_MINUTE_SOAK_NOT_PASS')
          if float(soak.get('duration_seconds',0)) < 1800.0: raise SystemExit('THIRTY_MINUTE_SOAK_DURATION_TOO_SHORT')
          if not main or main.get('passed') is not True or int(main.get('exit_code',-1)) != 0: raise SystemExit('MAIN_SCENE_CLI_ALL_NOT_PASS')
          report={'schema':'distributed_world_simulator.mvp5_world_core_acceptance.v1','passed':True,'declared_test_count':d.get('declared_test_count'),'discovered_test_count':d.get('discovered_test_count'),'step_count':len(steps),'failed_step_count':0,'nonzero_exit_count':0,'thirty_minute_soak':soak,'main_scene_cli_all':main}
          pathlib.Path('artifacts/mvp5-world-core/world-core-acceptance.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - name: Bind exact product world-core evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          out=pathlib.Path('artifacts/mvp5-world-core'); out.mkdir(parents=True,exist_ok=True)
          def g(*a):
              p=subprocess.run(['git',*a],capture_output=True,text=True)
              return {'exit_code':p.returncode,'stdout':p.stdout.strip(),'stderr':p.stderr.strip()}
          files=[]
          for root in [out,pathlib.Path('artifacts/test-results')]:
              if not root.exists(): continue
              for p in sorted(root.rglob('*')):
                  if p.is_file() and p != out/'manifest.json' and not any(x.startswith('world-profile-') or x in ('user-data','.godot') for x in p.parts):
                      files.append({'path':str(p),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          engine=pathlib.Path(os.environ['RUNNER_TEMP'])/'mvp5-world-core-engine/godot'
          m={'schema':'distributed_world_simulator.mvp5_full_world_core_exact_product.v1','product_head':os.environ['PRODUCT_HEAD'],'product_tree':os.environ['PRODUCT_TREE'],'carrier_head':os.environ['CARRIER_HEAD'],'actual_head':g('rev-parse','HEAD'),'actual_tree':g('rev-parse','HEAD^{tree}'),'feature_remote':g('rev-parse','origin/feature/v0-mvp-playable-seamless-planet-r1'),'canonical_main':g('rev-parse','origin/main'),'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'actual_engine_sha256':hashlib.sha256(engine.read_bytes()).hexdigest() if engine.is_file() else None,'tracked_after':g('status','--porcelain','--untracked-files=no'),'full_world_core_executed':True,'independent_verdict':False,'mvp5_predicate_verified':False,'files':files}
          (out/'manifest.json').write_text(json.dumps(m,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mvp5-world-core-b78de498-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/mvp5-world-core/
            artifacts/test-results/
            !artifacts/**/world-profile-*/**
            !artifacts/**/user-data/**
          if-no-files-found: error
          retention-days: 90
