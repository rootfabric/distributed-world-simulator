name: MVP6 Journal Main Full Harness Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3b82145ae946bb51aebf67f048a28420368b40be
          fetch-depth: 0
      - name: Exact main repair and full canonical Harness invocation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 3b82145ae946bb51aebf67f048a28420368b40be
          test "$(git rev-parse HEAD^{tree})" = 6b1b8c9ead5c16d15dc8565813d3abb1bf94d880
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          python3 -m pip install --disable-pip-version-check -r scripts/harness/requirements.txt
          mkdir -p artifacts/full-harness
          set +e
          python3 -m unittest discover -s tests/harness -p 'test_*.py' -v > artifacts/full-harness/tests.log 2>&1
          code=$?
          set -e
          export HARNESS_EXIT="$code"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys
          git=lambda *a:subprocess.check_output(['git',*a],text=True).strip()
          p=pathlib.Path('artifacts/full-harness/tests.log')
          result=dict(head=git('rev-parse','HEAD'),tree=git('rev-parse','HEAD^{tree}'),canonical_main=git('rev-parse','origin/main'),argv=['python3','-m','unittest','discover','-s','tests/harness','-p','test_*.py','-v'],exit_code=int(os.environ['HARNESS_EXIT']),log_sha256=hashlib.sha256(p.read_bytes()).hexdigest(),tracked_status=git('status','--porcelain','--untracked-files=no'),run_id=os.environ['GITHUB_RUN_ID'],python=sys.version,diagnostic_only=True,mvp6_verified=False)
          (p.parent/'summary.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
          print('\n'.join(p.read_text(errors='replace').splitlines()[-65:]))
          PY
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journal-full-harness-${{ github.run_id }}
          path: artifacts/full-harness
          if-no-files-found: error
          retention-days: 90
