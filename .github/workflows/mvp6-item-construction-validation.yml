name: MVP6 Journal Resolution Exact Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  journal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      BREAKPOINT_RUNTIME_DISABLED: '1'
      PLANET_SIMULATOR_INVENTORY_PROFILE: planet_default
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3b82145ae946bb51aebf67f048a28420368b40be
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: p7-repair-engine-34117353691
          run-id: 34117353691
          repository: rootfabric/distributed-world-simulator
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/engine
      - name: Exact Linux main integration candidate
        shell: bash
        run: |
          set -euo pipefail
          export GODOT_BIN="$RUNNER_TEMP/engine/godot"
          chmod u+x "$GODOT_BIN"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,subprocess
          git=lambda *a:subprocess.check_output(['git',*a],text=True).strip()
          head=git('rev-parse','HEAD');tree=git('rev-parse','HEAD^{tree}')
          assert head=='3b82145ae946bb51aebf67f048a28420368b40be'
          assert tree=='6b1b8c9ead5c16d15dc8565813d3abb1bf94d880'
          assert not git('status','--porcelain')
          engine=os.environ['GODOT_BIN'];sha=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          assert sha(engine)=='bfa7ce632d8d4b1dcc96f64f5405ee52b57c4e25d15c3e0478acc26e08d517d7'
          out=pathlib.Path('artifacts/journal-linux');out.mkdir(parents=True)
          specs=[('import',['--editor','--import','--quit'],None),('rollback',['--script','res://tests/runtime/test_v0_mvp_6_prediction_rollback.gd'],77),('nx6',['--script','res://tests/network/test_nx6_predicted_item_interactions.gd'],940),('bridge',['--script','res://tests/network/test_nx6_predicted_item_interactions_integration.gd'],66)]
          rows=[]
          for name,args,count in specs:
              log=out/(name+'.log');argv=[engine,'--headless','--path','.']+args
              with log.open('wb') as f: code=subprocess.run(argv,stdout=f,stderr=subprocess.STDOUT,timeout=240).returncode
              text=log.read_text(errors='replace');counts=[int(n) for n in re.findall(r'PASS \((\d+) assertions\)',text)]
              fatal=re.findall(r'(?m)^\s*(?:SCRIPT ERROR|ERROR):.*|.*Parse Error.*|.*Compile Error.*',text)
              rows.append(dict(name=name,argv=argv,exit_code=code,assertions=counts,fatal=fatal,passed=code==0 and not fatal and (count is None or counts==[count]),sha256=sha(log)))
              (out/'commands.json').write_text(json.dumps(rows,indent=2)+'\n')
          report=dict(head=head,tree=tree,engine_sha256=sha(engine),run_id=os.environ['GITHUB_RUN_ID'],commands=rows,tracked_clean=not git('status','--porcelain','--untracked-files=no'),mvp6_verified=False)
          report['passed']=all(r['passed'] for r in rows) and report['tracked_clean']
          (out/'summary.json').write_text(json.dumps(report,indent=2)+'\n')
          assert report['passed'],report
          PY
      - name: Exact feature NX repair composition, never canonical clearance
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          test "$(git rev-parse origin/main)" = 6982a563dd0c88c81449566131852c601ae89868
          git worktree add --detach "$RUNNER_TEMP/feature" 73b8818184c93986e3313f35f9f4548c608e47e6
          cd "$RUNNER_TEMP/feature"
          export GODOT_BIN="$RUNNER_TEMP/engine/godot"
          export EXPECTED_HEAD=73b8818184c93986e3313f35f9f4548c608e47e6
          export GITHUB_REF_NAME=feature/v0-mvp-playable-seamless-planet-r1
          export MVP6_NX_JOURNAL_REPAIR_HEAD="$EXPECTED_HEAD"
          export MVP6_NX_PROBE_OUTPUT="$GITHUB_WORKSPACE/artifacts/journal-nx-linux"
          export MVP6_NX_PROBE_WORKTREE="$RUNNER_TEMP/nx-composition"
          python3 docs/control/mvp-act0-r1/mvp6_nx_dependency_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journal-resolution-exact-${{ github.run_id }}
          path: artifacts/journal*
          if-no-files-found: error
          retention-days: 90
