name: MVP6 Native Prerequisite Diagnostic
on:
  push:
    branches: [feature/v0-mvp-playable-seamless-planet-r1]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mvp6-prerequisite-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostic:
    if: github.repository == 'rootfabric/distributed-world-simulator' && github.ref == 'refs/heads/feature/v0-mvp-playable-seamless-planet-r1' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[mvp6-diagnostic]'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_HEAD: ${{ github.sha }}
      PYTHONUTF8: '1'
      PYTHONPATH: scripts
      BREAKPOINT_RUNTIME_DISABLED: '1'
      GODOT_SILENCE_ROOT_WARNING: '1'
      PLANET_SIMULATOR_INVENTORY_PROFILE: planet_default
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Probe exact current-main PC0 before historical prerequisite fence
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r scripts/harness/requirements.txt
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          export MVP6_MAIN_PC0_OUTPUT="$RUNNER_TEMP/mvp6-current-main-pc0"
          export MVP6_MAIN_PC0_WORKTREE="$RUNNER_TEMP/mvp6-current-main-worktree"
          python3 docs/control/mvp-act0-r1/mvp6_current_main_pc0_probe.py
      - name: Upload exact current-main PC0 probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp6-current-main-pc0-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mvp6-current-main-pc0/
          if-no-files-found: error
          retention-days: 90
      - name: Download pinned double Godot for NX dependency probe
        uses: actions/download-artifact@v4
        with:
          name: p7-repair-engine-34117353691
          run-id: 34117353691
          repository: rootfabric/distributed-world-simulator
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/mvp6-nx-engine
      - name: Revalidate exact current V0 critical M4 blob against current NX consumer
        shell: bash
        run: |
          set -euo pipefail
          export GODOT_BIN="$RUNNER_TEMP/mvp6-nx-engine/godot"
          chmod u+x "$GODOT_BIN"
          export MVP6_NX_PROBE_OUTPUT="$RUNNER_TEMP/mvp6-nx-dependency"
          export MVP6_NX_PROBE_WORKTREE="$RUNNER_TEMP/mvp6-nx-consumer-worktree"
          python3 docs/control/mvp-act0-r1/mvp6_nx_dependency_probe.py
      - name: Upload exact NX dependency probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp6-nx-dependency-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mvp6-nx-dependency/
          if-no-files-found: error
          retention-days: 90
      - name: Exact subject and diagnostic-only write fence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=no)"
          git switch -c "$GITHUB_REF_NAME" "$EXPECTED_HEAD"
          test "$(git symbolic-ref --short HEAD)" = "$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor bc360383b78f0778cac136fe1d9c3a7d656c687b HEAD
          git diff --check bc360383b78f0778cac136fe1d9c3a7d656c687b HEAD
          echo "EXPECTED_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import fnmatch,json,subprocess
          w=json.load(open('config/control/harness/executions/E2026-09-09-V0-MVP-R1/work-orders/V0-MVP-R1-WO-001.v1.json'))
          paths=subprocess.check_output(['git','diff','--name-only','bc360383b78f0778cac136fe1d9c3a7d656c687b','HEAD'],text=True).splitlines()
          for p in paths:
              if not any(fnmatch.fnmatchcase(p,g) for g in w['allowed_paths']) or any(fnmatch.fnmatchcase(p,g) for g in w['forbidden_paths']):
                  raise SystemExit('MVP6_WRITE_FENCE:'+p)
              if p.startswith(('scripts/','scenes/')):
                  raise SystemExit('MVP6_DIAGNOSTIC_MUST_NOT_CHANGE_RUNTIME:'+p)
          subprocess.run(['git','diff','--exit-code','bc360383b78f0778cac136fe1d9c3a7d656c687b','HEAD','--','tests/runtime/test_v0_mvp3_live_owner_handoff.gd','tests/runtime/test_v0_mvp_5_exactly_once_material.gd'],check=True)
          print('MVP6_DIAGNOSTIC_WRITE_FENCE_PASS',len(paths))
          PY
      - uses: actions/download-artifact@v4
        with:
          name: p7-repair-engine-34117353691
          run-id: 34117353691
          repository: rootfabric/distributed-world-simulator
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/mvp6-engine
      - name: Reproduce prerequisite and run unchanged native focused controls
        shell: bash
        run: |
          set -euo pipefail
          export GODOT_BIN="$RUNNER_TEMP/mvp6-engine/godot"
          test "$(sha256sum "$GODOT_BIN" | cut -d' ' -f1)" = bfa7ce632d8d4b1dcc96f64f5405ee52b57c4e25d15c3e0478acc26e08d517d7
          chmod u+x "$GODOT_BIN"
          python3 docs/control/mvp-act0-r1/validate_mvp6_prerequisite.py
      - name: Read-only Harness Drive and human-decision close gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          python3 -m pip install --disable-pip-version-check -r scripts/harness/requirements.txt
          python3 - <<'PY'
          import json,pathlib,subprocess
          out=pathlib.Path('artifacts/mvp6-prerequisite');out.mkdir(parents=True,exist_ok=True)
          rows=[]
          for mode in ('Drive','CloseMission'):
              argv=['pwsh','-NoProfile','-File','./CONTROL_DEVELOPMENT.ps1','-'+mode,'-Checkpoint','V0_PLAYABLE_SEAMLESS_PLANET_COMPOSITION_ACCEPTANCE']
              target=out/('harness-'+mode.lower()+'.log')
              with target.open('w',encoding='utf-8') as log:
                  try: code=subprocess.run(argv,stdout=log,stderr=subprocess.STDOUT,timeout=180,check=False).returncode
                  except subprocess.TimeoutExpired: code=124
              documents=[]
              for line in target.read_text(encoding='utf-8-sig').splitlines():
                  if line.startswith('{'):
                      try: documents.append(json.loads(line))
                      except json.JSONDecodeError: pass
              (out/('harness-'+mode.lower()+'.json')).write_text(json.dumps(documents,indent=2)+'\n')
              row={'mode':mode,'argv':argv,'exit_code':code,'json_documents':len(documents)}
              rows.append(row)
              print('MVP6_HARNESS',json.dumps(row))
          (out/'harness-commands.json').write_text(json.dumps(rows,indent=2)+'\n')
          if any(r['exit_code']!=0 or r['json_documents']==0 for r in rows):
              raise SystemExit('MVP6_CONTROLLER_BOUNDARY_NOT_ESTABLISHED:inspect harness logs')
          PY
      - name: Bind complete diagnostic and controller evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          out=pathlib.Path('artifacts/mvp6-prerequisite');out.mkdir(parents=True,exist_ok=True)
          git=lambda *a:subprocess.check_output(['git',*a],text=True).strip()
          summary=json.loads((out/'summary.json').read_text()) if (out/'summary.json').is_file() else {}
          files=[{'path':p.relative_to(out).as_posix(),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(out.rglob('*')) if p.is_file() and p.name!='ci-manifest.json']
          record={'schema':'distributed_world_simulator.mvp6_prerequisite_ci_manifest.v1','subject_head':git('rev-parse','HEAD'),'subject_tree':git('rev-parse','HEAD^{tree}'),'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'tracked_after':git('status','--porcelain','--untracked-files=no'),'diagnostic_passed':summary.get('diagnostic_passed') is True,'mvp6_product_passed':False,'independent_verdict':False,'files':files}
          target=out/'ci-manifest.json';target.write_text(json.dumps(record,indent=2)+'\n')
          print('MVP6_CI_MANIFEST_SHA256='+hashlib.sha256(target.read_bytes()).hexdigest())
          print(json.dumps({'head':record['subject_head'],'tree':record['subject_tree'],'diagnostic_passed':record['diagnostic_passed'],'mvp6_product_passed':False,'files':len(files)}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mvp6-prerequisite-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mvp6-prerequisite/
          if-no-files-found: error
          retention-days: 90
  mvp7-recovery:
    if: github.repository == 'rootfabric/distributed-world-simulator' && github.ref == 'refs/heads/feature/v0-mvp-playable-seamless-planet-r1' && contains(github.event.head_commit.message, '[mvp7-evidence]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_HEAD: ${{ github.sha }}
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: scripts
      BREAKPOINT_RUNTIME_DISABLED: '1'
      GODOT_SILENCE_ROOT_WARNING: '1'
      PLANET_SIMULATOR_INVENTORY_PROFILE: planet_default
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact MVP7 subject and inherited write fence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=no)"
          git switch -c "$GITHUB_REF_NAME" "$EXPECTED_HEAD"
          git diff --check 8d10bcf896547476d6f9a1db8769fa8c41110291 HEAD
          python3 - <<'PY'
          import fnmatch,json,subprocess
          base='8d10bcf896547476d6f9a1db8769fa8c41110291'
          path='config/control/harness/executions/E2026-09-09-V0-MVP-R1/work-orders/V0-MVP-R1-WO-001.v1.json'
          w=json.load(open(path))
          paths=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          for p in paths:
              assert any(fnmatch.fnmatchcase(p,g) for g in w['allowed_paths']), 'OUTSIDE_ALLOWED:'+p
              assert not any(fnmatch.fnmatchcase(p,g) for g in w['forbidden_paths']), 'FORBIDDEN:'+p
          subprocess.run(['git','diff','--exit-code',base,'HEAD','--',path,'tests/runtime/test_v0_mvp3_live_owner_handoff.gd','tests/runtime/test_v0_mvp_5_exactly_once_material.gd','tests/runtime/test_v0_mvp_6_native_item_handoff.gd'],check=True)
          print('MVP7_SCOPE_EXACT_PASS',len(paths))
          PY
          python3 -m pip install --disable-pip-version-check -r scripts/harness/requirements.txt
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
      - name: Record non-terminal Harness entry boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/mvp7-control
          pwsh -NoProfile -File ./CONTROL_DEVELOPMENT.ps1 -Drive -Checkpoint V0_PLAYABLE_SEAMLESS_PLANET_COMPOSITION_ACCEPTANCE > artifacts/mvp7-control/drive-before.log 2>&1
      - uses: actions/download-artifact@v4
        with:
          name: p7-repair-engine-34117353691
          run-id: 34117353691
          repository: rootfabric/distributed-world-simulator
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/mvp7-engine
      - name: Three exact native recovery processes
        shell: bash
        run: |
          set -euo pipefail
          engine="$RUNNER_TEMP/mvp7-engine/godot"
          test "$(sha256sum "$engine" | cut -d' ' -f1)" = bfa7ce632d8d4b1dcc96f64f5405ee52b57c4e25d15c3e0478acc26e08d517d7
          chmod u+x "$engine"
          python3 docs/control/mvp-act0-r1/validate_mvp7_native.py --engine "$engine" --output "$PWD/artifacts/mvp7-native"
      - name: Real ENet reconnect and current-state graphical resync
        shell: bash
        run: |
          set -euo pipefail
          engine="$RUNNER_TEMP/mvp7-engine/godot"
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get update
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri
          xvfb-run -a -s '-screen 0 1600x900x24' python3 tests/integration/test_v0_mvp_7_graphical_reconnect.py --engine "$engine" --output "$PWD/artifacts/mvp7-graphical-reconnect"
      - name: Bounded raw diagnostics
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          for p in sorted(pathlib.Path('artifacts/mvp7-native').glob('*.log')):
              lines=p.read_text(encoding='utf-8',errors='replace').splitlines()
              selected=[(i,line) for i,line in enumerate(lines) if any(k in line for k in ('MVP7_', 'Parse Error:', 'SCRIPT ERROR:'))]
              print('MVP7_LOG',p.name,'lines',len(lines),'matches',len(selected))
              for i,line in selected[:30]:
                  print(i+1,line[:600])
                  for context in lines[i+1:i+3]: print(context[:600])
          PY
      - name: Observe parent without accepting it
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/mvp7-control
          pwsh -NoProfile -File ./CONTROL_DEVELOPMENT.ps1 -Drive -Checkpoint V0_PLAYABLE_SEAMLESS_PLANET_COMPOSITION_ACCEPTANCE > artifacts/mvp7-control/drive-after.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mvp7-native-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/mvp7-native/
            artifacts/mvp7-graphical-reconnect/
            artifacts/mvp7-control/
          if-no-files-found: error
          retention-days: 90

  mvp8-workload:
    if: github.repository == 'rootfabric/distributed-world-simulator' && github.ref == 'refs/heads/feature/v0-mvp-playable-seamless-planet-r1' && contains(github.event.head_commit.message, '[mvp8-evidence]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_HEAD: ${{ github.sha }}
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: scripts
      BREAKPOINT_RUNTIME_DISABLED: '1'
      GODOT_SILENCE_ROOT_WARNING: '1'
      PLANET_SIMULATOR_INVENTORY_PROFILE: planet_default
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact MVP8 subject and write fence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=no)"
          git switch -c "$GITHUB_REF_NAME" "$EXPECTED_HEAD"
          base='eab67e7d9913de13dc696aa6e3ff9d267f7ceaa1'
          git merge-base --is-ancestor "$base" HEAD
          git diff --check "$base" HEAD
          echo "EXPECTED_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import fnmatch,json,subprocess
          base='eab67e7d9913de13dc696aa6e3ff9d267f7ceaa1'
          path='config/control/harness/executions/E2026-09-09-V0-MVP-R1/work-orders/V0-MVP-R1-WO-001.v1.json'
          w=json.load(open(path))
          paths=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          for p in paths:
              assert any(fnmatch.fnmatchcase(p,g) for g in w['allowed_paths']), 'OUTSIDE_ALLOWED:'+p
              assert not any(fnmatch.fnmatchcase(p,g) for g in w['forbidden_paths']), 'FORBIDDEN:'+p
          subprocess.run(['git','diff','--exit-code',base,'HEAD','--',path],check=True)
          print('MVP8_SCOPE_EXACT_PASS',len(paths))
          PY
          python3 -m py_compile tests/integration/test_v0_mvp_8_bounded_workload.py
      - uses: actions/download-artifact@v4
        with:
          name: p7-repair-engine-34117353691
          run-id: 34117353691
          repository: rootfabric/distributed-world-simulator
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/mvp8-engine
      - name: Exact bounded connected workload
        shell: bash
        run: |
          set -euo pipefail
          engine="$RUNNER_TEMP/mvp8-engine/godot"
          test "$(sha256sum "$engine" | cut -d' ' -f1)" = bfa7ce632d8d4b1dcc96f64f5405ee52b57c4e25d15c3e0478acc26e08d517d7
          chmod u+x "$engine"
          if ! command -v Xvfb >/dev/null || ! command -v xauth >/dev/null; then
            sudo -n apt-get update
            sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri
          fi
          mkdir -p artifacts/mvp8-workload
          "$engine" --headless --path . --editor --import --quit > artifacts/mvp8-workload/import.log 2>&1
          xvfb-run -a -s '-screen 0 1600x900x24' python3 tests/integration/test_v0_mvp_8_bounded_workload.py --engine "$engine" --output "$PWD/artifacts/mvp8-workload/live"
      - name: Bounded MVP8 diagnostics
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          root=pathlib.Path('artifacts/mvp8-workload')
          for p in sorted(root.rglob('*.log')):
              lines=p.read_text(encoding='utf-8',errors='replace').splitlines()
              selected=[(i,line) for i,line in enumerate(lines) if any(k in line for k in ('MVP8_', 'Parse Error:', 'SCRIPT ERROR:', 'ERROR:'))]
              if selected:
                  print('MVP8_LOG',p.relative_to(root),'lines',len(lines),'matches',len(selected))
                  for i,line in selected[:40]:
                      print(i+1,line[:800])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mvp8-workload-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mvp8-workload/
          if-no-files-found: error
          retention-days: 90
