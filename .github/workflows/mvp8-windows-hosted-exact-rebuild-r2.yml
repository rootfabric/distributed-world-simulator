name: MVP8 Hosted Windows 2022 Exact Rebuild Probe

on:
  push:
    branches:
      - control/v0-mvp8-windows-hosted-exact-rebuild-r2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mvp8-hosted-windows-2022-exact-rebuild-r2
  cancel-in-progress: false

jobs:
  exact-windows-rebuild-and-closure:
    name: Rebuild exact double Godot then verify frozen MVP8
    runs-on: windows-2022
    timeout-minutes: 240
    env:
      SUBJECT_HEAD: 90bc1026f0f5749492107191233330f87c8c70df
      SUBJECT_TREE: 4b6f2d48f7ef8d9c441ae89d2cbb02c730ef7f71
      GODOT_SOURCE_COMMIT: a13da4feb8d8aefc283c3763d33a2f170a18d541
      EXPECTED_GODOT_VERSION: 4.7.1.stable.double.custom_build.a13da4feb
      EXPECTED_GODOT_SHA256: 3633c3e609c8ce2f9bae334a9c7e75c7f974de3af0415ab4a8050a625a15a7a5
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      BREAKPOINT_RUNTIME_DISABLED: '1'
      GODOT_SILENCE_ROOT_WARNING: '1'
      PLANET_SIMULATOR_INVENTORY_PROFILE: planet_default

    steps:
      - name: Checkout exact Godot source
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: a13da4feb8d8aefc283c3763d33a2f170a18d541
          path: godot
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout frozen MVP8 product
        uses: actions/checkout@v4
        with:
          ref: 90bc1026f0f5749492107191233330f87c8c70df
          path: simulator
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python for Godot build
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Prepare evidence and verify frozen source identity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $evidence = Join-Path $PWD "evidence"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          Push-Location simulator
          try {
            $head = (git rev-parse HEAD).Trim()
            $tree = (git rev-parse "HEAD^{tree}").Trim()
            $tracked = @(git status --porcelain --untracked-files=no)
          } finally {
            Pop-Location
          }
          if ($head -ne $env:SUBJECT_HEAD) { throw "SUBJECT_HEAD_MISMATCH:$head" }
          if ($tree -ne $env:SUBJECT_TREE) { throw "SUBJECT_TREE_MISMATCH:$tree" }
          if ($tracked.Count -ne 0) { throw "TRACKED_CHECKOUT_DIRTY_BEFORE" }
          [ordered]@{
            schema = "distributed_world_simulator.mvp8_hosted_windows_probe.v1"
            subject_head = $head
            subject_tree = $tree
            godot_source_commit = $env:GODOT_SOURCE_COMMIT
            expected_godot_version = $env:EXPECTED_GODOT_VERSION
            expected_godot_sha256 = $env:EXPECTED_GODOT_SHA256
            runner_name = $env:RUNNER_NAME
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            tracked_clean_before = $true
          } | ConvertTo-Json -Depth 6 | Set-Content -Encoding UTF8 (Join-Path $evidence "probe-input.json")

      - name: Install SCons
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --disable-pip-version-check --no-input "scons>=4.8,<4.10"
          scons --version

      - name: Install canonical Windows build dependencies
        shell: pwsh
        working-directory: godot
        run: |
          $ErrorActionPreference = "Stop"
          python misc/scripts/install_d3d12_sdk_windows.py
          python misc/scripts/install_winrt.py
          python misc/scripts/install_accesskit.py

      - name: Build Windows double editor from exact source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $log = Join-Path $PWD "evidence\godot-build.log"
          Push-Location godot
          try {
            & scons platform=windows target=editor arch=x86_64 precision=double -j4 *> $log
            $code = $LASTEXITCODE
          } finally {
            Pop-Location
          }
          Get-Content -LiteralPath $log
          [ordered]@{
            exit_code = $code
            command = "scons platform=windows target=editor arch=x86_64 precision=double -j4"
          } | ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $PWD "evidence\godot-build-exit.json")
          if ($code -ne 0) { throw "GODOT_BUILD_FAILED:$code" }

      - name: Require byte-exact canonical Windows Godot
        id: engine
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $candidates = @(
            Get-ChildItem -LiteralPath (Join-Path $PWD "godot\bin") -File -ErrorAction Stop |
              Where-Object { $_.Name -match "godot\.windows\.editor\.double\.x86_64\.console\.exe$" }
          )
          if ($candidates.Count -ne 1) {
            throw "GODOT_CONSOLE_CANDIDATE_COUNT:$($candidates.Count)"
          }
          $bin = $candidates[0].FullName
          $version = (& $bin --version 2>&1 | Select-Object -First 1).Trim()
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $bin).Hash.ToLowerInvariant()
          $bytes = (Get-Item -LiteralPath $bin).Length

          [ordered]@{
            schema = "distributed_world_simulator.godot_windows_exact_rebuild_result.v1"
            source_commit = $env:GODOT_SOURCE_COMMIT
            platform = "windows"
            target = "editor"
            arch = "x86_64"
            precision = "double"
            binary = $bin
            bytes = $bytes
            version = $version
            sha256 = $sha
            expected_version = $env:EXPECTED_GODOT_VERSION
            expected_sha256 = $env:EXPECTED_GODOT_SHA256
            version_exact = ($version -eq $env:EXPECTED_GODOT_VERSION)
            sha256_exact = ($sha -eq $env:EXPECTED_GODOT_SHA256)
          } | ConvertTo-Json -Depth 6 | Set-Content -Encoding UTF8 (Join-Path $PWD "evidence\godot-identity.json")

          Write-Host "rebuilt_version=$version"
          Write-Host "rebuilt_sha256=$sha"
          Write-Host "rebuilt_bytes=$bytes"

          if ($version -ne $env:EXPECTED_GODOT_VERSION) { throw "GODOT_VERSION_MISMATCH:$version" }
          if ($sha -ne $env:EXPECTED_GODOT_SHA256) { throw "GODOT_SHA256_MISMATCH:$sha" }

          "GODOT_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "godot_bin=$bin" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Healthy-host preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $evidence = Join-Path $PWD "evidence"
          $os = Get-CimInstance Win32_OperatingSystem
          $freeGb = [Math]::Round(($os.FreePhysicalMemory * 1KB) / 1GB, 3)
          $totalGb = [Math]::Round(($os.TotalVisibleMemorySize * 1KB) / 1GB, 3)
          $godotProcesses = @(Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.ProcessName -like "godot*" })
          [ordered]@{
            schema = "distributed_world_simulator.mvp8_windows_host_preflight.v1"
            windows_caption = $os.Caption
            windows_version = $os.Version
            windows_build = $os.BuildNumber
            free_physical_gb = $freeGb
            total_physical_gb = $totalGb
            existing_godot_processes = @($godotProcesses | ForEach-Object { [ordered]@{ id=$_.Id; name=$_.ProcessName } })
          } | ConvertTo-Json -Depth 6 | Set-Content -Encoding UTF8 (Join-Path $evidence "host-preflight.json")
          if ($godotProcesses.Count -ne 0) { throw "HOST_PREFLIGHT_EXISTING_GODOT_PROCESSES" }
          if ($freeGb -lt 6.0) { throw "HOST_PREFLIGHT_LOW_FREE_RAM_$($freeGb)GB" }

      - name: Fresh exact Windows MVP8 runtime
        shell: pwsh
        working-directory: simulator
        run: |
          $ErrorActionPreference = "Stop"
          $evidence = Join-Path (Split-Path $PWD -Parent) "evidence"
          $live = Join-Path $evidence "mvp8-live"
          $snapshot = Join-Path $evidence "mvp8-live-snapshot"
          $log = Join-Path $evidence "mvp8-runtime.log"
          if (Test-Path $live) { throw "MVP8_LIVE_ALREADY_EXISTS" }
          & python tests/integration/test_v0_mvp_8_bounded_workload.py --engine "$env:GODOT_BIN" --output "$live" *> "$log"
          $code = $LASTEXITCODE
          Get-Content -LiteralPath $log
          if ($code -ne 0) { throw "MVP8_RUNTIME_FAILED:$code" }

          Copy-Item -LiteralPath $live -Destination $snapshot -Recurse
          $manifest = Get-Content -Raw -LiteralPath (Join-Path $snapshot "manifest.json") | ConvertFrom-Json
          if ($manifest.passed -ne $true) { throw "MVP8_MANIFEST_NOT_PASS" }
          if ($manifest.subject_head -ne $env:SUBJECT_HEAD -or $manifest.subject_tree -ne $env:SUBJECT_TREE) { throw "MVP8_SUBJECT_MISMATCH" }
          if (@($manifest.checks.PSObject.Properties).Count -ne 20) { throw "MVP8_CHECK_COUNT" }
          if (@($manifest.checks.PSObject.Properties | Where-Object { $_.Value -ne $true }).Count -ne 0) { throw "MVP8_FALSE_CHECK" }
          if (@($manifest.negative_controls).Count -ne 14) { throw "MVP8_NEGATIVE_COUNT" }
          if (@($manifest.fatal_logs).Count -ne 0) { throw "MVP8_FATAL_LOGS" }

          $required = @(
            "phase1\authority-a.json","phase1\authority-b.json","phase1\gateway.json",
            "phase1\client-a.json","phase1\client-b.json","phase1\reconnect-a.json",
            "phase2\authority-a.json","phase2\authority-b.json","phase2\gateway.json",
            "phase2\client-a.json","phase2\client-b.json"
          )
          foreach ($rel in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path $snapshot $rel) -PathType Leaf)) {
              throw "MVP8_REQUIRED_RAW_FILE_MISSING:$rel"
            }
          }

          $hashRows = @(
            Get-ChildItem -LiteralPath $snapshot -Recurse -File |
              Sort-Object FullName |
              ForEach-Object {
                [ordered]@{
                  path = $_.FullName.Substring($snapshot.Length).TrimStart("\").Replace("\","/")
                  bytes = $_.Length
                  sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
                }
              }
          )
          [ordered]@{
            schema = "distributed_world_simulator.mvp8_windows_snapshot_hashes.v1"
            files = $hashRows
          } | ConvertTo-Json -Depth 8 | Set-Content -Encoding UTF8 (Join-Path $evidence "mvp8-snapshot-hashes.json")

      - name: Independent Windows full world core
        shell: pwsh
        working-directory: simulator
        run: |
          $ErrorActionPreference = "Stop"
          $evidence = Join-Path (Split-Path $PWD -Parent) "evidence"
          $managed = Join-Path $evidence "world-core-managed"
          New-Item -ItemType Directory -Force -Path $managed | Out-Null

          $env:MVP7_NATIVE_MODE = "produce"
          $env:MVP7_NATIVE_ROOT = Join-Path $managed "native"
          $env:MVP7_NATIVE_RESULT = Join-Path $managed "native-result.json"
          $env:MVP7_WORLD_MODE = "produce"
          $env:MVP7_WORLD_ROOT = Join-Path $managed "world"
          $env:MVP7_WORLD_RESULT = Join-Path $managed "world-result.json"
          $env:MVP7_CONSTRUCTION_MODE = "produce"
          $env:MVP7_CONSTRUCTION_ROOT = Join-Path $managed "construction"
          $env:MVP7_CONSTRUCTION_RESULT = Join-Path $managed "construction-result.json"
          foreach ($p in @($env:MVP7_NATIVE_ROOT,$env:MVP7_WORLD_ROOT,$env:MVP7_CONSTRUCTION_ROOT)) {
            New-Item -ItemType Directory -Force -Path $p | Out-Null
          }

          $log = Join-Path $evidence "world-core.log"
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\RUN_WORLD_REGRESSION_TESTS.ps1" *> "$log"
          $code = $LASTEXITCODE
          Get-Content -LiteralPath $log
          [ordered]@{ exit_code=$code; finished_at_utc=[DateTime]::UtcNow.ToString("o") } |
            ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $evidence "world-core-exit.json")
          if ($code -ne 0) { throw "WORLD_CORE_FAILED:$code" }

          $summarySource = Join-Path $PWD "artifacts\test-results\world-regression-summary.json"
          if (-not (Test-Path -LiteralPath $summarySource -PathType Leaf)) { throw "WORLD_CORE_SUMMARY_MISSING" }
          Copy-Item -LiteralPath $summarySource -Destination (Join-Path $evidence "world-regression-summary.json")
          $summary = Get-Content -Raw -LiteralPath $summarySource | ConvertFrom-Json
          if ($summary.passed -ne $true) { throw "WORLD_CORE_SUMMARY_NOT_PASS" }
          if ($summary.declared_test_count -ne $summary.discovered_test_count) { throw "WORLD_CORE_DISCOVERY_MISMATCH" }
          $failed = @($summary.steps | Where-Object { $_.passed -ne $true })
          if ($failed.Count -ne 0) { throw "WORLD_CORE_FAILED_STEPS:$($failed.Count)" }

      - name: Bind final evidence
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $evidence = Join-Path $PWD "evidence"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null

          $head = $null
          $tree = $null
          $tracked = @()
          if (Test-Path -LiteralPath "simulator") {
            Push-Location simulator
            try {
              $head = (git rev-parse HEAD).Trim()
              $tree = (git rev-parse "HEAD^{tree}").Trim()
              $tracked = @(git status --porcelain --untracked-files=no)
            } finally { Pop-Location }
          }

          $identityPath = Join-Path $evidence "godot-identity.json"
          $manifestPath = Join-Path $evidence "mvp8-live-snapshot\manifest.json"
          $worldPath = Join-Path $evidence "world-regression-summary.json"
          $identity = if (Test-Path $identityPath) { Get-Content -Raw $identityPath | ConvertFrom-Json } else { $null }
          $manifest = if (Test-Path $manifestPath) { Get-Content -Raw $manifestPath | ConvertFrom-Json } else { $null }
          $world = if (Test-Path $worldPath) { Get-Content -Raw $worldPath | ConvertFrom-Json } else { $null }

          $result = [ordered]@{
            schema = "distributed_world_simulator.mvp8_hosted_windows_exact_rebuild_carrier.v1"
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            frozen_subject_head = $head
            frozen_subject_tree = $tree
            exact_subject_match = ($head -eq $env:SUBJECT_HEAD -and $tree -eq $env:SUBJECT_TREE)
            source_tracked_clean_after = ($tracked.Count -eq 0)
            godot_identity_present = ($null -ne $identity)
            godot_version_exact = if ($null -ne $identity) { $identity.version_exact } else { $false }
            godot_sha256_exact = if ($null -ne $identity) { $identity.sha256_exact } else { $false }
            godot_actual_sha256 = if ($null -ne $identity) { $identity.sha256 } else { $null }
            mvp8_manifest_present = ($null -ne $manifest)
            mvp8_passed = if ($null -ne $manifest) { $manifest.passed } else { $false }
            mvp8_check_count = if ($null -ne $manifest) { @($manifest.checks.PSObject.Properties).Count } else { 0 }
            mvp8_negative_count = if ($null -ne $manifest) { @($manifest.negative_controls).Count } else { 0 }
            world_core_summary_present = ($null -ne $world)
            world_core_passed = if ($null -ne $world) { $world.passed } else { $false }
            world_core_declared = if ($null -ne $world) { $world.declared_test_count } else { $null }
            world_core_discovered = if ($null -ne $world) { $world.discovered_test_count } else { $null }
            world_core_steps = if ($null -ne $world) { @($world.steps).Count } else { $null }
            world_core_failed_steps = if ($null -ne $world) { @($world.steps | Where-Object { $_.passed -ne $true }).Count } else { $null }
            predicate_verified = $false
            independent_verdict = $false
          }
          $result | ConvertTo-Json -Depth 8 | Set-Content -Encoding UTF8 (Join-Path $evidence "carrier-summary.json")

          Get-ChildItem -LiteralPath $evidence -Recurse -File |
            Sort-Object FullName |
            ForEach-Object {
              [ordered]@{
                path = $_.FullName.Substring($evidence.Length).TrimStart("\").Replace("\","/")
                bytes = $_.Length
                sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
              }
            } | ConvertTo-Json -Depth 6 | Set-Content -Encoding UTF8 (Join-Path $evidence "all-evidence-hashes.json")

      - name: Upload hosted Windows probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp8-hosted-windows-2022-exact-rebuild-r2
          path: evidence/
          if-no-files-found: error
          retention-days: 90
