name: NET-SMOOTH1 R22 Strict Attested Flush Analyzer
on:
  push:
    branches:
      - tools/net-smooth1-r31p23r22-analyzer-r1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact native R2.2 ON and legacy OFF source tests
        run: |
          set -euo pipefail
          git merge-base --is-ancestor fb513173df4c73c607fd8cb6680ad108c76f41ac HEAD
          python -m py_compile tools/net_smooth1/analyze_r31p23r2_flush_layers.py
          python -m unittest discover -s tests/tools -p 'test_net_smooth1_r31p23r2_flush_layers.py' -v
          python -m unittest discover -s tests/tools -p 'test_net_smooth1_r31p23r2_source_contracts.py' -v
          python -m unittest discover -s tests/tools -p 'test_net_smooth1_r31p23r21_source_contracts.py' -v
          python -m unittest discover -s tests/tools -p 'test_net_smooth1_r31p23r22_source_contracts.py' -v
          test -z "$(git status --porcelain --untracked-files=no)"
