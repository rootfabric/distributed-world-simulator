name: NET-SMOOTH1 R4.2 R3C3 R1 Staged Earth Exact

on:
  push:
    branches:
      - feature/net-smooth1-r42-r3c3-r1-staged-earth-geometry
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: net-smooth-r42-r3c3-r1-staged-earth
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Geometry CPU-only source and initial duplicate baseline
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/tools -p test_net_smooth1_r42_r3c3_r1_source_contract.py -v
          python -m unittest discover -s tests/tools -p test_net_smooth1_r42_r3c3_earth_hotpath_audit.py -v
          python -m unittest discover -s tests/tools -p test_net_smooth1_r42_r3c2_source_contract.py -v
          python -m unittest discover -s tests/tools -p test_net_smooth1_r42_r3c2_fault_contract.py -v
          python tools/net_smooth1/r3c3_earth_hotpath_audit.py --require-baseline-blocking
  linux-exact:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 55
    env:
      GODOT_SILENCE_ROOT_WARNING: '1'
      BREAKPOINT_RUNTIME_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact Linux Godot double and ancestry
        shell: bash
        run: |
          set -euo pipefail
          E=artifacts/net-smooth1/r3c3-r1-linux-exact
          mkdir -p "$E"
          BASE=f2786b475df2be54d09f5926b37f87d6229aa991
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASE" HEAD
          test -z "$(git status --porcelain --untracked-files=no)"
          B="${DWS_GODOT_DOUBLE_LINUX_BIN:-$HOME/.local/opt/godot-double-4.7.1-a13da4f/godot.linuxbsd.editor.double.x86_64}"
          test -x "$B"
          test "$("$B" --version | head -1)" = "4.7.1.stable.double.custom_build.a13da4feb"
          test "$(sha256sum "$B" | cut -d' ' -f1)" = "bfa7ce632d8d4b1dcc96f64f5405ee52b57c4e25d15c3e0478acc26e08d517d7"
          echo "GODOT_BIN=$B" >> "$GITHUB_ENV"
          { git rev-parse HEAD; git rev-parse 'HEAD^{tree}'; sha256sum "$B"; } > "$E/identity.txt"
      - name: Cold import and source parse
        shell: bash
        run: |
          set -euo pipefail
          L=artifacts/net-smooth1/r3c3-r1-linux-exact/cold-import.log
          "$GODOT_BIN" --headless --editor --path . --import --quit > "$L" 2>&1 || { tail -n 140 "$L"; exit 1; }
          if grep -E 'SCRIPT ERROR:|Parse Error:|Compile Error:' "$L"; then tail -n 140 "$L"; exit 1; fi
      - name: Real Godot parity and inherited Earth plus M6 regression
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          E=artifacts/net-smooth1/r3c3-r1-linux-exact
          for P in \
            tests/runtime/test_net_smooth1_r42_r3c3_staged_earth_geometry.gd \
            tests/runtime/test_mvp_earth_m3_spectator.gd \
            tests/runtime/test_v0_p1_earth_wiring.gd \
            tests/runtime/test_v0_p1_earth_surface_presentation.gd \
            tests/runtime/test_net_smooth1_r42_r3c2_phased_item_publication.gd \
            tests/runtime/test_net_smooth1_r42_r3c_async_leave.gd \
            tests/runtime/test_net_smooth1_r42_r3c_queued_join.gd
          do
            L="$E/$(basename "$P").log"
            timeout --signal=TERM --kill-after=5s 180s "$GODOT_BIN" --headless --path . --script "res://$P" > "$L" 2>&1 || { code=$?; tail -n 130 "$L"; echo "SUITE_FAIL_OR_TIMEOUT:$P:$code"; exit 1; }
            if grep -E 'SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:' "$L"; then tail -n 130 "$L"; exit 1; fi
          done
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: SHA evidence manifest
        if: always()
        shell: bash
        run: |
          E=artifacts/net-smooth1/r3c3-r1-linux-exact
          mkdir -p "$E"
          (cd "$E" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt)
          git status --porcelain --untracked-files=no > "$E/tracked.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r3c3-r1-linux-exact-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/net-smooth1/r3c3-r1-linux-exact/
          retention-days: 21
          if-no-files-found: error

  windows-exact:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 70
    env:
      GODOT_SILENCE_ROOT_WARNING: '1'
      BREAKPOINT_RUNTIME_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact Windows Godot double and ancestry
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $Base='f2786b475df2be54d09f5926b37f87d6229aa991'
          $B='C:\Godot\godot\bin\godot.windows.editor.double.x86_64.console.exe'
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'R3C3_R1_HEAD_MISMATCH' }
          git merge-base --is-ancestor $Base HEAD
          if ($LASTEXITCODE -ne 0) { throw 'R3C3_R1_PARENT_MISSING' }
          if (git status --porcelain --untracked-files=no) { throw 'R3C3_R1_TRACKED_DIRTY' }
          if (-not (Test-Path $B)) { throw 'R3C3_R1_GODOT_MISSING' }
          $V=(& $B --version | Out-String).Trim()
          $SHA=(Get-FileHash $B -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($V -ne '4.7.1.stable.double.custom_build.a13da4feb') { throw 'R3C3_R1_GODOT_VERSION' }
          if ($SHA -ne '3633c3e609c8ce2f9bae334a9c7e75c7f974de3af0415ab4a8050a625a15a7a5') { throw 'R3C3_R1_GODOT_SHA' }
          $E='artifacts\net-smooth1\r3c3-r1-windows-exact'
          New-Item -ItemType Directory -Force $E | Out-Null
          [ordered]@{head=(git rev-parse HEAD).Trim();tree=(git rev-parse 'HEAD^{tree}').Trim();parent=$Base;engine=$V;sha256=$SHA} | ConvertTo-Json | Set-Content "$E\identity.json" -Encoding UTF8
      - name: Cold import exact Windows
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference='Stop'
          $B='C:\Godot\godot\bin\godot.windows.editor.double.x86_64.console.exe'
          $L='artifacts\net-smooth1\r3c3-r1-windows-exact\cold-import.log'
          & $B --headless --editor --path . --import --quit *> $L
          if ($LASTEXITCODE -ne 0 -or (Select-String $L -Pattern 'SCRIPT ERROR:|Parse Error:|Compile Error:' -Quiet)) {
            Get-Content $L -Tail 120
            throw 'R3C3_R1_COLD_IMPORT'
          }
      - name: Real geometry parity, stale cancellation and Earth plus M6 regressions
        shell: pwsh
        timeout-minutes: 40
        run: |
          $ErrorActionPreference='Stop'
          $B='C:\Godot\godot\bin\godot.windows.editor.double.x86_64.console.exe'
          $E='artifacts\net-smooth1\r3c3-r1-windows-exact'
          $Suites=@(
            'tests/runtime/test_net_smooth1_r42_r3c3_staged_earth_geometry.gd',
            'tests/runtime/test_mvp_earth_m3_spectator.gd',
            'tests/runtime/test_v0_p1_earth_wiring.gd',
            'tests/runtime/test_v0_p1_earth_surface_presentation.gd',
            'tests/runtime/test_net_smooth1_r42_r3c2_phased_item_publication.gd',
            'tests/runtime/test_net_smooth1_r42_r3c_async_leave.gd',
            'tests/runtime/test_net_smooth1_r42_r3c_queued_join.gd'
          )
          foreach ($P in $Suites) {
            $BaseLog=Join-Path $E (Split-Path $P -Leaf)
            $Out="$BaseLog.stdout.log"; $Err="$BaseLog.stderr.log"
            $Proc=Start-Process -FilePath $B -WorkingDirectory (Get-Location).Path -ArgumentList @('--headless','--path','.','--script',("res://"+$P)) -RedirectStandardOutput $Out -RedirectStandardError $Err -PassThru
            try {
              if (-not $Proc.WaitForExit(180000)) {
                $Proc.Kill($true); $Proc.WaitForExit()
                Get-Content $Out -Tail 120; Get-Content $Err -Tail 120
                throw "R3C3_R1_SUITE_TIMEOUT:$P"
              }
              $Code=$Proc.ExitCode
              $Errors=@(Select-String -Path $Out,$Err -Pattern 'SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:' -ErrorAction SilentlyContinue)
              if ($Code -ne 0 -or $Errors.Count -gt 0) {
                Get-Content $Out -Tail 120; Get-Content $Err -Tail 120
                throw "R3C3_R1_SUITE_FAIL:$P EXIT=$Code"
              }
            } finally { $Proc.Dispose() }
          }
          if (git status --porcelain --untracked-files=no) { throw 'R3C3_R1_TRACKED_DIRTY_AFTER' }
      - name: SHA256 evidence
        shell: pwsh
        if: always()
        run: |
          $E='artifacts\net-smooth1\r3c3-r1-windows-exact'
          New-Item -ItemType Directory -Force $E | Out-Null
          @(Get-ChildItem $E -File | Where-Object { $_.Name -ne 'sha256.json' } |
            ForEach-Object { [ordered]@{file=$_.Name;sha256=(Get-FileHash $_.FullName -Algorithm SHA256).Hash} }) | ConvertTo-Json -Depth 4 | Set-Content "$E\sha256.json" -Encoding UTF8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r3c3-r1-windows-exact-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/net-smooth1/r3c3-r1-windows-exact/
          retention-days: 21
          if-no-files-found: error
