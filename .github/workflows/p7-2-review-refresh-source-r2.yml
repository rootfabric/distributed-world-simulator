name: P7.2 Review Refresh Source Export R2

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p7-2-review-refresh-source-r2.yml"

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact P7.2 refreshed subject
        uses: actions/checkout@v4
        with:
          ref: 0292e0a97d980d5c384b0118999429f1e6f13c3d
          fetch-depth: 0

      - name: Assert exact subject
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "0292e0a97d980d5c384b0118999429f1e6f13c3d"
          test "$(git rev-parse HEAD^{tree})" = "dc39d42cf903b3dc7f56f6ba9cbb6fc82b258b36"
          echo "P7_2_REVIEW_REFRESH_HEAD=$(git rev-parse HEAD)"
          echo "P7_2_REVIEW_REFRESH_TREE=$(git rev-parse HEAD^{tree})"

      - name: Build immutable exact source archive
        shell: bash
        run: |
          git archive --format=tar.gz --prefix=distributed-world-simulator/ \
            -o p7-2-review-refresh-source.tar.gz \
            0292e0a97d980d5c384b0118999429f1e6f13c3d
          sha256sum p7-2-review-refresh-source.tar.gz | tee p7-2-review-refresh-source.sha256

      - name: Upload exact review source
        uses: actions/upload-artifact@v4
        with:
          name: p7-2-review-refresh-source-0292e0a97d
          path: |
            p7-2-review-refresh-source.tar.gz
            p7-2-review-refresh-source.sha256
          if-no-files-found: error
          retention-days: 14
