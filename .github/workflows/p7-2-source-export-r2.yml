name: P7.2 Repaired Source Export R2

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p7-2-source-export-r2.yml"

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact P7.2 repaired subject
        uses: actions/checkout@v4
        with:
          ref: 862fdc397e18f9ed597e1963fce7916cddcfd7c2
          fetch-depth: 0

      - name: Assert exact subject
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "862fdc397e18f9ed597e1963fce7916cddcfd7c2"
          test "$(git rev-parse HEAD^{tree})" = "125d7c46919c405c68f3d4affa60d3077ee23b3c"
          echo "P7_2_EXACT_SOURCE_HEAD=$(git rev-parse HEAD)"
          echo "P7_2_EXACT_SOURCE_TREE=$(git rev-parse HEAD^{tree})"

      - name: Build immutable source archive
        shell: bash
        run: |
          git archive --format=tar.gz --prefix=distributed-world-simulator/ \
            -o p7-2-repaired-source.tar.gz \
            862fdc397e18f9ed597e1963fce7916cddcfd7c2
          sha256sum p7-2-repaired-source.tar.gz | tee p7-2-repaired-source.sha256

      - name: Upload exact source
        uses: actions/upload-artifact@v4
        with:
          name: p7-2-repaired-source-862fdc397
          path: |
            p7-2-repaired-source.tar.gz
            p7-2-repaired-source.sha256
          if-no-files-found: error
          retention-days: 7
