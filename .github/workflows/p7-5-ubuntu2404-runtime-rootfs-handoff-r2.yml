name: P7.5 Ubuntu 24.04 Runtime Rootfs Handoff R2

on:
  push:
    branches:
      - validation/p7-5-ubuntu-rootfs-handoff-r1

permissions:
  contents: read

jobs:
  build-rootfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Build provisioned Ubuntu 24.04.4 amd64 verifier rootfs
        shell: bash
        run: |
          set -Eeuo pipefail
          image="ubuntu-base-24.04.4-base-amd64.tar.gz"
          base_url="https://cdimages.ubuntu.com/ubuntu-base/releases/24.04/release"

          mkdir -p download rootfs output
          cd download
          curl --fail --location --retry 3 --silent --show-error -O "$base_url/$image"
          curl --fail --location --retry 3 --silent --show-error -O "$base_url/SHA256SUMS"
          expected="$(awk -v f="$image" '$2 == f || $2 == ("*" f) { print $1; exit }' SHA256SUMS)"
          test -n "$expected"
          printf '%s  %s\n' "$expected" "$image" | sha256sum --check -
          cd ..

          sudo tar -xzf "download/$image" -C rootfs
          sudo cp --remove-destination /etc/resolv.conf rootfs/etc/resolv.conf

          cleanup() {
            sudo umount -R rootfs/dev 2>/dev/null || true
            sudo umount rootfs/proc 2>/dev/null || true
            sudo umount rootfs/sys 2>/dev/null || true
          }
          trap cleanup EXIT

          sudo mount --rbind /dev rootfs/dev
          sudo mount --make-rslave rootfs/dev
          sudo mount -t proc proc rootfs/proc
          sudo mount -t sysfs sysfs rootfs/sys

          sudo chroot rootfs /bin/bash -lc '
            set -Eeuo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends               git ca-certificates proot fontconfig               libfontconfig1 libfreetype6               libx11-6 libx11-xcb1 libxcb1               libxcursor1 libxinerama1 libxrandr2 libxi6               libgl1 libasound2t64 libpulse0 libudev1 libdbus-1-3               libxkbcommon0 libwayland-client0 libwayland-cursor0 libwayland-egl1
            apt-get clean
            rm -rf /var/lib/apt/lists/*
            git --version
            proot --version | head -n1
            cat /etc/os-release
          '

          cleanup
          trap - EXIT

          sudo rm -f rootfs/etc/resolv.conf
          sudo tar --numeric-owner -C rootfs -czf output/ubuntu-24.04.4-p7-5-runtime-rootfs-amd64.tar.gz .
          sudo chown "$(id -u):$(id -g)" output/ubuntu-24.04.4-p7-5-runtime-rootfs-amd64.tar.gz
          sha256sum output/ubuntu-24.04.4-p7-5-runtime-rootfs-amd64.tar.gz             | tee output/ubuntu-24.04.4-p7-5-runtime-rootfs-amd64.tar.gz.sha256

      - name: Upload verifier runtime rootfs
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-24.04.4-p7-5-runtime-rootfs-amd64
          path: output/
          if-no-files-found: error
          retention-days: 1
