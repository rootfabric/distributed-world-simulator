name: Post-merge Directional Diagnostic

on:
  push:
    branches:
      - fix/eg5-telemetry-hysteresis-r1

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch branch refs
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
      - name: Run directional watch
        run: |
          python3 scripts/control/project_control_directional_watch.py --no-fail-on-red
          echo '--- directional-watch-report.json ---'
          cat artifacts/control/directional-watch-report.json
