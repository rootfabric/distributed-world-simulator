name: Project Control

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"

jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all branch refs
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - name: Run PC0 auditor
        run: python3 scripts/control/project_control.py --no-fetch

      - name: Upload control report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-control-report
          path: |
            artifacts/control/PROJECT_STATUS_RU.md
            artifacts/control/project-control-report.json
          if-no-files-found: warn
