name: Project Control
'on':
  workflow_dispatch: null
  pull_request: null
  push:
    branches:
    - main
  schedule:
  - cron: 17 3 * * *
jobs:
  control:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout exact event subject
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    - name: Verify exact checkout
      env:
        EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      run: 'ACTUAL_SHA="$(git rev-parse HEAD)"

        echo "PROJECT_CONTROL_EXPECTED_HEAD=$EXPECTED_SHA"

        echo "PROJECT_CONTROL_ACTUAL_HEAD=$ACTUAL_SHA"

        test "$ACTUAL_SHA" = "$EXPECTED_SHA"

        '
    - name: Fetch all branch refs
      run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
    - name: Install pinned Harness dependencies
      run: "python3 -m pip install --disable-pip-version-check -r scripts/harness/requirements.txt\npython3 - <<'PY'\nimport\
        \ importlib.metadata\nfrom pathlib import Path\n\nrequired = Path(\"scripts/harness/requirements.txt\").read_text(encoding=\"\
        utf-8\").strip()\nexpected = required.split(\"==\", 1)[1]\nactual = importlib.metadata.version(\"jsonschema\")\nif\
        \ actual != expected:\n    raise SystemExit(f\"PINNED_DEPENDENCY_VERSION_MISMATCH:jsonschema={actual}:expected={expected}\"\
        )\nprint(f\"PINNED DEPENDENCY OK: jsonschema=={actual}\")\nPY\n"
    - name: Validate control candidate syntax and generation
      run: "python3 -m py_compile \\\n  scripts/control/project_control.py \\\n  scripts/control/project_control_architecture_compat.py\
        \ \\\n  scripts/control/project_control_core.py \\\n  scripts/control/directional_watch_clearance.py \\\n  scripts/control/project_control_directional_watch.py\
        \ \\\n  scripts/harness/checkpoint_planner.py \\\n  scripts/harness/event_reducer.py \\\n  scripts/harness/execution_selector.py\
        \ \\\n  scripts/harness/mission.py \\\n  scripts/harness/continuation.py \\\n  scripts/harness/git_authority.py \\\
        \n  scripts/harness/contracts.py \\\n  scripts/harness/cli.py\npython3 -m py_compile scripts/harness/project_overview.py\n\
        python3 - <<'PY'\nimport subprocess\nimport sys\nfrom pathlib import Path\nfrom jsonschema import Draft202012Validator\n\
        \nsys.path.insert(0, \"scripts\")\nfrom harness.contracts import ContractBundle, read_json\n\nrequired_json = [\n\
        \    Path(\"config/control/project-control-policy.v1.json\"),\n    Path(\"config/control/project-program-registry.v1.json\"\
        ),\n    Path(\"config/control/architecture-ownership.v1.json\"),\n    Path(\"config/control/directional-watch-clearances.v1.json\"\
        ),\n    Path(\"config/architecture/global-program-roadmap.v1.json\"),\n    Path(\"config/control/harness/project-goals.v1.json\"\
        ),\n    Path(\"config/control/harness/checkpoint-catalog.v1.json\"),\n    Path(\"config/control/harness/harness-policy.v1.json\"\
        ),\n    Path(\"config/control/harness/scheduler-policy.v1.json\"),\n    Path(\"config/control/harness/v0-product-train-policy.v1.json\"\
        ),\n    Path(\"config/control/harness/continuation-policy.v1.json\"),\n    Path(\"config/control/harness/work-order.schema.v1.json\"\
        ),\n    Path(\"config/control/harness/event.schema.v1.json\"),\n    Path(\"config/control/harness/project-epoch.schema.v1.json\"\
        ),\n    Path(\"config/control/harness/risk-policy.v1.json\"),\n    Path(\"config/control/harness/review-policy.v1.json\"\
        ),\n    Path(\"config/control/harness/repair-doctrine.v1.json\"),\n    Path(\"config/control/harness/evidence-map.schema.v1.json\"\
        ),\n    Path(\"config/control/harness/human-attention.schema.v1.json\"),\n    Path(\"validation/harness/control-development-output.schema.v1.json\"\
        ),\n]\nchanged_json = subprocess.check_output(\n    [\"git\", \"diff\", \"--name-only\", \"--diff-filter=ACMR\", \"\
        origin/main...HEAD\", \"--\", \"*.json\"],\n    text=True,\n).splitlines()\nrequired_json.extend(Path(path) for path\
        \ in changed_json)\nbundle = ContractBundle.load(Path.cwd())\nfor name, schema in bundle.contracts.items():\n    if\
        \ name.endswith(\"_schema\"):\n        Draft202012Validator.check_schema(schema)\n        print(f\"JSON SCHEMA OK:\
        \ {name}\")\nfor path in sorted(set(required_json)):\n    value = read_json(path)\n    if \"$schema\" in value:\n\
        \        Draft202012Validator.check_schema(value)\n    if not isinstance(value, dict):\n        raise SystemExit(f\"\
        Expected JSON object: {path}\")\n    print(f\"JSON DUPLICATE-KEY VALIDATION OK: {path}\")\n\nregistry = read_json(Path(\"\
        config/control/project-program-registry.v1.json\"))\nscheduler = read_json(Path(\"config/control/harness/scheduler-policy.v1.json\"\
        ))\ngeneration = registry.get(\"registry_generation\")\nif not isinstance(generation, int) or generation < 81:\n \
        \   raise SystemExit(f\"PROJECT_FOCUS_GENERATION_REQUIRED:{generation}\")\nif scheduler[\"pre_h0_3_runtime_mutation_lease\"\
        ][\"effective_registry_generation\"] != generation:\n    raise SystemExit(\"REGISTRY_LEASE_GENERATION_MISMATCH\")\n\
        print(f\"CANDIDATE REGISTRY GENERATION OK: {generation}\")\nPY\n"
    - name: Check candidate product coordination
      env:
        PYTHONPATH: scripts
      run: python3 -m harness.cli check-consistency --candidate
    - name: Run complete Harness regression discovery
      run: python3 -m unittest discover -s tests/harness -p 'test_*.py' -v
    - name: Run canonical-main PC0 auditor
      run: python3 scripts/control/project_control.py --no-fetch --no-fail-on-red
    - name: Run canonical-main PC0 directional watch auditor
      run: python3 scripts/control/project_control_directional_watch.py --no-fail-on-red
    - name: Upload control reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: project-control-report
        path: 'artifacts/control/PROJECT_STATUS_RU.md

          artifacts/control/project-control-report.json

          artifacts/control/DIRECTIONAL_WATCH_STATUS_RU.md

          artifacts/control/directional-watch-report.json

          '
        if-no-files-found: warn
concurrency:
  group: project-control-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
