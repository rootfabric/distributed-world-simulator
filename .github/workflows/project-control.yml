name: Project Control

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"

jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all branch refs
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - name: Validate control candidate syntax
        run: |
          python3 -m py_compile \
            scripts/control/project_control.py \
            scripts/control/project_control_architecture_compat.py \
            scripts/control/project_control_core.py \
            scripts/control/project_control_directional_watch.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          required_json = [
              Path("config/control/project-control-policy.v1.json"),
              Path("config/control/project-program-registry.v1.json"),
              Path("config/control/architecture-ownership.v1.json"),
              Path("config/architecture/global-program-roadmap.v1.json"),
              Path("config/control/harness/project-goals.v1.json"),
              Path("config/control/harness/checkpoint-catalog.v1.json"),
              Path("config/control/harness/harness-policy.v1.json"),
              Path("config/control/harness/scheduler-policy.v1.json"),
              Path("config/control/harness/work-order.schema.v1.json"),
              Path("config/control/harness/event.schema.v1.json"),
              Path("config/control/harness/project-epoch.schema.v1.json"),
              Path("config/control/harness/risk-policy.v1.json"),
              Path("config/control/harness/review-policy.v1.json"),
              Path("config/control/harness/repair-doctrine.v1.json"),
              Path("config/control/harness/evidence-map.schema.v1.json"),
              Path("config/control/harness/human-attention.schema.v1.json"),
          ]
          for path in required_json:
              with path.open("r", encoding="utf-8") as handle:
                  value = json.load(handle)
              if not isinstance(value, dict):
                  raise SystemExit(f"Expected JSON object: {path}")
              print(f"JSON OK: {path}")
          PY

      - name: Run architecture and ownership passport compatibility regression
        run: |
          python3 -m unittest \
            tests.harness.test_project_control_architecture_compatibility \
            tests.harness.test_project_control_historical_ownership_compatibility \
            tests.harness.test_project_control_proposed_r3_ownership_projection

      - name: Run PC0 auditor
        run: python3 scripts/control/project_control.py --no-fetch --no-fail-on-red

      - name: Run PC0 directional watch auditor
        run: python3 scripts/control/project_control_directional_watch.py --no-fail-on-red

      - name: Upload control reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-control-report
          path: |
            artifacts/control/PROJECT_STATUS_RU.md
            artifacts/control/project-control-report.json
            artifacts/control/DIRECTIONAL_WATCH_STATUS_RU.md
            artifacts/control/directional-watch-report.json
          if-no-files-found: warn
