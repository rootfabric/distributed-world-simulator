name: Project Control

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"

jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event subject
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "PROJECT_CONTROL_EXPECTED_HEAD=$EXPECTED_SHA"
          echo "PROJECT_CONTROL_ACTUAL_HEAD=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

      - name: Fetch all branch refs
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - name: Install pinned Harness dependencies
        run: |
          python3 -m pip install --disable-pip-version-check -r scripts/harness/requirements.txt
          python3 - <<'PY'
          import importlib.metadata
          from pathlib import Path

          required = Path("scripts/harness/requirements.txt").read_text(encoding="utf-8").strip()
          expected = required.split("==", 1)[1]
          actual = importlib.metadata.version("jsonschema")
          if actual != expected:
              raise SystemExit(f"PINNED_DEPENDENCY_VERSION_MISMATCH:jsonschema={actual}:expected={expected}")
          print(f"PINNED DEPENDENCY OK: jsonschema=={actual}")
          PY

      - name: Validate control candidate syntax and generation
        run: |
          python3 -m py_compile \
            scripts/control/project_control.py \
            scripts/control/project_control_architecture_compat.py \
            scripts/control/project_control_core.py \
            scripts/control/directional_watch_clearance.py \
            scripts/control/project_control_directional_watch.py \
            scripts/harness/checkpoint_planner.py \
            scripts/harness/event_reducer.py \
            scripts/harness/execution_selector.py \
            scripts/harness/mission.py \
            scripts/harness/continuation.py \
            scripts/harness/git_authority.py \
            scripts/harness/contracts.py \
            scripts/harness/cli.py
          python3 -m py_compile scripts/harness/project_overview.py
          python3 - <<'PY'
          import subprocess
          import sys
          from pathlib import Path
          from jsonschema import Draft202012Validator

          sys.path.insert(0, "scripts")
          from harness.contracts import ContractBundle, read_json

          required_json = [
              Path("config/control/project-control-policy.v1.json"),
              Path("config/control/project-program-registry.v1.json"),
              Path("config/control/architecture-ownership.v1.json"),
              Path("config/control/directional-watch-clearances.v1.json"),
              Path("config/architecture/global-program-roadmap.v1.json"),
              Path("config/control/harness/project-goals.v1.json"),
              Path("config/control/harness/checkpoint-catalog.v1.json"),
              Path("config/control/harness/harness-policy.v1.json"),
              Path("config/control/harness/scheduler-policy.v1.json"),
              Path("config/control/harness/v0-product-train-policy.v1.json"),
              Path("config/control/harness/continuation-policy.v1.json"),
              Path("config/control/harness/work-order.schema.v1.json"),
              Path("config/control/harness/event.schema.v1.json"),
              Path("config/control/harness/project-epoch.schema.v1.json"),
              Path("config/control/harness/risk-policy.v1.json"),
              Path("config/control/harness/review-policy.v1.json"),
              Path("config/control/harness/repair-doctrine.v1.json"),
              Path("config/control/harness/evidence-map.schema.v1.json"),
              Path("config/control/harness/human-attention.schema.v1.json"),
              Path("validation/harness/control-development-output.schema.v1.json"),
          ]
          changed_json = subprocess.check_output(
              ["git", "diff", "--name-only", "--diff-filter=ACMR", "origin/main...HEAD", "--", "*.json"],
              text=True,
          ).splitlines()
          required_json.extend(Path(path) for path in changed_json)
          bundle = ContractBundle.load(Path.cwd())
          for name, schema in bundle.contracts.items():
              if name.endswith("_schema"):
                  Draft202012Validator.check_schema(schema)
                  print(f"JSON SCHEMA OK: {name}")
          for path in sorted(set(required_json)):
              value = read_json(path)
              if "$schema" in value:
                  Draft202012Validator.check_schema(value)
              if not isinstance(value, dict):
                  raise SystemExit(f"Expected JSON object: {path}")
              print(f"JSON DUPLICATE-KEY VALIDATION OK: {path}")

          registry = read_json(Path("config/control/project-program-registry.v1.json"))
          scheduler = read_json(Path("config/control/harness/scheduler-policy.v1.json"))
          generation = registry.get("registry_generation")
          if not isinstance(generation, int) or generation < 81:
              raise SystemExit(f"PROJECT_FOCUS_GENERATION_REQUIRED:{generation}")
          if scheduler["pre_h0_3_runtime_mutation_lease"]["effective_registry_generation"] != generation:
              raise SystemExit("REGISTRY_LEASE_GENERATION_MISMATCH")
          print(f"CANDIDATE REGISTRY GENERATION OK: {generation}")
          PY

      - name: Check product coordination at the applicable authority boundary
        env:
          PYTHONPATH: scripts
        run: |
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            python3 -m harness.cli check-consistency
          else
            python3 -m harness.cli check-consistency --candidate
          fi

      - name: Run project overview authority regression
        run: python3 -m unittest tests.harness.test_project_overview

      - name: Run Harness checkpoint-session regression
        run: python3 -m unittest tests.harness.test_harness_checkpoint_session

      - name: Run architecture and ownership passport compatibility regression
        run: |
          python3 -m unittest \
            tests.harness.test_project_control_architecture_compatibility \
            tests.harness.test_project_control_historical_ownership_compatibility \
            tests.harness.test_project_control_proposed_r3_ownership_projection

      - name: Run H0.2 machine checkpoint regression
        run: python3 -m unittest tests.harness.test_h0_2_machine_checkpoint_contract

      - name: Run V0 product checkpoint regression
        run: |
          python3 -m unittest \
            tests.harness.test_v0_s1_networked_checkpoint_contract \
            tests.harness.test_v0_product_train_policy

      - name: Run generation-80 authorization safety regression
        run: |
          python3 -m unittest \
            tests.harness.test_v0_generation80_safety_guards \
            tests.harness.test_project_control_directional_clearance

      - name: Run complete Harness regression discovery
        run: python3 -m unittest discover -s tests/harness -p 'test_*.py' -v

      - name: Run canonical-main PC0 auditor
        run: python3 scripts/control/project_control.py --no-fetch --no-fail-on-red

      - name: Run canonical-main PC0 directional watch auditor
        run: python3 scripts/control/project_control_directional_watch.py --no-fail-on-red

      - name: Upload control reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-control-report
          path: |
            artifacts/control/PROJECT_STATUS_RU.md
            artifacts/control/project-control-report.json
            artifacts/control/DIRECTIONAL_WATCH_STATUS_RU.md
            artifacts/control/directional-watch-report.json
          if-no-files-found: warn
