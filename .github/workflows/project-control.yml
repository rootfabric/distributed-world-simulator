name: Project Control
'on':
  workflow_dispatch: null
  pull_request: null
  push:
    branches:
    - main
  schedule:
  - cron: 17 3 * * *
jobs:
  control:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Fetch all branch refs
      run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
    - name: Validate control candidate syntax
      run: "python3 -m py_compile \\\n  scripts/control/project_control.py \\\n  scripts/control/project_control_architecture_compat.py\
        \ \\\n  scripts/control/project_control_core.py \\\n  scripts/control/project_control_directional_watch.py \\\n  scripts/harness/checkpoint_planner.py\n\
        python3 - <<'PY'\nimport json\nfrom pathlib import Path\n\nrequired_json = [\n    Path(\"config/control/project-control-policy.v1.json\"\
        ),\n    Path(\"config/control/project-program-registry.v1.json\"),\n    Path(\"config/control/architecture-ownership.v1.json\"\
        ),\n    Path(\"config/architecture/global-program-roadmap.v1.json\"),\n    Path(\"config/control/harness/project-goals.v1.json\"\
        ),\n    Path(\"config/control/harness/checkpoint-catalog.v1.json\"),\n    Path(\"config/control/harness/harness-policy.v1.json\"\
        ),\n    Path(\"config/control/harness/scheduler-policy.v1.json\"),\n    Path(\"config/control/harness/work-order.schema.v1.json\"\
        ),\n    Path(\"config/control/harness/event.schema.v1.json\"),\n    Path(\"config/control/harness/project-epoch.schema.v1.json\"\
        ),\n    Path(\"config/control/harness/risk-policy.v1.json\"),\n    Path(\"config/control/harness/review-policy.v1.json\"\
        ),\n    Path(\"config/control/harness/repair-doctrine.v1.json\"),\n    Path(\"config/control/harness/evidence-map.schema.v1.json\"\
        ),\n    Path(\"config/control/harness/human-attention.schema.v1.json\"),\n]\nfor path in required_json:\n    with\
        \ path.open(\"r\", encoding=\"utf-8\") as handle:\n        value = json.load(handle)\n    if not isinstance(value,\
        \ dict):\n        raise SystemExit(f\"Expected JSON object: {path}\")\n    print(f\"JSON OK: {path}\")\nPY\n"
    - name: Run architecture and ownership passport compatibility regression
      run: "python3 -m unittest \\\n  tests.harness.test_project_control_architecture_compatibility \\\n  tests.harness.test_project_control_historical_ownership_compatibility\
        \ \\\n  tests.harness.test_project_control_proposed_r3_ownership_projection\n"
    - name: Run H0.2 machine checkpoint regression
      run: python3 -m unittest tests.harness.test_h0_2_machine_checkpoint_contract
    - name: Run PC0 auditor
      run: python3 scripts/control/project_control.py --no-fetch --no-fail-on-red
    - name: Run PC0 directional watch auditor
      run: python3 scripts/control/project_control_directional_watch.py --no-fail-on-red
    - name: Upload control reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: project-control-report
        path: 'artifacts/control/PROJECT_STATUS_RU.md

          artifacts/control/project-control-report.json

          artifacts/control/DIRECTIONAL_WATCH_STATUS_RU.md

          artifacts/control/directional-watch-report.json

          '
        if-no-files-found: warn
concurrency:
  group: project-control-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
