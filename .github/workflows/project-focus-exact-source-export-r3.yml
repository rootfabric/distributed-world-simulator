# Validation transport only. Do not merge this helper into the candidate or main.
name: Project Focus Exact Source Export R3

on:
  pull_request:
    branches: [control/project-focus-harness-reconciliation-r1]
    paths: [.github/workflows/project-focus-exact-source-export-r3.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 719a89611a5cb376ee6bf80476587399af7b9a4e
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact subject and fetched refs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/project-focus-export
          {
            git fetch --all --prune
            git rev-parse origin/main
            git rev-parse origin/control/project-focus-harness-reconciliation-r1
            git rev-parse HEAD
            git rev-parse 'HEAD^{tree}'
            git status --porcelain --untracked-files=no
          } 2>&1 | tee /tmp/project-focus-export/preflight.log
          test "$(git rev-parse HEAD)" = 719a89611a5cb376ee6bf80476587399af7b9a4e
          test "$(git rev-parse 'HEAD^{tree}')" = 6b1438ce1536f210af69e6a7920a96116e4e9dcb
          test "$(git rev-parse origin/main)" = 5b4152958624be4e9cc40f2369ce32c4964f65c3
          test "$(git rev-parse origin/control/project-focus-harness-reconciliation-r1)" = 719a89611a5cb376ee6bf80476587399af7b9a4e
          test -z "$(git status --porcelain --untracked-files=no)"
          if git config --local --get-regexp 'http\..*\.extraheader'; then
            echo 'EXPORT_FORBIDDEN_CREDENTIAL_HEADER_PRESENT'
            exit 1
          fi
      - name: Export pinned Python dependency
        run: python3 -m pip download --disable-pip-version-check --no-deps -r scripts/harness/requirements.txt -d /tmp/project-focus-export/wheels
      - name: Archive exact checkout and Git metadata
        shell: bash
        run: |
          set -euo pipefail
          tar -czf /tmp/project-focus-export/project-focus-719a896-with-git.tar.gz .
          cd /tmp/project-focus-export
          sha256sum project-focus-719a896-with-git.tar.gz preflight.log wheels/* > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: project-focus-719a896-exact-source
          path: /tmp/project-focus-export/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3
