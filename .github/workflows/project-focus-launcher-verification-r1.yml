# Validation transport only: do not merge this helper into candidate or main.
name: Project Focus Exact Launcher Verification R1

on:
  pull_request:
    branches: [control/project-focus-harness-reconciliation-r1]
    paths: [.github/workflows/project-focus-launcher-verification-r1.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1b87bb0908429f5bbae2eb5929a07649ed5507d4
          fetch-depth: 0
          persist-credentials: false
      - name: Verify live refs and exact clean subject
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/focus-launcher-evidence
          {
            git fetch --all --prune
            git rev-parse origin/main
            git rev-parse origin/control/project-focus-harness-reconciliation-r1
            git rev-parse HEAD
            git rev-parse 'HEAD^{tree}'
            git status --porcelain --untracked-files=no
            pwsh --version
          } 2>&1 | tee /tmp/focus-launcher-evidence/preflight.log
          test "$(git rev-parse HEAD)" = 1b87bb0908429f5bbae2eb5929a07649ed5507d4
          test "$(git rev-parse 'HEAD^{tree}')" = 31fe1abd8fea945645877e5fb8bc6bf40469efcb
          test "$(git rev-parse origin/main)" = 5b4152958624be4e9cc40f2369ce32c4964f65c3
          test "$(git rev-parse origin/control/project-focus-harness-reconciliation-r1)" = 1b87bb0908429f5bbae2eb5929a07649ed5507d4
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Install repository pinned dependencies
        run: python3 -m pip install --disable-pip-version-check -r scripts/harness/requirements.txt
      - name: Run actual PowerShell launcher without candidate authority
        shell: bash
        run: |
          set -euo pipefail
          for mode in Overview CheckConsistency Drive CloseMission; do
            set +e
            pwsh -NoLogo -NoProfile -File ./CONTROL_DEVELOPMENT.ps1 -"$mode" -Json > "/tmp/focus-launcher-evidence/${mode}.stdout.json" 2> "/tmp/focus-launcher-evidence/${mode}.stderr.log"
            result=$?
            set -e
            printf '%s\n' "$result" > "/tmp/focus-launcher-evidence/${mode}.exit"
            echo "POWER_SHELL_LAUNCHER_MODE=$mode EXIT=$result"
            cat "/tmp/focus-launcher-evidence/${mode}.stdout.json"
            cat "/tmp/focus-launcher-evidence/${mode}.stderr.log"
            if [ "$mode" = Overview ]; then test "$result" -eq 0; else test "$result" -eq 3; fi
          done
      - name: Validate exact output contracts and clean tracked state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          evidence = Path('/tmp/focus-launcher-evidence')
          schema = json.loads(Path('validation/harness/control-development-output.schema.v1.json').read_text())
          for mode in ('Overview', 'CheckConsistency', 'Drive', 'CloseMission'):
              value = json.loads((evidence / f'{mode}.stdout.json').read_text())
              Draft202012Validator(schema).validate(value)
              if mode in ('Drive', 'CloseMission'):
                  assert value['error']['detail'] == 'EPOCH_REGISTRY_GENERATION_MISMATCH', value
              if mode == 'CheckConsistency':
                  assert value['error']['detail'] == 'PROJECT_CONSISTENCY_ERRORS', value
              if mode == 'Overview':
                  provenance = value['overview']['provenance']
                  assert provenance['canonical_head'] == '5b4152958624be4e9cc40f2369ce32c4964f65c3'
                  assert provenance['candidate_preview'] is False
              print(f'OUTPUT_SCHEMA_AND_EXPECTED_PREMERGE_GATE: {mode}')
          PY
          {
            git rev-parse HEAD
            git rev-parse 'HEAD^{tree}'
            git status --porcelain --untracked-files=no
          } | tee /tmp/focus-launcher-evidence/postflight.log
          test -z "$(git status --porcelain --untracked-files=no)"
          cd /tmp/focus-launcher-evidence
          sha256sum *.log *.json *.exit > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-focus-1b87bb09-powershell-launcher
          path: /tmp/focus-launcher-evidence/
          if-no-files-found: error
          retention-days: 30
