name: Dispatch exact SM1.7.10 Project Control

on:
  push:
    branches:
      - staging/sm1-7-10-authority-recovery
    paths:
      - .github/workflows/sm1-7-10-dispatch-project-control.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Project Control on immutable product ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body -L             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             https://api.github.com/repos/rootfabric/distributed-world-simulator/actions/workflows/project-control.yml/dispatches             -d '{"ref":"feature/v0-sm1-seamless-product-integration"}'
