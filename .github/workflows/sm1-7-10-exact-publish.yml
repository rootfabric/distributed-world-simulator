name: Publish exact SM1.7.10 candidate

on:
  push:
    branches:
      - staging/sm1-7-10-authority-recovery

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact local candidate and fast-forward product branch
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          product_branch='feature/v0-sm1-seamless-product-integration'
          expected_base='98e035ba97fb1c2d817323a4e0fa8238846ef740'
          git fetch origin "$product_branch"
          actual="$(git rev-parse "origin/$product_branch")"
          test "$actual" = "$expected_base"
          git checkout --detach "$expected_base"
          git config user.name "rootfabric-sm1-publisher"
          git config user.email "rootfabric-sm1-publisher@users.noreply.github.com"
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/sm1710.patch
          git am /tmp/sm1710.patch

          test "$(git rev-list --count "$expected_base"..HEAD)" = "1"
          test "$(git diff --name-only "$expected_base"..HEAD | wc -l)" = "5"
          test "$(git hash-object scripts/runtime/networked_gameplay/sm1/sm1_6_gateway_worker.gd)" = "b94f482dddaa9eedd8f50ef00667c907670ba020"
          test "$(git hash-object scripts/runtime/networked_gameplay/sm1/sm1_6_authority_worker.gd)" = "855f10c3a148b97d670d58b926f5845d4abc1858"
          test "$(git hash-object scripts/runtime/networked_gameplay/sm1/sm1_7_authority_recovery_client.gd)" = "2929fc9e9c33ea2bf9ac0ca23c23714a9ea9f909"
          test "$(git hash-object tests/runtime/test_v0_sm1_authority_recovery.gd)" = "a6331c69b9d115109fabb26e6acd8490654ca06c"
          test "$(git hash-object RUN_V0_SM1_AUTHORITY_RECOVERY.sh)" = "09e5506538fd3ec103b17113e1bc95e8bded273e"
          test "$(git status --porcelain --untracked-files=all)" = ""

          git push origin HEAD:"refs/heads/$product_branch"
          git show -s --format='published=%H tree=%T parent=%P subject=%s'
