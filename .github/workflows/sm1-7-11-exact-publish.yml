name: Publish exact SM1.7.11 candidate
on:
  push:
    branches: [staging/sm1-7-11-world-mutations]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply exact local candidate and fast-forward product branch
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          product_branch='feature/v0-sm1-seamless-product-integration'
          expected_base='a98b55399d605c0145ae7358578d972e0ef3ff1a'
          git fetch origin "$product_branch"
          test "$(git rev-parse "origin/$product_branch")" = "$expected_base"
          git checkout --detach "$expected_base"
          git config user.name "rootfabric-sm1-publisher"
          git config user.email "rootfabric-sm1-publisher@users.noreply.github.com"
          set +e
          printf '%s' "$PATCH_B64" | base64 -d | gzip -dc > /tmp/sm1711.patch
          gzip_rc=$?
          set -e
          echo "gzip_rc=$gzip_rc patch_bytes=$(wc -c < /tmp/sm1711.patch)"
          test -s /tmp/sm1711.patch
          git am /tmp/sm1711.patch
          test "$(git rev-list --count "$expected_base"..HEAD)" = "1"
          test "$(git diff --name-only "$expected_base"..HEAD | wc -l)" = "3"
          test "$(git hash-object RUN_V0_SM1_WORLD_MUTATIONS_AROUND_HANDOFF.sh)" = "75df06436d92c2b2d122473f4a1c905b6968a58b"
          test "$(git hash-object scripts/runtime/networked_gameplay/sm1/sm1_canonical_mutation_gate.gd)" = "2f106ac86ee6ae5fbbd74a5a7c916b59a284304b"
          test "$(git hash-object tests/runtime/test_v0_sm1_world_mutations_around_handoff.gd)" = "997048e4f885044ff188e77ccbb4719c12eb46ca"
          test "$(git status --porcelain --untracked-files=all)" = ""
          git push origin HEAD:"refs/heads/$product_branch"
          git show -s --format='published=%H tree=%T parent=%P subject=%s'
