name: Export partial SM1.7.12 patch

on:
  push:
    branches:
      - staging/sm1-7-12-impaired-crossings
    paths:
      - .github/workflows/sm1-7-12-export-partial.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild partial patch
        shell: bash
        run: |
          set -euo pipefail
          cat carrier/sm1712/00.b64 carrier/sm1712/01.b64 carrier/sm1712/02.b64 carrier/sm1712/03.b64 > /tmp/sm1712.patch.b64
          set +e
          base64 -d /tmp/sm1712.patch.b64 | gzip -dc > /tmp/sm1712.patch
          rc=$?
          set -e
          echo "gzip_rc=$rc bytes=$(wc -c < /tmp/sm1712.patch)"
          test -s /tmp/sm1712.patch
          cp /tmp/sm1712.patch sm1712-partial.patch
      - uses: actions/upload-artifact@v4
        with:
          name: sm1712-partial-patch
          if-no-files-found: error
          retention-days: 3
          path: sm1712-partial.patch
