name: SM1.7.8 exact source probe

on:
  push:
    branches:
      - probe/sm1-7-8-final-ba6b2f9

permissions:
  contents: read

jobs:
  package-exact-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package immutable candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate=ba6b2f9e6732664c0051f9c6751f54fca964c39f
          git cat-file -e "${candidate}^{commit}"
          git branch --force exact-candidate "$candidate"
          git bundle create sm1-7-8-candidate.bundle exact-candidate
          printf '%s\n' "$candidate" > exact-head.txt
          git show -s --format='%H %T %P %s' "$candidate" > exact-commit.txt
          sha256sum sm1-7-8-candidate.bundle exact-head.txt exact-commit.txt > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: sm1-7-8-final-ba6b2f9
          if-no-files-found: error
          retention-days: 7
          path: |
            sm1-7-8-candidate.bundle
            exact-head.txt
            exact-commit.txt
            SHA256SUMS
