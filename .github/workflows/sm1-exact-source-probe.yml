name: V0 SM1 Exact Source Probe

on:
  pull_request:
    branches:
      - feature/v0-sm1-seamless-product-integration

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package exact SM1 base
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          EXPECTED="1e39bc1df73571fed23290c168bd33dcba5e0812"
          echo "SM1_PROBE_BASE=$BASE"
          test "$BASE" = "$EXPECTED"
          git branch --force sm1-exact "$BASE"
          git bundle create sm1-exact-1e39.bundle refs/heads/sm1-exact
          git archive --format=zip --output=sm1-source-1e39.zip "$BASE"
          printf '%s\n' "$BASE" > EXACT_HEAD.txt
          git bundle verify sm1-exact-1e39.bundle
      - uses: actions/upload-artifact@v4
        with:
          name: sm1-exact-1e39
          path: |
            sm1-exact-1e39.bundle
            sm1-source-1e39.zip
            EXACT_HEAD.txt
          if-no-files-found: error
          retention-days: 1
