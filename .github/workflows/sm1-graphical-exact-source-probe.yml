name: V0 SM1 Graphical Exact Source Probe

on:
  pull_request:
    branches:
      - feature/v0-sm1-seamless-product-integration

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive exact SM1 graphical base
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          EXPECTED="93093d3a3675b5773b8a672d39fb11e4965bf16a"
          echo "BASE=$BASE"
          test "$BASE" = "$EXPECTED"
          git bundle create sm1-graphical-9309.bundle "$BASE"
          git archive --format=zip --output=sm1-source-9309.zip "$BASE"
          printf '%s\n' "$BASE" > EXACT_HEAD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sm1-graphical-exact-9309
          path: |
            sm1-graphical-9309.bundle
            sm1-source-9309.zip
            EXACT_HEAD.txt
          if-no-files-found: error
          retention-days: 1
