name: USER1 R3 GUI Seam Smoke

on:
  push:
    branches:
      - verify/user1-r3-gui-seam-smoke-r1
  workflow_dispatch:

permissions:
  contents: read

env:
  PRODUCT_HEAD: ea45373a2c69d22b96553395eb1204a13a8a176b
  PRODUCT_TREE: 9a79de9cd74c9482e6cd7cabbaadf581f1d354f8
  GODOT_GUI: C:\Godot\godot\bin\godot.windows.editor.double.x86_64.exe
  GODOT_CONSOLE: C:\Godot\godot\bin\godot.windows.editor.double.x86_64.console.exe

jobs:
  control-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prove frozen product plus carrier-only diff
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse "$PRODUCT_HEAD^{tree}")" = "$PRODUCT_TREE"
          test "$(git merge-base "$PRODUCT_HEAD" HEAD)" = "$PRODUCT_HEAD"
          mapfile -t actual < <(git diff --name-only "$PRODUCT_HEAD" HEAD | sort)
          expected=(
            ".github/workflows/user1-r3-gui-seam-smoke.yml"
            "tools/live2/run_user1_r3_gui_seam_smoke.ps1"
          )
          test "${#actual[@]}" -eq 2
          test "$(printf '%s\n' "${actual[@]}")" = "$(printf '%s\n' "${expected[@]}")"
          git diff --check "$PRODUCT_HEAD" HEAD

  gui-smoke:
    needs: control-scope
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Host preflight
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $foreign=@(Get-Process -ErrorAction SilentlyContinue | Where-Object {$_.ProcessName -like 'godot*'})
          if($foreign.Count -gt 0){throw ('FOREIGN_GODOT_PROCESS:'+(($foreign|Select-Object -ExpandProperty Id)-join ','))}
          $version=(& $env:GODOT_CONSOLE --version | Out-String).Trim()
          $sha=(Get-FileHash $env:GODOT_CONSOLE -Algorithm SHA256).Hash.ToLowerInvariant()
          if($version-ne'4.7.1.stable.double.custom_build.a13da4feb'){throw "GODOT_VERSION_MISMATCH:$version"}
          if($sha-ne'3633c3e609c8ce2f9bae334a9c7e75c7f974de3af0415ab4a8050a625a15a7a5'){throw "GODOT_SHA_MISMATCH:$sha"}
      - name: Run USER1 R3 GUI seam smoke
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference='Stop'
          $session=Join-Path $env:RUNNER_TEMP ('user1-r3-gui-smoke-'+[guid]::NewGuid().ToString('N'))
          pwsh -NoLogo -NoProfile -File .\tools\live2\run_user1_r3_gui_seam_smoke.ps1 `
            -Worktree (Resolve-Path .).Path `
            -ExpectedProductHead $env:PRODUCT_HEAD `
            -ExpectedProductTree $env:PRODUCT_TREE `
            -GodotGui $env:GODOT_GUI `
            -GodotConsole $env:GODOT_CONSOLE `
            -SessionRoot $session
          if($LASTEXITCODE-ne0){throw "USER1_R3_GUI_SMOKE_FAILED:$LASTEXITCODE"}
          "SESSION_ROOT=$session" | Set-Content (Join-Path $env:RUNNER_TEMP 'user1-r3-gui-smoke.env') -Encoding ASCII
      - name: Verify smoke report
        if: always()
        shell: pwsh
        run: |
          $envFile=Join-Path $env:RUNNER_TEMP 'user1-r3-gui-smoke.env'
          if(-not(Test-Path $envFile)){return}
          $session=((Get-Content $envFile|Where-Object{$_ -like 'SESSION_ROOT=*'})-replace '^SESSION_ROOT=','')
          $report=Join-Path $session 'USER1-R3-GUI-SMOKE.json'
          if(-not(Test-Path $report)){throw 'USER1_R3_GUI_REPORT_MISSING'}
          $r=Get-Content $report -Raw|ConvertFrom-Json -Depth 100
          if([string]$r.outcome-ne'PASS'){throw "USER1_R3_GUI_REPORT_FAIL:$($r.failure)"}
          if([string]$r.product_head-ne$env:PRODUCT_HEAD){throw 'USER1_R3_GUI_PRODUCT_HEAD_MISMATCH'}
          if([bool]$r.mutation_freeze_reason_present){throw 'USER1_R3_GUI_FREEZE_REASON_PRESENT'}
          if([int]$r.transfer_failures-ne0){throw 'USER1_R3_GUI_TRANSFER_FAILURE'}
          if([int]$r.roundtrips-lt1){throw 'USER1_R3_GUI_ROUNDTRIP_MISSING'}
          if([int]$r.final_fast_join_acks-lt3){throw 'USER1_R3_GUI_FAST_JOIN_ACKS_MISSING'}
      - name: Upload USER1 R3 GUI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: user1-r3-gui-seam-smoke-${{ github.run_id }}
          path: |
            ${{ runner.temp }}\user1-r3-gui-smoke-*/**
            ${{ runner.temp }}\user1-r3-gui-smoke.env
          if-no-files-found: warn
          retention-days: 90
