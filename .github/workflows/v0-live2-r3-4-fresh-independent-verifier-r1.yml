name: V0 LIVE.2 R3.4 Fresh Independent Verifier R1

on:
  push:
    branches:
      - control/v0-live2-r3-4-fresh-independent-verifier-r1
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v0-live2-r3-4-fresh-independent-verifier-r1
  cancel-in-progress: true

env:
  SUBJECT_HEAD: 265b58768a388ab5502eb7662ae1809310c6169d
  SUBJECT_TREE: 3b571e318d563907876181e73aa21e196586841f
  PRODUCT_BASE: ab74614c2c3ea0f4dd5c07e614c0d11246eb270c
  MAIN_FENCE: 845dc2411a4810a5e7e15b6d96ae0d661014ffb8
  GODOT_BIN: C:\Godot\godot\bin\godot.windows.editor.double.x86_64.console.exe
  GODOT_GUI: C:\Godot\godot\bin\godot.windows.editor.double.x86_64.exe
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  BREAKPOINT_RUNTIME_DISABLED: '1'
  GODOT_SILENCE_ROOT_WARNING: '1'

jobs:
  evidence:
    name: verifier-source-and-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SUBJECT_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SUBJECT_TREE"
          git fetch origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse origin/main)" = "$MAIN_FENCE"
          git merge-base --is-ancestor "$MAIN_FENCE" "$SUBJECT_HEAD"
          mapfile -t changed < <(git diff --name-only "$PRODUCT_BASE" "$SUBJECT_HEAD")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "tests/integration/test_v0_mvp_5_graphical_material.py"
          python -m py_compile tests/integration/test_v0_mvp_5_graphical_material.py tools/live2/live2_automation_client.py tools/live2/analyze_live2_autonomous_playtest.py

      - name: Download final double-full evidence
        uses: actions/download-artifact@v4
        with:
          name: v0-live2-r3-4-maincatchup-full-37175171012-1
          path: verifier-evidence/full
          github-token: ${{ github.token }}
          repository: rootfabric/distributed-world-simulator
          run-id: 37175171012

      - name: Download final targeted Windows evidence
        uses: actions/download-artifact@v4
        with:
          name: v0-live2-targeted-37175136365-1
          path: verifier-evidence/targeted
          github-token: ${{ github.token }}
          repository: rootfabric/distributed-world-simulator
          run-id: 37175136365

      - name: Independently audit saved evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          head = "265b58768a388ab5502eb7662ae1809310c6169d"
          tree = "3b571e318d563907876181e73aa21e196586841f"
          main = "845dc2411a4810a5e7e15b6d96ae0d661014ffb8"
          product_base = "ab74614c2c3ea0f4dd5c07e614c0d11246eb270c"

          full = Path("verifier-evidence/full")
          targeted = Path("verifier-evidence/targeted")

          manifest = json.loads((full / "manifest.json").read_text(encoding="utf-8-sig"))
          assert manifest["passed"] is True
          assert manifest["subject_head"] == head
          assert manifest["subject_tree"] == tree
          assert manifest["main_fence"] == main
          assert manifest["live2_parent"] == product_base
          for key in (
              "preflight", "import", "focused", "p2_isolated",
              "world_core_pass_1", "world_core_pass_2", "final_identity",
          ):
              assert manifest[key] == "success", (key, manifest[key])

          preflight = json.loads((full / "preflight.json").read_text(encoding="utf-8-sig"))
          assert preflight["head"] == head
          assert preflight["tree"] == tree
          assert preflight["main"] == main
          assert preflight["verified_product_base"] == product_base
          assert preflight["post_catchup_harness_files"] == "tests/integration/test_v0_mvp_5_graphical_material.py"

          for pass_name in ("world-pass-1", "world-pass-2"):
              summary = json.loads((full / pass_name / "world-regression-summary.json").read_text(encoding="utf-8-sig"))
              assert summary["passed"] is True
              assert summary["declared_test_count"] == summary["discovered_test_count"] == 357
              assert len(summary["steps"]) >= 362
              assert all(step.get("passed") is True and int(step.get("exit_code", 0)) == 0 for step in summary["steps"])

          tsummary = json.loads((targeted / "summary.json").read_text(encoding="utf-8-sig"))
          assert tsummary["tree"] == tree
          for key in ("import_pass", "rollover_pass", "human_bridge_pass", "nx2_physical_pass", "mvp5_graphical_pass", "tracked_clean"):
              assert tsummary[key] is True, (key, tsummary[key])

          mvp5 = json.loads((targeted / "mvp5" / "manifest.json").read_text(encoding="utf-8-sig"))
          assert mvp5["subject_tree"] == tree
          assert mvp5["passed"] is True
          assert mvp5["error"] == ""
          assert all(mvp5["checks"].values())
          negatives = mvp5["negative_controls"]
          assert len(negatives) >= 20
          assert len(negatives) == len(set(negatives))
          assert "native_residual_outside_tolerance" in negatives

          out = {
              "schema": "dws.live2.r3_4.fresh_independent_verifier.source.v1",
              "subject_head": head,
              "subject_tree": tree,
              "main_fence": main,
              "product_base": product_base,
              "double_full_evidence": "PASS",
              "targeted_evidence": "PASS",
              "world_pass_test_count": 357,
              "mvp5_negative_controls": len(negatives),
              "verdict": "PASS",
          }
          Path("verifier-evidence/source-verifier.json").write_text(json.dumps(out, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(out, indent=2))
          PY

      - name: Upload source verifier evidence
        uses: actions/upload-artifact@v4
        with:
          name: v0-live2-r3-4-fresh-verifier-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: verifier-evidence/
          if-no-files-found: error
          retention-days: 90

  windows:
    name: verifier-exact-windows-and-gui
    needs: evidence
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SUBJECT_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Exact Windows preflight
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force artifacts\fresh-verifier | Out-Null
          if ((git rev-parse HEAD).Trim() -ne $env:SUBJECT_HEAD) { throw 'HEAD_MISMATCH' }
          if ((git rev-parse 'HEAD^{tree}').Trim() -ne $env:SUBJECT_TREE) { throw 'TREE_MISMATCH' }
          git fetch origin '+refs/heads/main:refs/remotes/origin/main'
          if ((git rev-parse origin/main).Trim() -ne $env:MAIN_FENCE) { throw 'MAIN_MOVED' }
          if (git status --porcelain --untracked-files=no) { throw 'TRACKED_DIRTY_BEFORE' }

          $foreign=@(Get-Process -ErrorAction SilentlyContinue | Where-Object {$_.ProcessName -like 'godot*'})
          if ($foreign.Count -gt 0) {
            throw ('FOREIGN_GODOT_PROCESS:' + (($foreign | Select-Object -ExpandProperty Id) -join ','))
          }

          $version=(& $env:GODOT_BIN --version | Out-String).Trim()
          $sha=(Get-FileHash $env:GODOT_BIN -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($version -ne '4.7.1.stable.double.custom_build.a13da4feb') { throw "GODOT_VERSION_MISMATCH:$version" }
          if ($sha -ne '3633c3e609c8ce2f9bae334a9c7e75c7f974de3af0415ab4a8050a625a15a7a5') { throw "GODOT_SHA_MISMATCH:$sha" }
          $os=Get-CimInstance Win32_OperatingSystem
          $free=[math]::Round(($os.FreePhysicalMemory*1KB)/1GB,2)
          if ($free -lt 10) { throw "LOW_FREE_RAM:$free" }

          [ordered]@{
            head=$env:SUBJECT_HEAD
            tree=$env:SUBJECT_TREE
            main=$env:MAIN_FENCE
            godot_version=$version
            godot_sha256=$sha
            gui_sha256=(Get-FileHash $env:GODOT_GUI -Algorithm SHA256).Hash.ToLowerInvariant()
            free_ram_gb=$free
            host=$env:COMPUTERNAME
          } | ConvertTo-Json -Depth 5 | Set-Content artifacts\fresh-verifier\preflight.json -Encoding UTF8

      - name: Cold import
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference='Stop'
          if (Test-Path .godot) { Remove-Item .godot -Recurse -Force }
          & $env:GODOT_BIN --headless --path . --editor --import --quit *> artifacts\fresh-verifier\import.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content artifacts\fresh-verifier\import.log -Tail 300
            throw "IMPORT_FAILED:$LASTEXITCODE"
          }
          if (Select-String artifacts\fresh-verifier\import.log -Pattern 'SCRIPT ERROR:|Parse Error:|Compile Error:' -Quiet) {
            throw 'IMPORT_SCRIPT_ERROR'
          }

      - name: Independent focused network and P2 gates
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference='Stop'
          $tests=@(
            'tests/runtime/test_v0_live2_r3_4_automation_control.gd',
            'tests/runtime/test_v0_live2_r3_3_snapshot_clock.gd',
            'tests/runtime/test_v0_live2_r3_reliability.gd',
            'tests/network/test_v0_live2_enet_rollover.gd',
            'tests/network/test_nx2_physical_channel_processes.gd',
            'tests/runtime/test_v0_p2_live_shared_state_convergence.gd'
          )
          $results=@()
          foreach($test in $tests) {
            $log=Join-Path 'artifacts\fresh-verifier' ((Split-Path $test -Leaf)+'.log')
            & $env:GODOT_BIN --headless --path . --script ('res://'+$test) *> $log
            $code=$LASTEXITCODE
            $errors=[bool](Select-String $log -Pattern 'SCRIPT ERROR:|Parse Error:|Compile Error:' -Quiet)
            $passed=($code -eq 0 -and -not $errors)
            $results += [ordered]@{test=$test;exit_code=$code;script_errors=$errors;passed=$passed}
            if(-not $passed) {
              Get-Content $log -Tail 300
              throw ("FOCUSED_FAILED:{0}:{1}" -f $test,$code)
            }
          }
          $results | ConvertTo-Json -Depth 5 | Set-Content artifacts\fresh-verifier\focused.json -Encoding UTF8

      - name: Independent MVP5 graphical material gate
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference='Stop'
          $out=(Join-Path (Resolve-Path artifacts\fresh-verifier).Path 'mvp5')
          python tests/integration/test_v0_mvp_5_graphical_material.py --engine $env:GODOT_BIN --output $out *> artifacts\fresh-verifier\mvp5.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content artifacts\fresh-verifier\mvp5.log -Tail 350
            throw "MVP5_FAILED:$LASTEXITCODE"
          }

      - name: Independent autonomous A/B GUI smoke
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference='Stop'
          $foreign=@(Get-Process -ErrorAction SilentlyContinue | Where-Object {$_.ProcessName -like 'godot*'})
          if ($foreign.Count -gt 0) { throw ('FOREIGN_GODOT_BEFORE_GUI:' + (($foreign | Select-Object -ExpandProperty Id) -join ',')) }

          $session=(Join-Path (Resolve-Path artifacts\fresh-verifier).Path 'gui')
          pwsh -NoProfile -File .\tools\live2\run_live2_autonomous_playtest.ps1 -Worktree (Resolve-Path .).Path -MovementPhaseSeconds 8 -SessionRoot $session
          if ($LASTEXITCODE -ne 0) { throw "GUI_RUNNER_FAILED:$LASTEXITCODE" }

          $report=Get-Content (Join-Path $session 'AUTONOMOUS-PLAYTEST-REPORT.json') -Raw | ConvertFrom-Json
          $lag=Get-Content (Join-Path $session 'AUTONOMOUS-LAG-ANALYSIS.json') -Raw | ConvertFrom-Json
          if ($report.outcome -ne 'COMPLETED') { throw "GUI_OUTCOME:$($report.outcome)" }
          if ($report.product_head -ne $env:SUBJECT_HEAD) { throw "GUI_HEAD_MISMATCH:$($report.product_head)" }

          $sources=@($lag.summary.snapshot_clock_sources)
          if ($sources.Count -ne 1 -or $sources[0] -ne 'CANONICAL_SNAPSHOT_CONTEXT') {
            throw ('GUI_CLOCK_SOURCE:' + ($sources -join ','))
          }
          if ([double]$lag.summary.max_remote_hold_ratio -gt 0.25) {
            throw "GUI_REMOTE_HOLD_MAJOR:$($lag.summary.max_remote_hold_ratio)"
          }
          if ([int]$lag.summary.local_hard_corrections_delta -ne 0) {
            throw "GUI_HARD_CORRECTIONS:$($lag.summary.local_hard_corrections_delta)"
          }
          foreach($field in @('server_pump_hard_stall','physical_delivery_mode_mismatch','input_queue_full','peer_local_quarantine','script_errors')) {
            if ([int]$lag.events.$field -ne 0) { throw ("GUI_EVENT_{0}:{1}" -f $field,$lag.events.$field) }
          }

      - name: Final exact identity and cleanup
        if: always()
        shell: pwsh
        run: |
          $head=(git rev-parse HEAD).Trim()
          $tree=(git rev-parse 'HEAD^{tree}').Trim()
          $tracked=(git status --porcelain --untracked-files=no | Out-String).Trim()
          $godot=@(Get-Process -ErrorAction SilentlyContinue | Where-Object {$_.ProcessName -like 'godot*'})
          [ordered]@{
            head=$head
            tree=$tree
            tracked_clean=[string]::IsNullOrWhiteSpace($tracked)
            remaining_godot_pids=@($godot | Select-Object -ExpandProperty Id)
          } | ConvertTo-Json -Depth 5 | Set-Content artifacts\fresh-verifier\final.json -Encoding UTF8

          if ($head -ne $env:SUBJECT_HEAD) { throw 'FINAL_HEAD_MISMATCH' }
          if ($tree -ne $env:SUBJECT_TREE) { throw 'FINAL_TREE_MISMATCH' }
          if (-not [string]::IsNullOrWhiteSpace($tracked)) { throw 'FINAL_TRACKED_DIRTY' }
          if ($godot.Count -gt 0) { throw ('FINAL_GODOT_LEAK:' + (($godot | Select-Object -ExpandProperty Id) -join ',')) }

      - name: Upload independent verifier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0-live2-r3-4-fresh-independent-verifier-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/fresh-verifier/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
