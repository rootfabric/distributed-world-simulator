name: V0 LIVE.2 R3 Exact Windows Quality Gate

on:
  push:
    branches: [control/v0-live2-r3-validation-r1]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v0-live2-r3-quality-exact
  cancel-in-progress: false

env:
  PRODUCT_HEAD: 5b5652cd479eaf9e3866b1ae27eb3cb3b2bbe356
  PRODUCT_TREE: 5607607f5940fbc8e7e33b147b0f3bcac7bb2b9e
  MAIN_FENCE: 323845379490b2acda1844c3799bb0275d8c2674
  R2_HEAD: a61e0bb6104b54214cea464a14ca79243b6dd7ea
  GODOT_BIN: C:\Godot\godot\bin\godot.windows.editor.double.x86_64.console.exe
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  BREAKPOINT_RUNTIME_DISABLED: '1'
  GODOT_SILENCE_ROOT_WARNING: '1'
  PLANET_SIMULATOR_INVENTORY_PROFILE: planet_default

jobs:
  quality:
    name: LIVE2 R3 Windows focused and full world-core
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    steps:
      - name: Checkout frozen R3
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare evidence and verify identity host transport pins
        id: preflight
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out='artifacts\live2-r3'
          New-Item -ItemType Directory -Force $out | Out-Null
          if ((git rev-parse HEAD).Trim() -ne $env:PRODUCT_HEAD) { throw 'HEAD_MISMATCH' }
          if ((git rev-parse 'HEAD^{tree}').Trim() -ne $env:PRODUCT_TREE) { throw 'TREE_MISMATCH' }
          if ((git status --porcelain --untracked-files=no)) { throw 'TRACKED_DIRTY_BEFORE' }
          git fetch origin '+refs/heads/main:refs/remotes/origin/main'
          if ($LASTEXITCODE -ne 0) { throw 'MAIN_FETCH_FAILED' }
          if ((git rev-parse origin/main).Trim() -ne $env:MAIN_FENCE) { throw 'MAIN_MOVED_BEFORE' }
          git merge-base --is-ancestor $env:MAIN_FENCE $env:PRODUCT_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'MAIN_NOT_ANCESTOR' }
          $pins=@(
            'scripts/network/transports/v2/enet_multi_peer_transport_port.gd',
            'scripts/network/realtime/realtime_channel_policy.gd',
            'scripts/runtime/networked_gameplay/m3/m3_graphical_client_runtime_nx6.gd',
            'scripts/runtime/networked_gameplay/m3/m3_graphical_client_runtime.gd',
            'tests/network/test_v0_live2_enet_rollover.gd'
          )
          git diff --exit-code $env:R2_HEAD $env:PRODUCT_HEAD -- $pins
          if ($LASTEXITCODE -ne 0) { throw 'R2_TRANSPORT_CHANGED' }
          $foreign=@(Get-Process -ErrorAction SilentlyContinue | Where-Object {$_.ProcessName -like 'godot*'})
          if ($foreign.Count -gt 0) { throw ('FOREIGN_GODOT_PROCESS:' + (($foreign | Select-Object -ExpandProperty Id) -join ',')) }
          $sha=(Get-FileHash $env:GODOT_BIN -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne '3633c3e609c8ce2f9bae334a9c7e75c7f974de3af0415ab4a8050a625a15a7a5') { throw 'GODOT_SHA_MISMATCH' }
          $version=& $env:GODOT_BIN --version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '4\.7\.1.*double.*a13da4feb') { throw 'GODOT_VERSION_MISMATCH' }
          $os=Get-CimInstance Win32_OperatingSystem
          $free=[math]::Round(($os.FreePhysicalMemory*1KB)/1GB,2)
          if ($free -lt 10) { throw "LOW_FREE_RAM:$free" }
          [ordered]@{head=$env:PRODUCT_HEAD;tree=$env:PRODUCT_TREE;main=$env:MAIN_FENCE;godot_version=$version;godot_sha256=$sha;free_ram_gb=$free;r2_transport_unchanged=$true} | ConvertTo-Json | Set-Content "$out\preflight.json" -Encoding utf8

      - name: Cold import
        id: import
        shell: pwsh
        timeout-minutes: 12
        run: |
          $ErrorActionPreference='Stop'
          if (Test-Path .godot) { Remove-Item .godot -Recurse -Force }
          & $env:GODOT_BIN --headless --path . --editor --import --quit *> artifacts\live2-r3\import.log
          $code=$LASTEXITCODE
          if ($code -ne 0) { Get-Content artifacts\live2-r3\import.log -Tail 200; throw "IMPORT_FAILED:$code" }
          if (-not (Test-Path .godot\global_script_class_cache.cfg)) { throw 'CLASS_CACHE_MISSING' }
          if ((Get-Item .godot\global_script_class_cache.cfg).Length -le 0) { throw 'CLASS_CACHE_EMPTY' }

      - name: R3 inventory ownership and reliability regressions
        id: focused
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference='Stop'
          $tests=@(
            @('tests/runtime/test_v0_live2_r3_inventory_ownership.gd','inventory.log','LIVE2 R3 inventory ownership: [1-9][0-9]* assertions, 0 failures'),
            @('tests/runtime/test_v0_live2_r3_reliability.gd','reliability.log','LIVE2 R3 presentation/pressure/diagnostics: [1-9][0-9]* assertions, 0 failures')
          )
          foreach ($test in $tests) {
            $log=Join-Path 'artifacts\live2-r3' $test[1]
            & $env:GODOT_BIN --headless --path . --script ('res://'+$test[0]) *> $log
            $code=$LASTEXITCODE
            $text=Get-Content -Raw $log
            if ($code -ne 0 -or $text -match 'SCRIPT ERROR:|Parse Error|Compile Error' -or $text -notmatch $test[2]) {
              Get-Content $log -Tail 250
              throw "R3_FOCUSED_FAILED:$($test[0]):$code"
            }
          }

      - name: R2 gameplay and NX2 compatibility regressions
        id: compatibility
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference='Stop'
          $tests=@(
            'tests/network/test_v0_live2_enet_rollover.gd',
            'tests/runtime/test_v0_live2_human_gameplay_bridge.gd',
            'tests/network/test_nx2_realtime_traffic_separation.gd',
            'tests/network/test_nx2_physical_channel_processes.gd'
          )
          foreach ($test in $tests) {
            $log=Join-Path 'artifacts\live2-r3' ((Split-Path $test -Leaf)+'.log')
            & $env:GODOT_BIN --headless --path . --script ('res://'+$test) *> $log
            $code=$LASTEXITCODE
            if ($code -ne 0 -or (Get-Content -Raw $log) -match 'SCRIPT ERROR:|Parse Error|Compile Error') {
              Get-Content $log -Tail 250
              throw "COMPATIBILITY_FAILED:$test`:$code"
            }
          }

      - name: Full world-core including NX3 NX4 NX5 UI
        id: world
        shell: pwsh
        timeout-minutes: 120
        run: |
          $ErrorActionPreference='Stop'
          $out=(Resolve-Path 'artifacts\live2-r3').Path
          $mvp6=Join-Path $out 'mvp6-results'
          $mvp7=Join-Path $out 'mvp7-managed'
          New-Item -ItemType Directory -Force $mvp6,$mvp7 | Out-Null
          $env:EXPECTED_HEAD=$env:PRODUCT_HEAD
          $env:EXPECTED_TREE=$env:PRODUCT_TREE
          $env:MVP6_SEAM_DIAGNOSTIC_RESULT=Join-Path $mvp6 'diagnostic.json'
          $env:MVP6_CROSS_AUTHORITY_SEAM_RESULT=Join-Path $mvp6 'product.json'
          $env:MVP6_DERIVED_COLLISION_RESULT=Join-Path $mvp6 'collision.json'
          $env:MVP6_PERSISTENCE_RESULT=Join-Path $mvp6 'persistence.json'
          $env:MVP7_NATIVE_MODE='produce'
          $env:MVP7_NATIVE_ROOT=Join-Path $mvp7 'native'
          $env:MVP7_NATIVE_RESULT=Join-Path $mvp7 'native-result.json'
          $env:MVP7_WORLD_MODE='produce'
          $env:MVP7_WORLD_ROOT=Join-Path $mvp7 'world'
          $env:MVP7_WORLD_RESULT=Join-Path $mvp7 'world-result.json'
          $env:MVP7_CONSTRUCTION_MODE='produce'
          $env:MVP7_CONSTRUCTION_ROOT=Join-Path $mvp7 'construction'
          $env:MVP7_CONSTRUCTION_RESULT=Join-Path $mvp7 'construction-result.json'
          New-Item -ItemType Directory -Force $env:MVP7_NATIVE_ROOT,$env:MVP7_WORLD_ROOT,$env:MVP7_CONSTRUCTION_ROOT | Out-Null
          pwsh -NoProfile -File .\RUN_WORLD_REGRESSION_TESTS.ps1 *> (Join-Path $out 'full-world-core.log')
          $code=$LASTEXITCODE
          "$code" | Set-Content (Join-Path $out 'world-exit.txt') -Encoding ascii
          $source='artifacts\test-results\world-regression-summary.json'
          if (Test-Path $source) { Copy-Item $source (Join-Path $out 'world-regression-summary.json') }
          if ($code -ne 0) { Get-Content (Join-Path $out 'full-world-core.log') -Tail 300; throw "WORLD_CORE_FAILED:$code" }
          if (-not (Test-Path $source)) { throw 'WORLD_SUMMARY_MISSING' }
          $summary=Get-Content -Raw $source | ConvertFrom-Json
          if ($summary.passed -ne $true -or [int]$summary.declared_test_count -le 0 -or [int]$summary.declared_test_count -ne [int]$summary.discovered_test_count) { throw 'WORLD_DISCOVERY_OR_SUMMARY_RED' }
          $bad=@($summary.steps | Where-Object {$_.passed -ne $true -or [int]$_.exit_code -ne 0})
          if (@($summary.steps).Count -eq 0 -or $bad.Count -gt 0) { throw 'WORLD_STEPS_RED' }
          Write-Host "LIVE2_R3_WORLD_PASS declared=$($summary.declared_test_count) discovered=$($summary.discovered_test_count) steps=$(@($summary.steps).Count)"

      - name: Final exact identity and fresh main fence
        id: final
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:PRODUCT_HEAD) { throw 'HEAD_CHANGED' }
          if ((git rev-parse 'HEAD^{tree}').Trim() -ne $env:PRODUCT_TREE) { throw 'TREE_CHANGED' }
          if ((git status --porcelain --untracked-files=no)) { throw 'TRACKED_DIRTY_AFTER' }
          git fetch origin '+refs/heads/main:refs/remotes/origin/main'
          if ($LASTEXITCODE -ne 0) { throw 'FINAL_MAIN_FETCH_FAILED' }
          if ((git rev-parse origin/main).Trim() -ne $env:MAIN_FENCE) { throw 'MAIN_MOVED_DURING_RUN' }

      - name: Bind honest result and hashes
        if: always()
        shell: pwsh
        env:
          PREFLIGHT: ${{ steps.preflight.outcome }}
          IMPORT: ${{ steps.import.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          COMPATIBILITY: ${{ steps.compatibility.outcome }}
          WORLD: ${{ steps.world.outcome }}
          FINAL: ${{ steps.final.outcome }}
        run: |
          $ErrorActionPreference='Stop'
          $out='artifacts\live2-r3'
          New-Item -ItemType Directory -Force $out | Out-Null
          $states=@($env:PREFLIGHT,$env:IMPORT,$env:FOCUSED,$env:COMPATIBILITY,$env:WORLD,$env:FINAL)
          $passed=@($states | Where-Object {$_ -ne 'success'}).Count -eq 0
          $root=(Resolve-Path $out).Path
          $files=@(Get-ChildItem $out -File -Recurse | Where-Object {$_.Name -ne 'manifest.json'} | ForEach-Object {
            [ordered]@{path=$_.FullName.Substring($root.Length).TrimStart('\');bytes=$_.Length;sha256=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()}
          })
          [ordered]@{
            schema='distributed_world_simulator.live2_r3_machine_evidence.v1'
            passed=$passed
            subject_head=$env:PRODUCT_HEAD
            subject_tree=$env:PRODUCT_TREE
            actual_head=(git rev-parse HEAD).Trim()
            actual_tree=(git rev-parse 'HEAD^{tree}').Trim()
            main_fence=$env:MAIN_FENCE
            preflight=$env:PREFLIGHT;import=$env:IMPORT;focused=$env:FOCUSED;compatibility=$env:COMPATIBILITY;world_core=$env:WORLD;final_identity=$env:FINAL
            human_acceptance=$false
            files=$files
          } | ConvertTo-Json -Depth 7 | Set-Content "$out\manifest.json" -Encoding utf8

      - name: Upload R3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0-live2-r3-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/live2-r3/
          if-no-files-found: error
          retention-days: 90
