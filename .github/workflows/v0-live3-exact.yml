name: V0 LIVE3 exact Windows recovery
on:
  push:
    branches: [feature/v0-live3-product-recovery-r1]
    paths: [.github/workflows/v0-live3-exact.yml, validation/live3/trigger.txt]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v0-live3-exact
  cancel-in-progress: true
env:
  GODOT_BIN: C:\Godot\godot\bin\godot.windows.editor.double.x86_64.console.exe
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  BREAKPOINT_RUNTIME_DISABLED: '1'
  GODOT_SILENCE_ROOT_WARNING: '1'
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Python syntax
        run: python3 -m py_compile tests/integration/test_v0_live3_product_recovery.py
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path tools/live3/run_live3_manual.ps1),[ref]$tokens,[ref]$errors) | Out-Null
          if (@($errors).Count) { $errors | Format-List; throw 'LIVE3_MANUAL_PARSER_ERRORS' }
  windows:
    needs: source
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact subject and host
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force artifacts/live3-exact | Out-Null
          $head=(git rev-parse HEAD).Trim()
          $tree=(git rev-parse 'HEAD^{tree}').Trim()
          if ($head -ne '${{ github.sha }}') { throw 'HEAD_MISMATCH' }
          if (git status --porcelain --untracked-files=no) { throw 'TRACKED_DIRTY' }
          $foreign=@(Get-Process -ErrorAction SilentlyContinue | Where-Object {$_.ProcessName -like 'godot*'})
          if ($foreign.Count) { throw ('FOREIGN_GODOT:' + (($foreign.Id) -join ',')) }
          $sha=(Get-FileHash $env:GODOT_BIN -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne '3633c3e609c8ce2f9bae334a9c7e75c7f974de3af0415ab4a8050a625a15a7a5') { throw 'GODOT_HASH_MISMATCH' }
          $version=(& $env:GODOT_BIN --version | Out-String).Trim()
          if ($version -ne '4.7.1.stable.double.custom_build.a13da4feb') { throw 'GODOT_VERSION_MISMATCH' }
          $free=(Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory*1KB/1GB
          if ($free -lt 10) { throw "LOW_RAM:$free" }
          @{head=$head;tree=$tree;host=$env:COMPUTERNAME;godot=$version;godot_sha256=$sha;free_ram_gb=$free} | ConvertTo-Json | Set-Content artifacts/live3-exact/identity.json
      - name: Cold import
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference='Stop'
          if (Test-Path .godot) { Remove-Item .godot -Recurse -Force }
          & $env:GODOT_BIN --headless --path . --editor --import --quit *> artifacts/live3-exact/import.log
          $code=$LASTEXITCODE
          if ($code -ne 0 -or (Select-String artifacts/live3-exact/import.log -Pattern 'SCRIPT ERROR:|Parse Error:|Compile Error:' -Quiet)) {
            Get-Content artifacts/live3-exact/import.log -Tail 220
            throw "IMPORT_FAILED:$code"
          }
      - name: LIVE3 and unchanged recovery regressions
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference='Stop'
          $tests=@('tests/runtime/test_v0_live3_recovery_contracts.gd','tests/runtime/test_launch_options.gd','tests/runtime/test_m6_dedicated_recovery_contracts.gd','tests/runtime/test_v0_live2_r3_4_automation_control.gd','tests/runtime/test_v0_live2_r3_3_snapshot_clock.gd','tests/runtime/test_v0_live2_r3_reliability.gd')
          $results=@()
          foreach($test in $tests) {
            $log=Join-Path artifacts/live3-exact ((Split-Path $test -Leaf)+'.log')
            & $env:GODOT_BIN --headless --path . --script ('res://'+$test) *> $log
            $code=$LASTEXITCODE
            $errors=[bool](Select-String $log -Pattern 'SCRIPT ERROR:|Parse Error:|Compile Error:' -Quiet)
            $results+=@{test=$test;exit_code=$code;script_errors=$errors;passed=($code -eq 0 -and -not $errors)}
            $results | ConvertTo-Json | Set-Content artifacts/live3-exact/focused.json
            if ($code -ne 0 -or $errors) {
              Get-Content $log -Tail 220
              throw ('FOCUSED_FAILED:{0}:{1}' -f $test,$code)
            }
          }
      - name: Real product server recovery
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path (Resolve-Path artifacts/live3-exact) 'process-recovery'
          python tests/integration/test_v0_live3_product_recovery.py --engine $env:GODOT_BIN --output $out *> artifacts/live3-exact/process-recovery.log
          $code=$LASTEXITCODE
          Get-Content artifacts/live3-exact/process-recovery.log -Tail 200
          if ($code -ne 0) { throw "LIVE3_PROCESS_RECOVERY_FAILED:$code" }
          $manifest=Get-Content (Join-Path $out 'manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.passed -ne $true -or $manifest.subject_head -ne '${{ github.sha }}') { throw 'LIVE3_PROCESS_MANIFEST_INVALID' }
      - name: Full world-core on requested frozen candidate
        if: contains(github.event.head_commit.message, '[live3-full]')
        shell: pwsh
        timeout-minutes: 75
        run: |
          $ErrorActionPreference='Stop'
          ./RUN_WORLD_REGRESSION_TESTS.ps1 -GodotBin $env:GODOT_BIN *> artifacts/live3-exact/world-core.log
          $code=$LASTEXITCODE
          if (Test-Path artifacts/test-results/world-regression-summary.json) {
            Copy-Item artifacts/test-results/world-regression-summary.json artifacts/live3-exact/world-core-summary.json
          }
          if ($code -ne 0) { Get-Content artifacts/live3-exact/world-core.log -Tail 250; throw "WORLD_CORE_FAILED:$code" }
      - name: Final source identity and owned-process cleanup check
        if: always()
        shell: pwsh
        run: |
          $godot=@(Get-Process -ErrorAction SilentlyContinue | Where-Object {$_.ProcessName -like 'godot*'})
          @{head=(git rev-parse HEAD).Trim();tree=(git rev-parse 'HEAD^{tree}').Trim();tracked_clean=(-not [bool](git status --porcelain --untracked-files=no));remaining_godot_pids=@($godot.Id)} | ConvertTo-Json | Set-Content artifacts/live3-exact/final.json
          if (git status --porcelain --untracked-files=no) { throw 'TRACKED_DIRTY_AFTER' }
          if ($godot.Count) { throw 'GODOT_PROCESSES_REMAIN_NO_MASS_KILL' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live3-exact-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/live3-exact/
            !artifacts/live3-exact/process-recovery/profiles/
          if-no-files-found: error
          retention-days: 30
