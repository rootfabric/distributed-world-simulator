name: V0 LIVE.3 R1 Recovery Windows

on:
  push:
    branches:
      - feature/v0-live3-recovery-product-r1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v0-live3-r1-recovery-windows
  cancel-in-progress: true

env:
  BASE_MAIN: 894f7033b16cefcf78e40d660bdbaf0c9b061afe
  GODOT_BIN: C:\Godot\godot\bin\godot.windows.editor.double.x86_64.console.exe
  GODOT_GUI: C:\Godot\godot\bin\godot.windows.editor.double.x86_64.exe
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  BREAKPOINT_RUNTIME_DISABLED: '1'
  GODOT_SILENCE_ROOT_WARNING: '1'

jobs:
  source:
    name: LIVE3 source contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prove bounded LIVE3 diff
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_MAIN" HEAD
          mapfile -t actual < <(git diff --name-only "$BASE_MAIN" HEAD | sort)
          expected=(
            ".github/workflows/v0-live3-r1-recovery-windows.yml"
            "docs/control/v0-live/V0_LIVE3_RECOVERY_PRODUCT_R1_RU.md"
            "scripts/app/earth_mvp_app.gd"
            "scripts/app/simulator_app.gd"
            "scripts/runtime/launch_options.gd"
            "tests/runtime/test_launch_options.gd"
            "tools/live3/run_live3_product_recovery.ps1"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${actual[@]}")
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Reject new canonical owners
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_MAIN" HEAD)"
          ! grep -Eq '^(scripts/(items|construction/authoritative|persistence|simulation/transactions)|config/control)/' <<<"$changed"
          grep -q 'resolved_network_persistence_root' scripts/runtime/launch_options.gd
          grep -q 'v0-live/recovery' scripts/runtime/launch_options.gd
          grep -q 'construction_construct_checksums' scripts/app/earth_mvp_app.gd

  windows:
    name: LIVE3 exact Windows product recovery
    needs: source
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Host and identity preflight
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force artifacts\live3-r1 | Out-Null
          $foreign=@(Get-Process -ErrorAction SilentlyContinue | Where-Object {$_.ProcessName -like 'godot*'})
          if($foreign.Count -gt 0){throw ('FOREIGN_GODOT_PROCESS:'+(($foreign|Select-Object -ExpandProperty Id)-join ','))}
          $version=(& $env:GODOT_BIN --version | Out-String).Trim()
          $sha=(Get-FileHash $env:GODOT_BIN -Algorithm SHA256).Hash.ToLowerInvariant()
          if($version -ne '4.7.1.stable.double.custom_build.a13da4feb'){throw "GODOT_VERSION_MISMATCH:$version"}
          if($sha -ne '3633c3e609c8ce2f9bae334a9c7e75c7f974de3af0415ab4a8050a625a15a7a5'){throw "GODOT_SHA_MISMATCH:$sha"}
          $os=Get-CimInstance Win32_OperatingSystem
          $free=[math]::Round(($os.FreePhysicalMemory*1KB)/1GB,2)
          if($free -lt 10){throw "LOW_FREE_RAM:$free"}
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\tools\live3\run_live3_product_recovery.ps1),
            [ref]$tokens,[ref]$errors
          ) | Out-Null
          if(@($errors).Count -ne 0){
            @($errors) | Format-List | Out-String | Write-Host
            throw "LIVE3_RUNNER_PARSE_FAILED:$(@($errors).Count)"
          }
          [ordered]@{
            head=(git rev-parse HEAD).Trim()
            tree=(git rev-parse 'HEAD^{tree}').Trim()
            base_main=$env:BASE_MAIN
            godot_version=$version
            godot_sha256=$sha
            free_ram_gb=$free
            host=$env:COMPUTERNAME
          } | ConvertTo-Json -Depth 5 | Set-Content artifacts\live3-r1\preflight.json -Encoding UTF8

      - name: Cold Godot import
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference='Stop'
          if(Test-Path .godot){Remove-Item .godot -Recurse -Force}
          & $env:GODOT_BIN --headless --path . --editor --import --quit *> artifacts\live3-r1\import.log
          $code=$LASTEXITCODE
          if($code -ne 0){
            Get-Content artifacts\live3-r1\import.log -Tail 300
            throw "IMPORT_FAILED:$code"
          }
          if(-not(Test-Path .godot\global_script_class_cache.cfg)){throw 'CLASS_CACHE_MISSING'}
          if(Select-String artifacts\live3-r1\import.log -Pattern 'SCRIPT ERROR:|Parse Error:|Compile Error:' -Quiet){
            Get-Content artifacts\live3-r1\import.log -Tail 300
            throw 'IMPORT_SCRIPT_ERRORS'
          }

      - name: LIVE3 launch contract
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & $env:GODOT_BIN --headless --path . --script res://tests/runtime/test_launch_options.gd *> artifacts\live3-r1\launch-options.log
          if($LASTEXITCODE -ne 0){
            Get-Content artifacts\live3-r1\launch-options.log -Tail 300
            throw "LAUNCH_OPTIONS_FAILED:$LASTEXITCODE"
          }

      - name: Existing recovery regressions
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference='Stop'
          $rows=@()
          function Invoke-Live3Regression([string]$Label,[string]$Test){
            $log=Join-Path 'artifacts\live3-r1' ($Label+'.log')
            & $env:GODOT_BIN --headless --path . --script ('res://'+$Test) *> $log
            $code=$LASTEXITCODE
            $scriptErrors=[bool](Select-String $log -Pattern 'SCRIPT ERROR:|Parse Error:|Compile Error:' -Quiet)
            $passed=($code -eq 0 -and -not $scriptErrors)
            if(-not$passed){
              Get-Content $log -Tail 350
              throw ("RECOVERY_REGRESSION_FAILED:{0}:{1}:{2}" -f $Label,$Test,$code)
            }
            return [ordered]@{label=$Label;test=$Test;exit_code=$code;script_errors=$scriptErrors;passed=$passed}
          }

          $directTests=@(
            'tests/runtime/test_m6_dedicated_recovery_contracts.gd',
            'tests/runtime/test_m6_dedicated_recovery_processes.gd',
            'tests/runtime/test_v0_p3_resource_mining_aggregate_recovery.gd',
            'tests/runtime/test_v0_p4_live_two_client_reconnect_convergence.gd'
          )
          foreach($test in $directTests){
            $rows += Invoke-Live3Regression ((Split-Path $test -LeafBase)) $test
          }

          # MVP7 quiescent and Construction restart files are process workers,
          # not standalone tests. Reproduce their accepted three-process
          # produce -> recover1 -> recover2 contract instead of invoking them
          # without the required environment.
          $head=(git rev-parse HEAD).Trim()
          $tree=(git rev-parse 'HEAD^{tree}').Trim()
          $env:EXPECTED_HEAD=$head
          $env:EXPECTED_TREE=$tree
          $artifactRoot=(Resolve-Path 'artifacts\live3-r1').Path
          $profileRoot=Join-Path $artifactRoot 'mvp7-regression-profile'
          $env:APPDATA=Join-Path $profileRoot 'AppData\Roaming'
          $env:LOCALAPPDATA=Join-Path $profileRoot 'AppData\Local'
          New-Item -ItemType Directory -Force $env:APPDATA,$env:LOCALAPPDATA | Out-Null

          $nativeRoot=Join-Path $artifactRoot 'mvp7-native-regression'
          New-Item -ItemType Directory -Force $nativeRoot | Out-Null
          $env:MVP7_NATIVE_ROOT=Join-Path $nativeRoot 'native-checkpoints'
          foreach($mode in @('produce','recover1','recover2')){
            $env:MVP7_NATIVE_MODE=$mode
            $env:MVP7_NATIVE_RESULT=Join-Path $nativeRoot ($mode+'.json')
            $rows += Invoke-Live3Regression ('mvp7-native-'+$mode) 'tests/runtime/test_v0_mvp_7_quiescent_recovery.gd'
          }

          $constructionRoot=Join-Path $artifactRoot 'mvp7-construction-regression'
          New-Item -ItemType Directory -Force $constructionRoot | Out-Null
          $env:MVP7_CONSTRUCTION_ROOT=$constructionRoot
          foreach($mode in @('produce','recover1','recover2')){
            $env:MVP7_CONSTRUCTION_MODE=$mode
            $env:MVP7_CONSTRUCTION_RESULT=Join-Path $constructionRoot ($mode+'.json')
            $rows += Invoke-Live3Regression ('mvp7-construction-'+$mode) 'tests/runtime/test_v0_mvp_7_construction_restart.gd'
          }

          $rows | ConvertTo-Json -Depth 5 | Set-Content artifacts\live3-r1\recovery-regressions.json -Encoding UTF8

      - name: LIVE2 compatibility focused regressions
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference='Stop'
          $tests=@(
            'tests/runtime/test_v0_live2_r3_4_automation_control.gd',
            'tests/runtime/test_v0_live2_r3_3_snapshot_clock.gd',
            'tests/runtime/test_v0_live2_r3_reliability.gd',
            'tests/network/test_v0_live2_enet_rollover.gd'
          )
          foreach($test in $tests){
            $log=Join-Path 'artifacts\live3-r1' ((Split-Path $test -Leaf)+'.compat.log')
            & $env:GODOT_BIN --headless --path . --script ('res://'+$test) *> $log
            if($LASTEXITCODE -ne 0){
              Get-Content $log -Tail 300
              throw ("LIVE2_COMPAT_FAILED:{0}:{1}" -f $test,$LASTEXITCODE)
            }
          }

      - name: Product reconnect and planned restart
        shell: pwsh
        timeout-minutes: 12
        run: |
          $ErrorActionPreference='Stop'
          $session=(Join-Path (Resolve-Path artifacts\live3-r1).Path 'product-recovery')

          # Diagnostic-only, fail-path instrumentation. The product checkout is
          # restored byte-for-byte before this step returns so final clean-source
          # remains an exact HEAD proof.
          $protocolPath=(Resolve-Path .\scripts\network\transports\v2\protocol_frame_v2.gd).Path
          $serverPath=(Resolve-Path .\scripts\runtime\networked_gameplay\m3\m3_dedicated_server_runtime_p2.gd).Path
          $utf8=New-Object System.Text.UTF8Encoding($false)
          $protocolOriginal=[IO.File]::ReadAllText($protocolPath)
          $serverOriginal=[IO.File]::ReadAllText($serverPath)
          try {
            $protocolNeedle='\tif expected_checksum.is_empty() or expected_checksum != String(value["payload_checksum"]):' + "`r`n" + '\t\treturn UtilsScript.validation_failure("PAYLOAD_CHECKSUM_MISMATCH", "Payload checksum mismatch")'
            if(-not $protocolOriginal.Contains($protocolNeedle)){
              $protocolNeedle='\tif expected_checksum.is_empty() or expected_checksum != String(value["payload_checksum"]):' + "`n" + '\t\treturn UtilsScript.validation_failure("PAYLOAD_CHECKSUM_MISMATCH", "Payload checksum mismatch")'
            }
            if(-not $protocolOriginal.Contains($protocolNeedle)){throw 'LIVE3_DIAG_PROTOCOL_ANCHOR_MISSING'}
            $nl=if($protocolNeedle.Contains("`r`n")){"`r`n"}else{"`n"}
            $protocolReplacement=(
              '\tif expected_checksum.is_empty() or expected_checksum != String(value["payload_checksum"]):' + $nl +
              '\t\tif OS.get_environment("DWS_LIVE3_CHECKSUM_DIAG") == "1":' + $nl +
              '\t\t\tprint("[live3_checksum_rx] " + JSON.stringify({' + $nl +
              '\t\t\t\t"stored_checksum": String(value["payload_checksum"]),' + $nl +
              '\t\t\t\t"expected_checksum": expected_checksum,' + $nl +
              '\t\t\t\t"frame_channel": String(value.get("channel", "")),' + $nl +
              '\t\t\t\t"delivery_mode": String(value.get("delivery_mode", "")),' + $nl +
              '\t\t\t\t"frame_sequence": int(value.get("sequence", 0)),' + $nl +
              '\t\t\t\t"payload": value.get("payload", {}),' + $nl +
              '\t\t\t}, "", true, true))' + $nl +
              '\t\treturn UtilsScript.validation_failure("PAYLOAD_CHECKSUM_MISMATCH", "Payload checksum mismatch")'
            )
            [IO.File]::WriteAllText($protocolPath,$protocolOriginal.Replace($protocolNeedle,$protocolReplacement),$utf8)

            $serverNeedle='\tvar frame_result: Dictionary = _boundary.create_frame_for_peer('
            $serverAt=$serverOriginal.IndexOf($serverNeedle)
            if($serverAt -lt 0){throw 'LIVE3_DIAG_SERVER_ANCHOR_MISSING'}
            $serverIf=$serverOriginal.IndexOf('\tif not bool(frame_result.get("success", false)):', $serverAt)
            if($serverIf -lt 0){throw 'LIVE3_DIAG_SERVER_IF_ANCHOR_MISSING'}
            $serverInsert=(
              '\tif OS.get_environment("DWS_LIVE3_CHECKSUM_DIAG") == "1" and message_type == "COMPACT_GAMEPLAY_SNAPSHOT":' + $nl +
              '\t\tvar diag_frame: Dictionary = frame_result.get("details", {}).get("frame", {})' + $nl +
              '\t\tprint("[live3_checksum_tx] " + JSON.stringify({' + $nl +
              '\t\t\t"peer_id": peer_id,' + $nl +
              '\t\t\t"stored_checksum": String(diag_frame.get("payload_checksum", "")),' + $nl +
              '\t\t\t"frame_sequence": int(diag_frame.get("sequence", 0)),' + $nl +
              '\t\t\t"payload": diag_frame.get("payload", {}),' + $nl +
              '\t\t}, "", true, true))' + $nl
            )
            $serverPatched=$serverOriginal.Insert($serverIf,$serverInsert)
            [IO.File]::WriteAllText($serverPath,$serverPatched,$utf8)

            $env:DWS_LIVE3_CHECKSUM_DIAG='1'
            pwsh -NoProfile -File .\tools\live3\run_live3_product_recovery.ps1 -Worktree (Resolve-Path .).Path -SessionRoot $session -PhaseOneServerLifetimeSeconds 90 -SkipImport
            $productExit=$LASTEXITCODE
          }
          finally {
            Remove-Item Env:DWS_LIVE3_CHECKSUM_DIAG -ErrorAction SilentlyContinue
            [IO.File]::WriteAllText($protocolPath,$protocolOriginal,$utf8)
            [IO.File]::WriteAllText($serverPath,$serverOriginal,$utf8)
          }
          if($productExit -ne 0){throw "LIVE3_PRODUCT_RECOVERY_FAILED:$productExit"}
          $report=Get-Content (Join-Path $session 'LIVE3-RECOVERY-REPORT.json') -Raw | ConvertFrom-Json
          if($report.outcome -ne 'PASS'){throw "LIVE3_REPORT_NOT_PASS:$($report.failure)"}
          if(-not[bool]$report.udp_port_free){throw 'LIVE3_UDP_PORT_LEAK'}

      - name: Final clean source and host
        if: always()
        shell: pwsh
        run: |
          $head=(git rev-parse HEAD).Trim()
          $tree=(git rev-parse 'HEAD^{tree}').Trim()
          $tracked=(git status --porcelain --untracked-files=no | Out-String).Trim()
          $godot=@(Get-Process -ErrorAction SilentlyContinue | Where-Object {$_.ProcessName -like 'godot*'})
          [ordered]@{
            head=$head
            tree=$tree
            tracked_clean=[string]::IsNullOrWhiteSpace($tracked)
            remaining_godot_pids=@($godot|Select-Object -ExpandProperty Id)
          } | ConvertTo-Json -Depth 5 | Set-Content artifacts\live3-r1\final.json -Encoding UTF8
          if(-not[string]::IsNullOrWhiteSpace($tracked)){throw 'TRACKED_DIRTY_AFTER'}
          if($godot.Count -gt 0){throw ('GODOT_PROCESS_LEAK:'+(($godot|Select-Object -ExpandProperty Id)-join ','))}

      - name: Upload LIVE3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0-live3-r1-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/live3-r1/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
