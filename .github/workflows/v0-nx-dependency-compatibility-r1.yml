name: V0 NX Dependency Compatibility R1
on:
  push:
    branches: [validation/eco-arch2-a9-postmerge-directional-r1]
    paths:
      - validation/control/v0_nx_directional_r1/**
      - scripts/network/prediction/predicted_item_interaction_journal.gd
      - .github/workflows/v0-nx-dependency-compatibility-r1.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: v0-nx-dependency-compat-r1
  cancel-in-progress: false
jobs:
  compatibility:
    if: github.repository == 'rootfabric/distributed-world-simulator' && github.ref == 'refs/heads/validation/eco-arch2-a9-postmerge-directional-r1'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      BREAKPOINT_RUNTIME_DISABLED: '1'
      GODOT_SILENCE_ROOT_WARNING: '1'
      PLANET_SIMULATOR_INVENTORY_PROFILE: planet_default
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Seal validator and all input refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune --quiet
          test -z "$(git status --porcelain --untracked-files=no)"
          python3 -m py_compile validation/control/v0_nx_directional_r1/*.py
      - uses: actions/download-artifact@v4
        with:
          name: p7-repair-engine-34117353691
          run-id: 34117353691
          repository: rootfabric/distributed-world-simulator
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/v0-nx-engine
      - name: Reproduce original defect and validate repaired NX pair plus exact V0
        shell: bash
        run: |
          set -euo pipefail
          export GODOT_BIN="$RUNNER_TEMP/v0-nx-engine/godot"
          test "$(sha256sum "$GODOT_BIN" | cut -d' ' -f1)" = bfa7ce632d8d4b1dcc96f64f5405ee52b57c4e25d15c3e0478acc26e08d517d7
          chmod u+x "$GODOT_BIN"
          python3 validation/control/v0_nx_directional_r1/verify_compatibility.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v0-nx-compatibility-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/v0-nx-compat/
          if-no-files-found: error
          retention-days: 90
  control-projection:
    if: github.repository == 'rootfabric/distributed-world-simulator' && github.ref == 'refs/heads/validation/eco-arch2-a9-postmerge-directional-r1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact head and pinned Harness dependency
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune --quiet
          python3 -m pip install --disable-pip-version-check -r scripts/harness/requirements.txt
          python3 -m py_compile validation/control/v0_nx_directional_r1/*.py
      - name: Fail-closed controls and isolated full-Harness main projection
        run: python3 validation/control/v0_nx_directional_r1/verify_control.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v0-nx-control-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/v0-nx-control/
          if-no-files-found: error
          retention-days: 90
