name: V0 P4.6 Source Export

on:
  push:
    branches:
      - probe/v0-p4-6-source-export

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact P4 head
        uses: actions/checkout@v4
        with:
          ref: fff8d86d3e112338d23e4c63e0b4cdc2172b57b7
          fetch-depth: 1
      - name: Verify exact head
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "fff8d86d3e112338d23e4c63e0b4cdc2172b57b7"
      - name: Pack source
        shell: bash
        run: |
          git archive --format=zip --output=v0-p4-6-source-fff8d86d.zip HEAD
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: v0-p4-6-source-fff8d86d
          path: v0-p4-6-source-fff8d86d.zip
          if-no-files-found: error
