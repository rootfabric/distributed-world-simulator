name: V0 P4 Closure Finalization Validation

on:
  pull_request:
    branches:
      - recovery/v0-p4-closure-ledger-r1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate immutable finalization shape
        shell: bash
        run: |
          set -euo pipefail
          BASE="76fcb96ea7f3d8da261a9f8aaf9d99ec5f207592"
          FINAL="b8e1443aac68525917153b28d0307f52b7959a5f"
          EXPECTED_MAIN="c58339c30e6d7e708a06c41e59208bd45f0709a4"
          HISTORICAL_DISPATCH_MAIN="5999d935e8d5b496100ced66283d8762d3403675"
          EXECUTION="config/control/harness/executions/E2026-08-17-V0-P4-R1"

          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          ACTUAL_MAIN="$(git rev-parse origin/main)"
          echo "ACTUAL_MAIN=$ACTUAL_MAIN"
          test "$ACTUAL_MAIN" = "$EXPECTED_MAIN"
          test "$(git rev-list --count "$BASE..$FINAL")" = "1"
          test "$(git rev-parse "$FINAL^")" = "$BASE"

          bad="$(git diff --name-only "$BASE" "$FINAL" | grep -Ev '^config/control/harness/executions/E2026-08-17-V0-P4-R1/' || true)"
          test -z "$bad"
          git diff --check "$BASE" "$FINAL"

          git checkout -B feature/v0-p4-construction-real-resources "$FINAL"
          test "$(git rev-parse HEAD)" = "$FINAL"

          python3 -m pip install --disable-pip-version-check -q -r scripts/harness/requirements.txt
          export PYTHONPATH="$PWD/scripts"
          export PYTHONUTF8=1

          # Historical reducer replay is intentionally evaluated against the exact
          # main that the immutable initial-dispatch audit authorized. Current-main
          # continuation is proven separately below; no RED is reinterpreted.
          git update-ref refs/remotes/origin/main "$HISTORICAL_DISPATCH_MAIN"
          python3 -m harness.cli status --root "$PWD" --execution "$EXECUTION" | tee /tmp/p4-status.log
          tail -n 1 /tmp/p4-status.log > /tmp/p4-status.json

          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/p4-status.json',encoding='utf-8'))
          r=p['reduced_work_order']
          required=p['active_work_order']['required_predicates']
          completed=r.get('completed_predicates',[])
          missing=[x for x in required if x not in completed]
          out={
            'ok':p.get('ok'),
            'state':r.get('state'),
            'snapshot_matches':r.get('snapshot_matches_authoritative_state'),
            'open_blocker':r.get('open_blocker'),
            'completed_count':len(completed),
            'missing':missing,
            'last_event_sequence':r.get('last_event_sequence'),
            'last_event_type':r.get('last_event_type'),
            'checkpoint_blockers':p.get('checkpoint_blockers'),
            'review_state':p.get('review',{}).get('state'),
            'runtime_authorized':p.get('runtime_authorized')
          }
          print('P4_HISTORICAL_LEDGER_REPLAY='+json.dumps(out,sort_keys=True))
          assert p.get('ok') is True, p
          assert r.get('state') == 'AUDITED', r
          assert r.get('snapshot_matches_authoritative_state') is True, r
          assert r.get('open_blocker') is None, r
          assert len(completed) == 35, completed
          assert missing == ['V0_P4_CHECKPOINT_PROPOSED'], missing
          assert r.get('last_event_sequence') == 53, r
          assert r.get('last_event_type') == 'AUDIT_COMPLETED', r
          assert p.get('review',{}).get('state') == 'READY', p.get('review')
          assert p.get('checkpoint_blockers') == ['REQUIRED_PREDICATES_INCOMPLETE'], p.get('checkpoint_blockers')
          assert p.get('runtime_authorized') is False, p.get('runtime_authorized')
          PY

          # Restore the real canonical main and independently prove that the new
          # current-main epoch audit authorizes continuation under epoch_validator.
          git update-ref refs/remotes/origin/main "$ACTUAL_MAIN"
          ACTUAL_MAIN="$ACTUAL_MAIN" python3 - <<'PY'
          import json, os
          from pathlib import Path
          from harness.epoch_validator import validate_epoch
          root=Path.cwd()
          execution=root/'config/control/harness/executions/E2026-08-17-V0-P4-R1'
          epoch=json.loads((execution/'project-epoch.v1.json').read_text(encoding='utf-8'))
          audit=json.loads((execution/'audits/V0-P4-CURRENT-MAIN-CONTINUE-002.v1.json').read_text(encoding='utf-8'))
          actual=os.environ['ACTUAL_MAIN']
          result=validate_epoch(root, epoch, 'main', audit, main_sha=actual)
          print('P4_CURRENT_MAIN_EPOCH_VALIDATION='+json.dumps(result,sort_keys=True))
          assert audit['main_sha'] == actual
          assert audit['decision'] == 'CONTINUE'
          assert audit['pc0'] == 'NON_RED'
          assert audit['directional_pc0'] == 'NON_RED'
          assert audit['runtime_subject_head'] == '2a6721cdf02fa1134c59d1ab98bb7b597c66821d'
          assert audit['production_runtime_mutation_present'] is False
          assert audit['p5_activation_present'] is False
          assert result['status'] == 'MAIN_MOVED_AUDIT_CONTINUE', result
          assert result['action'] == 'CONTINUE', result
          assert result['main_sha'] == actual, result
          PY

          python3 - <<'PY'
          import json
          p=json.load(open('config/control/harness/v0-product-train-policy.v1.json',encoding='utf-8'))
          assert p['current_checkpoint'] == 'V0_P4_REAL_RESOURCE_CONSTRUCTION'
          p5=next(x for x in p['checkpoint_sequence'] if x['id']=='V0_P5_EQUIPMENT_TOOLS')
          assert p5['state'] == 'PLANNED_NOT_ELIGIBLE'
          assert 'V0_P4_CHECKPOINT_ACCEPTED' in p5['activation_requires']
          print('P5_REMAINS_NOT_ELIGIBLE=PASS')
          PY
