name: V0 P4 Ledger R3 Validation

on:
  pull_request:
    branches:
      - recovery/v0-p4-closure-ledger-r1
  push:
    branches:
      - probe/v0-p4-ledger-r2-validation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate exact immutable repair with current main-owned generation-80 Harness
        shell: bash
        run: |
          set -euo pipefail
          BASE="b5bf2f529b55ce4ac6a5fb184151122814e4dcd8"
          REPAIR_HEAD="a5a166151bee325571260c4563bcecee942cb652"
          AUDITED_MAIN="5999d935e8d5b496100ced66283d8762d3403675"
          EXECUTION="config/control/harness/executions/E2026-08-17-V0-P4-R1"

          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          CURRENT_MAIN="$(git rev-parse origin/main)"
          echo "CURRENT_MAIN=$CURRENT_MAIN"
          echo "REPAIR_HEAD=$REPAIR_HEAD"
          git checkout --detach "$REPAIR_HEAD"
          test "$(git rev-parse HEAD)" = "$REPAIR_HEAD"
          test "$(git rev-list --count "$BASE..$REPAIR_HEAD")" = "1"
          test "$(git rev-parse "$REPAIR_HEAD^")" = "$BASE"

          while IFS= read -r path; do
            case "$path" in config/control/harness/executions/*) continue ;; esac
            mkdir -p "$(dirname "$path")"
            git show "$CURRENT_MAIN:$path" > "$path"
          done < <(git ls-tree -r --name-only "$CURRENT_MAIN" -- scripts/harness config/control/harness)
          for path in config/control/project-program-registry.v1.json config/control/project-control-policy.v1.json config/control/architecture-ownership.v1.json; do
            git show "$CURRENT_MAIN:$path" > "$path"
          done

          python3 -m pip install --disable-pip-version-check -q -r scripts/harness/requirements.txt
          export PYTHONPATH="$PWD/scripts"
          export PYTHONUTF8=1
          git update-ref refs/remotes/origin/main "$AUDITED_MAIN"

          python3 -m harness.cli status --root "$PWD" --execution "$EXECUTION" | tee /tmp/status.log
          tail -n 1 /tmp/status.log > /tmp/status.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/status.json',encoding='utf-8'))
          r=p['reduced_work_order']
          required=p['active_work_order']['required_predicates']
          completed=r.get('completed_predicates',[])
          missing=[x for x in required if x not in completed]
          out={
            'ok':p.get('ok'), 'state':r.get('state'), 'snapshot_matches':r.get('snapshot_matches_authoritative_state'),
            'open_blocker':r.get('open_blocker'), 'completed_count':len(completed), 'missing':missing,
            'last_event_sequence':r.get('last_event_sequence'), 'last_event_type':r.get('last_event_type'),
            'findings':p.get('findings'), 'checkpoint_blockers':p.get('checkpoint_blockers')
          }
          print('P4_LEDGER_R3_VALIDATION='+json.dumps(out,sort_keys=True))
          assert p.get('ok') is True, p
          assert r.get('state')=='AUDITED', r
          assert r.get('snapshot_matches_authoritative_state') is True, r
          assert r.get('open_blocker') is None, r
          assert len(completed)==35, completed
          assert missing==['V0_P4_CHECKPOINT_PROPOSED'], missing
          assert r.get('last_event_sequence')==52, r
          assert r.get('last_event_type')=='AUDIT_COMPLETED', r
          PY

      - name: Verify repair diff is control execution only
        shell: bash
        run: |
          set -euo pipefail
          BASE="b5bf2f529b55ce4ac6a5fb184151122814e4dcd8"
          HEAD="a5a166151bee325571260c4563bcecee942cb652"
          git diff --check "$BASE" "$HEAD"
          bad="$(git diff --name-only "$BASE" "$HEAD" | grep -Ev '^config/control/harness/executions/E2026-08-17-V0-P4-R1/' || true)"
          test -z "$bad"
          test "$(git rev-list --count "$BASE..$HEAD")" = "1"
          test "$(git rev-parse "$HEAD^")" = "$BASE"
