name: V0 P4 In-Progress Harness Probe

on:
  pull_request:
    paths:
      - '.github/workflows/v0-p4-post-activation-audit-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact current P4 execution
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/v0-p4-construction-real-resources

      - name: Verify current P4 execution head
        run: |
          ACTUAL="$(git rev-parse HEAD)"
          echo "P4_EXECUTION_HEAD=$ACTUAL"
          test "$ACTUAL" = "86a51c5396b3e78944e174ac2c2cb35e5b6b2990"
          git merge-base --is-ancestor 9c95a3ce4bdda22c7085f3b402a93d9e5f593bf1 "$ACTUAL"
          git merge-base --is-ancestor 52e8ad56f4a3cbbea36448fe7b269d41799188d8 "$ACTUAL"
          test -z "$(git status --porcelain)"
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - name: Overlay canonical-main Harness contracts only
        run: |
          while IFS= read -r f; do
            case "$f" in config/control/harness/executions/*) continue ;; esac
            mkdir -p "$(dirname "$f")"
            git show "origin/main:$f" > "$f"
          done < <(git ls-tree -r --name-only origin/main -- config/control/harness)
          while IFS= read -r f; do
            mkdir -p "$(dirname "$f")"
            git show "origin/main:$f" > "$f"
          done < <(git ls-tree -r --name-only origin/main -- scripts/harness | grep '\.py$')
          git show origin/main:config/control/project-program-registry.v1.json > config/control/project-program-registry.v1.json
          git show origin/main:config/control/project-control-policy.v1.json > config/control/project-control-policy.v1.json
          git show origin/main:config/control/architecture-ownership.v1.json > config/control/architecture-ownership.v1.json
          python3 -m pip install --disable-pip-version-check -r scripts/harness/requirements.txt

      - name: Reduce and plan current P4 execution
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          root = Path.cwd()
          sys.path.insert(0, str(root / 'scripts'))
          from harness.state_builder import build_state
          from harness.checkpoint_planner import build_plan
          from harness.contracts import ContractBundle
          execution = root / 'config/control/harness/executions/E2026-08-17-V0-P4-R1'
          state = build_state(root, execution)
          bundle = ContractBundle.load(root)
          plan = build_plan({
              'checkpoint_catalog': bundle.contracts['checkpoint_catalog'],
              'scheduler_policy': bundle.contracts['scheduler_policy'],
          }, state['active_work_order'], state['reduced_work_order'])
          assert state['reduced_work_order']['state'] == 'IN_PROGRESS', state['reduced_work_order']
          assert state['reduced_work_order']['snapshot_matches_authoritative_state'] is True
          assert state['repository']['event_subject_head_sha'] == '9c95a3ce4bdda22c7085f3b402a93d9e5f593bf1'
          assert state['repository']['event_ledger_head_sha'] == '52e8ad56f4a3cbbea36448fe7b269d41799188d8'
          assert state['findings'] == [], state['findings']
          assert plan['selected_checkpoint'] == 'V0_P4_REAL_RESOURCE_CONSTRUCTION'
          assert plan['autonomous_runtime_workers'] == 1, plan
          assert plan['v0_p4_gate']['runtime_mutation'] == 'AUTHORIZED_BY_DISPATCH', plan
          print(json.dumps({
              'execution_head': state['repository']['current_branch_head_sha'],
              'event_subject_head': state['repository']['event_subject_head_sha'],
              'event_ledger_head': state['repository']['event_ledger_head_sha'],
              'state': state['reduced_work_order']['state'],
              'snapshot_matches': state['reduced_work_order']['snapshot_matches_authoritative_state'],
              'runtime_mutation': plan['v0_p4_gate']['runtime_mutation'],
              'workers': plan['autonomous_runtime_workers'],
              'findings': state['findings'],
          }, indent=2, sort_keys=True))
          PY
