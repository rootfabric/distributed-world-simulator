name: V0 P4 Dispatch Authorization Probe

on:
  pull_request:
    paths:
      - '.github/workflows/v0-p4-post-activation-audit-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current P4 execution ledger
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/v0-p4-construction-real-resources

      - name: Fetch current refs
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - name: Verify P4 dispatch lineage
        run: |
          test "$(git branch --show-current)" = "feature/v0-p4-construction-real-resources"
          git merge-base --is-ancestor 47ff18cf603bbf98bb67f7f62962e050f8606542 HEAD
          git merge-base --is-ancestor a56a06481f2ee6534100aec11886d1958f7dd0de bc907d019900b158b26a2736be423ecaff07ecd3
          test "$(git log --diff-filter=A -1 --format=%H -- config/control/harness/executions/E2026-08-17-V0-P4-R1/events/V0-P4-R1-WO-001/0002-director-dispatched.v1.json)" = "bc907d019900b158b26a2736be423ecaff07ecd3"

      - name: Overlay canonical-main Harness contracts only
        run: |
          while IFS= read -r f; do
            case "$f" in
              config/control/harness/executions/*) continue ;;
            esac
            mkdir -p "$(dirname "$f")"
            git show "origin/main:$f" > "$f"
          done < <(git ls-tree -r --name-only origin/main -- config/control/harness)
          while IFS= read -r f; do
            mkdir -p "$(dirname "$f")"
            git show "origin/main:$f" > "$f"
          done < <(git ls-tree -r --name-only origin/main -- scripts/harness | grep '\.py$')
          git show origin/main:config/control/project-program-registry.v1.json > config/control/project-program-registry.v1.json
          git show origin/main:config/control/project-control-policy.v1.json > config/control/project-control-policy.v1.json
          git show origin/main:config/control/architecture-ownership.v1.json > config/control/architecture-ownership.v1.json

      - name: Install pinned Harness dependency
        run: python3 -m pip install --disable-pip-version-check -r scripts/harness/requirements.txt

      - name: Reduce execution and prove runtime authorization
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path.cwd()
          sys.path.insert(0, str(root / 'scripts'))
          from harness.state_builder import build_state
          from harness.checkpoint_planner import build_plan
          from harness.contracts import ContractBundle

          execution = root / 'config/control/harness/executions/E2026-08-17-V0-P4-R1'
          state = build_state(root, execution)
          bundle = ContractBundle.load(root)
          contracts = {
              'checkpoint_catalog': bundle.contracts['checkpoint_catalog'],
              'scheduler_policy': bundle.contracts['scheduler_policy'],
          }
          plan = build_plan(contracts, state['active_work_order'], state['reduced_work_order'])

          assert state['reduced_work_order']['state'] == 'DISPATCHED', state['reduced_work_order']
          assert state['reduced_work_order']['snapshot_matches_authoritative_state'] is True
          assert state['epoch']['registry_generation'] == 80
          assert state['epoch']['validation']['action'] == 'CONTINUE', state['epoch']['validation']
          assert 'WORK_ORDER_BRANCH_NOT_CHECKED_OUT' not in state['findings'], state['findings']
          assert plan['selected_checkpoint'] == 'V0_P4_REAL_RESOURCE_CONSTRUCTION', plan
          assert plan['mode'] == 'SINGLE_HIGH_RISK_PRODUCT_SLICE', plan
          assert plan['autonomous_runtime_workers'] == 1, plan
          assert plan['v0_p4_gate']['runtime_mutation'] == 'AUTHORIZED_BY_DISPATCH', plan
          assert plan['next_action'] == 'BEGIN_V0_P4_REAL_RESOURCE_CONSTRUCTION', plan
          print(json.dumps({
              'p4_branch_head': state['repository']['current_branch_head_sha'],
              'event_subject_head': state['repository']['event_subject_head_sha'],
              'event_ledger_head': state['repository']['event_ledger_head_sha'],
              'origin_main': state['repository']['origin_main_head_sha'],
              'reduced_state': state['reduced_work_order']['state'],
              'runtime_mutation': plan['v0_p4_gate']['runtime_mutation'],
              'runtime_workers': plan['autonomous_runtime_workers'],
              'next_action': plan['next_action'],
              'findings': state['findings'],
          }, indent=2, sort_keys=True))
          PY
