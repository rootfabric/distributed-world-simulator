name: V0 P4 Exact Source Export Probe

on:
  pull_request:
    paths:
      - '.github/workflows/v0-p4-post-activation-audit-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact current P4 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/v0-p4-construction-real-resources

      - name: Verify exact exported head and dispatch ancestry
        shell: bash
        run: |
          ACTUAL="$(git rev-parse HEAD)"
          echo "P4_EXPORTED_HEAD=$ACTUAL"
          test "$ACTUAL" = "d7641c0900772ecae4b324ecf04d6233a7bde4c6"
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor 47ff18cf603bbf98bb67f7f62962e050f8606542 "$ACTUAL"
          git merge-base --is-ancestor bc907d019900b158b26a2736be423ecaff07ecd3 "$ACTUAL"

      - name: Export tracked source tree
        shell: bash
        run: |
          git archive --format=tar.gz --prefix=dws-p4/ HEAD -o /tmp/dws-p4-source.tar.gz
          sha256sum /tmp/dws-p4-source.tar.gz | tee /tmp/dws-p4-source.sha256

      - name: Upload exact source archive
        uses: actions/upload-artifact@v4
        with:
          name: v0-p4-exact-source-d7641c09
          path: |
            /tmp/dws-p4-source.tar.gz
            /tmp/dws-p4-source.sha256
          if-no-files-found: error
