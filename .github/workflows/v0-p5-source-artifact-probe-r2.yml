name: V0 P5 Exact Source Artifact Probe R2

on:
  pull_request:
    branches:
      - feature/v0-p5-equipment-tools

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive exact P5 base source
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          EXPECTED="f9e5d4bcaccd677726efb3a65b843b9bd6f78d6b"
          echo "BASE=$BASE"
          test "$BASE" = "$EXPECTED"
          git archive --format=zip --output=p5-source-f9e5.zip "$BASE"
      - uses: actions/upload-artifact@v4
        with:
          name: p5-source-f9e5
          path: p5-source-f9e5.zip
          if-no-files-found: error
          retention-days: 1
