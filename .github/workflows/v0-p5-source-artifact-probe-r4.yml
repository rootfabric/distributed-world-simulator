name: V0 P5 Exact Source Artifact Probe R4

on:
  pull_request:
    branches:
      - feature/v0-p5-equipment-tools

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive exact P5 base source
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          EXPECTED="017d0017bbfe0bcb9ae42fb7f5cdc8bc10331b02"
          echo "BASE=$BASE"
          test "$BASE" = "$EXPECTED"
          git archive --format=zip --output=p5-source-017d.zip "$BASE"
      - uses: actions/upload-artifact@v4
        with:
          name: p5-source-017d
          path: p5-source-017d.zip
          if-no-files-found: error
          retention-days: 1
