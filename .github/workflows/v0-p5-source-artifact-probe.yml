name: V0 P5 Exact Source Artifact Probe

on:
  pull_request:
    branches:
      - feature/v0-p5-equipment-tools

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive exact P5 base source
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          EXPECTED="09df1f376a753c853f53c82598394fbad198b77b"
          echo "BASE=$BASE"
          test "$BASE" = "$EXPECTED"
          git archive --format=zip --output=p5-source-09df.zip "$BASE"
      - uses: actions/upload-artifact@v4
        with:
          name: p5-source-09df
          path: p5-source-09df.zip
          if-no-files-found: error
          retention-days: 1
