name: V0 P7.7 C2 Source Snapshot R2

on:
  pull_request:
    branches:
      - feature/v0-p7-bounded-terrain-mutation
    paths:
      - ".github/workflows/v0-p7-7-c2-source-snapshot-r2.yml"
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c9e758ecfe738f771fa261fa91df2627f91be686
          fetch-depth: 0
      - name: Verify exact identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c9e758ecfe738f771fa261fa91df2627f91be686"
          test "$(git rev-parse 'HEAD^{tree}')" = "6cbc2d2192f5a7fd30b5866ca4a670f7f9c2d1ad"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Archive source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .git
          tar -czf /tmp/dws-p7-7-c2-c9e758ec.tar.gz .
          sha256sum /tmp/dws-p7-7-c2-c9e758ec.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: dws-p7-7-c2-c9e758ec-source
          path: /tmp/dws-p7-7-c2-c9e758ec.tar.gz
          if-no-files-found: error
          retention-days: 1
