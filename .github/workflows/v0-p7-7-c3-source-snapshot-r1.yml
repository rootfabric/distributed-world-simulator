name: V0 P7.7 C3 Source Snapshot R1

on:
  pull_request:
    branches:
      - feature/v0-p7-bounded-terrain-mutation
    paths:
      - ".github/workflows/v0-p7-7-c3-source-snapshot-r1.yml"
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3410d4819baba5f28d67c826d609a1aa5d8ebc1a
          fetch-depth: 0
      - name: Verify exact identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3410d4819baba5f28d67c826d609a1aa5d8ebc1a"
          test "$(git rev-parse 'HEAD^{tree}')" = "5e75bc1f254cc9910f71591972b94a8c2eb3243b"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Archive source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .git
          tar -czf /tmp/dws-p7-7-c3-3410d481.tar.gz .
          sha256sum /tmp/dws-p7-7-c3-3410d481.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: dws-p7-7-c3-3410d481-source
          path: /tmp/dws-p7-7-c3-3410d481.tar.gz
          if-no-files-found: error
          retention-days: 1
