name: V0 P7.7 D Source Snapshot R2

on:
  pull_request:
    branches:
      - feature/v0-p7-bounded-terrain-mutation
    paths:
      - ".github/workflows/v0-p7-7-d-source-snapshot-r2.yml"
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c538c2abffc0b4d685a16ee8eb206d3856c37e18
          fetch-depth: 0
      - name: Verify exact identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c538c2abffc0b4d685a16ee8eb206d3856c37e18"
          test "$(git rev-parse 'HEAD^{tree}')" = "aae7f3444e1958ea2899cc7007b1bb8d3faf7d38"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Archive source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .git
          tar -czf /tmp/dws-p7-7-d-c538c2ab.tar.gz .
          sha256sum /tmp/dws-p7-7-d-c538c2ab.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: dws-p7-7-d-c538c2ab-source
          path: /tmp/dws-p7-7-d-c538c2ab.tar.gz
          if-no-files-found: error
          retention-days: 1
