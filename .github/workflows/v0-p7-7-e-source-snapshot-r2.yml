name: V0 P7.7 E Source Snapshot R2

on:
  pull_request:
    branches:
      - feature/v0-p7-bounded-terrain-mutation
    paths:
      - ".github/workflows/v0-p7-7-e-source-snapshot-r2.yml"
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5113f4922f61345fae222689b9e7cdaae3683e51
          fetch-depth: 0
      - name: Verify exact identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "5113f4922f61345fae222689b9e7cdaae3683e51"
          test "$(git rev-parse 'HEAD^{tree}')" = "14395d3e5353d1e84375fe62decc70f2f72f133e"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Archive source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .git
          tar -czf /tmp/dws-p7-7-e-5113f492.tar.gz .
          sha256sum /tmp/dws-p7-7-e-5113f492.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: dws-p7-7-e-5113f492-source
          path: /tmp/dws-p7-7-e-5113f492.tar.gz
          if-no-files-found: error
          retention-days: 1
