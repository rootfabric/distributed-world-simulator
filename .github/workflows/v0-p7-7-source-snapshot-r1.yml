name: V0 P7.7 Source Snapshot R1

on:
  pull_request:
    branches:
      - feature/v0-p7-bounded-terrain-mutation
    paths:
      - ".github/workflows/v0-p7-7-source-snapshot-r1.yml"
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact P7.7-A subject
        uses: actions/checkout@v4
        with:
          ref: 8455f27d19d5b36cdc7243eb077e69057d3638f6
          fetch-depth: 0
      - name: Verify identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "8455f27d19d5b36cdc7243eb077e69057d3638f6"
          test "$(git rev-parse 'HEAD^{tree}')" = "0e6e169a83e2317be0cc6bbb52934cc5bbadd859"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Prepare exact source snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .git
          tar -czf /tmp/dws-p7-7-a-8455f27d.tar.gz .
          sha256sum /tmp/dws-p7-7-a-8455f27d.tar.gz
      - name: Upload exact source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: dws-p7-7-a-8455f27d-source
          path: /tmp/dws-p7-7-a-8455f27d.tar.gz
          if-no-files-found: error
          retention-days: 1
