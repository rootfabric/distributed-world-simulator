name: V0 P7.7 Source Snapshot R3

on:
  pull_request:
    branches:
      - feature/v0-p7-bounded-terrain-mutation
    paths:
      - ".github/workflows/v0-p7-7-source-snapshot-r3.yml"
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d1d445f81ea4e2d83dcea67a9cfb8a5a753fe9a5
          fetch-depth: 0
      - name: Verify exact identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "d1d445f81ea4e2d83dcea67a9cfb8a5a753fe9a5"
          test "$(git rev-parse 'HEAD^{tree}')" = "a5a8e5d7e56fb9ee125670099a80d2ad104c2cc1"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Archive source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .git
          tar -czf /tmp/dws-p7-7-b-d1d445f8.tar.gz .
          sha256sum /tmp/dws-p7-7-b-d1d445f8.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: dws-p7-7-b-d1d445f8-source
          path: /tmp/dws-p7-7-b-d1d445f8.tar.gz
          if-no-files-found: error
          retention-days: 1
