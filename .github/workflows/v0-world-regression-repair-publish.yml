name: V0 World Regression Repair Publish

on:
  push:
    branches:
      - probe/v0-world-regression-repair-publish

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repair target
        uses: actions/checkout@v4
        with:
          ref: repair/v0-world-regression-baseline-r1
          fetch-depth: 0
      - name: Verify target freshness
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "5383f882a86c39d3a759bf43b36e89d496012a06"
          test -z "$(git status --porcelain)"
      - name: Materialize validated local patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > /tmp/repair.patch
          echo "c8c83c99879ebccd4932a02399f22226e3db96bc29fccb085397eaa7f416cb28  /tmp/repair.patch" | sha256sum -c -
          git apply --check /tmp/repair.patch
          git apply /tmp/repair.patch
          git diff --check
      - name: Verify exact repair scope
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected-files <<'FILES'
          RUN_WORLD_REGRESSION_TESTS.ps1
          scripts/runtime/networked_gameplay/m5/m5_graphical_acceptance_driver.gd
          tests/core/test_world_catalog.gd
          tests/integration/test_unified_planetary_runtime.gd
          tests/network/test_nx0_observability_baseline.gd
          tests/network/test_nx1_deterministic_network_condition_simulator.gd
          tests/network/test_nx2_realtime_traffic_separation.gd
          tests/network/test_nx3_fixed_tick_authoritative_simulation.gd
          tests/runtime/test_a2_networked_gameplay_architecture.gd
          tests/runtime/test_a3_single_server_multiplayer_architecture.gd
          tests/runtime/test_int0_m3_replica_resync_composition.gd
          tests/runtime/test_m1_unified_networked_gameplay_service.gd
          tests/runtime/test_m5_graphical_acceptance_contracts.gd
          tests/runtime/test_m5_graphical_acceptance_preparation.gd
          tests/runtime/test_m6_dedicated_recovery_processes.gd
          tests/runtime/test_mvp_earth_m3_spectator.gd
          tests/runtime/test_v0_p3_resource_mining_wire_and_wiring.gd
          tools/runtime/m4_graphical_item_client.gd
          tools/runtime/m7_playable_recovery_client.gd
          tools/runtime/v0_p2_live_reconnect_client.gd
          FILES
          git diff --name-only | sort > /tmp/actual-files
          sort /tmp/expected-files -o /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
          test "$(wc -l < /tmp/actual-files)" -eq 20
          if git diff --name-only | grep -Eq '^(scripts/(construction|network|persistence)|scripts/runtime/networked_gameplay/m[0-47]/|config/architecture/)'; then
            echo "Unexpected production-owner path in test/control repair" >&2
            exit 1
          fi
      - name: Commit and push one bounded repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name rootfabric
          git config user.email yglamazdin@gmail.com
          xargs -d '\n' git add -- < /tmp/expected-files
          git commit -m "test(control): restore world regression baseline coverage"
          test "$(git rev-list --count 5383f882a86c39d3a759bf43b36e89d496012a06..HEAD)" -eq 1
          git push origin HEAD:repair/v0-world-regression-baseline-r1
      - name: Report exact head
        shell: bash
        run: |
          git rev-parse HEAD
          git diff --stat 5383f882a86c39d3a759bf43b36e89d496012a06..HEAD
