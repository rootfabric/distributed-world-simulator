name: VERIFY CONTROL MVP8 R3 Fresh Frozen Exact
on:
  push:
    branches: [verify/control-mvp8-r3-fresh-7510aa4-r1]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  source-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact tested R3 product and verifier-only diff
        shell: bash
        run: |
          set -Eeuo pipefail
          source_head=7510aa4ff81e6d3a13bbfa0872b6f60bfb547621
          source_tree=5003355e504c620c7f4bb0413bda6d4f36b9fd8d
          test "$(git merge-base "$source_head" HEAD)" = "$source_head"
          test "$(git rev-parse "$source_head^{tree}")" = "$source_tree"
          test "$(git diff --name-only "$source_head" HEAD)" = ".github/workflows/verify-control-mvp8-r3-exact.yml"
          git diff --check "$source_head" HEAD
          echo "R3_FRESH_SOURCE_IDENTITY=PASS"

  linux-fresh:
    needs: source-provenance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Clean separate exact Git checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          head=7510aa4ff81e6d3a13bbfa0872b6f60bfb547621
          tree=5003355e504c620c7f4bb0413bda6d4f36b9fd8d
          exact="$RUNNER_TEMP/r3-fresh-exact"
          git worktree add --detach "$exact" "$head"
          git -C "$exact" switch -c "verify-r3-linux-$GITHUB_RUN_ID"
          test "$(git -C "$exact" rev-parse HEAD)" = "$head"
          test "$(git -C "$exact" rev-parse 'HEAD^{tree}')" = "$tree"
          test -z "$(git -C "$exact" status --porcelain --untracked-files=no)"
          echo "R3_EXACT=$exact" >> "$GITHUB_ENV"
          mkdir verification
          printf 'HEAD=%s\nTREE=%s\n' "$head" "$tree" >verification/IDENTITY
      - name: Pinned Harness dependency
        run: python -m pip install -r "$R3_EXACT/scripts/harness/requirements.txt"
      - name: Fresh adversarial R3, R2, R1 and schema checks
        shell: bash
        run: |
          set -Eeuo pipefail
          export PYTHONPATH="$R3_EXACT/scripts"
          cd "$R3_EXACT"
          for selector in \
            test_mvp8_git_bound_sibling_inputs_r3.py \
            test_mvp8_committed_witness_binding_r2.py \
            test_mvp8_external_reviewer_event_witness_r1.py \
            test_mvp8_immutable_evidence_reconciliation_r1.py; do
            python -m unittest discover -s tests/harness -p "$selector" -v 2>&1 | tee "$GITHUB_WORKSPACE/verification/$selector.log"
          done
      - name: Fresh exact Status and CheckConsistency
        shell: bash
        run: |
          set -Eeuo pipefail
          export PYTHONPATH="$R3_EXACT/scripts"
          cd "$R3_EXACT"
          python -m harness.cli status --root "$PWD" >"$GITHUB_WORKSPACE/verification/status.jsonl"
          python -m harness.cli check-consistency --root "$PWD" --candidate >"$GITHUB_WORKSPACE/verification/consistency.jsonl"
          python - "$GITHUB_WORKSPACE/verification" <<'PY'
          import json,pathlib,sys
          for name in ("status","consistency"):
              p=pathlib.Path(sys.argv[1])/(name+".jsonl")
              obj=json.loads(p.read_text(encoding="utf-8").splitlines()[-1])
              assert obj["schema"]=="distributed_world_simulator.control_development_output.v1"
              assert obj.get("ok") is True,obj
          print("R3_FRESH_LINUX_STATUS_AND_CONSISTENCY=PASS")
          PY
      - name: Fresh full Harness regression
        shell: bash
        run: |
          set -Eeuo pipefail
          export PYTHONPATH="$R3_EXACT/scripts"
          cd "$R3_EXACT"
          python -m unittest discover -s tests/harness -v >"$GITHUB_WORKSPACE/verification/full-harness.log" 2>&1 || {
            tail -120 "$GITHUB_WORKSPACE/verification/full-harness.log"
            exit 1
          }
          tail -12 "$GITHUB_WORKSPACE/verification/full-harness.log"
      - name: Fresh machine standard and directional PC0
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$R3_EXACT"
          python scripts/control/project_control.py --no-fetch --no-fail-on-red >"$GITHUB_WORKSPACE/verification/pc0-standard.log" 2>&1
          python scripts/control/project_control_directional_watch.py --no-fail-on-red >"$GITHUB_WORKSPACE/verification/pc0-directional.log" 2>&1
          python - "$GITHUB_WORKSPACE/verification" <<'PY'
          import json,sys,pathlib
          report={}
          for label,path in (
              ("standard","artifacts/control/project-control-report.json"),
              ("directional","artifacts/control/directional-watch-report.json"),
          ):
              data=json.loads(pathlib.Path(path).read_text(encoding="utf-8"))
              report[label]=data["overall_health"]
          print("R3_FRESH_MACHINE_PC0",json.dumps(report,sort_keys=True))
          assert all(s in ("GREEN","YELLOW","RED") for s in report.values())
          (pathlib.Path(sys.argv[1])/"pc0-health.json").write_text(json.dumps(report,indent=2)+"\n")
          PY
      - name: Evidence SHA256 manifests
        if: always()
        shell: bash
        run: |
          mkdir -p verification
          (cd verification && sha256sum *.log *.json *.jsonl IDENTITY >SHA256SUMS 2>/dev/null) || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-mvp8-r3-fresh-linux
          path: verification/**
          retention-days: 30
          if-no-files-found: warn

  windows-fresh:
    needs: source-provenance
    runs-on: windows-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Clean separate exact Windows worktree
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $Head='7510aa4ff81e6d3a13bbfa0872b6f60bfb547621'
          $Tree='5003355e504c620c7f4bb0413bda6d4f36b9fd8d'
          $Exact=Join-Path $env:RUNNER_TEMP 'control-r3-fresh-exact'
          git worktree add --detach $Exact $Head
          if ($LASTEXITCODE -ne 0) { throw 'WORKTREE_FAILED' }
          git -C $Exact switch -c "verify-r3-win-$env:GITHUB_RUN_ID"
          if ($LASTEXITCODE -ne 0) { throw 'BRANCH_FAILED' }
          if ((git -C $Exact rev-parse HEAD).Trim() -cne $Head) { throw 'HEAD_MISMATCH' }
          if ((git -C $Exact rev-parse 'HEAD^{tree}').Trim() -cne $Tree) { throw 'TREE_MISMATCH' }
          "R3_EXACT=$Exact" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Pinned Harness dependency
        shell: pwsh
        run: python -m pip install -r "$env:R3_EXACT/scripts/harness/requirements.txt"
      - name: Fresh R3, R2, R1 and schema exact tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:PYTHONPATH=Join-Path $env:R3_EXACT 'scripts'
          Push-Location $env:R3_EXACT
          try {
            foreach ($selector in @(
              'test_mvp8_git_bound_sibling_inputs_r3.py',
              'test_mvp8_committed_witness_binding_r2.py',
              'test_mvp8_external_reviewer_event_witness_r1.py',
              'test_mvp8_immutable_evidence_reconciliation_r1.py'
            )) {
              python -m unittest discover -s tests/harness -p $selector -v
              if ($LASTEXITCODE -ne 0) { throw "FOCUSED_FAIL_$selector" }
            }
          } finally { Pop-Location }
      - name: Fresh Windows public Status and CheckConsistency
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $Driver=Join-Path $env:R3_EXACT 'CONTROL_DEVELOPMENT.ps1'
          $out=@(& pwsh -NoLogo -NoProfile -File $Driver -Status)
          $code=$LASTEXITCODE
          $dto=($out | Select-Object -Last 1) | ConvertFrom-Json
          if ($code -ne 0 -or $dto.ok -ne $true) { throw "WINDOWS_STATUS_FAILED_$code" }
          Write-Host 'R3_FRESH_WINDOWS_STATUS=PASS'
          $out=@(& pwsh -NoLogo -NoProfile -File $Driver -CheckConsistency -Candidate)
          $code=$LASTEXITCODE
          $dto=($out | Select-Object -Last 1) | ConvertFrom-Json
          if ($code -ne 0 -or $dto.ok -ne $true) { throw "WINDOWS_CONSISTENCY_FAILED_$code" }
          Write-Host 'R3_FRESH_WINDOWS_CONSISTENCY=PASS'
